<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新幹線マップ 🚄</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #0a0f1e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: rgba(10,15,30,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1000;
  flex-shrink: 0;
}

header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
}

header p {
  font-size: 0.75rem;
  color: #888;
}

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

#map {
  flex: 1;
  background: #1a2035;
}

/* sidebar */
.sidebar {
  width: 260px;
  background: rgba(10,15,30,0.97);
  border-left: 1px solid rgba(255,255,255,0.07);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 16px 12px;
}

.sidebar h2 {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #555;
  margin-bottom: 14px;
}

.line-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 4px;
  user-select: none;
}
.line-item:hover { background: rgba(255,255,255,0.06); }
.line-item.active { background: rgba(255,255,255,0.1); }

.line-swatch {
  width: 16px; height: 16px;
  border-radius: 4px;
  flex-shrink: 0;
}
.line-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.line-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: #ddd;
}

.line-km {
  font-size: 0.68rem;
  color: #666;
  margin-top: 1px;
}

/* info panel (station popup) */
.info-panel {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,15,30,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 14px 20px;
  min-width: 220px;
  max-width: 360px;
  z-index: 2000;
  display: none;
  backdrop-filter: blur(8px);
}
.info-panel.visible { display: block; }
.info-panel h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.info-panel p  { font-size: 0.78rem; color: #aaa; line-height: 1.6; }
.info-panel .close-btn {
  position: absolute; top: 8px; right: 12px;
  background: none; border: none; color: #666;
  font-size: 1.1rem; cursor: pointer;
}

/* mobile */
@media (max-width: 600px) {
  .sidebar { width: 100%; border-left: none; border-top: 1px solid rgba(255,255,255,0.07); max-height: 38vh; }
  .main { flex-direction: column; }
  #map { min-height: 55vh; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚄 新幹線マップ</h1>
    <p>路線をタップして詳細を見る</p>
  </div>

<div class="main">
  <div id="map"></div>

// ── 地図初期化 ────────────────────────────────────────────────────────────────

  center: [36.5, 137.5],
  zoom: 6,
  zoomControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 14,
}).addTo(map);

// ── 状態 ──────────────────────────────────────────────────────────────────────
const layerGroups = {};
let activeLine = null;

// ── 路線・駅描画 ──────────────────────────────────────────────────────────────
function drawLine(line) {
  const group = L.layerGroup().addTo(map);

  const coords = line.stations.map(s => [s.lat, s.lng]);
  const polyline = L.polyline(coords, {
    color: line.color,
    weight: 4,
    opacity: 0.85,
    lineJoin: 'round',
  }).addTo(group);

  polyline.on('click', () => selectLine(line.id));

  line.stations.forEach(station => {
    const marker = L.circleMarker([station.lat, station.lng], {
      radius: 5,
      fillColor: line.color,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.9,
    }).addTo(group);

    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      showInfo(station.name, line, station.desc);
    });
  });

  layerGroups[line.id] = group;
}

LINES.forEach(drawLine);

// ── サイドバー ────────────────────────────────────────────────────────────────
const lineList = document.getElementById('line-list');

LINES.forEach(line => {
  const item = document.createElement('div');
  item.className = 'line-item';
  item.dataset.id = line.id;
  item.innerHTML = `
    <div class="line-swatch" style="background:${line.color}"></div>
    <div>
      <div class="line-name">${line.name}${line.note ? `<span style="font-size:0.65rem;color:#888;margin-left:4px">${line.note}</span>` : ''}</div>
      <div class="line-km">${line.operator} · ${line.km}</div>
    </div>
  `;
  item.addEventListener('click', () => selectLine(line.id));
  lineList.appendChild(item);
});

// ── 路線選択 ──────────────────────────────────────────────────────────────────
function selectLine(id) {
  // reset all
  LINES.forEach(l => {
    const group = layerGroups[l.id];
    group.eachLayer(layer => {
      if (layer instanceof L.Polyline) layer.setStyle({ opacity: id === l.id ? 1 : 0.25, weight: id === l.id ? 5 : 3 });
      if (layer instanceof L.CircleMarker) layer.setStyle({ fillOpacity: id === l.id ? 1 : 0.2, opacity: id === l.id ? 1 : 0.2 });
    });
  });

  document.querySelectorAll('.line-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  activeLine = id;

  // fit map to line
  const line = LINES.find(l => l.id === id);
  if (line) {
    const coords = line.stations.map(s => [s.lat, s.lng]);
    map.fitBounds(L.latLngBounds(coords), { padding: [40, 40] });
    showInfo(line.name, line, `${line.operator} / ${line.km}　駅数：${line.stations.length}駅`);
  }
}

// ── 情報パネル ────────────────────────────────────────────────────────────────
function showInfo(title, line, desc) {

  document.getElementById('info-title').textContent = title;
  document.getElementById('info-body').innerHTML =
    `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${line.color};margin-right:6px;vertical-align:middle"></span>${line.name}` +
    (desc ? `<br>${desc}` : '');
  panel.classList.add('visible');
}

document.getElementById('close-info').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('visible');
});

// map click resets selection
map.on('click', () => {
  LINES.forEach(l => {
    layerGroups[l.id].eachLayer(layer => {
      if (layer instanceof L.Polyline) layer.setStyle({ opacity: 0.85, weight: 4 });
      if (layer instanceof L.CircleMarker) layer.setStyle({ fillOpacity: 0.9, opacity: 1 });
    });
  });
  document.querySelectorAll('.line-item').forEach(el => el.classList.remove('active'));
  activeLine = null;
  document.getElementById('info-panel').classList.remove('visible');
});
</script>
</body>
</html>
