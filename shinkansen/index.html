<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しんかんせんマップ 🚄</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #07111f;
  color: #eee;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: #0b1728;
  border-bottom: 2px solid #1a2e48;
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; gap: 10px;
}
header h1 { font-size: 1.1rem; font-weight: 900; color: #fff; white-space: nowrap; }
#header-sub { font-size: 0.68rem; color: #4a6080; }

#back-btn {
  display: none;
  align-items: center; gap: 6px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 20px; padding: 5px 14px;
  font-size: 0.78rem; font-weight: 700; color: #bbb;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
#back-btn:hover { background: rgba(255,255,255,0.14); }
#back-btn.visible { display: flex; }

/* ── メイン ── */
.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

#map { flex: 1; background: #07111f; }
.leaflet-control-attribution { font-size: 0.5rem !important; }

/* ── サイドバー ── */
.sidebar {
  display: none;
  width: 230px; min-width: 230px;
  background: #0b1728;
  border-left: 2px solid #1a2e48;
  overflow-y: auto; flex-shrink: 0; flex-direction: column;
}
.sidebar.visible { display: flex; }

.photo-wrap {
  width: 100%; height: 130px; background: #0f1e30;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.photo-wrap .emoji { font-size: 3rem; }
.photo-caption { font-size: 0.58rem; color: #2a3a50; text-align: right; padding: 2px 8px 0; flex-shrink: 0; }
.photo-caption a { color: #3a5070; text-decoration: none; }

.sidebar-inner { padding: 12px 10px 20px; }
.sidebar-line-name { font-size: 1rem; font-weight: 900; margin-bottom: 2px; }
.sidebar-line-kana { font-size: 0.68rem; color: #5a7090; margin-bottom: 7px; }
.sidebar-nickname-badge {
  display: inline-block; padding: 3px 12px; border-radius: 20px;
  font-size: 0.74rem; font-weight: 700; color: #fff; margin-bottom: 12px;
}

/* ── 列車種別セレクター ── */
.service-section { margin-bottom: 14px; }
.service-label {
  font-size: 0.62rem; font-weight: 900; letter-spacing: 0.1em;
  color: #3a5070; margin-bottom: 7px;
}
.service-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.service-chip {
  padding: 5px 11px; border-radius: 16px;
  border: 1.5px solid var(--sc);
  background: transparent;
  font-size: 0.73rem; font-weight: 900; color: var(--sc);
  cursor: pointer; white-space: nowrap;
  transition: background 0.12s, color 0.12s;
}
.service-chip:hover { background: color-mix(in srgb, var(--sc) 20%, transparent); }
.service-chip.active { background: var(--sc); color: #fff; }
.service-chip.all-btn { border-color: #4a6080; color: #7a9080; --sc: #4a6080; }
.service-chip.all-btn.active { background: #2a3a50; color: #ccc; }

/* 停車駅の説明 */
.service-desc {
  font-size: 0.63rem; color: #4a6080; margin-top: 6px; line-height: 1.5;
  padding: 5px 8px; background: rgba(255,255,255,0.03); border-radius: 6px;
}

.station-list { list-style: none; }
.station-list li {
  padding: 5px 7px; border-left: 3px solid var(--c);
  margin-bottom: 3px; background: rgba(255,255,255,0.03);
  border-radius: 0 6px 6px 0;
  transition: opacity 0.2s, background 0.2s;
}
.station-list li.dimmed {
  opacity: 0.22;
  border-left-color: #2a3a50 !important;
}
.station-list li.active-stop {
  background: color-mix(in srgb, var(--sc,var(--c)) 15%, transparent);
  border-left-color: var(--sc, var(--c)) !important;
}
.station-list .s-name { font-size: 0.78rem; font-weight: 700; color: #ddd; }
.station-list .s-kana { font-size: 0.6rem; color: #5a7090; }

/* ── 下部路線バー ── */
#line-bar {
  background: #0b1728;
  border-top: 2px solid #1a2e48;
  padding: 8px 14px 11px; flex-shrink: 0;
}
.line-bar-title {
  font-size: 0.6rem; font-weight: 900; letter-spacing: 0.1em;
  color: #3a5070; margin-bottom: 8px;
}
.line-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.line-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 20px;
  border: 1.5px solid var(--c); background: rgba(0,0,0,0.3);
  cursor: pointer; font-size: 0.71rem; font-weight: 700;
  color: #ccc; white-space: nowrap;
  transition: background 0.12s, transform 0.1s;
}
.line-chip:hover  { background: rgba(255,255,255,0.08); transform: scale(1.05); }
.line-chip.active { background: var(--c); color: #fff; }
.line-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.line-chip.active .line-chip-dot { background: rgba(255,255,255,0.8); }
.line-chip-nick { color: var(--c); font-weight: 900; }
.line-chip.active .line-chip-nick { color: #fff; }

/* ── 地図ラベル ── */
.route-label { background: none !important; border: none !important; box-shadow: none !important; }
.route-label-inner { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.route-label-nick {
  font-size: 0.72rem; font-weight: 900;
  padding: 2px 8px; border-radius: 10px; white-space: nowrap; color: #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,0.7);
}
.route-label-kana { font-size: 0.52rem; color: rgba(255,255,255,0.82); text-shadow: 0 0 3px #000, 0 1px 3px #000; white-space: nowrap; margin-top: 1px; }

/* ── 駅ラベル ── */
.station-label { background: none !important; border: none !important; box-shadow: none !important; }
.station-label-inner { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.station-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #fff; margin-bottom: 2px; }
.station-name { font-size: 0.68rem; font-weight: 700; color: #fff; text-shadow: 0 0 4px #000, 0 1px 4px #000, -1px 0 3px #000, 1px 0 3px #000; white-space: nowrap; text-align: center; }
.station-kana { font-size: 0.55rem; color: rgba(255,255,255,0.85); text-shadow: 0 0 3px #000, 0 1px 3px #000; white-space: nowrap; text-align: center; }

/* dimmed station on map */
.station-label.dimmed .station-dot { opacity: 0.15; }
.station-label.dimmed .station-name { opacity: 0.15; }
.station-label.dimmed .station-kana { opacity: 0.15; }
.station-label.highlighted .station-dot { border-color: #fff; width: 9px; height: 9px; }

/* ── ローディング ── */
#loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #07111f; z-index: 9999; gap: 14px;
  font-size: 0.9rem; color: #4a6080; pointer-events: none;
}
#loading .spin { font-size: 2.8rem; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .sidebar { display: none !important; }
  .line-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  #line-bar { padding: 6px 10px 8px; }
}
</style>

// ── アイコン ──────────────────────────────────────────────────────────────────
function makeRouteLabelIcon(line) {
  const shortName = line.name.replace('新幹線', '');
  const shortKana = line.kana.replace('しんかんせん', '');
  const html = `<div class="route-label-inner">
    <div class="route-label-nick" style="background:${line.color}">${shortName}</div>
    <div class="route-label-kana">${shortKana}</div>
  </div>`;
  return L.divIcon({ className: 'route-label', html, iconAnchor: [0,0] });
}

function makeStationIcon(s, color, side = 'right') {
  const dot = `width:7px;height:7px;border-radius:50%;background:${color};border:1.5px solid #fff;position:absolute;top:4px`;
  const name = `font-size:0.68rem;font-weight:700;color:#fff;text-shadow:0 0 4px #000,0 1px 4px #000,-1px 0 3px #000,1px 0 3px #000;white-space:nowrap;position:absolute;top:0`;
  const kana = `font-size:0.55rem;color:rgba(255,255,255,0.85);text-shadow:0 0 3px #000,0 1px 3px #000;white-space:nowrap;position:absolute;top:14px`;
  const W = 110;
  let html, anchor;
  if (side === 'right') {
    html = `<div style="position:relative;width:${W}px;height:28px;pointer-events:none">
      <div style="${dot};left:0"></div>
      <div style="${name};left:11px">${s.name}</div>
      <div style="${kana};left:11px">${s.kana}</div>
    </div>`;
    anchor = [3, 6];
  } else {
    html = `<div style="position:relative;width:${W}px;height:28px;pointer-events:none">
      <div style="${dot};right:0"></div>
      <div style="${name};right:11px;text-align:right">${s.name}</div>
      <div style="${kana};right:11px;text-align:right">${s.kana}</div>
    </div>`;
    anchor = [W - 3, 6];
  }
  return L.divIcon({ className: 'station-label', html, iconAnchor: anchor, iconSize: [W, 28] });
}

// ── レイヤー ──────────────────────────────────────────────────────────────────
const overviewLayers = {};
// detailLayers[id] = { group, markers: [{marker, name}] }
const detailLayers   = {};

LINES.forEach(line => {
  const coords = line.stations.map(s => [s.lat, s.lng]);

  const ov = L.layerGroup();
  const ovLine = L.polyline(coords, { color: line.color, weight: 8, opacity: 0.7 });
  ovLine.on('click', () => selectLine(line.id));
  ovLine.on('mouseover', () => ovLine.setStyle({ weight: 12, opacity: 1 }));
  ovLine.on('mouseout',  () => ovLine.setStyle({ weight: 8,  opacity: 0.7 }));
  ovLine.addTo(ov);
  const ovLabel = L.marker(line.labelPos, { icon: makeRouteLabelIcon(line) });
  ovLabel.on('click', () => selectLine(line.id));
  ovLabel.addTo(ov);
  overviewLayers[line.id] = ov;

  const group = L.layerGroup();
  L.polyline(coords, { color: line.color, weight: 5, opacity: 0.95 }).addTo(group);
  const markers = [];
  line.stations.forEach((s, i) => {
    const side = i % 2 === 0 ? 'right' : 'left';
    const m = L.marker([s.lat, s.lng], { icon: makeStationIcon(s, line.color, side) });
    m.addTo(group);
    markers.push({ marker: m, name: s.name });
  });
  detailLayers[line.id] = { group, markers };
});

// ── 日本GeoJSON ───────────────────────────────────────────────────────────────
let ALL_CENTER, ALL_ZOOM;
const BOUNDS = [[30.8, 129.0], [42.5, 142.5]];

fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
  .then(r => r.json())
  .then(geojson => {
    L.geoJSON(geojson, {
      style: { fillColor: '#1e3d5c', fillOpacity: 1, color: '#2d6090', weight: 1 }
    }).addTo(map);
    map.fitBounds(BOUNDS, { padding: [10, 10] });
    ALL_CENTER = map.getCenter();
    ALL_ZOOM   = map.getZoom();
    LINES.forEach(l => overviewLayers[l.id].addTo(map));
    document.getElementById('loading').style.display = 'none';
  })
  .catch(() => {
    map.fitBounds(BOUNDS, { padding: [10, 10] });
    ALL_CENTER = map.getCenter();
    ALL_ZOOM   = map.getZoom();
    LINES.forEach(l => overviewLayers[l.id].addTo(map));
    document.getElementById('loading').style.display = 'none';
  });

  chipsEl.appendChild(chip);
});

// ── 列車種別フィルター ────────────────────────────────────────────────────────
let activeService = null; // { lineId, serviceIdx }

function applyServiceFilter(lineId, serviceIdx) {
  const line = LINES.find(l => l.id === lineId);
  const { markers } = detailLayers[lineId];
  const svc = line.services ? line.services[serviceIdx] : null;
  const stopSet = (svc && svc.stops) ? new Set(svc.stops) : null;

  markers.forEach(({ marker, name }) => {
    const el = marker.getElement();
    if (!el) return;
    if (!stopSet) {
      // 全停車（こだま/つばめ）
      el.classList.remove('dimmed');
      el.classList.add('highlighted');
    } else if (stopSet.has(name)) {
      el.classList.remove('dimmed');
      el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed');
      el.classList.remove('highlighted');
    }
  });

  // サイドバーの駅リストも更新
  const lis = document.querySelectorAll('#station-list li');
  lis.forEach(li => {
    const n = li.dataset.name;
    if (!stopSet) {
      li.classList.remove('dimmed');
      li.classList.add('active-stop');
    } else if (stopSet.has(n)) {
      li.classList.remove('dimmed');
      li.classList.add('active-stop');
    } else {
      li.classList.add('dimmed');
      li.classList.remove('active-stop');
    }
  });

  // service-chip の active 更新
  document.querySelectorAll('.service-chip').forEach((c, i) => {
    c.classList.toggle('active', i === serviceIdx);
  });

  // サービス説明更新
  const descEl = document.getElementById('service-desc');
  if (descEl && svc) descEl.textContent = svc.desc;

  activeService = { lineId, serviceIdx };
}

function clearServiceFilter(lineId) {
  const { markers } = detailLayers[lineId];
  markers.forEach(({ marker }) => {
    const el = marker.getElement();
    if (el) { el.classList.remove('dimmed', 'highlighted'); }
  });
  document.querySelectorAll('#station-list li').forEach(li => {
    li.classList.remove('dimmed', 'active-stop');
  });
  document.querySelectorAll('.service-chip').forEach(c => c.classList.remove('active'));
  const descEl = document.getElementById('service-desc');
  if (descEl) descEl.textContent = '';
  activeService = null;
}

// ── 路線選択 ──────────────────────────────────────────────────────────────────
let currentId = null;
const photoCache = {};

function selectLine(id) {
  currentId = id;
  activeService = null;
  const line = LINES.find(l => l.id === id);

  LINES.forEach(l => {
    map.removeLayer(overviewLayers[l.id]);
    map.removeLayer(detailLayers[l.id].group);
  });
  detailLayers[id].group.addTo(map);

  map.invalidateSize();
  map.fitBounds(L.latLngBounds(line.stations.map(s => [s.lat, s.lng])), { padding: [20, 20], animate: true });

  document.querySelectorAll('.line-chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  document.getElementById('sidebar').classList.add('visible');
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('header-sub').textContent = `${line.name}（${line.nickname}）`;

  // ── サービスセレクター HTML
  let serviceHtml = '';
  if (line.services) {
    const chips = line.services.map((s, i) =>
      `<div class="service-chip" style="--sc:${s.color}" onclick="applyServiceFilter('${id}',${i})">${s.name}</div>`
    ).join('');
    serviceHtml = `
      <div class="service-section">
        <div class="service-label">🚅 のりものをえらんでね</div>
        <div class="service-chips">
          <div class="service-chip all-btn" onclick="clearServiceFilter('${id}')">ぜんぶ</div>
          ${chips}
        </div>
        <div class="service-desc" id="service-desc"></div>
      </div>`;
  }

  // ── 駅リスト HTML
  const stationItems = line.stations.map(s =>
    `<li data-name="${s.name}" style="--c:${line.color}">
      <div class="s-name">${s.name}</div>
      <div class="s-kana">${s.kana}</div>
    </li>`
  ).join('');

  const inner = document.getElementById('sidebar-inner');
  inner.innerHTML = `
    <div class="sidebar-line-name" style="color:${line.color}">${line.name}</div>
    <div class="sidebar-line-kana">${line.kana}</div>
    <div class="sidebar-nickname-badge" style="background:${line.color}">${line.nickname}</div>
    ${serviceHtml}
    <ul class="station-list" id="station-list" style="--c:${line.color}">${stationItems}</ul>`;

  fetchPhoto(line);
}

// ── 全線に戻る ────────────────────────────────────────────────────────────────
function resetToAll() {
  if (currentId) {
    map.removeLayer(detailLayers[currentId].group);
    clearServiceFilter(currentId);
  }
  currentId = null;
  activeService = null;

  document.getElementById('sidebar').classList.remove('visible');
  setTimeout(() => {
    map.invalidateSize();
    LINES.forEach(l => overviewLayers[l.id].addTo(map));
    if (ALL_CENTER) map.setView(ALL_CENTER, ALL_ZOOM, { animate: true });
  }, 50);

  document.querySelectorAll('.line-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('header-sub').textContent = 'にほんには、たくさんのしんかんせんがある！';
  document.getElementById('photo-wrap').innerHTML = '<span class="emoji">🚄</span>';
  document.getElementById('photo-caption').innerHTML = '';
}

// ── 写真取得 ──────────────────────────────────────────────────────────────────
async function fetchPhoto(line) {
  const wrap    = document.getElementById('photo-wrap');
  const caption = document.getElementById('photo-caption');
  if (photoCache[line.id]) { showPhoto(photoCache[line.id], wrap, caption, line); return; }
  wrap.innerHTML = '<span class="emoji" style="opacity:.3">⏳</span>';
  caption.innerHTML = '';
  for (const title of [line.wikiTitle, line.name]) {
    if (!title) continue;
    try {
      const url = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&pithumbsize=500&format=json&origin=*`;
      const data = await (await fetch(url)).json();
      const page = Object.values(data.query.pages)[0];
      if (page.thumbnail) {
        const info = { src: page.thumbnail.source, title };
        photoCache[line.id] = info;
        showPhoto(info, wrap, caption, line);
        return;
      }
    } catch (_) {}
  }
  wrap.innerHTML = '<span class="emoji">🚄</span>';
}

function showPhoto(info, wrap, caption, line) {
  const img = document.createElement('img');
  img.src = info.src; img.alt = line.name;
  img.onerror = () => { wrap.innerHTML = '<span class="emoji">🚄</span>'; };
  wrap.innerHTML = '';
  wrap.appendChild(img);
  caption.innerHTML = `© <a href="https://ja.wikipedia.org/wiki/${encodeURIComponent(info.title)}" target="_blank" rel="noopener">Wikipedia</a>`;
}
