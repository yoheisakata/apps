<title>しんかんせんマップ 🚄</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #0a0f1e;
  color: #eee;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: #0d1526;
  border-bottom: 2px solid #1e2d4a;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
header h1 { font-size: 1.2rem; font-weight: 900; color: #fff; }
header p  { font-size: 0.75rem; color: #557; }

.main { display: flex; flex: 1; overflow: hidden; }

/* ── サイドバー ── */
.sidebar {
  width: 220px;
  background: #0d1526;
  border-right: 2px solid #1e2d4a;
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

.photo-wrap {
  width: 100%; height: 130px;
  background: #111927;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.photo-wrap .emoji { font-size: 3.5rem; }

.photo-caption {
  font-size: 0.58rem; color: #334; text-align: right;
  padding: 2px 8px 0; flex-shrink: 0;
}
.photo-caption a { color: #446; text-decoration: none; }

.sidebar-label {
  font-size: 0.62rem; font-weight: 900;
  letter-spacing: 0.12em;
  color: #446;
  padding: 12px 12px 6px;
}

.line-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px;
  cursor: pointer;
  border: none; background: none;
  width: 100%; text-align: left;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.line-btn:hover { background: rgba(255,255,255,0.05); }
.line-btn.active { background: rgba(255,255,255,0.09); border-left-color: var(--c); }

.line-dot {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--c); flex-shrink: 0;
  box-shadow: 0 0 6px var(--c);
}
.line-name-ja  { font-size: 0.82rem; font-weight: 700; color: #ddd; line-height: 1.3; }
.line-name-sub { font-size: 0.62rem; color: #557; margin-top: 1px; }

/* ── 地図 ── */
#map { flex: 1; background: #1a2035; }

/* ── 駅ラベル ── */
.station-label { background: none !important; border: none !important; box-shadow: none !important; }
.station-label-inner {
  display: flex; flex-direction: column; align-items: center;
  pointer-events: none;
}
.station-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid #fff; margin-bottom: 2px; flex-shrink: 0;
}
.station-name {
  font-size: 0.72rem; font-weight: 700; color: #fff;
  text-shadow: 0 0 3px #000, 0 1px 4px #000, -1px 0 3px #000, 1px 0 3px #000;
  white-space: nowrap; line-height: 1.2; text-align: center;
}
.station-kana {
  font-size: 0.58rem; color: rgba(255,255,255,0.82);
  text-shadow: 0 0 3px #000, 0 1px 3px #000;
  white-space: nowrap; text-align: center;
}

/* ── 案内 ── */
.hint {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(13,21,38,0.92); border: 2px solid #1e3a5f;
  border-radius: 16px; padding: 12px 20px;
  font-size: 0.9rem; color: #7ab; z-index: 2000;
  pointer-events: none; text-align: center; white-space: nowrap;
}

/* ── モバイル ── */
@media (max-width: 600px) {
  .sidebar { width: 100%; border-right: none; border-top: 2px solid #1e2d4a; flex-direction: row; max-height: 100px; overflow-x: auto; overflow-y: hidden; }
  .photo-wrap, .photo-caption, .sidebar-label { display: none; }
  .line-btn { flex-direction: column; align-items: center; gap: 4px; min-width: 74px; padding: 8px 6px; border-left: none; border-bottom: 3px solid transparent; }
  .line-btn.active { border-left-color: transparent; border-bottom-color: var(--c); }
  .line-name-sub { display: none; }
  .main { flex-direction: column-reverse; }
}
</style>
</head>

      { name: '嬉野温泉', kana: 'うれしのおんせん',lat: 33.1162, lng: 130.0924 },
      { name: '新大村',   kana: 'しんおおむら',    lat: 32.9336, lng: 129.9621 },
      { name: '諫早',     kana: 'いさはや',        lat: 32.8415, lng: 130.0534 },
      { name: '長崎',     kana: 'ながさき',        lat: 32.7505, lng: 129.8770 },
    ]
  },
];

// ── 地図（固定ビュー） ────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [36.5, 137.0],
  zoom: 6,
  zoomControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
  maxZoom: 14,
}).addTo(map);

// ── 駅アイコン生成 ────────────────────────────────────────────────────────────
function makeStationIcon(station, color) {
  const html = `<div class="station-label-inner">
    <div class="station-dot" style="background:${color}"></div>
    <div class="station-name">${station.name}</div>
    <div class="station-kana">${station.kana}</div>
  </div>`;
  return L.divIcon({ className: 'station-label', html, iconAnchor: [0, 8] });
}

// ── レイヤー作成（最初は地図に追加しない） ───────────────────────────────────
const layerGroups = {};

LINES.forEach(line => {
  const group = L.layerGroup();
  const coords = line.stations.map(s => [s.lat, s.lng]);
  L.polyline(coords, { color: line.color, weight: 5, opacity: 0.9 }).addTo(group);
  line.stations.forEach(s => {
    L.marker([s.lat, s.lng], { icon: makeStationIcon(s, line.color) }).addTo(group);
  });
  layerGroups[line.id] = group;
});

// ── サイドバー生成 ────────────────────────────────────────────────────────────
const lineList = document.getElementById('line-list');
LINES.forEach(line => {
  const btn = document.createElement('button');
  btn.className = 'line-btn';
  btn.dataset.id = line.id;
  btn.style.setProperty('--c', line.color);
  btn.innerHTML = `
    <div class="line-dot"></div>
    <div>
      <div class="line-name-ja">${line.name}</div>
      <div class="line-name-sub">${line.kana}</div>
    </div>`;
  btn.addEventListener('click', () => selectLine(line.id));
  lineList.appendChild(btn);
});

// ── 路線選択 ──────────────────────────────────────────────────────────────────
let currentId = null;
const photoCache = {};

function selectLine(id) {
  if (currentId === id) {
    // 同じ路線を再タップ → リセット
    map.removeLayer(layerGroups[id]);
    currentId = null;
    document.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('hint').style.display = '';
    document.getElementById('photo-wrap').innerHTML = '<span class="emoji">🚄</span>';
    document.getElementById('photo-caption').innerHTML = '';
    return;
  }

  // 前の路線を消す
  if (currentId) map.removeLayer(layerGroups[currentId]);

  currentId = id;
  layerGroups[id].addTo(map);

  document.querySelectorAll('.line-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('hint').style.display = 'none';

  fetchPhoto(LINES.find(l => l.id === id));
}

// ── 写真取得 ──────────────────────────────────────────────────────────────────
async function fetchPhoto(line) {
  const wrap = document.getElementById('photo-wrap');
  const caption = document.getElementById('photo-caption');

  if (photoCache[line.id]) {
    showPhoto(photoCache[line.id], wrap, caption, line);
    return;
  }

  wrap.innerHTML = '<span class="emoji" style="opacity:.3">⏳</span>';
  caption.innerHTML = '';

  for (const title of [line.wikiTitle, line.name]) {
    if (!title) continue;
    try {
      const url = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&pithumbsize=500&format=json&origin=*`;
      const data = await (await fetch(url)).json();
      const page = Object.values(data.query.pages)[0];
      if (page.thumbnail) {
        const info = { src: page.thumbnail.source, title };
        photoCache[line.id] = info;
        showPhoto(info, wrap, caption, line);
        return;
      }
    } catch (_) {}
  }

  wrap.innerHTML = '<span class="emoji">🚄</span>';
}

function showPhoto(info, wrap, caption, line) {
  const img = document.createElement('img');
  img.src = info.src;
  img.alt = line.name;
  img.onerror = () => { wrap.innerHTML = '<span class="emoji">🚄</span>'; };
  wrap.innerHTML = '';
  wrap.appendChild(img);
  caption.innerHTML = `© <a href="https://ja.wikipedia.org/wiki/${encodeURIComponent(info.title)}" target="_blank" rel="noopener">Wikipedia</a>`;
}
</script>
</body>
</html>
