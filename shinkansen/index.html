<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しんかんせんマップ 🚄</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #07111f;
  color: #eee;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── ヘッダー ── */
header {
  background: #0b1728;
  border-bottom: 2px solid #1a2e48;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
}
header h1 { font-size: 1.1rem; font-weight: 900; color: #fff; white-space: nowrap; }
#header-sub { font-size: 0.68rem; color: #4a6080; }

#back-btn {
  display: none;
  align-items: center; gap: 6px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 20px; padding: 5px 14px;
  font-size: 0.78rem; font-weight: 700; color: #bbb;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s;
}
#back-btn:hover { background: rgba(255,255,255,0.14); }
#back-btn.visible { display: flex; }

/* ── メイン ── */
.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ── 地図 ── */
#map {
  flex: 1;
  /* タイル非表示のため背景色がそのまま海の色になる */
  background: #07111f;
}
/* Leaflet帰属表示を小さく */
.leaflet-control-attribution { font-size: 0.5rem !important; }

/* ── サイドバー（路線選択時のみ表示） ── */
.sidebar {
  display: none;
  width: 210px;
  background: #0b1728;
  border-left: 2px solid #1a2e48;
  overflow-y: auto;
  flex-shrink: 0;
  flex-direction: column;
}
.sidebar.visible { display: flex; }

.photo-wrap {
  width: 100%; height: 118px;
  background: #0f1e30;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.photo-wrap .emoji { font-size: 3rem; }
.photo-caption { font-size: 0.58rem; color: #2a3a50; text-align: right; padding: 2px 8px 0; flex-shrink: 0; }
.photo-caption a { color: #3a5070; text-decoration: none; }

.sidebar-inner { padding: 10px 10px 16px; overflow-y: auto; }
.sidebar-line-name { font-size: 0.95rem; font-weight: 900; margin-bottom: 2px; }
.sidebar-line-kana { font-size: 0.68rem; color: #5a7090; margin-bottom: 6px; }
.sidebar-nickname-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 700; color: #fff; margin-bottom: 12px;
}
.station-list { list-style: none; }
.station-list li {
  padding: 4px 6px; border-left: 2px solid var(--c);
  margin-bottom: 3px; background: rgba(255,255,255,0.03);
  border-radius: 0 6px 6px 0;
}
.station-list .s-name { font-size: 0.76rem; font-weight: 700; color: #ddd; }
.station-list .s-kana { font-size: 0.58rem; color: #5a7090; }

/* ── 下部路線バー（常に表示） ── */
#line-bar {
  background: #0b1728;
  border-top: 2px solid #1a2e48;
  padding: 8px 12px 10px;
  flex-shrink: 0;
}
.line-bar-title {
  font-size: 0.6rem; font-weight: 900; letter-spacing: 0.1em;
  color: #3a5070; margin-bottom: 7px;
}
.line-chips {
  display: flex; gap: 7px; flex-wrap: wrap;
}
.line-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 20px;
  border: 1.5px solid var(--c);
  background: rgba(0,0,0,0.25);
  cursor: pointer; font-size: 0.7rem; font-weight: 700;
  color: #ccc; white-space: nowrap;
  transition: background 0.12s, transform 0.1s;
}
.line-chip:hover  { background: rgba(255,255,255,0.07); transform: scale(1.05); }
.line-chip.active { background: var(--c); color: #fff; }
.line-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.line-chip.active .line-chip-dot { background: #fff; }
.line-chip-nick { color: var(--c); font-weight: 900; }
.line-chip.active .line-chip-nick { color: #fff; }

/* ── 地図上ラベル ── */
.route-label { background: none !important; border: none !important; box-shadow: none !important; }
.route-label-inner { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.route-label-nick {
  font-size: 0.68rem; font-weight: 900;
  padding: 2px 7px; border-radius: 10px;
  white-space: nowrap; color: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.route-label-kana {
  font-size: 0.52rem; color: rgba(255,255,255,0.8);
  text-shadow: 0 0 3px #000, 0 1px 3px #000;
  white-space: nowrap; margin-top: 1px;
}

/* ── 駅ラベル ── */
.station-label { background: none !important; border: none !important; box-shadow: none !important; }
.station-label-inner { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.station-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #fff; margin-bottom: 2px; }
.station-name {
  font-size: 0.68rem; font-weight: 700; color: #fff;
  text-shadow: 0 0 3px #000, 0 1px 4px #000, -1px 0 3px #000, 1px 0 3px #000;
  white-space: nowrap; text-align: center;
}
.station-kana {
  font-size: 0.55rem; color: rgba(255,255,255,0.85);
  text-shadow: 0 0 3px #000, 0 1px 3px #000;
  white-space: nowrap; text-align: center;
}

/* ── ローディング ── */
#loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #07111f; z-index: 9999; gap: 12px;
  font-size: 0.85rem; color: #4a6080;
}
#loading .spin { font-size: 2.4rem; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .sidebar { display: none !important; }
  .line-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  #line-bar { padding: 6px 10px 8px; }
}
</style>
</head>

<header>
  <div>
    <h1>🚄 しんかんせんマップ</h1>
    <p id="header-sub">にほんには、たくさんのしんかんせんがある！</p>
  </div>
  <button id="back-btn" onclick="resetToAll()">◀ もどる</button>

<div class="main" style="position:relative">
  <div id="loading"><div class="spin">🗾</div>ちずをよみこみちゅう…</div>
  <div id="map"></div>

// ── 地図初期化 ─────────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: false,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  touchZoom: false,
  dragging: false,
  // 初期値（fitBoundsで上書き）
  center: [36, 136], zoom: 5,
});

// タイル非表示（日本地形のみ描画するため）
// 軽量な透明タイルを使う
L.tileLayer('data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

// ── アイコン生成 ──────────────────────────────────────────────────────────────
function makeRouteLabelIcon(line) {
  const nick = line.nickname.split('・')[0];
  const html = `<div class="route-label-inner">
    <div class="route-label-nick" style="background:${line.color}">${nick}</div>
    <div class="route-label-kana">${line.kana.slice(0, 6)}</div>
  </div>`;
  return L.divIcon({ className: 'route-label', html, iconAnchor: [0, 0] });
}

function makeStationIcon(s, color) {
  const html = `<div class="station-label-inner">
    <div class="station-dot" style="background:${color}"></div>
    <div class="station-name">${s.name}</div>
    <div class="station-kana">${s.kana}</div>
  </div>`;
  return L.divIcon({ className: 'station-label', html, iconAnchor: [0, 8] });
}

// ── レイヤー生成 ──────────────────────────────────────────────────────────────
const overviewLayers = {};
const detailLayers   = {};

LINES.forEach(line => {
  const coords = line.stations.map(s => [s.lat, s.lng]);

  const ov = L.layerGroup();
  L.polyline(coords, { color: line.color, weight: 3, opacity: 0.9 }).addTo(ov);
  const lbl = L.marker(line.labelPos, { icon: makeRouteLabelIcon(line), interactive: true }).addTo(ov);
  lbl.on('click', () => selectLine(line.id));
  overviewLayers[line.id] = ov;

  const dt = L.layerGroup();
  L.polyline(coords, { color: line.color, weight: 5, opacity: 0.95 }).addTo(dt);
  line.stations.forEach(s =>
    L.marker([s.lat, s.lng], { icon: makeStationIcon(s, line.color) }).addTo(dt)
  );
  detailLayers[line.id] = dt;
});

// ── 日本地図を GeoJSON で描画 ─────────────────────────────────────────────────
let japanLayer = null;
let ALL_CENTER, ALL_ZOOM;

const JAPAN_STYLE = {
  fillColor: '#1a3050',
  fillOpacity: 1,
  color: '#2a5080',
  weight: 1,
};

fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
  .then(r => r.json())
  .then(geojson => {
    japanLayer = L.geoJSON(geojson, { style: JAPAN_STYLE }).addTo(map);

    // 新幹線ネットワークが収まる範囲にフィット（沖縄など離島は除外）
    // 鹿児島中央(31.5N)〜新函館北斗(41.9N)、長崎(129.8E)〜八戸(141.5E)
    const SHINKANSEN_BOUNDS = [[30.8, 129.0], [42.5, 142.5]];
    map.fitBounds(SHINKANSEN_BOUNDS, { padding: [20, 20] });
    ALL_CENTER = map.getCenter();
    ALL_ZOOM   = map.getZoom();

    // 全路線を表示
    LINES.forEach(l => overviewLayers[l.id].addTo(map));

    document.getElementById('loading').style.display = 'none';
  })
  .catch(() => {
    // GeoJSON取得失敗時のフォールバック
    map.fitBounds([[30.8, 129.0], [42.5, 142.5]], { padding: [20, 20] });
    ALL_CENTER = map.getCenter();
    ALL_ZOOM   = map.getZoom();
    LINES.forEach(l => overviewLayers[l.id].addTo(map));
    document.getElementById('loading').style.display = 'none';
  });

// ── 下部路線チップ生成 ────────────────────────────────────────────────────────
const chipsEl = document.getElementById('line-chips');
LINES.forEach(line => {
  const chip = document.createElement('div');
  chip.className = 'line-chip';
  chip.dataset.id = line.id;
  chip.style.setProperty('--c', line.color);
  const nick = line.nickname.split('・')[0];
  chip.innerHTML = `<div class="line-chip-dot"></div><span class="line-chip-nick">${nick}</span><span style="color:#778;font-size:0.62rem">${line.name.replace('新幹線','')}</span>`;
  chip.addEventListener('click', () => selectLine(line.id));
  chipsEl.appendChild(chip);
});

// ── 路線選択 ──────────────────────────────────────────────────────────────────
let currentId = null;
const photoCache = {};

function selectLine(id) {
  currentId = id;
  const line = LINES.find(l => l.id === id);

  LINES.forEach(l => { map.removeLayer(overviewLayers[l.id]); map.removeLayer(detailLayers[l.id]); });
  detailLayers[id].addTo(map);

  const bounds = L.latLngBounds(line.stations.map(s => [s.lat, s.lng]));
  map.fitBounds(bounds, { padding: [48, 48], animate: true, duration: 0.6 });

  // チップの active 状態
  document.querySelectorAll('.line-chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));

  document.getElementById('sidebar').classList.add('visible');
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('header-sub').textContent = `${line.name}（${line.nickname}）`;

  const inner = document.getElementById('sidebar-inner');
  inner.innerHTML = `
    <div class="sidebar-line-name" style="color:${line.color}">${line.name}</div>
    <div class="sidebar-line-kana">${line.kana}</div>
    <div class="sidebar-nickname-badge" style="background:${line.color}">${line.nickname}</div>
    <ul class="station-list" style="--c:${line.color}">
      ${line.stations.map(s => `<li><div class="s-name">${s.name}</div><div class="s-kana">${s.kana}</div></li>`).join('')}
    </ul>`;

  fetchPhoto(line);
}

// ── 全線表示に戻る ────────────────────────────────────────────────────────────
function resetToAll() {
  if (currentId) map.removeLayer(detailLayers[currentId]);
  currentId = null;

  LINES.forEach(l => overviewLayers[l.id].addTo(map));
  if (ALL_CENTER) map.setView(ALL_CENTER, ALL_ZOOM, { animate: true, duration: 0.5 });

  document.querySelectorAll('.line-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('sidebar').classList.remove('visible');
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('header-sub').textContent = 'にほんには、たくさんのしんかんせんがある！';
  document.getElementById('photo-wrap').innerHTML = '<span class="emoji">🚄</span>';
  document.getElementById('photo-caption').innerHTML = '';
}

// ── 写真取得 ──────────────────────────────────────────────────────────────────
async function fetchPhoto(line) {
  const wrap    = document.getElementById('photo-wrap');
  const caption = document.getElementById('photo-caption');
  if (photoCache[line.id]) { showPhoto(photoCache[line.id], wrap, caption, line); return; }
  wrap.innerHTML = '<span class="emoji" style="opacity:.3">⏳</span>';
  caption.innerHTML = '';
  for (const title of [line.wikiTitle, line.name]) {
    if (!title) continue;
    try {
      const url = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&pithumbsize=500&format=json&origin=*`;
      const data = await (await fetch(url)).json();
      const page = Object.values(data.query.pages)[0];
      if (page.thumbnail) {
        const info = { src: page.thumbnail.source, title };
        photoCache[line.id] = info;
        showPhoto(info, wrap, caption, line);
        return;
      }
    } catch (_) {}
  }
  wrap.innerHTML = '<span class="emoji">🚄</span>';
}

function showPhoto(info, wrap, caption, line) {
  const img = document.createElement('img');
  img.src = info.src; img.alt = line.name;
  img.onerror = () => { wrap.innerHTML = '<span class="emoji">🚄</span>'; };
  wrap.innerHTML = '';
  wrap.appendChild(img);
  caption.innerHTML = `© <a href="https://ja.wikipedia.org/wiki/${encodeURIComponent(info.title)}" target="_blank" rel="noopener">Wikipedia</a>`;
}
</script>
