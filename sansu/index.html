<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<title>さんすうれんしゅう 🧮</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#0d0d1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;user-select:none;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(255,159,28,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(168,85,247,.08) 0%,transparent 50%);pointer-events:none;}

/* ── スクリーン共通 ── */
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:420px;min-height:100vh;padding:0 16px 24px;position:relative;z-index:1;}
.screen.active{display:flex;}
.app-title{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#ff9f1c,#ff6b9d,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:24px 0 4px;text-align:center;}
.app-sub{color:#888;font-size:1rem;margin-bottom:20px;}
.home-link{color:#555;font-size:0.8rem;margin-top:20px;text-decoration:none;}
.home-link:hover{color:#888;}

/* ── モードえらび ── */
.mode-col{display:flex;flex-direction:column;gap:14px;width:100%;}
.mode-btn{border:none;border-radius:22px;font-family:'Nunito',sans-serif;font-weight:900;color:#fff;padding:26px 16px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:transform .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);text-align:left;}
.mode-btn:active{transform:scale(.96);}
.mode-btn .m-emoji{font-size:2.4rem;}
.mode-btn .m-label{font-size:1.3rem;}
.mode-btn .m-desc{font-size:0.78rem;color:rgba(255,255,255,.75);font-weight:700;margin-top:2px;}

/* ── えらびグリッド（レベル・だん共通） ── */
.pick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;}
.pick-grid.cols1{grid-template-columns:1fr;}
.pick-btn{border:none;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:900;color:#fff;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.pick-btn:active{transform:scale(.92);}
.pick-btn .d-emoji{font-size:1.8rem;}
.pick-btn .d-label{font-size:0.85rem;}

/* ── れんしゅうスクリーン共通ヘッダー ── */
.study-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0 0;}
.back-btn{background:rgba(255,255,255,.1);border:none;border-radius:12px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;padding:8px 14px;cursor:pointer;}
.back-btn:active{opacity:.7;}
.head-title{font-size:1.1rem;font-weight:900;}
.prog-text{font-size:0.85rem;color:#888;}

/* しんちょくドット */
.prog-dots{display:flex;gap:6px;justify-content:center;margin:12px 0 8px;}
.pdot{height:10px;border-radius:5px;background:rgba(255,255,255,.18);transition:all .3s;width:10px;}
.pdot.cur{width:28px;}

/* ── たしざんカード ── */
.quiz-card{width:100%;background:rgba(255,255,255,.05);border-radius:26px;border:2px solid rgba(255,255,255,.1);padding:22px 16px;margin-bottom:12px;text-align:center;}
.emoji-row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-bottom:12px;flex-wrap:wrap;}
.emoji-group{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:150px;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 7px;}
.emoji-item{font-size:1.25rem;line-height:1.3;}
.plus-sign{font-size:1.6rem;font-weight:900;color:#1e90ff;flex-shrink:0;}
.question-num{font-size:clamp(2.2rem,10vw,3rem);font-weight:900;letter-spacing:2px;}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-bottom:8px;}
.ans-btn{background:#16213e;border:2px solid rgba(255,255,255,.1);border-radius:13px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.8rem;font-weight:900;padding:16px 10px;cursor:pointer;transition:all .12s;}
.ans-btn:active{transform:scale(.93);}
.ans-btn.correct{background:rgba(46,213,115,.2);border-color:#2ed573;color:#2ed573;animation:pop .3s ease;}
.ans-btn.wrong{background:rgba(255,71,87,.2);border-color:#ff4757;color:#ff4757;animation:shake .3s ease;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback{text-align:center;font-size:1rem;font-weight:900;min-height:26px;}
.feedback.correct{color:#2ed573;}
.feedback.wrong{color:#ff4757;}

/* ── くく べんきょうカード ── */
.study-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;background:rgba(255,255,255,.05);border-radius:26px;border:2px solid rgba(255,255,255,.1);padding:28px 16px 20px;cursor:pointer;transition:border-color .4s;margin-bottom:12px;min-height:340px;}
.study-card:active{opacity:.92;}
.visual-area{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;min-height:48px;align-items:center;}
.v-group{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 7px;}
.eq-line{font-size:clamp(2.6rem,11vw,3.8rem);font-weight:900;letter-spacing:3px;line-height:1.2;text-align:center;margin-bottom:4px;}
.eq-ans{font-size:clamp(3rem,13vw,4.5rem);font-weight:900;line-height:1.1;text-align:center;margin-bottom:14px;}
.yomi{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.9);margin-bottom:16px;text-align:center;}
.tap-hint{font-size:0.72rem;color:rgba(255,255,255,.25);margin-top:auto;}
.speak-btn{background:rgba(255,255,255,.1);border:none;border-radius:100px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;padding:9px 20px;cursor:pointer;margin-bottom:14px;}
.speak-btn:active{opacity:.7;}
.nav-row{display:flex;gap:10px;width:100%;}
.nav-btn{flex:1;border:none;border-radius:16px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;padding:15px;cursor:pointer;background:rgba(255,255,255,.1);transition:transform .1s;}
.nav-btn:active{transform:scale(.95);}

/* ── おわりスクリーン ── */
.done-emoji{font-size:3.5rem;margin-bottom:12px;}
.done-title{font-size:2rem;font-weight:900;margin-bottom:6px;}
.done-sub{font-size:1.1rem;color:#aaa;margin-bottom:30px;text-align:center;}
.done-btns{display:flex;flex-direction:column;gap:10px;width:100%;}
.done-btn{border:none;border-radius:18px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;padding:17px;cursor:pointer;transition:transform .1s;background:rgba(255,255,255,.1);}
.done-btn:active{transform:scale(.95);}
</style>
</head>
<body>

<!-- ── モードえらび ── -->
<div class="screen active" id="screenHome">
  <div class="app-title">🧮 さんすうれんしゅう</div>
  <div class="app-sub">なにをれんしゅうする？</div>
  <div class="mode-col">
    <button class="mode-btn" style="background:linear-gradient(135deg,#1e90ff,#1e90ff88)" onclick="showScreen('screenAddLevel')">
      <span class="m-emoji">➕</span>
      <span><span class="m-label">たしざん</span><div class="m-desc">もんだいをといてれんしゅう</div></span>
    </button>
    <button class="mode-btn" style="background:linear-gradient(135deg,#ff7f3f,#ff7f3f88)" onclick="showScreen('screenDanSelect')">
      <span class="m-emoji">✖️</span>
      <span><span class="m-label">かけざん（くく）</span><div class="m-desc">よみあげでくくをおぼえる</div></span>
    </button>
  </div>
  <a href="../" class="home-link">← アプリいちらんにもどる</a>
</div>

<!-- ══════════ たしざん ══════════ -->

<!-- レベルえらび -->
<div class="screen" id="screenAddLevel">
  <div class="app-title">➕ たしざん</div>
  <div class="app-sub">どのレベルをやる？</div>
  <div class="pick-grid cols1" id="levelGrid"></div>
  <a href="#" class="home-link" onclick="showScreen('screenHome');return false;">← もどる</a>
</div>

<!-- もんだいスクリーン -->
<div class="screen" id="screenAddQuiz">
  <div class="study-header">
    <button class="back-btn" onclick="showScreen('screenAddLevel')">← もどる</button>
    <div class="head-title" id="quizTitle">レベル1</div>
    <div class="prog-text" id="quizProg">1 / 10</div>
  </div>
  <div class="prog-dots" id="quizDots"></div>

  <div class="quiz-card">
    <div class="emoji-row" id="emojiRow"></div>
    <div class="question-num" id="question">？＋？＝？</div>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="answers">
    <button class="ans-btn" onclick="answer(0)">0</button>
    <button class="ans-btn" onclick="answer(1)">0</button>
    <button class="ans-btn" onclick="answer(2)">0</button>
    <button class="ans-btn" onclick="answer(3)">0</button>
  </div>
</div>

<!-- たしざんおわり -->
<div class="screen" id="screenAddDone">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;">
    <div class="done-emoji" id="addDoneEmoji">💮</div>
    <div class="done-title">おしまい！</div>
    <div class="done-sub" id="addDoneSub">10もんちゅう 10もん せいかい</div>
    <div class="done-btns">
      <button class="done-btn" id="addReplayBtn" onclick="startLevel(curLevel)">🔄 もういちど</button>
      <button class="done-btn" id="addNextBtn" onclick="startLevel(curLevel+1)">▶ つぎのレベルへ</button>
      <button class="done-btn" onclick="showScreen('screenAddLevel')">📚 レベルをえらぶ</button>
    </div>
  </div>
</div>

<!-- ══════════ かけざん（くく） ══════════ -->

<!-- だんえらび -->
<div class="screen" id="screenDanSelect">
  <div class="app-title">✖️ かけざん（くく）</div>
  <div class="app-sub">なんのだんをやる？</div>
  <div class="pick-grid" id="danGrid"></div>
  <a href="#" class="home-link" onclick="showScreen('screenHome');return false;">← もどる</a>
</div>

<!-- べんきょうスクリーン -->
<div class="screen" id="screenStudy">
  <div class="study-header">
    <button class="back-btn" onclick="showDanSelect()">← もどる</button>
    <div class="head-title" id="studyTitle">３のだん</div>
    <div class="prog-text" id="studyProg">1 / 9</div>
  </div>
  <div class="prog-dots" id="progDots"></div>

  <div class="study-card" id="studyCard" onclick="nextEntry()">
    <div class="visual-area" id="visualArea"></div>
    <div class="eq-line" id="eqLine">３ × ４</div>
    <div class="eq-ans" id="eqAns">＝ １２</div>
    <div class="yomi" id="eqYomi">さんし じゅうに</div>
    <button class="speak-btn" onclick="event.stopPropagation();speak()">🔊 もういちど</button>
    <div class="tap-hint">タップでつぎへ ▶</div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" onclick="prevEntry()">← まえ</button>
    <button class="nav-btn" id="nextBtn" onclick="nextEntry()">つぎへ →</button>
  </div>
</div>

<!-- くくおわり -->
<div class="screen" id="screenKukuDone">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;">
    <div class="done-emoji">💮</div>
    <div class="done-title">できた！</div>
    <div class="done-sub" id="doneSub">３のだん、ぜんぶできた！</div>
    <div class="done-btns">
      <button class="done-btn" id="replayBtn" onclick="replay()">🔄 もういちど</button>
      <button class="done-btn" id="nextDanBtn" onclick="goNextDan()">▶ つぎのだんへ</button>
      <button class="done-btn" onclick="showDanSelect()">📚 ほかのだんをえらぶ</button>
    </div>
  </div>
</div>

<script>
/* ══════════ 共通 ══════════ */
const COLORS=['#e84057','#ff7f3f','#f5c518','#2ed573','#1e90ff','#a855f7','#ff6b9d','#00cec9','#f39c12'];

function showScreen(id){
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function fw(n){return String(n).replace(/[0-9]/g,c=>'０１２３４５６７８９'[+c]);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function renderDots(elId,total,cur,col){
  let dots='';
  for(let i=0;i<total;i++){
    const isCur=i===cur, isDone=i<cur;
    dots+=`<div class="pdot${isCur?' cur':''}" style="${isCur?`background:${col};`:isDone?`background:${col}66;`:''}"></div>`;
  }
  document.getElementById(elId).innerHTML=dots;
}

/* ══════════ たしざん ══════════ */
const ADD_LEVELS=[
  {label:'レベル1：1〜5のたしざん',  aMax:5, bMax:4, emoji:'🎂'},
  {label:'レベル2：1〜9のたしざん',  aMax:8, bMax:8, emoji:'🍎'},
  {label:'レベル3：10までのたしざん',aMax:9, bMax:9, emoji:'⭐'},
  {label:'レベル4：2けた＋1けた',    aMax:15,bMax:9, emoji:'🐶'},
  {label:'レベル5：おおきいかず！',  aMax:20,bMax:20,emoji:'🚗'},
];
const QUESTIONS_PER_SET=10;

let curLevel=0,qIdx=0,qCorrect=0,answered=false,correctAnswer=0;

function startLevel(i){
  curLevel=i;qIdx=0;qCorrect=0;
  document.getElementById('quizTitle').textContent=`レベル${i+1}`;
  document.getElementById('quizTitle').style.color=COLORS[i];
  showScreen('screenAddQuiz');
  generateQuestion();
}

function generateQuestion(){
  answered=false;
  const cfg=ADD_LEVELS[curLevel];
  const col=COLORS[curLevel];
  const a=randInt(1,cfg.aMax),b=randInt(1,cfg.bMax);
  correctAnswer=a+b;

  document.getElementById('quizProg').textContent=`${qIdx+1} / ${QUESTIONS_PER_SET}`;
  renderDots('quizDots',QUESTIONS_PER_SET,qIdx,col);

  const em=cfg.emoji;
  const row=document.getElementById('emojiRow');
  if(a>10||b>10){
    row.innerHTML=`<span style="font-size:1.6rem">${em}</span><span class="plus-sign">+</span><span style="font-size:1.6rem">${em}</span>`;
  } else {
    let hA='<div class="emoji-group">';for(let i=0;i<a;i++)hA+=`<span class="emoji-item">${em}</span>`;hA+='</div>';
    let hB='<div class="emoji-group">';for(let i=0;i<b;i++)hB+=`<span class="emoji-item">${em}</span>`;hB+='</div>';
    row.innerHTML=hA+'<span class="plus-sign">+</span>'+hB;
  }
  document.getElementById('question').innerHTML=
    `<span style="color:${col}">${a}</span> ＋ <span style="color:${col}">${b}</span> ＝ ？`;

  const opts=new Set([correctAnswer]);let att=0;
  while(opts.size<4&&att<200){att++;const d=randInt(1,5)*(Math.random()<0.5?1:-1);const w=correctAnswer+d;if(w>0)opts.add(w);}
  const arr=[...opts].sort(()=>Math.random()-0.5);
  const btns=document.querySelectorAll('.ans-btn');
  arr.forEach((v,i)=>{btns[i].textContent=v;btns[i].className='ans-btn';btns[i].disabled=false;});
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
}

function answer(idx){
  if(answered)return;answered=true;
  const btns=document.querySelectorAll('.ans-btn');
  const chosen=parseInt(btns[idx].textContent);
  btns.forEach(b=>b.disabled=true);
  if(chosen===correctAnswer){
    btns[idx].classList.add('correct');qCorrect++;
    showFeedback('⭕ せいかい！','correct');
    setTimeout(nextQuestion,900);
  } else {
    btns[idx].classList.add('wrong');
    btns.forEach(b=>{if(parseInt(b.textContent)===correctAnswer)b.classList.add('correct');});
    showFeedback(`❌ こたえは ${correctAnswer} だよ`,'wrong');
    setTimeout(nextQuestion,1600);
  }
}
function showFeedback(msg,type){const el=document.getElementById('feedback');el.textContent=msg;el.className=`feedback ${type}`;}

function nextQuestion(){
  qIdx++;
  if(qIdx<QUESTIONS_PER_SET){generateQuestion();return;}
  document.getElementById('addDoneEmoji').textContent=qCorrect===QUESTIONS_PER_SET?'💮':'📝';
  document.getElementById('addDoneSub').textContent=`${QUESTIONS_PER_SET}もんちゅう ${qCorrect}もん せいかい`;
  document.getElementById('addReplayBtn').style.background=COLORS[curLevel];
  const nb=document.getElementById('addNextBtn');
  if(curLevel<ADD_LEVELS.length-1){nb.style.display='';nb.style.background=COLORS[curLevel+1];}
  else nb.style.display='none';
  showScreen('screenAddDone');
}

// レベルボタンをつくる
(function(){
  const grid=document.getElementById('levelGrid');
  ADD_LEVELS.forEach((lv,i)=>{
    const b=document.createElement('button');
    b.className='pick-btn';
    b.style.background=`linear-gradient(135deg,${COLORS[i]},${COLORS[i]}88)`;
    b.innerHTML=`<span class="d-emoji">${lv.emoji}</span><span class="d-label">${lv.label}</span>`;
    b.onclick=()=>startLevel(i);
    grid.appendChild(b);
  });
})();

/* ══════════ かけざん（くく） ══════════ */
const DAN_EMOJI=['⭐','🍎','🌸','🐸','⚽','🦋','🌈','🐬','💎'];

const KUKU=[
  [
    {a:1,b:1,ans:1, yomi:'いんいちが いち'},
    {a:1,b:2,ans:2, yomi:'いんにが に'},
    {a:1,b:3,ans:3, yomi:'いんさんが さん'},
    {a:1,b:4,ans:4, yomi:'いんしが し'},
    {a:1,b:5,ans:5, yomi:'いんごが ご'},
    {a:1,b:6,ans:6, yomi:'いんろくが ろく'},
    {a:1,b:7,ans:7, yomi:'いんしちが しち'},
    {a:1,b:8,ans:8, yomi:'いんはちが はち'},
    {a:1,b:9,ans:9, yomi:'いんくが く'},
  ],[
    {a:2,b:1,ans:2,  yomi:'にいちが に'},
    {a:2,b:2,ans:4,  yomi:'ににんが し'},
    {a:2,b:3,ans:6,  yomi:'にさんが ろく'},
    {a:2,b:4,ans:8,  yomi:'にしが はち'},
    {a:2,b:5,ans:10, yomi:'にご じゅう'},
    {a:2,b:6,ans:12, yomi:'にろく じゅうに'},
    {a:2,b:7,ans:14, yomi:'にしち じゅうし'},
    {a:2,b:8,ans:16, yomi:'にはち じゅうろく'},
    {a:2,b:9,ans:18, yomi:'にく じゅうはち'},
  ],[
    {a:3,b:1,ans:3,  yomi:'さんいちが さん'},
    {a:3,b:2,ans:6,  yomi:'さんにが ろく'},
    {a:3,b:3,ans:9,  yomi:'さざんが く'},
    {a:3,b:4,ans:12, yomi:'さんし じゅうに'},
    {a:3,b:5,ans:15, yomi:'さんご じゅうご'},
    {a:3,b:6,ans:18, yomi:'さんろく じゅうはち'},
    {a:3,b:7,ans:21, yomi:'さんしち にじゅういち'},
    {a:3,b:8,ans:24, yomi:'さんぱ にじゅうし'},
    {a:3,b:9,ans:27, yomi:'さんく にじゅうしち'},
  ],[
    {a:4,b:1,ans:4,  yomi:'しいちが し'},
    {a:4,b:2,ans:8,  yomi:'しにが はち'},
    {a:4,b:3,ans:12, yomi:'しさん じゅうに'},
    {a:4,b:4,ans:16, yomi:'しし じゅうろく'},
    {a:4,b:5,ans:20, yomi:'しご にじゅう'},
    {a:4,b:6,ans:24, yomi:'しろく にじゅうし'},
    {a:4,b:7,ans:28, yomi:'ししち にじゅうはち'},
    {a:4,b:8,ans:32, yomi:'しはち さんじゅうに'},
    {a:4,b:9,ans:36, yomi:'しく さんじゅうろく'},
  ],[
    {a:5,b:1,ans:5,  yomi:'ごいちが ご'},
    {a:5,b:2,ans:10, yomi:'ごに じゅう'},

let curDan=0, curIdx=0;

function showDanSelect(){showScreen('screenDanSelect');}

function startDan(i){
  curDan=i; curIdx=0;
  const col=COLORS[i];
  document.getElementById('nextBtn').style.background=col;
  document.getElementById('studyTitle').style.color=col;
  showScreen('screenStudy');
  renderEntry();
}

function renderEntry(){
  const e=KUKU[curDan][curIdx];
  const col=COLORS[curDan];
  const em=DAN_EMOJI[curDan];

  document.getElementById('studyTitle').textContent=`${curDan+1}のだん`;
  document.getElementById('studyProg').textContent=`${curIdx+1} / 9`;
  document.getElementById('studyCard').style.borderColor=col+'99';
  renderDots('progDots',9,curIdx,col);

  // えもじビジュアル（25こ以下はグループひょうじ）
  const va=document.getElementById('visualArea');
  if(e.ans<=25){
    let h='';
    for(let g=0;g<e.b;g++){
      let items='';
      for(let k=0;k<e.a;k++) items+=`<span style="font-size:1.25rem;line-height:1.3">${em}</span>`;
      h+=`<div class="v-group">${items}</div>`;
    }
    va.innerHTML=h;
  } else {
    va.innerHTML=`<span style="font-size:2.5rem">${em}</span>`;
  }

  // しき
  document.getElementById('eqLine').innerHTML=
    `<span style="color:${col}">${fw(e.a)}</span><span style="color:rgba(255,255,255,.45)"> × </span><span style="color:${col}">${fw(e.b)}</span>`;
  document.getElementById('eqAns').innerHTML=
    `<span style="color:rgba(255,255,255,.4)">＝ </span><span style="color:#fff">${fw(e.ans)}</span>`;
  document.getElementById('eqYomi').textContent=e.yomi;

  // じどうよみあげ
  setTimeout(()=>doSpeak(e.yomi), 350);
}

function doSpeak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=0.78; u.pitch=1.1;
  speechSynthesis.speak(u);
}
function speak(){doSpeak(KUKU[curDan][curIdx].yomi);}

function nextEntry(){
  if(curIdx<8){curIdx++;renderEntry();}
  else showKukuDone();
}
function prevEntry(){
  if(curIdx>0){curIdx--;renderEntry();}
}

function showKukuDone(){
  document.getElementById('doneSub').textContent=`${curDan+1}のだん、ぜんぶできた！`;
  document.getElementById('replayBtn').style.background=COLORS[curDan];
  const nb=document.getElementById('nextDanBtn');
  if(curDan<8){nb.style.display='';nb.style.background=COLORS[curDan+1];}
  else nb.style.display='none';
  showScreen('screenKukuDone');
}
function replay(){startDan(curDan);}
function goNextDan(){if(curDan<8)startDan(curDan+1);else showDanSelect();}

// だんボタンをつくる
(function(){
  const grid=document.getElementById('danGrid');
  for(let i=0;i<9;i++){
    const b=document.createElement('button');
    b.className='pick-btn';
    b.style.background=`linear-gradient(135deg,${COLORS[i]},${COLORS[i]}88)`;
    b.innerHTML=`<span class="d-emoji">${DAN_EMOJI[i]}</span><span class="d-label">${i+1}のだん</span>`;
    b.onclick=()=>startDan(i);
    grid.appendChild(b);
  }
})();
