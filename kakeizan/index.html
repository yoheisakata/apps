<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✖️</text></svg>">
<title>くくをおぼえよう ✖️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:#0d0d1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;user-select:none;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(255,159,28,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(168,85,247,.08) 0%,transparent 50%);pointer-events:none;}

/* ── スクリーン共通 ── */
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:420px;min-height:100vh;padding:0 16px 24px;position:relative;z-index:1;}
.screen.active{display:flex;}

/* ── だんえらびスクリーン ── */
.app-title{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#ff9f1c,#ff6b9d,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:24px 0 4px;text-align:center;}
.app-sub{color:#888;font-size:1rem;margin-bottom:20px;}
.dan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;}
.dan-btn{border:none;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:900;color:#fff;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.dan-btn:active{transform:scale(.92);}
.dan-btn .d-emoji{font-size:1.8rem;}
.dan-btn .d-label{font-size:0.85rem;}
.home-link{color:#555;font-size:0.8rem;margin-top:20px;text-decoration:none;}
.home-link:hover{color:#888;}

/* ── べんきょうスクリーン ── */
.study-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0 0;}
.back-btn{background:rgba(255,255,255,.1);border:none;border-radius:12px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;padding:8px 14px;cursor:pointer;}
.back-btn:active{opacity:.7;}
.dan-label-big{font-size:1.2rem;font-weight:900;}
.prog-text{font-size:0.85rem;color:#888;}

/* しんちょくドット */
.prog-dots{display:flex;gap:6px;justify-content:center;margin:12px 0 8px;}
.pdot{height:10px;border-radius:5px;background:rgba(255,255,255,.18);transition:all .3s;}
.pdot.done{background:rgba(255,255,255,.45);}
.pdot.cur{width:28px;}

/* めいんカード */
.study-card{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;background:rgba(255,255,255,.05);border-radius:26px;
  border:2px solid rgba(255,255,255,.1);padding:28px 16px 20px;
  cursor:pointer;transition:border-color .4s;margin-bottom:12px;
  min-height:340px;
}
.study-card:active{opacity:.92;}

/* えもじビジュアル */
.visual-area{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;min-height:48px;align-items:center;}
.v-group{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 7px;}

/* しき */
.eq-line{font-size:clamp(2.6rem,11vw,3.8rem);font-weight:900;letter-spacing:3px;line-height:1.2;text-align:center;margin-bottom:4px;}
.eq-ans{font-size:clamp(3rem,13vw,4.5rem);font-weight:900;line-height:1.1;text-align:center;margin-bottom:14px;}

/* よみがな */
.yomi{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.9);margin-bottom:16px;text-align:center;}

.tap-hint{font-size:0.72rem;color:rgba(255,255,255,.25);margin-top:auto;}

/* もういちどボタン */
.speak-btn{background:rgba(255,255,255,.1);border:none;border-radius:100px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;padding:9px 20px;cursor:pointer;margin-bottom:14px;}
.speak-btn:active{opacity:.7;}

/* ナビボタン */
.nav-row{display:flex;gap:10px;width:100%;}
.nav-btn{flex:1;border:none;border-radius:16px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;padding:15px;cursor:pointer;background:rgba(255,255,255,.1);transition:transform .1s;}
.nav-btn:active{transform:scale(.95);}

/* ── かんりょうスクリーン ── */
.done-stars{font-size:3.5rem;animation:starBounce .8s infinite alternate;margin-bottom:12px;}
@keyframes starBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-14px) rotate(5deg)}}
.done-title{font-size:2.4rem;font-weight:900;color:#f5c518;margin-bottom:6px;}
.done-sub{font-size:1.1rem;color:#aaa;margin-bottom:30px;}
.done-btns{display:flex;flex-direction:column;gap:10px;width:100%;}
.done-btn{border:none;border-radius:18px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;padding:17px;cursor:pointer;transition:transform .1s;}
.done-btn:active{transform:scale(.95);}
.done-btn.sub{background:rgba(255,255,255,.1);}
</style>
</head>
<body>

<!-- ── だんえらびスクリーン ── -->
<div class="screen active" id="screenSelect">
  <div class="app-title">✖️ くくをおぼえよう</div>
  <div class="app-sub">なんのだんをやる？</div>
  <div class="dan-grid" id="danGrid"></div>
  <a href="../" class="home-link">← ゲームいちらんにもどる</a>
</div>

<!-- ── べんきょうスクリーン ── -->
<div class="screen" id="screenStudy">
  <div class="study-header">
    <button class="back-btn" onclick="showSelect()">← もどる</button>
    <div class="dan-label-big" id="studyTitle">３のだん</div>
    <div class="prog-text" id="studyProg">1 / 9</div>
  </div>
  <div class="prog-dots" id="progDots"></div>

  <div class="study-card" id="studyCard" onclick="nextEntry()">
    <div class="visual-area" id="visualArea"></div>
    <div class="eq-line" id="eqLine">３ × ４</div>
    <div class="eq-ans" id="eqAns">＝ １２</div>
    <div class="yomi" id="eqYomi">さんし じゅうに</div>
    <button class="speak-btn" onclick="event.stopPropagation();speak()">🔊 もういちど</button>
    <div class="tap-hint">タップでつぎへ ▶</div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" onclick="prevEntry()">← まえ</button>
    <button class="nav-btn" id="nextBtn" onclick="nextEntry()">つぎへ →</button>
  </div>
</div>

<!-- ── かんりょうスクリーン ── -->
<div class="screen" id="screenComplete">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;">
    <div class="done-stars">⭐⭐⭐</div>
    <div class="done-title">すごい！</div>
    <div class="done-sub" id="doneSub">３のだん、ぜんぶできた！</div>
    <div class="done-btns">
      <button class="done-btn" id="replayBtn" onclick="replay()">🔄 もういちど</button>
      <button class="done-btn" id="nextDanBtn" onclick="goNextDan()">▶ つぎのだんへ</button>
      <button class="done-btn sub" onclick="showSelect()">📚 ほかのだんをえらぶ</button>
    </div>
  </div>
</div>

<script>
const DAN_COLORS=['#e84057','#ff7f3f','#f5c518','#2ed573','#1e90ff','#a855f7','#ff6b9d','#00cec9','#f39c12'];
const DAN_EMOJI =['⭐','🍎','🌸','🐸','⚽','🦋','🌈','🐬','💎'];

const KUKU=[
  [
    {a:1,b:1,ans:1, yomi:'いんいちが いち'},
    {a:1,b:2,ans:2, yomi:'いんにが に'},
    {a:1,b:3,ans:3, yomi:'いんさんが さん'},
    {a:1,b:4,ans:4, yomi:'いんしが し'},
    {a:1,b:5,ans:5, yomi:'いんごが ご'},
    {a:1,b:6,ans:6, yomi:'いんろくが ろく'},
    {a:1,b:7,ans:7, yomi:'いんしちが しち'},
    {a:1,b:8,ans:8, yomi:'いんはちが はち'},
    {a:1,b:9,ans:9, yomi:'いんくが く'},
  ],[
    {a:2,b:1,ans:2,  yomi:'にいちが に'},
    {a:2,b:2,ans:4,  yomi:'ににんが し'},
    {a:2,b:3,ans:6,  yomi:'にさんが ろく'},
    {a:2,b:4,ans:8,  yomi:'にしが はち'},
    {a:2,b:5,ans:10, yomi:'にご じゅう'},
    {a:2,b:6,ans:12, yomi:'にろく じゅうに'},
    {a:2,b:7,ans:14, yomi:'にしち じゅうし'},
    {a:2,b:8,ans:16, yomi:'にはち じゅうろく'},
    {a:2,b:9,ans:18, yomi:'にく じゅうはち'},
  ],[
    {a:3,b:1,ans:3,  yomi:'さんいちが さん'},
    {a:3,b:2,ans:6,  yomi:'さんにが ろく'},
    {a:3,b:3,ans:9,  yomi:'さざんが く'},
    {a:3,b:4,ans:12, yomi:'さんし じゅうに'},
    {a:3,b:5,ans:15, yomi:'さんご じゅうご'},
    {a:3,b:6,ans:18, yomi:'さんろく じゅうはち'},
    {a:3,b:7,ans:21, yomi:'さんしち にじゅういち'},
    {a:3,b:8,ans:24, yomi:'さんぱ にじゅうし'},
    {a:3,b:9,ans:27, yomi:'さんく にじゅうしち'},
  ],[
    {a:4,b:1,ans:4,  yomi:'しいちが し'},
    {a:4,b:2,ans:8,  yomi:'しにが はち'},
    {a:4,b:3,ans:12, yomi:'しさん じゅうに'},
    {a:4,b:4,ans:16, yomi:'しし じゅうろく'},
    {a:4,b:5,ans:20, yomi:'しご にじゅう'},
    {a:4,b:6,ans:24, yomi:'しろく にじゅうし'},
    {a:4,b:7,ans:28, yomi:'ししち にじゅうはち'},
    {a:4,b:8,ans:32, yomi:'しはち さんじゅうに'},
    {a:4,b:9,ans:36, yomi:'しく さんじゅうろく'},
  ],[
    {a:5,b:1,ans:5,  yomi:'ごいちが ご'},
    {a:5,b:2,ans:10, yomi:'ごに じゅう'},
    {a:5,b:3,ans:15, yomi:'ごさん じゅうご'},
    {a:5,b:4,ans:20, yomi:'ごし にじゅう'},
    {a:5,b:5,ans:25, yomi:'ごご にじゅうご'},
    {a:5,b:6,ans:30, yomi:'ごろく さんじゅう'},
    {a:5,b:7,ans:35, yomi:'ごしち さんじゅうご'},
    {a:5,b:8,ans:40, yomi:'ごはち しじゅう'},
    {a:5,b:9,ans:45, yomi:'ごく しじゅうご'},
  ],[
    {a:6,b:1,ans:6,  yomi:'ろくいちが ろく'},
    {a:6,b:2,ans:12, yomi:'ろくに じゅうに'},
    {a:6,b:3,ans:18, yomi:'ろくさん じゅうはち'},
    {a:6,b:4,ans:24, yomi:'ろくし にじゅうし'},
    {a:6,b:5,ans:30, yomi:'ろくご さんじゅう'},
    {a:6,b:6,ans:36, yomi:'ろくろく さんじゅうろく'},
    {a:6,b:7,ans:42, yomi:'ろくしち しじゅうに'},
    {a:6,b:8,ans:48, yomi:'ろくはち しじゅうはち'},
    {a:6,b:9,ans:54, yomi:'ろっく ごじゅうし'},
  ],[
    {a:7,b:1,ans:7,  yomi:'しちいちが しち'},
    {a:7,b:2,ans:14, yomi:'しちに じゅうし'},
    {a:7,b:3,ans:21, yomi:'しちさん にじゅういち'},
    {a:7,b:4,ans:28, yomi:'しちし にじゅうはち'},
    {a:7,b:5,ans:35, yomi:'しちご さんじゅうご'},
    {a:7,b:6,ans:42, yomi:'しちろく しじゅうに'},
    {a:7,b:7,ans:49, yomi:'しちしち しじゅうく'},
    {a:7,b:8,ans:56, yomi:'しちはち ごじゅうろく'},
    {a:7,b:9,ans:63, yomi:'しちく ろくじゅうさん'},
  ],[
    {a:8,b:1,ans:8,  yomi:'はちいちが はち'},
    {a:8,b:2,ans:16, yomi:'はちに じゅうろく'},
    {a:8,b:3,ans:24, yomi:'はちさん にじゅうし'},
    {a:8,b:4,ans:32, yomi:'はちし さんじゅうに'},
    {a:8,b:5,ans:40, yomi:'はちご しじゅう'},
    {a:8,b:6,ans:48, yomi:'はちろく しじゅうはち'},
    {a:8,b:7,ans:56, yomi:'はちしち ごじゅうろく'},
    {a:8,b:8,ans:64, yomi:'はっぱ ろくじゅうし'},
    {a:8,b:9,ans:72, yomi:'はちく しちじゅうに'},
  ],[
    {a:9,b:1,ans:9,  yomi:'くいちが く'},
    {a:9,b:2,ans:18, yomi:'くに じゅうはち'},
    {a:9,b:3,ans:27, yomi:'くさん にじゅうしち'},
    {a:9,b:4,ans:36, yomi:'くし さんじゅうろく'},
    {a:9,b:5,ans:45, yomi:'くご しじゅうご'},
    {a:9,b:6,ans:54, yomi:'くろく ごじゅうし'},
    {a:9,b:7,ans:63, yomi:'くしち ろくじゅうさん'},
    {a:9,b:8,ans:72, yomi:'くはち しちじゅうに'},
    {a:9,b:9,ans:81, yomi:'くく はちじゅういち'},
  ],
];

let curDan=0, curIdx=0;

function fw(n){return String(n).replace(/[0-9]/g,c=>'０１２３４５６７８９'[+c]);}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showSelect(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  showScreen('screenSelect');
}

function startDan(i){
  curDan=i; curIdx=0;
  const col=DAN_COLORS[i];
  document.getElementById('nextBtn').style.background=col;
  document.getElementById('studyTitle').style.color=col;
  showScreen('screenStudy');
  renderEntry();
}

function renderEntry(){
  const e=KUKU[curDan][curIdx];
  const col=DAN_COLORS[curDan];
  const em=DAN_EMOJI[curDan];

  document.getElementById('studyTitle').textContent=`${curDan+1}のだん`;
  document.getElementById('studyProg').textContent=`${curIdx+1} / 9`;
  document.getElementById('studyCard').style.borderColor=col+'99';

  // しんちょくドット
  let dots='';
  for(let i=0;i<9;i++){
    const isCur=i===curIdx, isDone=i<curIdx;
    dots+=`<div class="pdot${isCur?' cur':isDone?' done':''}" style="${isCur?`width:28px;background:${col};`:isDone?`width:10px;background:${col}66;`:'width:10px;'}"></div>`;
  }
  document.getElementById('progDots').innerHTML=dots;

  // えもじビジュアル（25こ以下はグループひょうじ）
  const va=document.getElementById('visualArea');
  if(e.ans<=25){
    let h='';
    for(let g=0;g<e.b;g++){
      let items='';
      for(let k=0;k<e.a;k++) items+=`<span style="font-size:1.25rem;line-height:1.3">${em}</span>`;
      h+=`<div class="v-group">${items}</div>`;
    }
    va.innerHTML=h;
  } else {
    va.innerHTML=`<span style="font-size:2.5rem">${em}</span>`;
  }

  // しき
  document.getElementById('eqLine').innerHTML=
    `<span style="color:${col}">${fw(e.a)}</span><span style="color:rgba(255,255,255,.45)"> × </span><span style="color:${col}">${fw(e.b)}</span>`;
  document.getElementById('eqAns').innerHTML=
    `<span style="color:rgba(255,255,255,.4)">＝ </span><span style="color:#fff">${fw(e.ans)}</span>`;
  document.getElementById('eqYomi').textContent=e.yomi;

  // じどうよみあげ
  setTimeout(()=>doSpeak(e.yomi), 350);
}

function doSpeak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=0.78; u.pitch=1.1;
  speechSynthesis.speak(u);
}
function speak(){doSpeak(KUKU[curDan][curIdx].yomi);}

function nextEntry(){
  if(curIdx<8){curIdx++;renderEntry();}
  else showComplete();
}
function prevEntry(){
  if(curIdx>0){curIdx--;renderEntry();}
}

function showComplete(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('doneSub').textContent=`${curDan+1}のだん、ぜんぶできた！`;
  document.getElementById('replayBtn').style.background=DAN_COLORS[curDan];
  const nb=document.getElementById('nextDanBtn');
  if(curDan<8){nb.style.display='';nb.style.background=DAN_COLORS[curDan+1];}
  else nb.style.display='none';
  showScreen('screenComplete');
  setTimeout(()=>doSpeak('すごい！ぜんぶできた！'), 400);
}
function replay(){startDan(curDan);}
function goNextDan(){if(curDan<8)startDan(curDan+1);else showSelect();}

// だんボタンをつくる
(function(){
  const grid=document.getElementById('danGrid');
  for(let i=0;i<9;i++){
    const b=document.createElement('button');
    b.className='dan-btn';
    b.style.background=`linear-gradient(135deg,${DAN_COLORS[i]},${DAN_COLORS[i]}88)`;
    b.innerHTML=`<span class="d-emoji">${DAN_EMOJI[i]}</span><span class="d-label">${i+1}のだん</span>`;
    b.onclick=()=>startDan(i);
    grid.appendChild(b);
  }
})();
</script>
</body>
</html>
