<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<title>My Apps 🎮</title>
<meta name="theme-color" content="#372a1c">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ダークセピア（真っ暗だと暗すぎるので、茶〜琥珀の暖色にしている） */
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(180deg, #372a1c 0%, #2c2218 55%, #251d15 100%);
  background-attachment: fixed;
  color: #f2e6d3;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
  overflow-x: hidden;
}

/* Ambient background blobs */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(214,163,94,0.16) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 85%, rgba(160,110,64,0.14) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 60% 40%, rgba(245,214,160,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.header {
  position: relative; z-index: 1;
  text-align: center;
  margin-bottom: 40px;
}
.header h1 {
  font-size: 1.9rem; font-weight: 900;
  background: linear-gradient(135deg, #f7e0b0 0%, #c8934e 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.header p { color: #8d7a63; font-size: 0.82rem; }

/* 更新日時（タップで最新を取り直す） */
.header .updated {
  display: inline-flex; align-items: center; gap: 7px;
  color: #b39a78; font-size: 0.78rem; font-weight: 700;
  padding: 6px 14px; border-radius: 100px;
  border: 1px solid rgba(226,192,140,0.18);
  background: rgba(226,192,140,0.06);
  font-family: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
}
.header .updated:active { transform: scale(0.93); }
.header .updated .reload-icon { font-size: 0.95em; opacity: 0.7; }

/* App container */
.section {
  position: relative; z-index: 1;
  width: 100%; max-width: 480px;
  margin-bottom: 16px;
}

/* Icon grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px 12px;
  width: 100%;
}

/* App icon */
.app {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  text-decoration: none; color: #e6d8c2;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.app:active .icon-wrap { transform: scale(0.88); }

.icon-wrap {
  position: relative;
  width: 72px; height: 72px;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
  transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s;
  overflow: hidden;
}
/* Subtle shine overlay */
.icon-wrap::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
  border-radius: inherit;
  pointer-events: none;
}

/* Per-app gradient backgrounds */
.app.earth     .icon-wrap { background: linear-gradient(135deg,#1e3a5f,#3b82f6); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
.app.tarot     .icon-wrap { background: linear-gradient(135deg,#3b0764,#9333ea); box-shadow: 0 6px 20px rgba(147,51,234,0.45); }
.app.quiz      .icon-wrap { background: linear-gradient(135deg,#4c1d95,#7c3aed); box-shadow: 0 6px 20px rgba(124,58,237,0.4); }
.app.shinkansen  .icon-wrap { background: linear-gradient(135deg,#1e3a8a,#3b82f6); box-shadow: 0 6px 20px rgba(59,130,246,0.45); }
.app.kidslearning .icon-wrap { background: linear-gradient(135deg,#e07b00,#ffb703); box-shadow: 0 6px 20px rgba(255,183,3,0.45); }
.app.pgquiz    .icon-wrap { background: linear-gradient(135deg,#336791,#6cace4); box-shadow: 0 6px 20px rgba(108,172,228,0.45); }
.app.awsquiz   .icon-wrap { background: linear-gradient(135deg,#232f3e,#ff9900); box-shadow: 0 6px 20px rgba(255,153,0,0.45); }
.app.shogi     .icon-wrap { background: linear-gradient(135deg,#8a5a2b,#dcb35c); box-shadow: 0 6px 20px rgba(220,179,92,0.45); }
.app.othello   .icon-wrap { background: linear-gradient(135deg,#0f3d1f,#1f9e4e); box-shadow: 0 6px 20px rgba(31,158,78,0.45); }
.app.gomoku    .icon-wrap { background: linear-gradient(135deg,#5c3a1e,#c9974f); box-shadow: 0 6px 20px rgba(201,151,79,0.45); }
.app.chess     .icon-wrap { background: linear-gradient(135deg,#2b2118,#c9a876); box-shadow: 0 6px 20px rgba(201,168,118,0.4); }
.app.go        .icon-wrap { background: linear-gradient(135deg,#3a2a15,#d9b45f); box-shadow: 0 6px 20px rgba(217,180,95,0.4); }
.app.mahjong   .icon-wrap { background: linear-gradient(135deg,#0d3d2e,#2fae7e); box-shadow: 0 6px 20px rgba(47,174,126,0.45); }
.app.diamondgame .icon-wrap { background: linear-gradient(135deg,#7a1f5c,#e0479f); box-shadow: 0 6px 20px rgba(224,71,159,0.45); }
.app.rockcollections .icon-wrap { background: linear-gradient(135deg,#4a7c3f,#e8a838); box-shadow: 0 6px 20px rgba(232,168,56,0.45); }
.app.cardgames  .icon-wrap { background: linear-gradient(135deg,#0f5c33,#f2c14e); box-shadow: 0 6px 20px rgba(242,193,78,0.45); }

.app-name {
  font-size: 0.7rem; font-weight: 700;
  text-align: center; line-height: 1.3;
  color: rgba(244,231,211,0.8);
  max-width: 76px;
  word-break: keep-all;
}

/* NEW badge */
.new-badge {
  position: absolute; top: -5px; right: -5px;
  background: linear-gradient(135deg,#ef4444,#b91c1c);
  color: #fff; font-size: 0.55rem; font-weight: 900;
  padding: 2px 6px; border-radius: 100px;
  font-family: 'Nunito', sans-serif;
  box-shadow: 0 2px 6px rgba(239,68,68,0.5);
  letter-spacing: 0.04em;
}

</style>
</head>
<body>

<div class="header">
  <h1>🎮 My Apps</h1>
  <!-- 更新日時: 読み込み時に「各アプリ / 自分自身の最終更新のうち新しい方」で上書きされる。
       ここの文字列は file:// やオフライン用のフォールバック -->
  <button class="updated" id="updated">更新 2026-08-16 18:32:37<span class="reload-icon">↻</span></button>
</div>

<!-- Apps -->
<div class="section">
  <div class="grid">

    <a class="app earth" href="earth/" data-added="2026-06-03T04:47:30">
      <div class="icon-wrap">🌏</div>
      <div class="app-name">ちきゅうを<br>まなぼう</div>
    </a>

    <a class="app shinkansen" href="shinkansen/" data-added="2026-06-19T18:06:44">
      <div class="icon-wrap">🚄</div>
      <div class="app-name">新幹線<br>マップ</div>
    </a>

    <a class="app tarot" href="tarot/" data-added="2026-06-03T03:16:22">
      <div class="icon-wrap">🔮</div>

    </a>

    <a class="app quiz" href="tarot/quiz.html" data-added="2026-06-03T03:25:01">
      <div class="icon-wrap">🃏</div>
      <div class="app-name">タロット<br>クイズ</div>
    </a>

    <a class="app kidslearning" href="kids-learning-app/" data-added="2026-07-24T23:05:09">
      <div class="icon-wrap">🌟</div>
      <div class="app-name">まなび<br>アプリ</div>
    </a>

    <a class="app pgquiz" href="pgquiz/" data-added="2026-07-25T01:34:52">

      <div class="app-name">PostgreSQL<br>強化書</div>
    </a>

    <a class="app awsquiz" href="awsquiz/" data-added="2026-08-13T01:37:44">
      <div class="icon-wrap">☁️</div>
      <div class="app-name">AWS SAP<br>対策</div>
    </a>

    <a class="app shogi" href="shogi/" data-added="2026-08-16T02:18:38">
      <div class="icon-wrap">♟️</div>
      <div class="app-name">将棋</div>
    </a>

    <a class="app othello" href="othello/" data-added="2026-08-16T16:02:51">

    <a class="app gomoku" href="gomoku/" data-added="2026-08-16T16:02:51">

    <a class="app cardgames" href="cardgames/" data-added="2026-08-16T23:47:24">
      <div class="icon-wrap">🃏</div>
      <div class="app-name">トランプ<br>ゲーム</div>
    </a>

  </div>
</div>

<script>
// NEW バッジは data-added（アプリを追加した日時）から 24 時間だけ出す。
// バッジは HTML に直書きせず、ここで動的に付ける（期限切れのバッジが一瞬見えるのを防ぐため）。
// data-added は "YYYY-MM-DDTHH:MM:SS"（ローカル時刻）。日付だけ書いた場合は 00:00:00 とみなす。
(function () {
  var DAY = 24 * 60 * 60 * 1000;
  var now = Date.now();
  [].forEach.call(document.querySelectorAll('a.app[data-added]'), function (a) {
    var v = a.getAttribute('data-added');
    var t = Date.parse(v.indexOf('T') < 0 ? v + 'T00:00:00' : v);
    if (isNaN(t) || now - t > DAY) return;
    var wrap = a.querySelector('.icon-wrap');
    if (!wrap) return;
    var b = document.createElement('span');
    b.className = 'new-badge';
    b.textContent = 'NEW';
    wrap.appendChild(b);
  });
})();

(function () {
  var btn   = document.getElementById('updated');
  var label = btn.firstChild;                 // 「更新 YYYY-MM-DD HH:MM:SS」のテキストノード
  var links = [].slice.call(document.querySelectorAll('a.app'));
  var urls  = links.map(function (a) { return a.href; });   // 印を付ける前の素の URL
  var stamp = new URLSearchParams(location.search).get('t');

  // 強制更新で開いたときは、各アプリへのリンクにも同じ印を付けて回す
  // （通常時は付けない。付けると PWA のオフラインキャッシュを外してしまうため）
  if (stamp) {
    links.forEach(function (a) {
      a.href += (a.href.indexOf('?') < 0 ? '?' : '&') + 't=' + encodeURIComponent(stamp);
    });
  }

  // ホーム画面に登録した web アプリには「引っぱって更新」がないため、
  // 更新時刻をタップしたらキャッシュを避けて最新を取り直せるようにしている。
  btn.addEventListener('click', function () {
    this.textContent = 'さいしんを かくにんちゅう…';
    location.replace(location.pathname + '?t=' + Date.now());
  });

  // 表示する更新時刻 = 各アプリの最終更新 と このページ自身の最終更新 のうち新しい方。
  // 各アプリは HEAD の Last-Modified で調べる。file:// やオフラインでは取れないので、
  // その場合は HTML に直書きしてある時刻をそのまま表示する（フォールバック）。
  function fmt(d) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  if (!window.fetch) return;

  var newest = new Date(document.lastModified);   // index.html 自身

  Promise.all(urls.map(function (u) {
    return fetch(u, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.headers.get('Last-Modified') : null; })
      .catch(function () { return null; });
  })).then(function (heads) {
    var got = false;
    heads.forEach(function (s) {
      if (!s) return;
      var d = new Date(s);
      if (isNaN(d.getTime())) return;
      got = true;
      if (d > newest) newest = d;
    });
    if (got && !isNaN(newest.getTime())) label.nodeValue = '更新 ' + fmt(newest);
  });
})();
</script>

</body>
