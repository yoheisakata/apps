<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐘</text></svg>">
<title>PostgreSQL 強化書 🐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  --bg1:#0a1220; --bg2:#0f2236;
  --card:#132437; --card-border:rgba(108,172,228,.18);
  --accent:#6cace4; --accent-dark:#336791;
  --text:#e9f1fa; --sub:#8fa7bd;
  --correct:#2ed573; --wrong:#ff4757;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Nunito','Hiragino Sans','Yu Gothic',sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  color:var(--text);
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden; user-select:none;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 55% 35% at 15% 8%, rgba(108,172,228,.14) 0%, transparent 70%),
    radial-gradient(ellipse 45% 35% at 85% 92%, rgba(46,213,115,.08) 0%, transparent 70%);
}

.screen{display:none; flex-direction:column; align-items:center; width:100%; max-width:640px; min-height:100vh; min-height:100dvh; padding:20px 16px 40px; position:relative; z-index:1;}
.screen.active{display:flex;}

.back-btn{
  align-self:flex-start;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border); color:var(--text);
  font-family:inherit; font-size:.95rem; font-weight:700;
  padding:10px 18px; border-radius:14px; cursor:pointer; margin-bottom:12px;
  min-height:44px;
}
.back-btn:active{opacity:.7;}

.home-link{
  align-self:flex-start;
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border); color:var(--sub);
  font-size:.85rem; font-weight:700; text-decoration:none;
  padding:8px 14px; border-radius:12px; min-height:40px; margin-bottom:8px;
}
.home-link:active{opacity:.7;}

.app-title{font-size:clamp(1.6rem,6vw,2.2rem); font-weight:900; text-align:center; margin:12px 0 4px;
  background:linear-gradient(135deg,#6cace4,#2ed573); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.app-sub{color:var(--sub); font-size:.9rem; text-align:center; margin-bottom:8px;}

/* ---- ホーム: モードえらび ---- */
.mode-col{display:flex; flex-direction:column; gap:16px; width:100%; max-width:420px;}
.mode-btn{
  border:none; border-radius:24px; font-family:inherit; font-weight:900; color:#fff;
  padding:26px 20px; cursor:pointer; display:flex; align-items:center; gap:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.35); text-align:left; min-height:44px;
  transition:transform .12s;
}
.mode-btn:active{transform:scale(.97);}
.mode-emoji{font-size:2.4rem; flex-shrink:0;}
.mode-label{font-size:1.25rem; display:block;}
.mode-desc{font-size:.8rem; color:rgba(255,255,255,.75); font-weight:700; margin-top:4px;}
.mode-quiz{background:linear-gradient(135deg,var(--accent-dark),var(--accent));}
.mode-flash{background:linear-gradient(135deg,#0f5132,#2ed573);}

.footnote{color:var(--sub); font-size:.75rem; margin-top:auto; padding-top:30px; text-align:center;}
/* バージョン表示（画面上部・更新のたびに上げる） */
.app-version{color:var(--sub); opacity:.55; font-size:.65rem; letter-spacing:.06em; text-align:center; margin-bottom:36px;}

/* ---- カテゴリえらび ---- */
.screen-title{font-size:1.3rem; color:var(--text); margin:8px 0 20px; text-align:center;}
.category-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px; width:100%;
}
.category-card{
  border:1px solid var(--card-border); border-radius:20px; background:var(--card);
  color:var(--text); font-family:inherit; cursor:pointer; padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px; min-height:44px;
  transition:transform .12s, border-color .2s;
}
.category-card:active{transform:scale(.95);}
.category-emoji{font-size:1.8rem;}
.category-name{font-size:.9rem; font-weight:800; text-align:center; line-height:1.3;}
.category-count{font-size:.72rem; color:var(--sub);}
.category-card.all{border-color:var(--accent); background:linear-gradient(135deg,rgba(108,172,228,.14),rgba(46,213,115,.1));}

/* ---- クイズ ---- */
.quiz-header{display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:10px;}
.quiz-cat-label{font-size:.85rem; color:var(--sub); font-weight:700;}
.quiz-prog-text{font-size:.85rem; color:var(--sub); font-weight:700;}
.prog-dots{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0 22px;}
.pdot{height:9px; width:9px; border-radius:50%; background:rgba(255,255,255,.15); flex-shrink:0;}
.pdot.done{background:var(--accent);}
.pdot.cur{background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.2);}

.quiz-card{width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:26px;
  padding:clamp(20px,5vw,32px) clamp(16px,5vw,26px); margin-bottom:18px;}
.quiz-question{font-size:clamp(1.05rem,4vw,1.3rem); font-weight:800; line-height:1.55; text-align:center;}

.choices{display:grid; grid-template-columns:1fr; gap:12px; width:100%;}
@media (min-width:480px){ .choices{grid-template-columns:1fr 1fr;} }
.choice-btn{
  background:rgba(255,255,255,.05); border:2px solid var(--card-border); border-radius:18px;
  color:var(--text); font-family:inherit; font-size:.98rem; font-weight:700;
  padding:16px 14px; cursor:pointer; text-align:left; min-height:56px;
  transition:transform .1s, background .15s, border-color .15s;
}
.choice-btn:active{transform:scale(.97);}
.choice-btn.correct{background:rgba(46,213,115,.18); border-color:var(--correct); color:var(--correct);}
.choice-btn.wrong{background:rgba(255,71,87,.18); border-color:var(--wrong); color:var(--wrong);}
.choice-btn:disabled{cursor:default;}
.choice-btn.eliminated{opacity:.3; text-decoration:line-through;}

.hint-btn{
  margin-top:14px; background:none; border:1px dashed var(--card-border); color:var(--sub);
  font-family:inherit; font-size:.85rem; font-weight:700; padding:10px 20px; border-radius:100px;
  cursor:pointer; min-height:44px;
}
.hint-btn:active{opacity:.7;}
.hint-btn:disabled{opacity:.35; cursor:default;}
.hint-btn.hidden{display:none;}

.quiz-note{
  width:100%; background:rgba(255,255,255,.04); border-left:4px solid var(--accent);
  border-radius:12px; padding:16px 18px; margin-top:18px; font-size:.9rem; line-height:1.6; color:var(--text);
  display:none;
}
.quiz-note.show{display:block;}
.quiz-note b{color:var(--accent);}

/* ---- 解説図 ---- */
.fig-box{margin-top:14px; background:rgba(0,0,0,.22); border:1px solid var(--card-border); border-radius:12px; padding:10px 12px;}
.fig-box svg{display:block; width:100%; height:auto; max-width:420px; margin:0 auto;}
.flash-fig{width:100%;}
.flash-fig .fig-box{margin-top:0; padding:8px;}
.flash-fig svg{max-width:320px;}

.next-btn{
  margin-top:18px; width:100%; max-width:280px; padding:16px; border:none; border-radius:18px;
  background:linear-gradient(135deg,var(--accent-dark),var(--accent)); color:#fff; font-family:inherit;
  font-size:1.05rem; font-weight:900; cursor:pointer; display:none; min-height:44px;
}
.next-btn.show{display:block;}
.next-btn:active{transform:scale(.97);}

/* ---- 結果 ---- */
.result-emoji{font-size:4rem; margin:20px 0 8px;}
.result-score{font-size:2.4rem; font-weight:900; color:var(--accent); margin-bottom:6px;}
.result-msg{color:var(--sub); font-size:.95rem; margin-bottom:30px; text-align:center;}
.result-btns{display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px;}
.result-btn{
  border:none; border-radius:18px; padding:16px; font-family:inherit; font-size:1rem; font-weight:800;
  color:#fff; cursor:pointer; min-height:44px; background:rgba(255,255,255,.08);
}
.result-btn.primary{background:linear-gradient(135deg,var(--accent-dark),var(--accent));}
.result-btn:active{transform:scale(.97);}

/* ---- フラッシュカード ---- */
.flash-progress{color:var(--sub); font-size:.85rem; font-weight:700; margin-bottom:16px;}
.flash-wrap{width:100%; max-width:460px; perspective:1400px; margin-bottom:22px;}
.flash-card{
  position:relative; width:100%; min-height:340px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:26px;
  border:1px solid var(--card-border); padding:clamp(20px,6vw,32px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; justify-content:safe center;
  text-align:center; gap:14px; overflow-y:auto;
}
.flash-front{background:var(--card);}
.flash-back{background:linear-gradient(160deg,#12331f,#0f2236); transform:rotateY(180deg);}
.flash-cat-chip{font-size:.72rem; font-weight:800; color:var(--accent); background:rgba(108,172,228,.12);
  padding:5px 12px; border-radius:100px; position:absolute; top:16px; left:16px;}
.flash-q{font-size:clamp(1rem,4.2vw,1.25rem); font-weight:800; line-height:1.55;}
.flash-answer{font-size:clamp(1.1rem,4.5vw,1.4rem); font-weight:900; color:var(--correct);}
.flash-note{font-size:.88rem; color:var(--sub); line-height:1.6;}
.flash-hint{font-size:.72rem; color:var(--sub); margin-top:4px;}

.flash-nav{display:flex; gap:10px; width:100%; max-width:460px;}
.flash-nav-btn{
  flex:1; border:none; border-radius:16px; padding:15px; font-family:inherit; font-weight:800; font-size:.95rem;
  background:rgba(255,255,255,.08); color:var(--text); cursor:pointer; min-height:44px;
}
.flash-nav-btn:active{transform:scale(.96);}
.flash-nav-btn:disabled{opacity:.35; cursor:default;}
.flash-shuffle{margin-top:12px; background:none; border:1px solid var(--card-border); color:var(--sub);
  font-family:inherit; font-size:.85rem; font-weight:700; padding:10px 20px; border-radius:100px; cursor:pointer; min-height:44px;}
.flash-shuffle:active{opacity:.7;}
</style>
</head>
<body>

<!-- ホーム -->
<div class="screen active" id="screen-home">
  <a class="home-link" href="../">🏠 アプリ一覧へ</a>
  <div class="app-title">🐘 PostgreSQL 強化書</div>
  <div class="app-sub">対象バージョン: PostgreSQL 17 以降</div>
  <div class="app-version">v1.0.2</div>
  <div class="mode-col">
    <button class="mode-btn mode-quiz" data-action="pick-mode-quiz">
      <span class="mode-emoji">📝</span>
      <span><span class="mode-label">クイズモード</span><span class="mode-desc">4択問題で理解度をチェック</span></span>
    </button>
    <button class="mode-btn mode-flash" data-action="pick-mode-flash">
      <span class="mode-emoji">🃏</span>
      <span><span class="mode-label">フラッシュカード</span><span class="mode-desc">カードをめくって暗記・復習</span></span>
    </button>
  </div>
  <div class="footnote">全104問・13カテゴリ / データはこの端末に保存されません</div>
</div>

<!-- カテゴリえらび -->
<div class="screen" id="screen-category">
  <button class="back-btn" data-action="home">← もどる</button>
  <h2 class="screen-title">カテゴリをえらぶ</h2>
  <div class="category-grid" id="category-grid"></div>
</div>

<!-- クイズ -->
<div class="screen" id="screen-quiz">
  <button class="back-btn" data-action="home">← やめる</button>
  <div class="quiz-header">
    <span class="quiz-cat-label" id="quiz-cat-label"></span>
    <span class="quiz-prog-text" id="quiz-prog-text"></span>
  </div>
  <div class="prog-dots" id="quiz-dots"></div>
  <div class="quiz-card">
    <div class="quiz-question" id="quiz-question"></div>
  </div>
  <div class="choices" id="quiz-choices"></div>
  <button class="hint-btn" id="quiz-hint-btn" data-action="quiz-hint">💡 ヒント: 選択肢を2つへらす</button>
  <div class="quiz-note" id="quiz-note"></div>
  <button class="next-btn" id="quiz-next-btn" data-action="quiz-next">つぎの問題へ →</button>
</div>

<!-- クイズ結果 -->
<div class="screen" id="screen-result">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-score" id="result-score">0 / 0</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-btns">
    <button class="result-btn primary" data-action="quiz-retry">🔄 同じカテゴリでもう一度</button>
    <button class="result-btn" data-action="pick-mode-quiz">📚 カテゴリを選び直す</button>
    <button class="result-btn" data-action="home">🏠 ホームへ</button>
  </div>
</div>

<!-- フラッシュカード -->
<div class="screen" id="screen-flash">
  <button class="back-btn" data-action="home">← もどる</button>
  <div class="flash-progress" id="flash-progress"></div>
  <div class="flash-wrap">
    <div class="flash-card" id="flash-card" data-action="flash-flip">
      <div class="flash-face flash-front">
        <span class="flash-cat-chip" id="flash-cat-chip"></span>
        <div class="flash-q" id="flash-q"></div>
        <div class="flash-hint">タップして こたえを見る</div>
      </div>
      <div class="flash-face flash-back">
        <div class="flash-answer" id="flash-answer"></div>
        <div class="flash-note" id="flash-note"></div>
        <div class="flash-fig" id="flash-fig"></div>
      </div>
    </div>
  </div>
  <div class="flash-nav">
    <button class="flash-nav-btn" id="flash-prev-btn" data-action="flash-prev">← まえ</button>
    <button class="flash-nav-btn" id="flash-next-btn" data-action="flash-next">つぎへ →</button>
  </div>
  <button class="flash-shuffle" data-action="flash-shuffle">🔀 シャッフルし直す</button>
</div>

<script>
(function () {
  "use strict";

  // ==== 出題データ (PostgreSQL 17以降を対象) ====
  var QUESTIONS = [
    // -- 基本概念 --
    { cat:"基本概念", q:"トランザクションの原子性・一貫性・独立性・永続性の4特性をまとめて何と呼ぶ?",
      choices:["ACID特性","CAP定理","BASE特性","2相コミット"], answer:0,
      note:"ACID = Atomicity(原子性)・Consistency(一貫性)・Isolation(独立性)・Durability(永続性)の頭文字。" },
    { cat:"基本概念", q:"複数のトランザクションが同じ行を同時に読み書きできるよう、行の複数バージョンを保持する仕組みは?",
      choices:["MVCC(多版型同時実行制御)","ロック昇格","WALストリーミング","シャーディング"], answer:0, fig:"mvcc",
      note:"MVCC(Multi-Version Concurrency Control)。更新のたびに新しい行バージョンが作られ、不要になった古いバージョンはVACUUMで回収される。" },
    { cat:"基本概念", q:"PostgreSQLのデフォルトのトランザクション分離レベルは?",
      choices:["READ COMMITTED","REPEATABLE READ","SERIALIZABLE","READ UNCOMMITTED"], answer:0,
      note:"SQL標準のデフォルトはSERIALIZABLEだが、PostgreSQLのデフォルトはREAD COMMITTED。READ UNCOMMITTEDを指定してもREAD COMMITTEDとして扱われる。" },
    { cat:"基本概念", q:"変更をデータファイルに反映する前に、まず追記して記録しておくクラッシュリカバリ用のログ機構は?",
      choices:["WAL(先行書き込みログ)","バイナリログ","スロークエリログ","監査ログ"], answer:0, fig:"wal",
      note:"WAL(Write-Ahead Log)。クラッシュ後の復旧はこのログを再生することで行われる。" },
    { cat:"基本概念", q:"PostgreSQLがSERIALIZABLE分離レベルを実現するために使う仕組みは?",
      choices:["SSI(直列化可能スナップショット分離)","2フェーズロック","タイムスタンプ順序付け","マルチグラニュラロック"], answer:0,
      note:"SSI(Serializable Snapshot Isolation)により、追加のロックオーバーヘッドを抑えつつ直列化可能性を保証する。" },
    { cat:"基本概念", q:"トランザクションの一部分だけを取り消せるようにする、ROLLBACK TOと組み合わせて使う機能は?",
      choices:["SAVEPOINT(セーブポイント)","CHECKPOINT","VACUUM FULL","プリペアドトランザクション"], answer:0,
      note:"SAVEPOINTで印を付けておくと、ROLLBACK TO SAVEPOINTでそこまでだけ変更を巻き戻せる。" },
    { cat:"基本概念", q:"複数のデータベース間で一貫性を保った分散トランザクションを実現するための、PREPARE TRANSACTIONを使う方式は?",
      choices:["2相コミット(2PC)","単相コミット","ベクタークロック","Paxos"], answer:0,
      note:"PREPARE TRANSACTIONで準備し、後からCOMMIT PREPARED/ROLLBACK PREPAREDで確定させる分散トランザクション向けの仕組み。" },

    // -- インデックス --
    { cat:"インデックス", q:"PostgreSQLのデフォルトのインデックス種別は?",
      choices:["B-tree","GIN","GiST","Hash"], answer:0,
      note:"等値検索・範囲検索・並び替えに強いB-treeがCREATE INDEXのデフォルト。" },
    { cat:"インデックス", q:"配列やJSONB、全文検索など「1つの値が複数のキーを持つ」データの検索に向いたインデックス種別は?",
      choices:["GIN(汎用転置インデックス)","B-tree","BRIN","Hash"], answer:0,
      note:"GIN(Generalized Inverted Index)は、1行が複数のキーワード/キーを持つデータの検索に強い。" },
    { cat:"インデックス", q:"タイムスタンプなど物理的な並び順と相関のあるカラムに向いた、非常に小さいサイズのインデックス種別は?",
      choices:["BRIN(ブロックレンジインデックス)","B-tree","Hash","GiST"], answer:0,
      note:"BRIN(Block Range Index)はブロック範囲ごとの最小・最大値だけを保持するためコンパクト。挿入順とカラム値に相関がある場合に有効。" },
    { cat:"インデックス", q:"WHERE句の条件を満たす行だけを対象にすることで、サイズを小さくできるインデックスの種類は?",
      choices:["部分インデックス(Partial Index)","クラスタインデックス","複合インデックス","カバリングインデックス"], answer:0,
      note:"CREATE INDEX ... WHERE 条件 で作成する。status='active'のような一部の値だけを検索する場合に有効。" },
    { cat:"インデックス", q:"カラムの値そのものではなく、関数やカラムを組み合わせた式の結果に対して作るインデックスは?",
      choices:["式インデックス(Expression Index)","部分インデックス","ユニークインデックス","カバリングインデックス"], answer:0,
      note:"CREATE INDEX ... (lower(email)) のように式の結果にインデックスを張る。大文字小文字を無視した検索の高速化などに使う。" },
    { cat:"インデックス", q:"インデックスに含まれる列だけでSELECT結果を返せる場合に、テーブル本体(ヒープ)へのアクセスを省略できるスキャン方式は?",
      choices:["インデックスオンリースキャン","シーケンシャルスキャン","ビットマップヒープスキャン","TIDスキャン"], answer:0,
      note:"可視性マップで該当行が全トランザクションから見えると保証されていれば、ヒープを読まずインデックスだけで結果を返せる。" },
    { cat:"インデックス", q:"稼働中のテーブルをロックせずにインデックスを作成するために使うオプションは?",
      choices:["CREATE INDEX CONCURRENTLY","CREATE INDEX ASYNC","CREATE INDEX ONLINE","CREATE INDEX NOWAIT"], answer:0,
      note:"CONCURRENTLYを付けると書き込みをブロックせずにインデックスを作成できる(通常より時間はかかる)。" },
    { cat:"インデックス", q:"複数カラムの複合インデックスで、検索パフォーマンスに強く影響するのはどれ?",
      choices:["カラムの並び順","カラム名のアルファベット順","カラムのデータ型の一致","インデックス名の長さ"], answer:0,
      note:"複合インデックスは左端のカラムから順にしか効率よく使われない(左端一致の原則)ため、条件でよく使う順に並べる。" },

  var QUESTIONS_PER_QUIZ = 10;

  // ==== 状態 ====
  var state = {
    intent: null,     // "quiz" | "flash"
    category: null,   // カテゴリ名 or null(=すべて)
    pool: []
  };
  var quiz = { list: [], idx: 0, correct: 0, answered: false, hintUsed: false, hintCount: 0 };
  var flash = { list: [], idx: 0, flipped: false };

  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function poolForCategory(cat) {
    return cat ? QUESTIONS.filter(function (q) { return q.cat === cat; }) : QUESTIONS.slice();
  }
  function figHtml(item) {
    return item.fig && FIGURES[item.fig] ? "<div class=\"fig-box\">" + FIGURES[item.fig] + "</div>" : "";
  }

  // ==== カテゴリえらび画面 ====
  function buildCategoryScreen() {
    var grid = document.getElementById("category-grid");
    grid.innerHTML = "";

    var allBtn = document.createElement("button");
    allBtn.className = "category-card all";
    allBtn.innerHTML = "<span class=\"category-emoji\">🎲</span><span class=\"category-name\">ぜんぶ</span><span class=\"category-count\">" + QUESTIONS.length + "問</span>";
    allBtn.onclick = function () { selectCategory(null); };
    grid.appendChild(allBtn);

    Object.keys(CATEGORY_EMOJI).forEach(function (cat) {
      var count = QUESTIONS.filter(function (q) { return q.cat === cat; }).length;
      var btn = document.createElement("button");
      btn.className = "category-card";
      btn.innerHTML = "<span class=\"category-emoji\">" + CATEGORY_EMOJI[cat] + "</span><span class=\"category-name\">" + cat + "</span><span class=\"category-count\">" + count + "問</span>";
      btn.onclick = function () { selectCategory(cat); };
      grid.appendChild(btn);
    });
  }

  function selectCategory(cat) {
    state.category = cat;
    state.pool = poolForCategory(cat);
    if (state.intent === "quiz") startQuiz();
    else startFlash();
  }

  // ==== クイズ ====
  function startQuiz() {
    var n = Math.min(QUESTIONS_PER_QUIZ, state.pool.length);
    quiz.list = shuffle(state.pool).slice(0, n);
    quiz.idx = 0;
    quiz.correct = 0;
    quiz.hintCount = 0;
    show("screen-quiz");
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    quiz.answered = false;
    var item = quiz.list[quiz.idx];
    document.getElementById("quiz-cat-label").textContent = (state.category || "ぜんぶ") + (CATEGORY_EMOJI[item.cat] ? " " + CATEGORY_EMOJI[item.cat] : "");
    document.getElementById("quiz-prog-text").textContent = (quiz.idx + 1) + " / " + quiz.list.length;

    var dots = "";
    for (var i = 0; i < quiz.list.length; i++) {
      dots += "<span class=\"pdot" + (i < quiz.idx ? " done" : i === quiz.idx ? " cur" : "") + "\"></span>";
    }
    document.getElementById("quiz-dots").innerHTML = dots;

    document.getElementById("quiz-question").textContent = item.q;

    var order = shuffle(item.choices.map(function (c, i) { return i; }));
    var box = document.getElementById("quiz-choices");
    box.innerHTML = "";
    order.forEach(function (origIdx) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = item.choices[origIdx];
      btn.onclick = function () { onQuizAnswer(btn, origIdx, item); };
      box.appendChild(btn);
    });

    var note = document.getElementById("quiz-note");
    note.classList.remove("show");
    note.innerHTML = "";
    document.getElementById("quiz-next-btn").classList.remove("show");

    quiz.hintUsed = false;
    var hintBtn = document.getElementById("quiz-hint-btn");
    hintBtn.classList.remove("hidden");
    hintBtn.disabled = false;
  }

  function useQuizHint() {
    if (quiz.answered || quiz.hintUsed) return;
    quiz.hintUsed = true;
    quiz.hintCount++;
    var item = quiz.list[quiz.idx];
    var wrongBtns = [];
    document.querySelectorAll("#quiz-choices .choice-btn").forEach(function (b) {
      if (b.textContent !== item.choices[item.answer]) wrongBtns.push(b);
    });
    shuffle(wrongBtns).slice(0, 2).forEach(function (b) {
      b.classList.add("eliminated");
      b.disabled = true;
    });
    document.getElementById("quiz-hint-btn").disabled = true;
  }

  function onQuizAnswer(btn, chosenIdx, item) {
    if (quiz.answered) return;
    quiz.answered = true;
    var correct = chosenIdx === item.answer;
    if (correct) quiz.correct++;

    document.querySelectorAll(".choice-btn").forEach(function (b, i) {
      b.disabled = true;
    });
    btn.classList.add(correct ? "correct" : "wrong");
    if (!correct) {
      document.querySelectorAll(".choice-btn").forEach(function (b) {
        if (b.textContent === item.choices[item.answer]) b.classList.add("correct");
      });
    }

    var note = document.getElementById("quiz-note");
    note.innerHTML = "<b>" + (correct ? "⭕ せいかい! " : "❌ おしい! ") + "</b>" + item.note + figHtml(item);
    note.classList.add("show");

    document.getElementById("quiz-hint-btn").classList.add("hidden");

    var nextBtn = document.getElementById("quiz-next-btn");
    nextBtn.textContent = (quiz.idx + 1 >= quiz.list.length) ? "結果を見る →" : "つぎの問題へ →";
    nextBtn.classList.add("show");
  }

  function goQuizNext() {
    quiz.idx++;
    if (quiz.idx >= quiz.list.length) finishQuiz();
    else renderQuizQuestion();
  }

  function finishQuiz() {
    var total = quiz.list.length;
    var rate = quiz.correct / total;
    var emoji = rate === 1 ? "🏆" : rate >= 0.7 ? "🎉" : rate >= 0.4 ? "📘" : "💪";
    var msg = rate === 1 ? "パーフェクト! バッチリ理解できています。"
            : rate >= 0.7 ? "いい調子! もう少しで完璧です。"
            : rate >= 0.4 ? "半分以上正解。復習してもう一度挑戦してみましょう。"
            : "フラッシュカードで復習してから、もう一度挑戦してみましょう。";
    document.getElementById("result-emoji").textContent = emoji;
    document.getElementById("result-score").textContent = quiz.correct + " / " + total;
    document.getElementById("result-msg").textContent = msg + (quiz.hintCount > 0 ? " (💡ヒント " + quiz.hintCount + "回使用)" : "");
    show("screen-result");
  }

  // ==== フラッシュカード ====
  function startFlash() {
    flash.list = shuffle(state.pool);
    flash.idx = 0;
    flash.flipped = false;
    show("screen-flash");
    renderFlashCard();
  }

  function renderFlashCard() {
    var item = flash.list[flash.idx];
    document.getElementById("flash-progress").textContent = (state.category || "ぜんぶ") + " ・ " + (flash.idx + 1) + " / " + flash.list.length;
    document.getElementById("flash-cat-chip").textContent = (CATEGORY_EMOJI[item.cat] || "") + " " + item.cat;
    document.getElementById("flash-q").textContent = item.q;
    document.getElementById("flash-answer").textContent = item.choices[item.answer];
    document.getElementById("flash-note").textContent = item.note;
    document.getElementById("flash-fig").innerHTML = figHtml(item);

    flash.flipped = false;
    var card = document.getElementById("flash-card");
    card.classList.remove("flipped");
    // 裏面(答え+解説+図)が収まるようカード高さを内容に合わせる
    card.style.height = "";
    var maxH = Math.max.apply(null, [340].concat(
      Array.prototype.map.call(card.querySelectorAll(".flash-face"), function (f) { return f.scrollHeight; })
    ));
    card.style.height = maxH + "px";
    document.getElementById("flash-prev-btn").disabled = flash.idx === 0;
    document.getElementById("flash-next-btn").textContent = (flash.idx + 1 >= flash.list.length) ? "さいしょから" : "つぎへ →";
  }

  function flashFlip() {
    flash.flipped = !flash.flipped;
    document.getElementById("flash-card").classList.toggle("flipped", flash.flipped);
  }
  function flashPrev() {
    if (flash.idx > 0) { flash.idx--; renderFlashCard(); }
  }
  function flashNext() {
    if (flash.idx + 1 >= flash.list.length) { flash.idx = 0; }
    else { flash.idx++; }
    renderFlashCard();
  }
  function flashReshuffle() {
    flash.list = shuffle(flash.list);
    flash.idx = 0;
    renderFlashCard();
  }

  // ==== ナビゲーション ====
  document.body.addEventListener("click", function (e) {
    var action = e.target.closest("[data-action]");
    if (!action) return;
    switch (action.dataset.action) {
      case "pick-mode-quiz":
        state.intent = "quiz";
        buildCategoryScreen();
        show("screen-category");
        break;
      case "pick-mode-flash":
        state.intent = "flash";
        buildCategoryScreen();
        show("screen-category");
        break;
      case "quiz-next":
        goQuizNext();
        break;
      case "quiz-hint":
        useQuizHint();
        break;
      case "quiz-retry":
        startQuiz();
        break;
      case "flash-flip":
        flashFlip();
        break;
      case "flash-prev":
        flashPrev();
        break;
      case "flash-next":
        flashNext();
        break;
      case "flash-shuffle":
        flashReshuffle();
        break;
      case "home":
        show("screen-home");
        break;
    }
  });
})();
</script>
</body>
</html>
