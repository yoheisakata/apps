{"d":4,"q":"S3 に蓄積される評価ジョブの結果 (JSONL) を、AWS に不慣れな責任者が開くたびに最新状態で見られるダッシュボードとして提供し、月次推移も自動で追えるようにしたいです。最も運用負荷の低い構成はどれですか。","c":["毎月担当者がスプレッドシートへ手作業で集計して共有する","責任者に Bedrock コンソールの閲覧権限を付与する","Glue クローラーで JSONL をテーブル化し、Athena 経由で QuickSight のダイレクトクエリのダッシュボードを作って共有・定期配信する","QuickSight に月初に手動アップロードした CSV を SPICE に取り込み据え置く"],"a":2,"e":"Glue クローラーが新しい評価結果を同じテーブルに自動で追加し、ダイレクトクエリなら開くたびに最新データが表示されます。共有とメール定期配信も QuickSight の機能で完結します。SPICE 据え置き (D) は更新するまで古いままで、B はコンソールに不慣れな責任者に合わず推移も見にくく、A は手作業の負荷と転記ミスが残ります。"},
{"d":4,"q":"Bedrock 上の複数モデルで動く QA アプリに「回答の確信度」を表示したいのですが、利用中のモデルはトークン確率を返さず、汎用の信頼度スコア API もありません。実用的な代理手法はどれですか。","c":["temperature 0 で 1 回実行し、回答が返れば高確信とみなす","モデル自身に「自信を 0〜100% で申告せよ」と指示し、その数値を使う","回答の文字数が長いほど確信度が高いとみなす","同じ質問を中程度の temperature で複数回サンプリングし、回答間の意味的一貫性（埋め込み類似度）を確信度の代理指標にする"],"a":3,"e":"複数回サンプリングして回答がほぼ同じ内容に収束するなら確信度が高く、ばらつくなら低い——意味的一貫性は較正された確率がなくても計算できる実用的な代理指標です。temperature 0 の 1 回実行 (A) は自信を測らず、自己申告 (B) は較正されないことが知られ、文字数 (C) は確信度と相関しません。"},
{"d":4,"q":"Converse API ベースのチャットで「回答が途中で止まる」「回答が出ない」という報告があり、原因が出力上限・ガードレール介入・コンテキスト超過のどれなのかをリクエストごとに即時に判別して、利用者に適切な案内を出したいです。最も適切な実装はどれですか。","c":["すべての異常時に共通の汎用エラーメッセージを表示する","レスポンスの stopReason で分岐し、max_tokens / guardrail_intervened / model_context_window_exceeded など値ごとに対応した案内を表示する","回答の文字数が一定未満なら「上限到達」と案内する","週次でログを集計し、傾向を見てから案内文を改善する"],"a":1,"e":"stopReason は停止理由をそのまま返します: max_tokens（出力上限）、guardrail_intervened（ガードレール介入）、model_context_window_exceeded（コンテキスト超過）が異常系、end_turn（正常終了）、tool_use（ツール実行要求）、stop_sequence（停止文字列）は正常系です。値で分岐すれば即時に適切な案内が出せます。A は原因を伝えられず、C は推測にすぎず、D は即時対応の要件を満たしません。"},
{"d":4,"q":"Knowledge Base の同期ジョブは毎回「成功」と表示されるのに、12 万件の文書のうち約 4,000 件が検索にヒットしません。欠落した文書と原因を特定する最初のステップはどれですか。","c":["データソース全体を削除して再同期する","S3 の文書一覧とベクトルストアの件数の差分だけを確認する","取り込みジョブの統計と失敗明細を確認し、文書ごとの失敗理由（形式非対応・サイズ超過など）を特定する","ジョブの実行時刻と所要時間を確認する"],"a":2,"e":"取り込みジョブの結果には処理件数に加えて失敗した文書数と理由（非対応フォーマット、サイズ超過など）の明細が含まれます。ジョブ全体のステータスが成功でも個別文書は失敗し得ます。再同期 (A) は同じ理由で再失敗し、件数差分 (B) は漏れた文書が分かっても理由が分からず、実行時刻 (D) は原因と無関係です。"},
{"d":4,"q":"S3 をデータソースとする Knowledge Base で、誤記のあった文書を直接取り込み API（direct ingestion）で修正版に差し替えたところ、当日は正しい回答が返るのに翌朝には古い内容に戻ってしまいます。最も可能性の高い原因はどれですか。","c":["夜間にスケジュールされた StartIngestionJob が、S3 に残っている旧版の文書を取り込み直して修正版を上書きしている（S3 側の元文書も更新する必要がある）","埋め込みモデルのドリフトにより類似度スコアが低下している","直接取り込み API はベクトルストアに書き込まないため修正が反映されていない","ガードレールが修正版の内容をブロックしている"],"a":0,"e":"直接取り込みはベクトルストアへ即時反映しますが、S3 上の元文書は変更しません。そのため夜間の定期同期が S3 の旧版を取り込み直し、修正を上書きします。対策は同じ修正を S3 の文書にも反映することです。C は事実と逆（当日は正しい回答が返っている時点で反映済み）、B や D ではこの「翌朝に旧版へ戻る」パターンを説明できません。"},
{"d":4,"q":"Bedrock Prompt Management で変数 {{customer_name}} を定義したプロンプトを呼び出していますが、生成文に顧客名が埋め込まれず、変数部分が欠けた文章になります。権限エラーは出ていません。プロンプトの変更には承認が必要で、今週は変更できません。最も影響の小さい修正はどれですか。","c":["変数名を変えた新しいプロンプトバージョンを作成して切り替える","呼び出し側の IAM ロールに RenderPrompt 権限を追加する","システムプロンプト（system フィールド）に顧客名を直接埋め込む","コードが promptVariables に渡しているキー名を確認し、プロンプト側の定義と同じ customer_name に修正する"],"a":3,"e":"promptVariables のキー名はプロンプト定義の変数名と完全一致が必要で、customerName のような別名で渡すと値は挿入されず、エラーにもなりません。コード側のキー名修正が最小影響の修正です。権限不足 (B) なら AccessDeniedException になるはずで症状が異なり、新バージョン (A) は承認制約に反して管理も複雑化し、C はプロンプトを model ID として指定する呼び出しでは system を含められません。"},
{"d":4,"q":"RetrieveAndGenerate で構築した RAG API の p95 レイテンシが悪化していますが、検索と生成のどちらが支配的なのか内訳が分かりません。本番トラフィックで内訳を継続的に計測する最も適切な方法はどれですか。","c":["RAG 評価ジョブを実行して品質メトリクスを確認する","呼び出しを Retrieve と Converse の 2 段に分割し、それぞれの所要時間をカスタムメトリクスとして発行して p95 を別々に監視する","モデル呼び出しログを有効化して所要時間を解析する","ベクトルストアを別サービスへ移行して速度を比較する"],"a":1,"e":"RetrieveAndGenerate は検索と生成を 1 回の呼び出しにまとめるため内訳が見えません。Retrieve＋Converse に分解して段ごとの時間をメトリクス化すれば、検索側（件数・リランカー）と生成側（モデル・出力長）のどちらを調整すべきかが分かります。評価ジョブ (A) はオフラインの品質評価で本番の時間は測れず、呼び出しログ (C) には Knowledge Base の検索時間が含まれず、移行 (D) は見積もりのためだけには過大です。"},
{"d":4,"q":"OpenSearch の k-NN (HNSW) インデックスで、文書数が 3 倍に増えて以降、検索の p95 が 80ms から 600ms に悪化し、データノードのメモリ使用率は 96% に達しています。原因確認と対処の組み合わせとして最も適切なものはどれですか。","c":["k（取得件数）を減らしてレイテンシを下げる","ef_search を引き上げて検索精度を上げる","k-NN グラフのメモリ使用メトリクスでグラフがメモリに載り切っていないことを確認し、スカラー量子化でベクトルを 8 ビット化してメモリ使用量を大幅に削減する","SearchLatency メトリクスだけを監視してしきい値超過時に再起動する"],"a":2,"e":"HNSW の k-NN グラフはメモリ上に読み込まれて動作するため、グラフがメモリに収まらなくなるとレイテンシが急増します。KNNGraphMemoryUsage 系メトリクスで原因を確認し、スカラー量子化（32bit→8bit）でメモリを約 1/4 に抑えるのが正攻法です。k を減らす (A) や ef_search (B) はメモリ逼迫を解決せず（B はむしろ悪化）、再起動 (D) は対症療法です。"},
{"d":4,"q":"SQS キュー経由で文書を処理する GenAI パイプラインで、入力形式が壊れた特定のメッセージが可視性タイムアウトのたびにキューへ戻り、1 日数千回再処理されて正常メッセージの処理を遅らせています。壊れたメッセージの内容は後から原因調査に使いたいです。最も適切な対策はどれですか。","c":["キューに maxReceiveCount 付きのリドライブポリシーを設定し、超過したメッセージをデッドレターキューへ自動的に隔離する","5 回失敗したメッセージを削除し、削除件数だけをメトリクスに記録する","処理失敗したメッセージを同じキューの末尾へ再送する","Lambda で受信時に全メッセージを検査し、不正なものを S3 へ退避してから削除する独自機構を実装する"],"a":0,"e":"DLQ への自動隔離は数回の失敗で滞留を止め、隔離されたメッセージは DLQ に残るため後から取り出して原因調査できます。既存の処理実装の変更も不要です。削除 (B) は調査材料を失い、同一キューへの再送 (C) は滞留が続き、独自機構 (D) は SQS 標準機能で足りるものを自前実装する過剰設計です。"},
{"d":4,"q":"コンテナイメージでデプロイした推論用 Lambda 関数が、数週間呼び出されなかった後の最初の呼び出しだけ失敗し、直後の再試行では成功します。ECR のイメージは存在しアクセス権も正常です。最も可能性の高い原因はどれですか。","c":["VPC の ENI 作成に失敗している","メモリ設定が不足して OOM が発生している","参照中の ECR イメージが削除されて関数が Failed 状態になっている","長期間未使用のため関数が Inactive 状態になり、最初の呼び出しは拒否されて Lambda がイメージを再最適化している"],"a":3,"e":"コンテナイメージ関数は呼び出しが長期間ないと Inactive 状態になり、その後の最初の呼び出しは拒否され、裏でイメージの再最適化が走ってから使えるようになります。低頻度の推論関数に特有の失敗モードで、対策は定期的なウォームアップ呼び出しや初回リトライの実装です。ECR イメージ削除 (C) なら Failed 状態で再試行しても成功せず、A や B なら毎回失敗するはずです。"},
{"d":4,"q":"新しいプロンプトをリリースした直後から Bedrock の InvocationLatency が上昇しましたが、トークンあたりのスループットは変わっていません。サービス側の性能劣化とワークロードの変化を切り分ける最も適切な確認はどれですか。","c":["ネットワーク経路の変更を調査する","出力トークン数のメトリクスとレイテンシのパーセンタイルを突き合わせ、応答が長くなっていないかを確認する（InvocationLatency は最後のトークン受信までを測る）","スロットリングが増えたとみなしてクォータ引き上げを申請する","呼び出し回数（Invocations）の推移だけを確認する"],"a":1,"e":"InvocationLatency はリクエスト送信から最後のトークン受信までの時間なので、プロンプト変更で応答が長くなればトークン毎スループットが同じでもレイテンシは上がります。トークン量とレイテンシの相関確認が第一歩です。なおスロットリングされた呼び出しは Invocations やエラー系メトリクスから除外されるため、C や D では切り分けになりません。"},
{"d":4,"q":"トラフィックの少ないステージング環境の Bedrock エラーアラームが、リクエストのない時間帯に INSUFFICIENT_DATA 状態になり、オンコールの混乱を招いています。「リクエストがない＝正常」として静かにさせる正しい設定はどれですか。","c":["TreatMissingData を notBreaching に設定する","TreatMissingData を breaching に設定する","評価期間を 1 分に短縮する","アラームを削除して手動監視に切り替える"],"a":0,"e":"既定では欠損データは INSUFFICIENT_DATA になります。静かな時間帯があるのが正常なワークロードでは notBreaching（欠損＝正常扱い）が正解です。逆に、定期カナリアや同期ヘルスチェックのように「データが出ないこと自体が障害」のメトリクスでは breaching (B) を選びます。期間短縮 (C) は欠損を増やし、D は監視放棄です。"},
{"d":4,"q":"運用ダッシュボードに Logs Insights クエリのウィジェットを多数置いたところ、障害時に調査用のアドホッククエリが実行できなくなることがあります（アカウントの同時実行クエリ上限に到達）。最も適切な改善はどれですか。","c":["ダッシュボードの自動更新間隔をさらに短くする","調査担当者ごとに別アカウントを払い出す","「特定パターンの件数」のような固定的なカウンタはメトリクスフィルタでメトリクス化してウィジェットをメトリクス表示に置き換え、Logs Insights は探索的な分析に温存する","すべてのログを S3 にエクスポートしてダッシュボードを廃止する"],"a":2,"e":"Logs Insights の同時実行クエリはアカウント上限があり、ダッシュボードの発行分も枠を消費します。事前に決まったパターンの件数はメトリクスフィルタで継続的にメトリクス化すれば枠を使わず、アラームにも直結できます。Logs Insights はパーセンタイルやグループ集計など探索的な分析に使い分けます。A は逆効果、B は過剰、D は即時可視性を失います。"},
{"d":4,"q":"利用がバースト的で深夜はトラフィックがほぼゼロになる社内 GenAI API について、「認証 → プロンプト送信 → ストリーミング応答の受信 → 出力形式の検証」という多段フローの健全性を、実トラフィックに依存せず継続的に確認し、失敗した段も特定したいです。最も適切な仕組みはどれですか。","c":["実トラフィックのエラー率アラームに頼る","ELB のヘルスチェックを 10 秒間隔に短縮する","CloudTrail で API 呼び出し履歴を監視する","CloudWatch Synthetics カナリアでフローをスクリプト化してスケジュール実行し、ステップ単位のメトリクスで失敗段を特定する"],"a":3,"e":"カナリアは顧客と同じ経路でエンドポイントを定期的に叩くスクリプトで、本番トラフィックがなくても健全性シグナルを得られます。ステップごとに計装すれば StepName 別メトリクスで失敗段・遅延段を特定できます。実トラフィック依存のアラーム (A) は深夜に盲目になり、ELB ヘルスチェック (B) は疎通確認のみ、CloudTrail (C) は API 監査証跡で健全性監視ではありません。"},
{"d":4,"q":"スーパーバイザー型エージェントがエージェント間プロトコル (A2A) で複数のサブエージェントへタスクを委譲する構成を 2026 年に新規構築します。「どのサブエージェントに何を渡し、何が返り、どこで時間を消費したか」を 1 本のトレースとして追跡したいです。最も適切な計装はどれですか。","c":["AgentCore Observability と OpenTelemetry でトレースコンテキストを A2A ハンドオフ越しに伝播させ、同一トレース ID の階層トレースとして記録する","各エージェントが個別にログを出し、タイムスタンプの近さで後から対応付ける","X-Ray SDK とデーモンで新規に計装する","CloudTrail のイベント履歴でエージェント間の呼び出しを追跡する"],"a":0,"e":"AgentCore Observability は OpenTelemetry 標準で推論ループの各ステップやツール呼び出しをスパンとして記録し、OTEL コンテキストを A2A ハンドオフ越しに伝播させれば委譲先の動作も同一トレース ID の階層に収まります。タイムスタンプ照合 (B) は確実な対応付けになりません。X-Ray SDK/デーモン (C) は保守モードに移行しており新規計装には OTEL が推奨です。CloudTrail (D) は実行時間や受け渡し内容を示しません。"},
{"d":4,"q":"与信モデルの学習を開始する前に、「過去データにおける属性グループ間の表現の偏り」と「ラベル自体に含まれる偏り」の証拠を取得し、ガバナンス記録として保管する必要があります。最も適切な方法はどれですか。","c":["学習後に SHAP で特徴量寄与を分析する","本番運用開始後にバイアスドリフト監視を設定する","SageMaker Clarify の学習前（pre-training）バイアス分析を生データに対して実行し、レポートをモデルカードに取り込める形で保管する","学習済みモデルの予測に対して学習後（post-training）バイアス分析を実行する"],"a":2,"e":"学習前バイアス分析はモデル非依存で生データに対して実行でき、属性グループ間の表現の偏りやラベル分布の差を学習前に検出します。予測を必要としないため、学習の計算資源を使う前にデータ側の対処（収集・サンプリング・ラベル見直し）が可能です。SHAP (A) と学習後分析 (D) は学習済みモデルの予測が前提で「学習前」の要件に合わず、ドリフト監視 (B) は本番運用後の仕組みです。"},
{"d":4,"q":"条件分岐を含む多ノード構成の Bedrock フローが、特定の入力で意図しない経路を通ります。「その呼び出しで実際にどの Condition 分岐が発火し、各ノードに何が入出力されたか」を確認する方法はどれですか。","c":["フローの定義図（グラフ）をレビューして経路を推定する","モデル呼び出しログを有効化してプロンプトを確認する","フローを再デプロイして挙動が直るか確認する","トレースを有効にしてフローを呼び出し、レスポンスストリームに含まれるノード単位のトレースイベント（入力・出力・タイムスタンプ、発火した分岐）を確認する"],"a":3,"e":"InvokeFlow でトレースを有効にすると、各ノードの入力・出力・タイムスタンプを含むトレースイベントがレスポンスストリームで返り、どの Condition 分岐が発火したかも分かります。定義図 (A) は「起こりうる挙動」を示すだけで、特定の 1 回に「実際に起きたこと」はトレースでしか分かりません。呼び出しログ (B) はモデル呼び出し部分のみでノード間の流れを示さず、再デプロイ (C) は原因を特定しません。"},
{"d":4,"q":"Bedrock エージェントの指示文（instructions）を修正したのに、本番アプリ経由の応答に変更がまったく反映されません。最初に確認・実施すべきことはどれですか。","c":["編集は作業ドラフトにのみ反映されるため、PrepareAgent を実行し、本番エイリアスが新しいバージョンを指しているかを確認する","アクショングループの Lambda 関数を再デプロイする","変更の伝播を待つため 24 時間置いて再確認する","enableTrace を有効にして推論過程を解析する"],"a":0,"e":"エージェントの編集は作業用ドラフトにのみ入り、テスト・反映には PrepareAgent が必要です。さらにデプロイ済みエイリアスは特定バージョンに固定されているため、エイリアスが旧バージョンを指したままなら本番は変わりません。preparedAt（Last prepared）とエイリアスの指すバージョンの確認が第一歩です。Lambda (B) は指示文と無関係、伝播待ち (C) という仕組みはなく、トレース (D) は準備確認の後に使う手段です。"},
{"d":4,"q":"セキュリティ部門から「Bedrock の全プロンプトと応答（大きなマルチモーダル含む）を、別リージョンにある中央セキュリティアカウントへ集約せよ」と要求されました。モデル呼び出しログの正しい構成はどれですか。","c":["呼び出しログの配信先に中央アカウントの S3 バケットを直接指定する","CloudWatch Logs のみを配信先にして全データを記録する","呼び出しと同一アカウント・同一リージョンの S3 に配信し（大きな本文は S3 が必要）、その後レプリケーション等で中央アカウントへ集約する","呼び出しログは既定で有効なので、追加設定は不要である"],"a":2,"e":"モデル呼び出しログの配信先は呼び出しと同一アカウント・同一リージョンでなければならず、別アカウント・別リージョンの直接指定 (A) はできません。集約は配信後のレプリケーションで行います。CloudWatch Logs のインラインレコードは本文 100KB までで、それを超える本文やバイナリ（マルチモーダル）は S3 配信が必要なため B も不適切。ログは既定で無効なので D も誤りです。プロンプト全文が観測基盤に出る以上、マスキングとアクセス制御も設計時に組み込みます。"},

{"d":0,"q":"Amazon Titan Text Embeddings V2 を使う RAG で、検索精度を大きく落とさずベクトルストアの保存・検索コストを下げたい。最も適切な方法は？","c":["dimensions パラメータで次元数を 1024 から 512 や 256 に小さくする","生成モデルを大型のものに変更する","PCA で自前の後処理を行い次元削減する","チャンクのオーバーラップを 0 にする"],"a":0,"e":"次元数は精度と保存・検索コストのトレードオフで、Titan V2 は dimensions で 1024/512/256 をネイティブに指定できます。PCA 後処理はネイティブでなく精度管理も自前になります。"},
{"d":0,"q":"Bedrock のナレッジベースを作成後、埋め込みモデルを別のモデルに変えたくなった。正しい対応は？","c":["新しい KB を作成して同期・検証し、アプリの KB ID を切り替える(ブルー/グリーン)","KB の設定画面で埋め込みモデルを差し替えて再同期する","既存ベクトルはそのままに、新規文書だけ新モデルで埋め込む","クエリ側だけ新モデルにする"],"a":0,"e":"異なる埋め込みモデルのベクトル空間は比較できず、KB では埋め込みモデルを後から変更できません。新 KB を作って全文書を取り込み、検証後に切り替えます。"},
{"d":0,"q":"型番やエラーコードでの検索が、ベクトル検索だけだと外れてしまう。改善策として最も適切なのは？","c":["BM25 の語句一致とベクトル検索を組み合わせるハイブリッド検索にする","チャンクサイズを小さくする","生成モデルの temperature を下げる","リランカーだけを追加する"],"a":0,"e":"型番・固有名詞は埋め込み空間でほぼ同じ位置に落ちやすく、語句一致(BM25)との統合が有効です。リランカーは候補に入っていない文書を救えません。"},
{"d":0,"q":"RAG で「上位50件には正解文書が含まれているが、LLM に渡す上位5件に入らない」。最も適切な対策は？","c":["50件を取得し、リランカーで再採点して上位5件だけを FM に渡す","取得件数を5件に減らす","埋め込みモデルを変更する","チャンクのオーバーラップを増やす"],"a":0,"e":"無関係な文書が混ざる(後段)問題にはリランカーが有効です。広く取って再順位付けし上位だけ渡すと、コスト・遅延・ハルシネーションも減ります。"},
{"d":0,"q":"1つの質問に複数の論点が含まれ、片方の論点の文書しか検索で取れない。有効な手法は？","c":["クエリ分解(サブクエリ化)","リランカーの追加","取得件数のみ増やす","temperature を上げる"],"a":0,"e":"1つの埋め込みは1つの意味に偏るため、複合質問はサブクエリに分解してそれぞれ検索します。リランカーや件数増は「候補に入っていない」文書を救えません。"},
{"d":0,"q":"日常語で質問するユーザーに対し、文書は専門用語で書かれていて検索が合わない(語彙ギャップ)。適切な対策は？","c":["クエリ拡張(同義語・専門用語の追加)やクエリ変換を行う","チャンクを大きくする","ベクトルの次元数を下げる","Guardrails を有効にする"],"a":0,"e":"語彙ギャップにはクエリ拡張・変換が有効です。RetrieveAndGenerate ではオーケストレーションプロンプトのカスタマイズでクエリ生成段階の変換もできます。"},
{"d":0,"q":"構造のない物語調の長文を、意味の変わり目で分割したい。しきい値を上げると何が起きる？","c":["セマンティックチャンキングで、チャンクが大きく・少なくなる","階層型チャンキングで、親チャンクが小さくなる","固定長チャンキングで、トークン数が増える","チャンキングなしになる"],"a":0,"e":"セマンティックチャンキングは意味の変化点で分割し、ブレイクポイントのしきい値を上げるとチャンクは大きく少なくなります。"},
{"d":0,"q":"文書に「Procedure N:」という見出しパターンがあり、必ずそこで分割したい。最も適切な構成は？","c":["チャンキングなしにし、カスタム変換 Lambda で分割する","セマンティックチャンキング","固定長チャンキング","階層型チャンキング"],"a":0,"e":"ドメイン固有の分割規則は、チャンキングなし + カスタム変換 Lambda で実現します。"},
{"d":0,"q":"PDF 内の表が平坦化されて、検索結果の質が悪い。最初に見直すべきなのは？","c":["パーサーを FM(視覚)パーサーや Bedrock Data Automation パーサーに変更する","チャンクサイズを大きくする","埋め込みモデルを変更する","取得件数を増やす"],"a":0,"e":"表の構造解釈はチャンキングではなくパーサーの問題です。FM パーサーや BDA パーサーで構造を保持して取り込みます。"},
{"d":0,"q":"Bedrock ナレッジベースで、チャンキング戦略を後から変更したい。正しいのは？","c":["チャンキングは取り込み時に決まるため、変更には再取り込み(作り直し)が必要","設定を変えれば既存の索引へ即時反映される","呼び出しごとのパラメータで変更できる","Guardrails で変更できる"],"a":0,"e":"チャンキングは取り込み時に決まり、後から変えるには再取り込みが必要です。トークン上限や温度などは呼び出しごとに変えられる、という層の違いが頻出です。"},
{"d":0,"q":"S3 上の文書が頻繁に更新され、更新イベントが大量に発生する。KB の取り込みを安定して回す設計は？","c":["S3 イベントを SQS でバッファし、バッチごとに StartIngestionJob を1回起動する","イベントごとに StartIngestionJob を並列で呼ぶ","FIFO キューで1件ずつ起動する","毎回 KB を作り直す"],"a":0,"e":"StartIngestionJob は増分同期で、1データソースにつき同時実行は1つです。SQS で束ねてバッチごとに1回起動します(ジョブは S3 の現状を見るので FIFO は不要)。"},
{"d":0,"q":"文書を S3 を介さず、1分以内に KB へ反映したい。使うべき機能は？","c":["カスタムデータソースと直接取り込み API(IngestKnowledgeBaseDocuments)","S3 バケットの定期同期","DataSync のスケジュールタスク","Transfer Family"],"a":0,"e":"S3 を介さず即時反映したい場合は、カスタムデータソース + IngestKnowledgeBaseDocuments / DeleteKnowledgeBaseDocuments を使います。"},
{"d":0,"q":"オンプレミスの SMB 共有上の文書を KB に取り込み、削除も反映させたい。適切な構成は？","c":["DataSync(エージェント + 削除伝播設定のスケジュールタスク)で S3 に同期する","Transfer Family を使う","AppFlow のスケジュールフロー","手動でアップロードする"],"a":0,"e":"オンプレ SMB/NFS は DataSync が向いています。削除された文書が回答に出続ける事故は、削除の伝播設定漏れが典型的な原因です。"},
{"d":0,"q":"RAG の回答と一緒に、正確な出典を表示したい。最も確実な方法は？","c":["RetrieveAndGenerate のレスポンスの citations を使う","プロンプトで「出典を書いて」とモデルに指示する","モデルに URL を生成させる","CloudTrail のログを参照する"],"a":0,"e":"モデルに出典を言わせると捏造することがあります。citations はサービスが返す実際の参照元なので信頼できます。"},
{"d":0,"q":"RetrieveAndGenerate でフォローアップ質問(「それについて詳しく」)の文脈が切れてしまう。最も簡単な対策は？","c":["sessionId を指定して会話の文脈を維持する","自前の履歴 DB を構築する","毎回全履歴を連結して送る","クエリ書き換え用の別モデルを追加する"],"a":0,"e":"RetrieveAndGenerate は sessionId で文脈を維持できます。自前の履歴管理やクエリ書き換え呼び出しは不要です。"},
{"d":0,"q":"ナレッジベースで dataDeletionPolicy=RETAIN のデータソースを削除した。何が起きる？","c":["埋め込みがベクトルストアに残り、古い内容が検索され続ける","埋め込みも自動で削除される","KB 自体が削除される","S3 の原本が削除される"],"a":0,"e":"既定は DELETE ですが RETAIN だと削除後も埋め込みが残ります。残骸はベクトルストアから直接削除する必要があります。"},
{"d":0,"q":"KnowledgeBaseDocuments API で KB の文書を直接修正したが、次回の同期後に元の内容に戻ってしまった。原因は？","c":["S3 が唯一の正であり、直接修正はベクトルストアのみの更新だったため","KB のキャッシュが残っていた","埋め込みモデルが変わった","Guardrails が元に戻した"],"a":0,"e":"直接修正はベクトルストアのみを更新し、次回同期で S3 の旧版に巻き戻ります。修正は S3 原本にも反映します。"},
{"d":0,"q":"複数の関係をたどる多段の質問(マルチホップ)に強い RAG 構成は？","c":["Neptune Analytics を使った GraphRAG","S3 Vectors","DocumentDB のベクトル検索","ElastiCache のキー値検索"],"a":0,"e":"GraphRAG(Neptune Analytics)は KB が文書からエンティティ関係のグラフを自動構築し、多段の関係性の質問に強くなります。"},
{"d":0,"q":"ベクトル検索を追加したいが、アイドル時のコストをゼロにしたい低頻度ワークロード。適切なベクトルストアは？","c":["S3 Vectors","OpenSearch Serverless のベクトルコレクション","Aurora pgvector","Neptune Analytics"],"a":0,"e":"S3 Vectors はアイドルコストがゼロで再開遅延もなく、低頻度の用途に向いています。大規模・低遅延・運用最小なら OpenSearch Serverless です。"},
{"d":0,"q":"カスタムモデル(ファインチューニング済み)を Bedrock で本番利用するときの前提は？","c":["プロビジョンドスループットが必要(対応モデルならオンデマンドのデプロイ)","学習しただけでオンデマンドで呼び出せる","クロスリージョン推論プロファイルが必須","Guardrails が必須"],"a":0,"e":"Bedrock のカスタマイズモデルの推論にはプロビジョンドスループットが必要で、時間課金・コミット期間で単価が変わります。「調整すれば安くなる」は誤りです。"},
{"d":0,"q":"ベースにしていた基盤モデルが Legacy/EOL になる。そのモデルから作ったカスタムモデルはどうなる？","c":["派生カスタムモデルも使えなくなるため、Active 版ベースで再ファインチューニングする","影響を受けず使い続けられる","プロビジョンドスループットを購入すれば使い続けられる","自動で最新版に移行される"],"a":0,"e":"基盤モデルが EOL になると派生カスタムモデルも失効します(PT 購入でも回避不可)。Active 版を検証して ID を切り替え、保存済み学習データで再 FT します。"},
{"d":1,"q":"Converse API で、モデル固有のパラメータ(例: top_k)を指定するにはどこに書く？","c":["additionalModelRequestFields","inferenceConfig","toolConfig","guardrailConfig"],"a":0,"e":"inferenceConfig は maxTokens / temperature / topP / stopSequences のみで、モデル固有のパラメータは additionalModelRequestFields に書きます(形式はモデルごとに異なる)。"},
{"d":1,"q":"Converse API のレスポンスで stopReason が tool_use で、本文が空だった。正しい解釈は？","c":["エラーではなく、モデルがツール実行を要求している","モデルが失敗した","max_tokens に到達した","ガードレールが遮断した"],"a":0,"e":"tool_use はツール実行の要求です。stopReason(end_turn / max_tokens / tool_use)で必ず分岐しないと、ツールターンで空応答を出したり、切れた回答を完結扱いするバグになります。"},
{"d":1,"q":"Converse API のツール利用で、ツール実行結果をモデルに返す正しい方法は？","c":["user メッセージ内に toolUseId を付けた toolResult ブロックを入れる","assistant メッセージに結果を入れる","system プロンプトに結果を追記する","toolConfig に結果を入れる"],"a":0,"e":"結果は user メッセージ内の toolResult ブロック(toolUseId 付き)で返します。assistant で返すと ValidationException になります。"},
{"d":1,"q":"特定の問い合わせでは、モデルに必ず特定のツールを呼ばせたい。最も確実な方法は？","c":["リクエストの toolChoice で特定ツールを指定する","プロンプトで「必ずツールを使え」と書く","temperature を 0 にする","max_tokens を小さくする"],"a":0,"e":"toolChoice は auto / any / 特定ツールの強制をリクエスト単位で指定できます。プロンプト指示は確率的で保証になりません。"},
{"d":1,"q":"応答の前置きを排除し、出力の書き出しを固定したい。最も確実な手段は？","c":["messages の末尾に assistant のプレフィル(書き出し)を置く","プロンプトで前置きを禁止する","top_p を下げる","stopSequences を設定する"],"a":0,"e":"assistant の書き出しを部分的に置くと、モデルはその続きから生成します。プロンプト指示は確率的ですが、プレフィルは前置き排除・形式固定の最も確実な手段です。"},
{"d":1,"q":"多言語の入力でも、必須フィールドが欠けない構造化出力を保証したい。最も適切な方法は？","c":["required を宣言した inputSchema のツールを定義し、それに出力させる","プロンプトで JSON 形式を指示する","正規表現で検証し失敗時に再生成する","出力形式をファインチューニングする"],"a":0,"e":"ツール使用のスキーマで強制すると、欠落や順序崩れが構造的に起きません。プロンプト指示・再生成・FT は保証にはなりません。"},
{"d":1,"q":"Prompt Management の管理プロンプトを Converse API で呼び出すとき、正しい指定は？","c":["modelId にプロンプトのバージョン ARN を渡し、inferenceConfig は併送しない","modelId にモデル ID を渡し、プロンプト本文を messages に入れる","DRAFT を参照し、inferenceConfig も併送する","guardrailConfig にプロンプト ARN を渡す"],"a":0,"e":"推論設定はプロンプトリソース側に定義されるため、inferenceConfig を併送すると 400 ValidationError になります。本番は不変バージョンを参照します。"},
{"d":1,"q":"夜間に大量の文書を非リアルタイムで処理し、コストを約50%下げたい。適切な方法は？","c":["CreateModelInvocationJob(バッチ推論)を使う","StartAsyncInvoke を使う","プロビジョンドスループットを購入する","Converse API を並列呼び出しする"],"a":0,"e":"バッチ推論は S3 の JSONL({recordId, modelInput})を入力とし、約50%の割引です。完了保証はなくリアルタイムには使えません。ツール呼び出し・構造化出力には非対応です。"},
{"d":1,"q":"マルチテナントのアプリで、テナントごとに Bedrock の呼び出し量を制限したい。適切な方法は？","c":["API Gateway の使用量プランやテナント別トークンバケットを呼び出しの手前に置く","Bedrock のクォータをテナントごとに設定する","WAF のレートルールを使う","Lambda の予約同時実行数を使う"],"a":0,"e":"Bedrock クォータはモデル × リージョン単位でテナント別設定はできません。WAF のレートルールは送信元 IP 単位で、共有プロキシ環境では破綻します。"},
{"d":1,"q":"Step Functions で、人手の承認を待ってから処理を再開したい。適切な方法は？","c":["Standard ワークフローの .waitForTaskToken コールバックと SendTaskSuccess","Express ワークフローの .waitForTaskToken","固定の Wait ステートで待つ","Lambda を15分間ポーリングする"],"a":0,"e":"人手承認は .waitForTaskToken で、SendTaskSuccess で即時再開します(output は次ステートの入力)。トークンコールバックは Standard のみ対応で、Express は非対応です。"},
{"d":1,"q":"Step Functions で数万件の S3 上のデータを並列処理したい。適切なのは？","c":["Distributed Map","Inline Map","Parallel ステート","Choice ステート"],"a":0,"e":"数万件・S3 直読み・同時実行制御には Distributed Map です。Inline Map は 256KB / 並列約40の上限があります。Parallel は固定の独立ブランチ用です。"},
{"d":1,"q":"「必ずこの順序で、スキップなしで、監査可能に」処理したい。適切なのは？","c":["Step Functions のワークフロー","Bedrock Agents","エージェントが動的にツールを選択","プロンプトで手順を指示"],"a":0,"e":"決定的な手順は Step Functions、曖昧な意図を解釈してツールを動的に選ぶのはエージェントです。この混同を狙う出題が頻出します。"},

{"d":0,"q":"埋め込みモデルの次元数と、ストレージ・検索精度の関係として正しいものは？","c":["次元が高いほど表現力と検索精度は上がるが、ストレージ消費とレイテンシが増える","次元が低いほど検索精度が上がる","次元は精度にも費用にも影響しない","次元が高いほどストレージ消費は減る"],"a":0,"e":"次元数は精度とコストのトレードオフです。また、ドキュメント用とクエリ用で必ず同じ埋め込みモデル(同じ次元・同じ座標空間)を使う必要があります。"},
{"d":0,"q":"RAG で使う埋め込みモデルについて、動画で強調されている注意点は？","c":["ドキュメントとクエリで同じ埋め込みモデルを使う(異なるモデルだと同じ意味でもベクトルが違う場所に置かれる)","クエリ用だけ別の埋め込みモデルにする","生成に使う FM とは無関係に何でもよい","埋め込みは一度作れば二度と更新しない"],"a":0,"e":"類似度計算は同じ座標空間上にあることが前提です。異なるモデルで作ったベクトルは比較できません。"},
{"d":0,"q":"ベクトル間の類似度を測る指標として、動画で説明されている組み合わせは？","c":["コサイン類似度・内積・ユークリッド距離(一般にはコサイン類似度がよく使われる)","BLEU・ROUGE・BERTScore","HNSW・IVF・k-NN","温度・top_p・top_k"],"a":0,"e":"コサイン類似度は角度を測り -1〜1 の値(1 に近いほど同じ向き、0 は無関係、-1 は逆向き)。内積は向きに加えて大きさも考慮し、ユークリッド距離は2点の直線距離で小さいほど似ています。"},
{"d":0,"q":"LLM が「トークン」という単位でテキストを扱う理由として、動画で説明されているものは？","c":["単語だと数が無限でデータベースが巨大になり未知語に対応できず、文字だと意味の単位が失われるため、サイズを現実的に保ちつつ意味を捉えるバランスのよい単位だから","トークンは常に1単語と一致するから","トークンは画像専用の単位だから","トークンは暗号化のための単位だから"],"a":0,"e":"トークンは単語の一部・句読点・1文字の場合もあります。コンテキストウィンドウはトークン数で決まるため、同じ文字数でも日本語は英語よりトークン数が多くなる傾向があります。"},
{"d":0,"q":"RAG の3つのフェーズの正しい順序と内容は？","c":["インデキシング(収集→チャンク化→埋め込み→格納)→リトリーバル(クエリのベクトル化→類似検索)→ジェネレーション(取得チャンク+クエリで LLM が回答)","ジェネレーション→リトリーバル→インデキシング","リトリーバル→インデキシング→ファインチューニング","チャンク化→回答生成→埋め込み"],"a":0,"e":"RAG はインデキシング・リトリーバル・ジェネレーションの3フェーズです。KB for Bedrock は、この全てのフェーズをカバーするマネージド機能です。"},
{"d":0,"q":"GraphRAG が通常の RAG(ベクトル検索のみ)より有利な点は？","c":["エンティティ間の関係をナレッジグラフで保持するため、「田中の所属部門は？」のように複数チャンクをまたぐ関係の質問にも答えられる","埋め込みモデルが不要になる","チャンキングが不要になる","検索が常に安くなる"],"a":0,"e":"ベクトル検索は意味の近いチャンクは見つけられても、エンティティ間の関係をたどれません。Neptune Analytics を KB のベクトルストアに選ぶと、エンティティ抽出からグラフ検索までマネージドに実行されます。"},
{"d":0,"q":"HyDE(Hypothetical Document Embeddings)の手法として正しいものは？","c":["LLM に仮の回答文を生成させ、その回答文をベクトル化して検索する","クエリに同義語を追加する","複合質問をサブクエリに分解する","検索結果をリランカーで並べ替える"],"a":0,"e":"HyDE はユーザーのクエリを直接ベクトル化せず、仮の回答文を埋め込んで検索します。クエリ拡張は KB でマネージドに使えますが、クエリ分解・クエリ変換・HyDE は Lambda 等で LLM を呼んで自前実装が必要です。"},
{"d":0,"q":"エージェント型 RAG(Agentic RAG)の特徴は？","c":["エージェントが自律的にクエリを解釈し、検索の要否や追加検索を判断して、十分な情報が揃ってから回答する","検索結果が不十分でもそのまま回答を生成する","必ず1回だけ検索する","人間が毎回検索クエリを手書きする"],"a":0,"e":"従来の RAG は検索結果が不十分でもそのまま回答を生成します。エージェント型は結果が不十分なら追加検索を行います。AWS では Bedrock Agents で実装できます。"},
{"d":0,"q":"外部アプリからナレッジベースにアクセスする方法として、動画で紹介されている3つは？","c":["関数呼び出し(ツールとして KB を登録)、MCP、標準的な REST API","SMTP、FTP、SNMP","gRPC、GraphQL、SOAP のみ","SSH、Telnet、RDP"],"a":0,"e":"関数呼び出しは質問内容に応じて RAG を実行するためコスト最適化的です。MCP は多くの LLM が対応し、複数の AI ツールを併用する場合に有効です。REST API は汎用的で拡張・移行がしやすい方法です。"},
{"d":0,"q":"継続事前学習(Continued Pre-training)の目的と使うデータは？","c":["特定分野(法律・医学など)の専門知識を教え込む。ラベルなしの大量のテキストを使う","出力スタイルを教える。プロンプトと応答のペアを使う","人間の好みに合わせる。人間のフィードバックを使う","コストを下げる。大型モデルから小型モデルへ知識を移す"],"a":0,"e":"継続事前学習はラベルなしデータでドメイン知識を得ます。教師ありファインチューニングはプロンプトと応答のペアで、RLHF は人間のフィードバックで調整します。"},
{"d":0,"q":"RAG とファインチューニングの使い分けとして正しいものは？","c":["モデルが知らない情報を正しく答えさせたいなら RAG、答え方やスタイルを変えたいならファインチューニング。両方を組み合わせることもできる","最新情報を答えさせるにはファインチューニングが必須","ファインチューニングは学習データでハルシネーションを防ぐ","RAG はモデルのパラメータを更新する"],"a":0,"e":"RAG はモデルを再学習せずデータの拡張だけで対応します。ファインチューニングはパラメータを更新しますが、学習データ自体は不変なのでハルシネーション対策にはなりません。"},
{"d":0,"q":"LoRA(Low-Rank Adaptation)の説明として正しいものは？","c":["元の重みを固定したままアダプター行列だけを追加で学習し、学習対象のパラメータ数を大幅に減らす手法","モデル全体の重みを毎回更新する手法","トークンを暗号化する手法","画像を生成する拡散モデルの一種"],"a":0,"e":"学習時間・コスト・ストレージコストを下げられ、ベースモデルを共有してアダプターだけ切り替えることもできます。ただし Bedrock のファインチューニングでは LoRA のランクなどの内部パラメータは調整できません(AWS 側がマネージド)。"},
{"d":0,"q":"Bedrock でカスタムモデルを作る方法として、動画で並列に扱われているものは？","c":["ファインチューニング、継続事前学習(CPT)、蒸留","RAG、プロンプトエンジニアリング、キャッシュ","Guardrails、PrivateLink、KMS","CloudWatch、X-Ray、CloudTrail"],"a":0,"e":"AWS ではファインチューニング・CPT・蒸留を並列にカスタムモデルとして扱います。カスタムモデルを Bedrock で使う際はプロビジョンドスループットを選択します。"},
{"d":0,"q":"埋め込みモデルとして Bedrock で代表的に利用できるものは？","c":["Amazon Titan Embeddings や Nova の埋め込みモデル","Amazon Polly","Amazon Rekognition","AWS Glue"],"a":0,"e":"埋め込みモデルも基盤モデルと同様に、次元数やユースケース(多言語・マルチモーダルなど)を考慮して選定します。"},
{"d":0,"q":"Bedrock の API 呼び出しにおけるコントロールプレーンとデータプレーンの違いは？","c":["コントロールプレーンはモデル一覧取得・カスタムモデル作成・KB やガードレールの管理など管理操作、データプレーンは InvokeModel や Converse などの推論実行","コントロールプレーンが推論を実行し、データプレーンが管理を行う","両者は同じ IAM 名前空間で扱われ、同じ権限で使える","データプレーンは S3 専用"],"a":0,"e":"IAM では別の名前空間として扱われるため、それぞれに対して個別に権限を付与する必要があります。"},
{"d":1,"q":"InvokeModel と Converse の違いとして正しいものは？","c":["InvokeModel は最低レベルで細かい指定ができるがモデルごとにリクエスト形式が異なる。Converse は全モデルで共通のスキーマで、モデル切替は modelId の変更だけで済む","InvokeModel は全モデル共通で、Converse はモデル固有","Converse はガードレールと統合できない","Converse は会話履歴をサーバー側で保持する"],"a":0,"e":"Converse は messages 配列・システムプロンプト・inferenceConfig の共通スキーマで、会話履歴も messages にそのまま積みます。ガードレールやプロンプトマネージメントとのネイティブ統合もあり、現在は Converse が推奨です。"},
{"d":1,"q":"ストリーミングで、ブラウザからのキャンセル送信や長時間の対話セッションに向くプロトコルは？","c":["WebSocket(API Gateway で実装。双方向通信)","SSE(単方向)","同期 REST のみ","SMTP"],"a":0,"e":"WebSocket は双方向 TCP 接続でクライアントからのキャンセルやサーバーからの能動メッセージができ、Cognito 認証や Lambda とも統合できます。API Gateway WebSocket のアイドルタイムアウトは10分です。"},
{"d":1,"q":"SSE(Server-Sent Events)でのストリーミング配信について正しいものは？","c":["HTTP ベースで軽量・プロキシやファイアウォール設定が簡単だが単方向。Lambda 関数 URL なら最大15分まで接続でき、API Gateway HTTP API は29秒のタイムアウトがあり長時間には不向き","双方向通信が可能で、クライアントから割り込める","Cognito 連携ができる","API Gateway HTTP API で無制限に接続できる"],"a":0,"e":"SSE は単方向のため、クライアントからの割り込みは別の HTTP リクエストが必要です。Lambda 関数 URL は Cognito 連携ができない点がデメリットです。"},
{"d":1,"q":"Bedrock のストリーミング応答(ConverseStream)のイベントの流れとして正しいものは？","c":["messageStart → contentBlockStart → contentBlockDelta(連続して生成データ)→ ... → 最後にトークン使用量やレイテンシのメトリクス","最終結果が1回で返る","contentBlockDelta は最初に1回だけ流れる","エラーは HTTP ヘッダーにだけ返る"],"a":0,"e":"クライアントは contentBlockDelta を受け取って画面に表示していきます。応答中のエラーはエラーイベントとしてストリーム内で返され、Lambda で検出して通知する設計もできます。"},
{"d":1,"q":"ストリーミング応答のメリットとして動画で挙げられているものは？","c":["最初のトークンが表示されるまでの時間(TTFT)が短くなり、生成中に内容を見て途中で停止できるため無駄なトークン生成を避けられる","生成の合計時間が必ず半分になる","料金が必ず安くなる","クォータが増える"],"a":0,"e":"生成 AI ツールでは TTFT の短さがユーザー満足度に影響すると考えられます。完成まで待って破棄するより、途中で止めたほうが無駄な生成を避けられます。"},
{"d":1,"q":"Bedrock Agents のアクショングループを定義する要素は？","c":["スキーマ(何ができるかの定義)と Lambda 関数(実際の処理)","ベクトルストアと埋め込みモデル","VPC と NAT ゲートウェイ","KMS キーと CloudTrail"],"a":0,"e":"スキーマは OpenAPI スキーマ(既存 REST API の接続向け)か、ファンクションスキーマ(関数名・説明・パラメータを JSON で定義する簡易版。REST API を持たない処理向け)で定義します。"},
{"d":1,"q":"Bedrock Agents のメモリについて正しいものは？","c":["短期メモリはセッション内の会話履歴を保持し、セッション終了で破棄される。長期メモリはセッションをまたいで履歴を永続化し、ユーザー ID で管理される","短期メモリはセッションをまたいで残る","長期メモリはセッション終了で破棄される","メモリはモデルのパラメータに保存される"],"a":0,"e":"トレース表示でリアクトループのステップを確認すれば、エージェントが期待通りの判断をしているか、誤ったアクショングループを呼んでいないか、不要なループが発生していないかを調べられます。"},
{"d":1,"q":"Bedrock Agents と AgentCore の違いとして、動画で説明されているものは？","c":["Bedrock Agents はフルマネージドで標準的なエージェント向けでモデルは Bedrock のみ。AgentCore は Strands・LangGraph・CrewAI などのフレームワークやサードパーティモデルが使え、認証・メモリ・監視など大規模運用の機能を提供する","どちらも同じ機能で名前が違うだけ","AgentCore は Bedrock のモデルしか使えない","Bedrock Agents は任意のフレームワークが使える"],"a":0,"e":"AgentCore のコンポーネントは独立して利用でき、必要なものだけを選べます。"},
{"d":1,"q":"Strands Agents の説明として正しいものは？","c":["AWS がオープンソースで公開する AI エージェントのフレームワークで、Python と TypeScript に対応し、モデル駆動型(プロンプトで役割とツールを定義すると LLM が計画・実行・評価する)","AWS の有償マネージドサービスで Bedrock 専用","データベースのスキーマ移行ツール","画像生成ライブラリ"],"a":0,"e":"数行のコードでエージェントを作れ、Bedrock・OpenAI・Gemini など幅広いモデルや MCP・A2A に対応します。ローカル・Lambda・EC2・AgentCore Runtime へデプロイできます。"},
{"d":1,"q":"マルチエージェントのパターンのうち、「エージェント間の依存関係と実行順序を DAG として定義し、条件分岐のある複雑な処理を表現する」ものは？","c":["エージェントグラフ(Graph)","スワーム(Swarm)","エージェントワークフロー","ツールとしてのエージェント"],"a":0,"e":"スワームは複数の類似エージェントが同時にアプローチする(ブレインストーミング的)、ワークフローは前のエージェントの出力が次の入力になる直列パイプライン、ツールとしてのエージェントはオーケストレーターがサブエージェントを呼び出す一般的なパターンです。パターンは組み合わせても使えます。"},
{"d":1,"q":"MCP と A2A の違いは？","c":["MCP はエージェントとツール/データソースを接続し、A2A はエージェント同士を接続してタスク・進捗・結果・ステートの共有を標準化する","MCP はエージェント同士、A2A はツールとの接続","どちらも暗号化アルゴリズム","MCP は画像専用、A2A は音声専用"],"a":0,"e":"MCP は AI 側クライアントとデータソース側サーバー間の通信手順を JSON ベースで標準化し、クライアントサーバーモデルを採用しています。A2A は異なるフレームワークで作られたエージェント間の通信を可能にします。"},
{"d":1,"q":"動画で紹介されている、API Gateway + Lambda から Bedrock を呼ぶ動的アーキテクチャで、モデルを設定で切り替える方法は？","c":["AppConfig のフラグでモデル ID を管理し、Converse API の modelId を変更するだけで切り替える(段階的デプロイやロールバックも容易)","毎回 Lambda のコードを書き換えてデプロイする","API Gateway のステージ名を変える","モデルごとに別アカウントを使う"],"a":0,"e":"Converse なら modelId の差し替えだけで済み、温度などのパラメータも変数化して管理できます。リクエスト内容に応じて Lambda で大型/小型モデルにルーティングする構成もとれます。"},
{"d":1,"q":"Step Functions でプロンプトの内容に応じて適切なモデルにルーティングする設計は？","c":["最初の Task でプロンプトを分類し(出力は JSON)、Choice ステートで評価してコード生成なら高価なモデル、一般的な質問応答なら軽量モデルへ振り分ける","Wait ステートで待つ","Map ステートのみ","Parallel ステートで全モデルに送る"],"a":0,"e":"自前実装の代わりに、AWS 側がクエリの意味を解析して最適なモデルへ自動ルーティングする Bedrock のインテリジェントプロンプトルーティングも使えます。"},
{"d":1,"q":"サーキットブレーカーの3状態の正しい説明は？","c":["クローズド(正常、失敗をカウント)→ 閾値超過でオープン(遮断し代替経路へ)→ 一定時間後にハーフオープン(限定的に元のモデルへ転送して復帰を確認)","オープンが正常でクローズドが遮断","ハーフオープンは常にすべてのリクエストを通す","状態は3つではなく2つだけ"],"a":0,"e":"AWS では SDK の指数バックオフ・リトライ、Step Functions でのエラー検知とカウント、DynamoDB での状態保存を組み合わせて構築できます。"},
{"d":1,"q":"多段フォールバックによるグレースフルデグラデーションの典型的な順序は？","c":["高品質モデル → バランス型モデル → 軽量モデル → キャッシュ済みの過去の応答(ElastiCache など)→ 最終手段として静的な応答","最初から静的な応答を返す","失敗したら全リクエストを破棄","全てのモデルを同時に呼ぶ"],"a":0,"e":"Step Functions の Catch と Retry で Bedrock のスロットリングなどを捕捉して次のステートに遷移させます。ベクトル検索を用いたセマンティックキャッシュも有効です。"},
{"d":1,"q":"Bedrock Prompt Management の機能として正しいものは？","c":["プロンプト内に変数を定義して動的に値を注入でき、バージョニングで変更履歴を追跡し、本番反映前に承認ワークフローを挟める","プロンプトを自動で最適化する(モデルを再学習する)","変数は使えない","バージョン管理はできない"],"a":0,"e":"プロンプトテンプレートを S3 に一元保存して CI/CD パイプラインや GitHub と連携できます。複数のプロンプトをチェーンとして接続する Prompt Flows は、ノーコード/ローコードで条件分岐や前後処理との統合も可能です。"},
{"d":1,"q":"Bedrock Flows(プロンプトフロー)の使いどころとして正しいものは？","c":["プロンプトの出力を別のプロンプトの入力に接続する(例: 翻訳してから要約)、出力に応じて条件分岐する、共通の処理をコンポーネント化して再利用する","モデルの重みを更新する","画像を圧縮する","ネットワークを分離する"],"a":0,"e":"ノーコード/ローコードで構築でき、前後処理(Lambda 等)との統合も可能です。"},
{"d":1,"q":"プロンプトの出力が確率的であることを踏まえた品質保証の方法として適切なものは？","c":["Lambda などで決定論的な出力検証(JSON スキーマのバリデーション、キーワードチェック、スコアリング)を行い、Step Functions で境界値・空文字・超長文・多言語混在などのテストケースを並列実行する","出力が確率的なのでテストは不要","毎回人手で全件確認する","temperature を上げて検証する"],"a":0,"e":"CloudWatch にモデルの正解率をメトリクスとして出力してアラームを設定すれば、リリース後の異常を自動で通知できます。"},
{"d":1,"q":"動画で挙げられている、Bedrock でカスタムモデルをデプロイする方法の使い分けは？","c":["Bedrock は運用負荷を最小にでき、ガードレールや RAG をそのまま活用できる。SageMaker はより細かいカスタマイズや独自モデル、ブルー/グリーンデプロイが必要な場合に向く","SageMaker のほうが常に運用負荷が低い","Bedrock では全くカスタマイズできない","どちらも同じ機能"],"a":0,"e":"Bedrock のカスタムモデルを使う際はプロビジョンドスループットを選択します。"},
{"d":2,"q":"動画で紹介されているプロンプト攻撃のうち、ユーザー入力に悪意のある指示を紛れ込ませて AI の本来のタスクを無視させるものは？","c":["プロンプトインジェクション","ジェイルブレイク","プロンプトリーク","プロンプトポイズニング"],"a":0,"e":"ジェイルブレイクは安全ガードレールを巧みなプロンプトで回避する攻撃(「あなたは小説家です」という前提で禁止回答を引き出すなど)、プロンプトリークはシステムプロンプトや参照している機密情報を出力させる攻撃です。"},
{"d":2,"q":"RAG を標的にして、AI が参照する知識ソースに意図的に悪意のある情報を埋め込む攻撃は？","c":["プロンプトポイズニング","ジェイルブレイク","プロンプトリーク","ハイジャッキング"],"a":0,"e":"例えば編集権限を持つ攻撃者が社内データに偽のルールを追加すると、ボットは汚染されたデータに基づいて誤った応答をします。ハイジャッキングはインジェクションの中でも、AI の本来のタスクを中断して攻撃者に有利な別タスクを実行させる悪質なものです。"},
{"d":2,"q":"生成 AI の4つのリスクのうち、「AI がなぜその結論に至ったのか人間が理解できない」問題は？","c":["解釈可能性(ブラックボックス性)","ハルシネーション","バイアス","著作権"],"a":0,"e":"ハルシネーションは事実に基づかない情報をもっともらしく生成することで、RAG による事実情報の付与が有効です。解釈可能性の問題から、医療など重要な意思決定ではAIの判断を鵜呑みにできず、AI だけでは社会的な説明責任を果たせません。"},
{"d":2,"q":"Bedrock Guardrails のフィルターと役割の正しい組み合わせは？","c":["コンテンツフィルター=有害カテゴリの検出、拒否トピック=業務範囲外のトピックのブロック、単語フィルター=指定語のブロック、PII/機密情報フィルター=マスキングやブロック、グラウンディングチェック=出力が提供コンテキストに基づくかの検証","拒否トピック=画像の暗号化、単語フィルター=ネットワーク制御","グラウンディングチェック=PII マスキング","コンテンツフィルター=リソース課金の制御"],"a":0,"e":"全フィルターで強度を設定できます。画像コンテンツフィルターも提供されています。ガードレールはリクエスト時にガードレール ID を指定するだけで適用でき、OpenAI など Bedrock 外の LLM にも適用できます。"},
{"d":2,"q":"グラウンディングチェックの動作として正しいものは？","c":["出力と情報源の関連性を評価し、情報源にない内容を生成していないか、質問に直接答えているかをスコア化して、しきい値を下回れば出力をブロックまたは警告できる","出力を常に自動で書き換える","入力のみを検査する","スコアは設定できない"],"a":0,"e":"グラウンディングとは、データソースや RAG の検索結果を根拠として回答させ、LLM の出力を信頼できる情報源に基づかせる手法でハルシネーションを抑制します。"},
{"d":2,"q":"ハルシネーション抑制のためにガードレール以外で組み合わせられる手段として、動画で挙げられているものは？","c":["構造化出力の活用(JSON スキーマ準拠)、Text-to-SQL で回答根拠を SQL として明示、セマンティック類似度検証で乖離が大きければ再生成、多重生成して一致した回答のみ採用(セルフコンシステンシー)","温度を最大にする","出力を長くする","学習データを削除する"],"a":0,"e":"Text-to-SQL は自然言語でなく SQL クエリを生成させ、DB の実行結果を返す形にして回答根拠を明確にします。これらの組み合わせで、ガードレール単体では防げないハルシネーションを抑制します。"},
{"d":2,"q":"多層防御の設計として動画で説明されているものは？","c":["ガードレールの前段に入力前処理(Lambda でプロンプトの長さ・構造を検証)を置き、後段に出力後処理(必須項目が欠けていれば再生成など)を置く","ガードレールを1つだけ設定すれば十分","入力前処理は不要","出力後処理でモデルを再学習する"],"a":0,"e":"1つの層が突破されても他の層で守られる、という設計思想です。Well-Architected のセキュリティの柱でも、ネットワーク・IAM による認証認可・データ保護・検出とモニタリングで多層防御を構成することが推奨されています。"},
{"d":2,"q":"Bedrock のネットワーク分離で、VPC から AWS のプライベートネットワーク経由で Bedrock に接続する方法は？","c":["インターフェース型 VPC エンドポイント(PrivateLink)","ゲートウェイ型 VPC エンドポイント","インターネットゲートウェイ","VPC ピアリング"],"a":0,"e":"PrivateLink はインターネットの影響を受けず、VPC を経由するのでセキュリティグループや VPC エンドポイントポリシーで通信を細かく制御できます。"},
{"d":2,"q":"IAM を使って、特定のモデルのみ InvokeModel を許可し、ファインチューニングは拒否したい。設計として正しいものは？","c":["最小権限の原則で、アクションとリソースにモデルの ARN を指定して必要最小限のモデルと操作のみ許可する","bedrock:* を全リソースに許可する","ルートユーザーを使う","モデルアクセスは全員に開放する"],"a":0,"e":"IAM Identity Center と組み合わせ、グループに許可セットを割り当てて層別管理できます。例えばベーシック=軽量モデル(Haiku や Nova Micro)、スタンダード=中級(Sonnet や Nova Lite)、プロ=最上位(Opus や Nova Premier)のような層です。"},
{"d":2,"q":"PII や機密情報の検出サービスの使い分けとして正しいものは？","c":["Comprehend はテキスト内の PII をリアルタイム検出、Macie は S3 上の機密データを自動発見、Bedrock Guardrails の PII フィルターは入出力の PII をマスキング/ブロック","Macie はテキストのリアルタイム検出、Comprehend は S3 のスキャン","Guardrails は S3 のデータをスキャン","どれも PII は扱えない"],"a":0,"e":"データ保護では保存時と転送時の両方の暗号化が必要です。S3 は既定で暗号化され、KMS のカスタマー管理キーを指定できます。通信は TLS で暗号化されます。"},
{"d":2,"q":"Bedrock の監査・モニタリングで、CloudTrail と CloudWatch の役割の違いは？","c":["CloudTrail は誰がいつどのモデルを呼んだかという API 呼び出しの記録(監査向け)、CloudWatch は利用状況のメトリクス(トークン数・呼び出し回数・エラー率)とアラーム、モデル呼び出しログの出力先","CloudTrail がトークン数を測り、CloudWatch が API 履歴を持つ","どちらも同じ機能","CloudWatch はプロンプトを保存できない"],"a":0,"e":"モデル呼び出しログを CloudWatch Logs などに出力すれば、プロンプトと応答を保存できます。"},
{"d":2,"q":"責任ある AI を Bedrock の機能で実現する対応として、動画で挙げられているものは？","c":["Guardrails=有害コンテンツのフィルタリングと PII マスキングで安全性/プライバシー、モデル評価=精度評価とバイアス検出、ナレッジベース=ハルシネーション抑制で正確性、モデル呼び出しのログ記録=ガバナンス","Guardrails=精度評価","モデル評価=PII マスキング","ナレッジベース=ネットワーク分離"],"a":0,"e":"AWS は人間中心の視点で、設計・開発・展開・運用の全フェーズに責任ある実践を組み込むことを推奨しています。AI レンズ(Generative AI Lens)は Well-Architected Tool のカスタムレンズとして取り込めます。"},
{"d":3,"q":"Bedrock のオンデマンド推論の3つのティアと特徴は？","c":["スタンダード(標準)、プライオリティ(低レイテンシで割高)、フレックス(遅延を許容する代わりに割安)","スタンダード、バッチ、リザーブド","プライオリティ(割安)、フレックス(低レイテンシ)、無料","ティアは存在しない"],"a":0,"e":"バッチ推論は非リアルタイム処理向けでオンデマンドより割安、プロビジョンドスループットはスループットを確保するオプション、リザーブドは長期契約で割引を受けるオプションです。"},
{"d":3,"q":"プロンプトキャッシュについて正しいものは？","c":["プロンプトの先頭にある繰り返し部分をキャッシュして再利用する。保持期間は既定で5分で、キャッシュヒット時は TTFT や入力トークンが削減される","プロンプトの末尾をキャッシュする","キャッシュはクエリ結果の回答全体を保存する","キャッシュミスでエラーになる"],"a":0,"e":"キャッシュミスの場合は新しくチェックポイントを生成するか、キャッシュなしで通常通り回答します。キャッシュの書き込みと読み出しには割引が適用されます。"},
{"d":3,"q":"Bedrock のモデルカスタマイズの料金について正しいものは？","c":["ファインチューニングと継続事前学習はトークン単価とモデルのストレージ月額、蒸留は教師モデルの推論コストと生徒モデルの学習コストが発生する","カスタマイズは無料","学習時のみ課金され、保管は無料","蒸留は料金が一切かからない"],"a":0,"e":"単価はリージョンやモデルごとに異なるため、最新の料金は公式ドキュメントで確認します。"},
{"d":3,"q":"クロスリージョン推論(CRIS)の課金とリスクについて正しいものは？","c":["課金は元リージョンの単価で追加コストは発生しないが、トラフィックが他リージョンを経由するため地理的な制約がある場合は慎重な検討が必要。許可リージョンは IAM ポリシーや SCP で制限できる","必ず割高になる","データは常に元リージョン内に留まる","リージョンの制限はできない"],"a":0,"e":"呼び出し時にインファレンスプロファイル ID を指定するだけで利用でき、スループット制限の回避や回復性向上のメリットがあります。"},
{"d":3,"q":"Bedrock の主なメトリクスの説明として正しいものは？","c":["InvocationLatency=最終的な応答を返すまでの時間、TimeToFirstToken=ストリーミングで最初のトークンを返すまでの時間、InvocationThrottles=スロットリングされた呼び出し数","TimeToFirstToken は料金の指標","InvocationLatency は成功した呼び出し回数","InvocationThrottles は入力トークン数"],"a":0,"e":"チャットでは最初の単語が出るまでの時間が顧客満足度に影響し、要約などでは最終応答を待つため InvocationLatency が重視されます。入出力トークン数はモデル別にフィルタリングでき、モデル ID ごとにエラーメトリクスも取得できます。"},
{"d":3,"q":"生成 AI アプリで、複数サービスをまたぐ1つのリクエストのボトルネックを調べるには？","c":["X-Ray のトレースで、リクエストがサービス間をどう流れたか、レイテンシ・リトライ・エラーを可視化する","CloudTrail のログだけを見る","Macie を使う","KMS のキーを確認する"],"a":0,"e":"AgentCore Observability はエージェントのセッション数・レイテンシ・実行時間・トークン使用量・エラー率を CloudWatch ダッシュボードで可視化します。"},
{"d":3,"q":"リアルタイムチャットと夜間バッチ処理のモデル選定として、動画で説明されているものは？","c":["リアルタイムチャットは Nova Micro や Haiku のような小型で高速なモデル、夜間バッチは速度より品質を優先して大型モデルを割り当てる","どちらも常に最大のモデルを使う","どちらも常に最小のモデルを使う","夜間バッチはストリーミングが必須"],"a":0,"e":"モデルサイズとコストはほぼ比例し、最小と最大では利用料金に数百倍の差が出ることもあります。コンテキストウィンドウもコストとトレードオフです。"},
{"d":3,"q":"モデルカスケードの説明として正しいものは？","c":["まず軽量なモデルで処理し、結果を評価して十分ならそのまま返し、不十分なら高性能なモデルで処理し直すことでコストと精度のバランスを取る","全リクエストを最初から高性能モデルに送る","全モデルの出力を平均する","モデルを毎回再学習する"],"a":0,"e":"インテリジェントプロンプトルーティングは、出力してから判断するのではなく入力の時点で振り分け先を予測するので、さらにコストを節約できます。"},
{"d":4,"q":"文章要約タスクの自動評価に使われる指標は？","c":["ROUGE(生成文と人間の要約文の単語・フレーズの重複度を測る)","BLEU(翻訳専用なので要約には使えない)","MMLU(知識のベンチマーク)","SuperGLUE(翻訳専用)"],"a":0,"e":"BLEU は AI 翻訳とプロ翻訳の一致度を測り、短すぎる翻訳にペナルティを与えます。BERTScore は埋め込みを使って単語の意味の類似性を比較し、より汎用的なテキスト生成の評価に使えます。"},
{"d":4,"q":"ベンチマークの説明として正しいものは？","c":["MMLU は高校レベルの数学から法律・倫理まで57タスクでモデルの知識を測り、SuperGLUE は生成 AI ブーム以前に作られた自然言語処理能力のベンチマーク","MMLU は翻訳専用","SuperGLUE は画像専用","ベンチマークは実際のユースケースに必ず当てはまる"],"a":0,"e":"公開ベンチマークは一般的な評価にすぎず、実際のユースケースに当てはまるとは限りません。そのため、Bedrock のモデル評価によるユースケース固有の評価を並行して行う必要があります。"},
{"d":4,"q":"Bedrock モデル評価の評価方式として正しいものは？","c":["自動評価(組み込みアルゴリズムで精度・堅牢性・毒性など)、LLM による評価(LLM-as-a-judge)、人手による評価(自分のデータセットで関連性やスタイルを評価)","自動評価のみ","人手評価のみ","評価は RAG には使えない"],"a":0,"e":"自動評価は手軽ですが評価できる指標が限定されます。開発段階では自動評価、最終的な品質確認には人手評価、という使い分けも効果的です。"},
{"d":4,"q":"RAG の評価で、検索と生成の評価観点として動画で挙げられているものは？","c":["検索はコンテキストの関連性とカバレッジ、生成は正確性とハルシネーションなどを含む完全性、さらに引用のカバレッジと精度","検索はトークン数のみ、生成は料金のみ","どちらも評価できない","評価は人間でなければできない"],"a":0,"e":"RAG の評価は LLM を使って行えます。モデル評価を CI/CD に組み込む場合は、CodePipeline から CodeBuild/Lambda 経由で評価を呼び出し、評価スコアに基づく承認ステップでデプロイの可否を判断できます。"},
{"d":4,"q":"Bedrock API が 503(ServiceUnavailable)を返した場合の正しい理解は？","c":["サービス側の問題でありユーザー側の設定でできることはない。待機するか、別のモデルやリージョンを使う","ユーザーの IAM 設定が間違っている","入力のトークンが多すぎる","リクエストの形式が不正"],"a":0,"e":"アカウントレベルのクォータやレート制限は CloudTrail に履歴が残りますが、503 は切り分けができません。ストリーミング API ではエラー内容がストリーム内のイベントとして返されます。"},
{"d":4,"q":"入力トークンがモデルのコンテキストウィンドウを超えた場合の対処法は？","c":["長文を分割する、RAG の取得件数を減らす、プロンプトから不要な情報を除外する(超えると ValidationException か入力の切り捨てが起きる)","max_tokens を増やす","温度を下げる","KB を再作成する"],"a":0,"e":"出力が途中で切れる場合は max_tokens を引き上げます(出力側の問題)。入力側と出力側の問題を区別します。"},
{"d":4,"q":"RAG で回答が的外れな場合の切り分けとして正しいものは？","c":["検索フェーズの問題ならチャンキング戦略の見直し・ハイブリッド検索・リランキングの導入、生成フェーズの問題ならモデルや埋め込みモデルの変更・ドメイン適合性の評価を検討する","原因に関係なくモデルを大型にする","常に KB を削除する","常にキャッシュを無効にする"],"a":0,"e":"時間の経過で検索精度が劣化する「モデルのドリフト」もあるため、ナレッジベースの評価を定期的に行います。"},
{"d":4,"q":"Bedrock Agents の評価について、動画で述べられているものは？","c":["Bedrock Agents には専用のエージェント評価がないため、オープンソースのツール(Ragas、Langfuse など)を組み合わせて評価する","専用のエージェント評価機能が完備されている","評価は不要","Guardrails だけで評価できる"],"a":0,"e":"Ragas は RAG/LLM を評価するライブラリで内部的に LLM-as-a-judge を使います。Langfuse はトレースと評価スコアを記録する LLM の監視プラットフォームです。"},

{x:"■ なぜ正解か\nBedrock の評価機能には RAG 向けのモードがあり、Knowledge Base の検索結果の関連性・網羅性や、回答の正確性・根拠への忠実性などを自動で評価できます。改善前後の比較にも使えます。\n\n■ 他の選択肢\nCloudTrail、VPC Flow Logs、AWS Config は監査・ネットワーク・構成管理で、回答品質の評価はできません。",
 g:[F("RAG 評価ジョブ",["評価用データセット(質問と正解)","Knowledge Base で検索+生成","評価モデルが指標を採点","結果を比較してチューニング"])]},
{x:"■ なぜ正解か\nstopReason が max_tokens なら、設定した最大出力トークン数に達して打ち切られています。maxTokens を引き上げるか、「簡潔に答えて」と指示して出力を短くします。モデル側の上限も確認します。\n\n■ 他の選択肢\n障害ではなく仕様どおりの打ち切りです。温度や Guardrails の変更では直りません。",
 g:[C("stopReason の見方",["値","意味"],[["end_turn","正常に終了"],["max_tokens ✔","出力上限で打ち切り"],["tool_use","ツール呼び出しを要求"],["guardrail_intervened","ガードレールが介入"]],1)]},
{x:"■ なぜ正解か\nモデルは、ツールの説明・引数スキーマ・戻り値から次の行動を決めます。これらが曖昧だと同じ呼び出しを繰り返すことがあります。トレースで推論過程を確認し、説明とスキーマを具体的にし、最大反復回数やタイムアウトの上限も設定します。\n\n■ 他の選択肢\n温度を最大にする、無限リトライ、ログ無効化はいずれも悪化させるか原因究明を妨げます。",
 g:[F("ループの調査",["トレースで繰り返しを確認","ツール説明/戻り値の曖昧さを修正","最大反復・タイムアウトを設定","テストして再発を確認"])]}
