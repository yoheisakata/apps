{"d":4,"q":"S3 に蓄積される評価ジョブの結果 (JSONL) を、AWS に不慣れな責任者が開くたびに最新状態で見られるダッシュボードとして提供し、月次推移も自動で追えるようにしたいです。最も運用負荷の低い構成はどれですか。","c":["毎月担当者がスプレッドシートへ手作業で集計して共有する","責任者に Bedrock コンソールの閲覧権限を付与する","Glue クローラーで JSONL をテーブル化し、Athena 経由で QuickSight のダイレクトクエリのダッシュボードを作って共有・定期配信する","QuickSight に月初に手動アップロードした CSV を SPICE に取り込み据え置く"],"a":2,"e":"Glue クローラーが新しい評価結果を同じテーブルに自動で追加し、ダイレクトクエリなら開くたびに最新データが表示されます。共有とメール定期配信も QuickSight の機能で完結します。SPICE 据え置き (D) は更新するまで古いままで、B はコンソールに不慣れな責任者に合わず推移も見にくく、A は手作業の負荷と転記ミスが残ります。"},
{"d":4,"q":"Bedrock 上の複数モデルで動く QA アプリに「回答の確信度」を表示したいのですが、利用中のモデルはトークン確率を返さず、汎用の信頼度スコア API もありません。実用的な代理手法はどれですか。","c":["temperature 0 で 1 回実行し、回答が返れば高確信とみなす","モデル自身に「自信を 0〜100% で申告せよ」と指示し、その数値を使う","回答の文字数が長いほど確信度が高いとみなす","同じ質問を中程度の temperature で複数回サンプリングし、回答間の意味的一貫性（埋め込み類似度）を確信度の代理指標にする"],"a":3,"e":"複数回サンプリングして回答がほぼ同じ内容に収束するなら確信度が高く、ばらつくなら低い——意味的一貫性は較正された確率がなくても計算できる実用的な代理指標です。temperature 0 の 1 回実行 (A) は自信を測らず、自己申告 (B) は較正されないことが知られ、文字数 (C) は確信度と相関しません。"},
{"d":4,"q":"Converse API ベースのチャットで「回答が途中で止まる」「回答が出ない」という報告があり、原因が出力上限・ガードレール介入・コンテキスト超過のどれなのかをリクエストごとに即時に判別して、利用者に適切な案内を出したいです。最も適切な実装はどれですか。","c":["すべての異常時に共通の汎用エラーメッセージを表示する","レスポンスの stopReason で分岐し、max_tokens / guardrail_intervened / model_context_window_exceeded など値ごとに対応した案内を表示する","回答の文字数が一定未満なら「上限到達」と案内する","週次でログを集計し、傾向を見てから案内文を改善する"],"a":1,"e":"stopReason は停止理由をそのまま返します: max_tokens（出力上限）、guardrail_intervened（ガードレール介入）、model_context_window_exceeded（コンテキスト超過）が異常系、end_turn（正常終了）、tool_use（ツール実行要求）、stop_sequence（停止文字列）は正常系です。値で分岐すれば即時に適切な案内が出せます。A は原因を伝えられず、C は推測にすぎず、D は即時対応の要件を満たしません。"},
{"d":4,"q":"Knowledge Base の同期ジョブは毎回「成功」と表示されるのに、12 万件の文書のうち約 4,000 件が検索にヒットしません。欠落した文書と原因を特定する最初のステップはどれですか。","c":["データソース全体を削除して再同期する","S3 の文書一覧とベクトルストアの件数の差分だけを確認する","取り込みジョブの統計と失敗明細を確認し、文書ごとの失敗理由（形式非対応・サイズ超過など）を特定する","ジョブの実行時刻と所要時間を確認する"],"a":2,"e":"取り込みジョブの結果には処理件数に加えて失敗した文書数と理由（非対応フォーマット、サイズ超過など）の明細が含まれます。ジョブ全体のステータスが成功でも個別文書は失敗し得ます。再同期 (A) は同じ理由で再失敗し、件数差分 (B) は漏れた文書が分かっても理由が分からず、実行時刻 (D) は原因と無関係です。"},
{"d":4,"q":"S3 をデータソースとする Knowledge Base で、誤記のあった文書を直接取り込み API（direct ingestion）で修正版に差し替えたところ、当日は正しい回答が返るのに翌朝には古い内容に戻ってしまいます。最も可能性の高い原因はどれですか。","c":["夜間にスケジュールされた StartIngestionJob が、S3 に残っている旧版の文書を取り込み直して修正版を上書きしている（S3 側の元文書も更新する必要がある）","埋め込みモデルのドリフトにより類似度スコアが低下している","直接取り込み API はベクトルストアに書き込まないため修正が反映されていない","ガードレールが修正版の内容をブロックしている"],"a":0,"e":"直接取り込みはベクトルストアへ即時反映しますが、S3 上の元文書は変更しません。そのため夜間の定期同期が S3 の旧版を取り込み直し、修正を上書きします。対策は同じ修正を S3 の文書にも反映することです。C は事実と逆（当日は正しい回答が返っている時点で反映済み）、B や D ではこの「翌朝に旧版へ戻る」パターンを説明できません。"},
{"d":4,"q":"Bedrock Prompt Management で変数 {{customer_name}} を定義したプロンプトを呼び出していますが、生成文に顧客名が埋め込まれず、変数部分が欠けた文章になります。権限エラーは出ていません。プロンプトの変更には承認が必要で、今週は変更できません。最も影響の小さい修正はどれですか。","c":["変数名を変えた新しいプロンプトバージョンを作成して切り替える","呼び出し側の IAM ロールに RenderPrompt 権限を追加する","システムプロンプト（system フィールド）に顧客名を直接埋め込む","コードが promptVariables に渡しているキー名を確認し、プロンプト側の定義と同じ customer_name に修正する"],"a":3,"e":"promptVariables のキー名はプロンプト定義の変数名と完全一致が必要で、customerName のような別名で渡すと値は挿入されず、エラーにもなりません。コード側のキー名修正が最小影響の修正です。権限不足 (B) なら AccessDeniedException になるはずで症状が異なり、新バージョン (A) は承認制約に反して管理も複雑化し、C はプロンプトを model ID として指定する呼び出しでは system を含められません。"},
{"d":4,"q":"RetrieveAndGenerate で構築した RAG API の p95 レイテンシが悪化していますが、検索と生成のどちらが支配的なのか内訳が分かりません。本番トラフィックで内訳を継続的に計測する最も適切な方法はどれですか。","c":["RAG 評価ジョブを実行して品質メトリクスを確認する","呼び出しを Retrieve と Converse の 2 段に分割し、それぞれの所要時間をカスタムメトリクスとして発行して p95 を別々に監視する","モデル呼び出しログを有効化して所要時間を解析する","ベクトルストアを別サービスへ移行して速度を比較する"],"a":1,"e":"RetrieveAndGenerate は検索と生成を 1 回の呼び出しにまとめるため内訳が見えません。Retrieve＋Converse に分解して段ごとの時間をメトリクス化すれば、検索側（件数・リランカー）と生成側（モデル・出力長）のどちらを調整すべきかが分かります。評価ジョブ (A) はオフラインの品質評価で本番の時間は測れず、呼び出しログ (C) には Knowledge Base の検索時間が含まれず、移行 (D) は見積もりのためだけには過大です。"},
{"d":4,"q":"OpenSearch の k-NN (HNSW) インデックスで、文書数が 3 倍に増えて以降、検索の p95 が 80ms から 600ms に悪化し、データノードのメモリ使用率は 96% に達しています。原因確認と対処の組み合わせとして最も適切なものはどれですか。","c":["k（取得件数）を減らしてレイテンシを下げる","ef_search を引き上げて検索精度を上げる","k-NN グラフのメモリ使用メトリクスでグラフがメモリに載り切っていないことを確認し、スカラー量子化でベクトルを 8 ビット化してメモリ使用量を大幅に削減する","SearchLatency メトリクスだけを監視してしきい値超過時に再起動する"],"a":2,"e":"HNSW の k-NN グラフはメモリ上に読み込まれて動作するため、グラフがメモリに収まらなくなるとレイテンシが急増します。KNNGraphMemoryUsage 系メトリクスで原因を確認し、スカラー量子化（32bit→8bit）でメモリを約 1/4 に抑えるのが正攻法です。k を減らす (A) や ef_search (B) はメモリ逼迫を解決せず（B はむしろ悪化）、再起動 (D) は対症療法です。"},
{"d":4,"q":"SQS キュー経由で文書を処理する GenAI パイプラインで、入力形式が壊れた特定のメッセージが可視性タイムアウトのたびにキューへ戻り、1 日数千回再処理されて正常メッセージの処理を遅らせています。壊れたメッセージの内容は後から原因調査に使いたいです。最も適切な対策はどれですか。","c":["キューに maxReceiveCount 付きのリドライブポリシーを設定し、超過したメッセージをデッドレターキューへ自動的に隔離する","5 回失敗したメッセージを削除し、削除件数だけをメトリクスに記録する","処理失敗したメッセージを同じキューの末尾へ再送する","Lambda で受信時に全メッセージを検査し、不正なものを S3 へ退避してから削除する独自機構を実装する"],"a":0,"e":"DLQ への自動隔離は数回の失敗で滞留を止め、隔離されたメッセージは DLQ に残るため後から取り出して原因調査できます。既存の処理実装の変更も不要です。削除 (B) は調査材料を失い、同一キューへの再送 (C) は滞留が続き、独自機構 (D) は SQS 標準機能で足りるものを自前実装する過剰設計です。"},
{"d":4,"q":"コンテナイメージでデプロイした推論用 Lambda 関数が、数週間呼び出されなかった後の最初の呼び出しだけ失敗し、直後の再試行では成功します。ECR のイメージは存在しアクセス権も正常です。最も可能性の高い原因はどれですか。","c":["VPC の ENI 作成に失敗している","メモリ設定が不足して OOM が発生している","参照中の ECR イメージが削除されて関数が Failed 状態になっている","長期間未使用のため関数が Inactive 状態になり、最初の呼び出しは拒否されて Lambda がイメージを再最適化している"],"a":3,"e":"コンテナイメージ関数は呼び出しが長期間ないと Inactive 状態になり、その後の最初の呼び出しは拒否され、裏でイメージの再最適化が走ってから使えるようになります。低頻度の推論関数に特有の失敗モードで、対策は定期的なウォームアップ呼び出しや初回リトライの実装です。ECR イメージ削除 (C) なら Failed 状態で再試行しても成功せず、A や B なら毎回失敗するはずです。"},
{"d":4,"q":"新しいプロンプトをリリースした直後から Bedrock の InvocationLatency が上昇しましたが、トークンあたりのスループットは変わっていません。サービス側の性能劣化とワークロードの変化を切り分ける最も適切な確認はどれですか。","c":["ネットワーク経路の変更を調査する","出力トークン数のメトリクスとレイテンシのパーセンタイルを突き合わせ、応答が長くなっていないかを確認する（InvocationLatency は最後のトークン受信までを測る）","スロットリングが増えたとみなしてクォータ引き上げを申請する","呼び出し回数（Invocations）の推移だけを確認する"],"a":1,"e":"InvocationLatency はリクエスト送信から最後のトークン受信までの時間なので、プロンプト変更で応答が長くなればトークン毎スループットが同じでもレイテンシは上がります。トークン量とレイテンシの相関確認が第一歩です。なおスロットリングされた呼び出しは Invocations やエラー系メトリクスから除外されるため、C や D では切り分けになりません。"},
{"d":4,"q":"トラフィックの少ないステージング環境の Bedrock エラーアラームが、リクエストのない時間帯に INSUFFICIENT_DATA 状態になり、オンコールの混乱を招いています。「リクエストがない＝正常」として静かにさせる正しい設定はどれですか。","c":["TreatMissingData を notBreaching に設定する","TreatMissingData を breaching に設定する","評価期間を 1 分に短縮する","アラームを削除して手動監視に切り替える"],"a":0,"e":"既定では欠損データは INSUFFICIENT_DATA になります。静かな時間帯があるのが正常なワークロードでは notBreaching（欠損＝正常扱い）が正解です。逆に、定期カナリアや同期ヘルスチェックのように「データが出ないこと自体が障害」のメトリクスでは breaching (B) を選びます。期間短縮 (C) は欠損を増やし、D は監視放棄です。"},
{"d":4,"q":"運用ダッシュボードに Logs Insights クエリのウィジェットを多数置いたところ、障害時に調査用のアドホッククエリが実行できなくなることがあります（アカウントの同時実行クエリ上限に到達）。最も適切な改善はどれですか。","c":["ダッシュボードの自動更新間隔をさらに短くする","調査担当者ごとに別アカウントを払い出す","「特定パターンの件数」のような固定的なカウンタはメトリクスフィルタでメトリクス化してウィジェットをメトリクス表示に置き換え、Logs Insights は探索的な分析に温存する","すべてのログを S3 にエクスポートしてダッシュボードを廃止する"],"a":2,"e":"Logs Insights の同時実行クエリはアカウント上限があり、ダッシュボードの発行分も枠を消費します。事前に決まったパターンの件数はメトリクスフィルタで継続的にメトリクス化すれば枠を使わず、アラームにも直結できます。Logs Insights はパーセンタイルやグループ集計など探索的な分析に使い分けます。A は逆効果、B は過剰、D は即時可視性を失います。"},
{"d":4,"q":"利用がバースト的で深夜はトラフィックがほぼゼロになる社内 GenAI API について、「認証 → プロンプト送信 → ストリーミング応答の受信 → 出力形式の検証」という多段フローの健全性を、実トラフィックに依存せず継続的に確認し、失敗した段も特定したいです。最も適切な仕組みはどれですか。","c":["実トラフィックのエラー率アラームに頼る","ELB のヘルスチェックを 10 秒間隔に短縮する","CloudTrail で API 呼び出し履歴を監視する","CloudWatch Synthetics カナリアでフローをスクリプト化してスケジュール実行し、ステップ単位のメトリクスで失敗段を特定する"],"a":3,"e":"カナリアは顧客と同じ経路でエンドポイントを定期的に叩くスクリプトで、本番トラフィックがなくても健全性シグナルを得られます。ステップごとに計装すれば StepName 別メトリクスで失敗段・遅延段を特定できます。実トラフィック依存のアラーム (A) は深夜に盲目になり、ELB ヘルスチェック (B) は疎通確認のみ、CloudTrail (C) は API 監査証跡で健全性監視ではありません。"},
{"d":4,"q":"スーパーバイザー型エージェントがエージェント間プロトコル (A2A) で複数のサブエージェントへタスクを委譲する構成を 2026 年に新規構築します。「どのサブエージェントに何を渡し、何が返り、どこで時間を消費したか」を 1 本のトレースとして追跡したいです。最も適切な計装はどれですか。","c":["AgentCore Observability と OpenTelemetry でトレースコンテキストを A2A ハンドオフ越しに伝播させ、同一トレース ID の階層トレースとして記録する","各エージェントが個別にログを出し、タイムスタンプの近さで後から対応付ける","X-Ray SDK とデーモンで新規に計装する","CloudTrail のイベント履歴でエージェント間の呼び出しを追跡する"],"a":0,"e":"AgentCore Observability は OpenTelemetry 標準で推論ループの各ステップやツール呼び出しをスパンとして記録し、OTEL コンテキストを A2A ハンドオフ越しに伝播させれば委譲先の動作も同一トレース ID の階層に収まります。タイムスタンプ照合 (B) は確実な対応付けになりません。X-Ray SDK/デーモン (C) は保守モードに移行しており新規計装には OTEL が推奨です。CloudTrail (D) は実行時間や受け渡し内容を示しません。"},
{"d":4,"q":"与信モデルの学習を開始する前に、「過去データにおける属性グループ間の表現の偏り」と「ラベル自体に含まれる偏り」の証拠を取得し、ガバナンス記録として保管する必要があります。最も適切な方法はどれですか。","c":["学習後に SHAP で特徴量寄与を分析する","本番運用開始後にバイアスドリフト監視を設定する","SageMaker Clarify の学習前（pre-training）バイアス分析を生データに対して実行し、レポートをモデルカードに取り込める形で保管する","学習済みモデルの予測に対して学習後（post-training）バイアス分析を実行する"],"a":2,"e":"学習前バイアス分析はモデル非依存で生データに対して実行でき、属性グループ間の表現の偏りやラベル分布の差を学習前に検出します。予測を必要としないため、学習の計算資源を使う前にデータ側の対処（収集・サンプリング・ラベル見直し）が可能です。SHAP (A) と学習後分析 (D) は学習済みモデルの予測が前提で「学習前」の要件に合わず、ドリフト監視 (B) は本番運用後の仕組みです。"},
{"d":4,"q":"条件分岐を含む多ノード構成の Bedrock フローが、特定の入力で意図しない経路を通ります。「その呼び出しで実際にどの Condition 分岐が発火し、各ノードに何が入出力されたか」を確認する方法はどれですか。","c":["フローの定義図（グラフ）をレビューして経路を推定する","モデル呼び出しログを有効化してプロンプトを確認する","フローを再デプロイして挙動が直るか確認する","トレースを有効にしてフローを呼び出し、レスポンスストリームに含まれるノード単位のトレースイベント（入力・出力・タイムスタンプ、発火した分岐）を確認する"],"a":3,"e":"InvokeFlow でトレースを有効にすると、各ノードの入力・出力・タイムスタンプを含むトレースイベントがレスポンスストリームで返り、どの Condition 分岐が発火したかも分かります。定義図 (A) は「起こりうる挙動」を示すだけで、特定の 1 回に「実際に起きたこと」はトレースでしか分かりません。呼び出しログ (B) はモデル呼び出し部分のみでノード間の流れを示さず、再デプロイ (C) は原因を特定しません。"},
{"d":4,"q":"Bedrock エージェントの指示文（instructions）を修正したのに、本番アプリ経由の応答に変更がまったく反映されません。最初に確認・実施すべきことはどれですか。","c":["編集は作業ドラフトにのみ反映されるため、PrepareAgent を実行し、本番エイリアスが新しいバージョンを指しているかを確認する","アクショングループの Lambda 関数を再デプロイする","変更の伝播を待つため 24 時間置いて再確認する","enableTrace を有効にして推論過程を解析する"],"a":0,"e":"エージェントの編集は作業用ドラフトにのみ入り、テスト・反映には PrepareAgent が必要です。さらにデプロイ済みエイリアスは特定バージョンに固定されているため、エイリアスが旧バージョンを指したままなら本番は変わりません。preparedAt（Last prepared）とエイリアスの指すバージョンの確認が第一歩です。Lambda (B) は指示文と無関係、伝播待ち (C) という仕組みはなく、トレース (D) は準備確認の後に使う手段です。"},
{"d":4,"q":"セキュリティ部門から「Bedrock の全プロンプトと応答（大きなマルチモーダル含む）を、別リージョンにある中央セキュリティアカウントへ集約せよ」と要求されました。モデル呼び出しログの正しい構成はどれですか。","c":["呼び出しログの配信先に中央アカウントの S3 バケットを直接指定する","CloudWatch Logs のみを配信先にして全データを記録する","呼び出しと同一アカウント・同一リージョンの S3 に配信し（大きな本文は S3 が必要）、その後レプリケーション等で中央アカウントへ集約する","呼び出しログは既定で有効なので、追加設定は不要である"],"a":2,"e":"モデル呼び出しログの配信先は呼び出しと同一アカウント・同一リージョンでなければならず、別アカウント・別リージョンの直接指定 (A) はできません。集約は配信後のレプリケーションで行います。CloudWatch Logs のインラインレコードは本文 100KB までで、それを超える本文やバイナリ（マルチモーダル）は S3 配信が必要なため B も不適切。ログは既定で無効なので D も誤りです。プロンプト全文が観測基盤に出る以上、マスキングとアクセス制御も設計時に組み込みます。"},

{"d":0,"q":"Amazon Titan Text Embeddings V2 を使う RAG で、検索精度を大きく落とさずベクトルストアの保存・検索コストを下げたい。最も適切な方法は？","c":["dimensions パラメータで次元数を 1024 から 512 や 256 に小さくする","生成モデルを大型のものに変更する","PCA で自前の後処理を行い次元削減する","チャンクのオーバーラップを 0 にする"],"a":0,"e":"次元数は精度と保存・検索コストのトレードオフで、Titan V2 は dimensions で 1024/512/256 をネイティブに指定できます。PCA 後処理はネイティブでなく精度管理も自前になります。"},
{"d":0,"q":"Bedrock のナレッジベースを作成後、埋め込みモデルを別のモデルに変えたくなった。正しい対応は？","c":["新しい KB を作成して同期・検証し、アプリの KB ID を切り替える(ブルー/グリーン)","KB の設定画面で埋め込みモデルを差し替えて再同期する","既存ベクトルはそのままに、新規文書だけ新モデルで埋め込む","クエリ側だけ新モデルにする"],"a":0,"e":"異なる埋め込みモデルのベクトル空間は比較できず、KB では埋め込みモデルを後から変更できません。新 KB を作って全文書を取り込み、検証後に切り替えます。"},
{"d":0,"q":"型番やエラーコードでの検索が、ベクトル検索だけだと外れてしまう。改善策として最も適切なのは？","c":["BM25 の語句一致とベクトル検索を組み合わせるハイブリッド検索にする","チャンクサイズを小さくする","生成モデルの temperature を下げる","リランカーだけを追加する"],"a":0,"e":"型番・固有名詞は埋め込み空間でほぼ同じ位置に落ちやすく、語句一致(BM25)との統合が有効です。リランカーは候補に入っていない文書を救えません。"},
{"d":0,"q":"RAG で「上位50件には正解文書が含まれているが、LLM に渡す上位5件に入らない」。最も適切な対策は？","c":["50件を取得し、リランカーで再採点して上位5件だけを FM に渡す","取得件数を5件に減らす","埋め込みモデルを変更する","チャンクのオーバーラップを増やす"],"a":0,"e":"無関係な文書が混ざる(後段)問題にはリランカーが有効です。広く取って再順位付けし上位だけ渡すと、コスト・遅延・ハルシネーションも減ります。"},
{"d":0,"q":"1つの質問に複数の論点が含まれ、片方の論点の文書しか検索で取れない。有効な手法は？","c":["クエリ分解(サブクエリ化)","リランカーの追加","取得件数のみ増やす","temperature を上げる"],"a":0,"e":"1つの埋め込みは1つの意味に偏るため、複合質問はサブクエリに分解してそれぞれ検索します。リランカーや件数増は「候補に入っていない」文書を救えません。"},
{"d":0,"q":"日常語で質問するユーザーに対し、文書は専門用語で書かれていて検索が合わない(語彙ギャップ)。適切な対策は？","c":["クエリ拡張(同義語・専門用語の追加)やクエリ変換を行う","チャンクを大きくする","ベクトルの次元数を下げる","Guardrails を有効にする"],"a":0,"e":"語彙ギャップにはクエリ拡張・変換が有効です。RetrieveAndGenerate ではオーケストレーションプロンプトのカスタマイズでクエリ生成段階の変換もできます。"},
{"d":0,"q":"構造のない物語調の長文を、意味の変わり目で分割したい。しきい値を上げると何が起きる？","c":["セマンティックチャンキングで、チャンクが大きく・少なくなる","階層型チャンキングで、親チャンクが小さくなる","固定長チャンキングで、トークン数が増える","チャンキングなしになる"],"a":0,"e":"セマンティックチャンキングは意味の変化点で分割し、ブレイクポイントのしきい値を上げるとチャンクは大きく少なくなります。"},
{"d":0,"q":"文書に「Procedure N:」という見出しパターンがあり、必ずそこで分割したい。最も適切な構成は？","c":["チャンキングなしにし、カスタム変換 Lambda で分割する","セマンティックチャンキング","固定長チャンキング","階層型チャンキング"],"a":0,"e":"ドメイン固有の分割規則は、チャンキングなし + カスタム変換 Lambda で実現します。"},
{"d":0,"q":"PDF 内の表が平坦化されて、検索結果の質が悪い。最初に見直すべきなのは？","c":["パーサーを FM(視覚)パーサーや Bedrock Data Automation パーサーに変更する","チャンクサイズを大きくする","埋め込みモデルを変更する","取得件数を増やす"],"a":0,"e":"表の構造解釈はチャンキングではなくパーサーの問題です。FM パーサーや BDA パーサーで構造を保持して取り込みます。"},
{"d":0,"q":"Bedrock ナレッジベースで、チャンキング戦略を後から変更したい。正しいのは？","c":["チャンキングは取り込み時に決まるため、変更には再取り込み(作り直し)が必要","設定を変えれば既存の索引へ即時反映される","呼び出しごとのパラメータで変更できる","Guardrails で変更できる"],"a":0,"e":"チャンキングは取り込み時に決まり、後から変えるには再取り込みが必要です。トークン上限や温度などは呼び出しごとに変えられる、という層の違いが頻出です。"},
{"d":0,"q":"S3 上の文書が頻繁に更新され、更新イベントが大量に発生する。KB の取り込みを安定して回す設計は？","c":["S3 イベントを SQS でバッファし、バッチごとに StartIngestionJob を1回起動する","イベントごとに StartIngestionJob を並列で呼ぶ","FIFO キューで1件ずつ起動する","毎回 KB を作り直す"],"a":0,"e":"StartIngestionJob は増分同期で、1データソースにつき同時実行は1つです。SQS で束ねてバッチごとに1回起動します(ジョブは S3 の現状を見るので FIFO は不要)。"},
{"d":0,"q":"文書を S3 を介さず、1分以内に KB へ反映したい。使うべき機能は？","c":["カスタムデータソースと直接取り込み API(IngestKnowledgeBaseDocuments)","S3 バケットの定期同期","DataSync のスケジュールタスク","Transfer Family"],"a":0,"e":"S3 を介さず即時反映したい場合は、カスタムデータソース + IngestKnowledgeBaseDocuments / DeleteKnowledgeBaseDocuments を使います。"},
{"d":0,"q":"オンプレミスの SMB 共有上の文書を KB に取り込み、削除も反映させたい。適切な構成は？","c":["DataSync(エージェント + 削除伝播設定のスケジュールタスク)で S3 に同期する","Transfer Family を使う","AppFlow のスケジュールフロー","手動でアップロードする"],"a":0,"e":"オンプレ SMB/NFS は DataSync が向いています。削除された文書が回答に出続ける事故は、削除の伝播設定漏れが典型的な原因です。"},
{"d":0,"q":"RAG の回答と一緒に、正確な出典を表示したい。最も確実な方法は？","c":["RetrieveAndGenerate のレスポンスの citations を使う","プロンプトで「出典を書いて」とモデルに指示する","モデルに URL を生成させる","CloudTrail のログを参照する"],"a":0,"e":"モデルに出典を言わせると捏造することがあります。citations はサービスが返す実際の参照元なので信頼できます。"},
{"d":0,"q":"RetrieveAndGenerate でフォローアップ質問(「それについて詳しく」)の文脈が切れてしまう。最も簡単な対策は？","c":["sessionId を指定して会話の文脈を維持する","自前の履歴 DB を構築する","毎回全履歴を連結して送る","クエリ書き換え用の別モデルを追加する"],"a":0,"e":"RetrieveAndGenerate は sessionId で文脈を維持できます。自前の履歴管理やクエリ書き換え呼び出しは不要です。"},
{"d":0,"q":"ナレッジベースで dataDeletionPolicy=RETAIN のデータソースを削除した。何が起きる？","c":["埋め込みがベクトルストアに残り、古い内容が検索され続ける","埋め込みも自動で削除される","KB 自体が削除される","S3 の原本が削除される"],"a":0,"e":"既定は DELETE ですが RETAIN だと削除後も埋め込みが残ります。残骸はベクトルストアから直接削除する必要があります。"},
{"d":0,"q":"KnowledgeBaseDocuments API で KB の文書を直接修正したが、次回の同期後に元の内容に戻ってしまった。原因は？","c":["S3 が唯一の正であり、直接修正はベクトルストアのみの更新だったため","KB のキャッシュが残っていた","埋め込みモデルが変わった","Guardrails が元に戻した"],"a":0,"e":"直接修正はベクトルストアのみを更新し、次回同期で S3 の旧版に巻き戻ります。修正は S3 原本にも反映します。"},
{"d":0,"q":"複数の関係をたどる多段の質問(マルチホップ)に強い RAG 構成は？","c":["Neptune Analytics を使った GraphRAG","S3 Vectors","DocumentDB のベクトル検索","ElastiCache のキー値検索"],"a":0,"e":"GraphRAG(Neptune Analytics)は KB が文書からエンティティ関係のグラフを自動構築し、多段の関係性の質問に強くなります。"},
{"d":0,"q":"ベクトル検索を追加したいが、アイドル時のコストをゼロにしたい低頻度ワークロード。適切なベクトルストアは？","c":["S3 Vectors","OpenSearch Serverless のベクトルコレクション","Aurora pgvector","Neptune Analytics"],"a":0,"e":"S3 Vectors はアイドルコストがゼロで再開遅延もなく、低頻度の用途に向いています。大規模・低遅延・運用最小なら OpenSearch Serverless です。"},
{"d":0,"q":"カスタムモデル(ファインチューニング済み)を Bedrock で本番利用するときの前提は？","c":["プロビジョンドスループットが必要(対応モデルならオンデマンドのデプロイ)","学習しただけでオンデマンドで呼び出せる","クロスリージョン推論プロファイルが必須","Guardrails が必須"],"a":0,"e":"Bedrock のカスタマイズモデルの推論にはプロビジョンドスループットが必要で、時間課金・コミット期間で単価が変わります。「調整すれば安くなる」は誤りです。"},
{"d":0,"q":"ベースにしていた基盤モデルが Legacy/EOL になる。そのモデルから作ったカスタムモデルはどうなる？","c":["派生カスタムモデルも使えなくなるため、Active 版ベースで再ファインチューニングする","影響を受けず使い続けられる","プロビジョンドスループットを購入すれば使い続けられる","自動で最新版に移行される"],"a":0,"e":"基盤モデルが EOL になると派生カスタムモデルも失効します(PT 購入でも回避不可)。Active 版を検証して ID を切り替え、保存済み学習データで再 FT します。"},
{"d":1,"q":"Converse API で、モデル固有のパラメータ(例: top_k)を指定するにはどこに書く？","c":["additionalModelRequestFields","inferenceConfig","toolConfig","guardrailConfig"],"a":0,"e":"inferenceConfig は maxTokens / temperature / topP / stopSequences のみで、モデル固有のパラメータは additionalModelRequestFields に書きます(形式はモデルごとに異なる)。"},
{"d":1,"q":"Converse API のレスポンスで stopReason が tool_use で、本文が空だった。正しい解釈は？","c":["エラーではなく、モデルがツール実行を要求している","モデルが失敗した","max_tokens に到達した","ガードレールが遮断した"],"a":0,"e":"tool_use はツール実行の要求です。stopReason(end_turn / max_tokens / tool_use)で必ず分岐しないと、ツールターンで空応答を出したり、切れた回答を完結扱いするバグになります。"},
{"d":1,"q":"Converse API のツール利用で、ツール実行結果をモデルに返す正しい方法は？","c":["user メッセージ内に toolUseId を付けた toolResult ブロックを入れる","assistant メッセージに結果を入れる","system プロンプトに結果を追記する","toolConfig に結果を入れる"],"a":0,"e":"結果は user メッセージ内の toolResult ブロック(toolUseId 付き)で返します。assistant で返すと ValidationException になります。"},
{"d":1,"q":"特定の問い合わせでは、モデルに必ず特定のツールを呼ばせたい。最も確実な方法は？","c":["リクエストの toolChoice で特定ツールを指定する","プロンプトで「必ずツールを使え」と書く","temperature を 0 にする","max_tokens を小さくする"],"a":0,"e":"toolChoice は auto / any / 特定ツールの強制をリクエスト単位で指定できます。プロンプト指示は確率的で保証になりません。"},
{"d":1,"q":"応答の前置きを排除し、出力の書き出しを固定したい。最も確実な手段は？","c":["messages の末尾に assistant のプレフィル(書き出し)を置く","プロンプトで前置きを禁止する","top_p を下げる","stopSequences を設定する"],"a":0,"e":"assistant の書き出しを部分的に置くと、モデルはその続きから生成します。プロンプト指示は確率的ですが、プレフィルは前置き排除・形式固定の最も確実な手段です。"},
{"d":1,"q":"多言語の入力でも、必須フィールドが欠けない構造化出力を保証したい。最も適切な方法は？","c":["required を宣言した inputSchema のツールを定義し、それに出力させる","プロンプトで JSON 形式を指示する","正規表現で検証し失敗時に再生成する","出力形式をファインチューニングする"],"a":0,"e":"ツール使用のスキーマで強制すると、欠落や順序崩れが構造的に起きません。プロンプト指示・再生成・FT は保証にはなりません。"},
{"d":1,"q":"Prompt Management の管理プロンプトを Converse API で呼び出すとき、正しい指定は？","c":["modelId にプロンプトのバージョン ARN を渡し、inferenceConfig は併送しない","modelId にモデル ID を渡し、プロンプト本文を messages に入れる","DRAFT を参照し、inferenceConfig も併送する","guardrailConfig にプロンプト ARN を渡す"],"a":0,"e":"推論設定はプロンプトリソース側に定義されるため、inferenceConfig を併送すると 400 ValidationError になります。本番は不変バージョンを参照します。"},
{"d":1,"q":"夜間に大量の文書を非リアルタイムで処理し、コストを約50%下げたい。適切な方法は？","c":["CreateModelInvocationJob(バッチ推論)を使う","StartAsyncInvoke を使う","プロビジョンドスループットを購入する","Converse API を並列呼び出しする"],"a":0,"e":"バッチ推論は S3 の JSONL({recordId, modelInput})を入力とし、約50%の割引です。完了保証はなくリアルタイムには使えません。ツール呼び出し・構造化出力には非対応です。"},
{"d":1,"q":"マルチテナントのアプリで、テナントごとに Bedrock の呼び出し量を制限したい。適切な方法は？","c":["API Gateway の使用量プランやテナント別トークンバケットを呼び出しの手前に置く","Bedrock のクォータをテナントごとに設定する","WAF のレートルールを使う","Lambda の予約同時実行数を使う"],"a":0,"e":"Bedrock クォータはモデル × リージョン単位でテナント別設定はできません。WAF のレートルールは送信元 IP 単位で、共有プロキシ環境では破綻します。"},
{"d":1,"q":"Step Functions で、人手の承認を待ってから処理を再開したい。適切な方法は？","c":["Standard ワークフローの .waitForTaskToken コールバックと SendTaskSuccess","Express ワークフローの .waitForTaskToken","固定の Wait ステートで待つ","Lambda を15分間ポーリングする"],"a":0,"e":"人手承認は .waitForTaskToken で、SendTaskSuccess で即時再開します(output は次ステートの入力)。トークンコールバックは Standard のみ対応で、Express は非対応です。"},

var KEY="genaiquiz-v1";
var S=load();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.wrong)return s;}catch(e){}return {wrong:[],done:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(id){return document.getElementById(id);}
function show(id){["home","quiz","result"].forEach(function(s){$(s).classList.toggle("on",s===id);});window.scrollTo(0,0);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function renderHome(){
  var h="";
  DOMAINS.forEach(function(n,i){
    var ids=[];Q.forEach(function(q,k){if(q.d===i)ids.push(k);});
    var done=0;ids.forEach(function(k){if(S.done[k]==="ok")done++;});
    var p=Math.round(done/ids.length*100);
    h+='<button class="btn" onclick="startDomain('+i+')">'+n+'<small>'+ids.length+'問 ・ 正解済み '+done+'/'+ids.length+'</small><div class="bar"><i style="width:'+p+'%"></i></div></button>';
  });
  $("domains").innerHTML=h;
  var n=S.wrong.length;
  $("reviewCnt").textContent=n?n+"問":"間違えた問題はありません";
  $("reviewBtn").disabled=!n;
}

var cur=[],idx=0,right=0,per={},answered=false;
function startRandom(n){begin(shuffle(Q.map(function(_,i){return i;})).slice(0,n));}
function startDomain(d){var ids=[];Q.forEach(function(q,k){if(q.d===d)ids.push(k);});begin(shuffle(ids));}
function startReview(){begin(shuffle(S.wrong));}
function begin(ids){if(!ids.length)return;cur=ids;idx=0;right=0;per={};show("quiz");render();}

function render(){
  answered=false;
  var q=Q[cur[idx]];
  $("prog").textContent=(idx+1)+" / "+cur.length;
  $("barFill").style.width=(idx/cur.length*100)+"%";
  $("qtag").textContent=DOMAINS[q.d];
  $("qtext").textContent=q.q;
  $("exp").style.display="none";$("next").style.display="none";
  var order=shuffle(q.c.map(function(_,i){return i;}));
  var h="";
  order.forEach(function(o){h+='<button class="opt" data-o="'+o+'" onclick="pick(this,'+o+')">'+esc(q.c[o])+'</button>';});
  $("opts").innerHTML=h;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function pick(el,o){
  if(answered)return;answered=true;
  var k=cur[idx],q=Q[k],ok=(o===q.a);
  [].forEach.call($("opts").children,function(b){
    b.classList.add("lock");
    var v=+b.getAttribute("data-o");
    if(v===q.a)b.classList.add("ok");
    else if(b===el)b.classList.add("ng");
  });
  per[q.d]=per[q.d]||[0,0];per[q.d][1]++;
  if(ok){right++;per[q.d][0]++;S.done[k]="ok";var p=S.wrong.indexOf(k);if(p>=0)S.wrong.splice(p,1);}
  else{S.done[k]="ng";if(S.wrong.indexOf(k)<0)S.wrong.push(k);}
  save();
  $("exp").innerHTML="<b>"+(ok?"⭕ 正解":"❌ 不正解")+"</b><br>"+esc(q.e);
  $("exp").style.display="block";
  $("next").textContent=(idx+1<cur.length)?"次へ":"結果を見る";
  $("next").style.display="block";
  $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){idx++;if(idx<cur.length)render();else finish();}

function finish(){
  show("result");
  var pc=Math.round(right/cur.length*100);
  $("rscore").textContent=pc+"%";
  $("rsub").textContent=cur.length+"問中 "+right+"問正解"+(pc>=75?" 🎉 合格ライン超え!":"");
  var h="";
  Object.keys(per).forEach(function(d){h+='<div class="btn" style="cursor:default">'+DOMAINS[d]+'<small>'+per[d][0]+' / '+per[d][1]+' 正解</small></div>';});
  $("rdom").innerHTML=h;
}
function goHome(){renderHome();show("home");}
function resetStats(){if(confirm("成績と復習リストをリセットしますか？")){S={wrong:[],done:{}};save();renderHome();}}
renderHome();
</script>
