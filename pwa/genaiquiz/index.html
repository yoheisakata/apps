{"d":0,"q":"1,000 万チャンクを OpenSearch に書き込む取り込みジョブが途中で失敗し、再実行すると書き込み済みの分が重複して蓄積されます。失敗位置を特定する手段はありません。再実行しても重複せず、仕組みの追加を最小にする設計はどれですか。","c":["文書キーとチャンク番号から決定的に ID を生成し、同じ ID への書き込みで既存文書を上書きさせる","再実行のたびにインデックスを削除して作り直す","書き込み完了後に重複を検索して削除するジョブを追加する","DynamoDB に進捗を記録し、失敗時はそこから再開する"],"a":0,"e":"同じ ID への書き込みは置き換えになるため、先頭から流し直しても既書き込み分は同内容で上書きされるだけで重複しません (冪等)。進捗管理も重複削除も不要です。B は毎回全件書き直しで時間がかかり、C は照合・削除の工程が増え、D は記録と実際の乖離 (記録前のクラッシュ等) で重複が残ります。"},
{"d":0,"q":"自前の OpenSearch ベクトルストアで、チャンク本文は不変なのに「閲覧可能部門」などのメタデータ属性が頻繁に変わります。現在は属性変更のたびに文書を再チャンク・再埋め込みしており、コストと反映遅延が問題です。最も効率的な対処はどれですか。","c":["取得後にアプリ側で属性不一致のチャンクを除外する","属性値を本文に埋め込んで再埋め込みする","該当チャンクの埋め込みベクトルを保持したまま、メタデータフィールドだけを部分更新する","S3 タグで属性を管理し、日次バッチで同期する"],"a":2,"e":"埋め込みは本文から作られるため、属性だけの変更でベクトルを作り直す必要はありません。部分更新なら対象チャンクのメタデータだけが書き換わり、変更が即座に検索時フィルタに反映されます。A は上位 k 件から除外すると根拠が不足し、B は無駄な埋め込みコスト、D は反映が翌日まで遅延します。"},
{"d":0,"q":"数百万件の FAQ から、表現は違うが意味的に重複している項目の候補を抽出したいと考えています。候補は人が最終確認するため精度は完全でなくて構いませんが、現実的な時間で完了する必要があります。最も適切な方法はどれですか。","c":["全組み合わせを基盤モデルに渡して重複かどうかを判定させる","Athena で文字数と語数が近い組を抽出する","Comprehend のキーフレーズ抽出で共通語を持つ組を集める","各 FAQ を埋め込みに変換してベクトルストアに格納し、各件の近傍を近似最近傍検索で引いて候補とする"],"a":3,"e":"総当たりの判定 (A) は比較回数が件数の二乗で増え現実的な時間で終わりません。埋め込みでは意味の近さが距離として表現されるため、各件の近傍だけを引けば比較対象が絞られ、言い換えによる重複も拾えます。C は言い回しが異なると語がそろわず、B は表面的な長さの近さで意味の近さを表しません。"},
{"d":0,"q":"複数の上流システムから集めた顧客レコードを学習データとして統合しています。氏名や住所の表記が微妙に異なる同一顧客のレコードが残っており、Glue の組み込みの重複削除変換では除去できませんでした。最も適切な対処はどれですか。","c":["Glue の FindMatches 変換で曖昧 (ファジー) な重複を検出して統合する","組み込みの重複削除変換を複数回適用する","Amazon Macie で重複レコードをスキャンする","全レコードのハッシュ値を比較して一致する組を削除する"],"a":0,"e":"組み込みの重複削除はバイト単位の完全一致向けで、表記ゆれのある重複には効きません。FindMatches は機械学習でファジーな重複 (微妙に異なる同一実体) を検出する専用変換です。B は何度やっても完全一致の基準が変わらず、C は Macie の用途 (機密データ検出) 違い、D はハッシュも完全一致しか拾えません。"},
{"d":0,"q":"固定サイズチャンキングの RAG で、「条件」とその直後の「例外規定」がチャンク境界で分断され、片方しか取得されず誤答につながっています。固定サイズ方式と取り込みコストの低さは維持したいです。最も適切な対処はどれですか。","c":["チャンクサイズを 2 倍にして境界の数を減らす","基盤モデルパーサーに切り替えて文書構造を解析させる","オーバーラップを 10〜20% 程度に設定して再取り込みし、境界付近の文を隣接チャンクの両方に含める","チャンキングなしに変更して文書全体を 1 チャンクにする"],"a":2,"e":"オーバーラップは境界をまたぐ文脈が失われないようにする仕組みで、条件と例外が同じチャンクに入りやすくなります。取り込み時に FM を使わないため追加モデルコストもほぼありません (保存量が少し増える程度)。A は分断の確率を下げるだけで根本解決にならず粒度も粗くなり、B は取り込み時のモデルコストが発生し、D は検索粒度が粗くなりすぎます。"},
{"d":0,"q":"料金プラン約款の RAG で、「この料金は月額で請求される」のようにプラン名を含まないチャンクが多く、「プラン A の料金は?」と聞くと別プランのチャンクが上位に返ります。検索設定は変えずに、チャンクごとに文脈を区別できるようにする最も適切な方法はどれですか。","c":["取り込み時のカスタム変換で、各チャンクが文書内で何を指すかを 1 文にまとめて本文の先頭に前置してから埋め込む","文書ごとに共通の説明文を全チャンクに付加する","文書名をメタデータ属性にして検索時にフィルタで絞る","取得件数を増やしてリランカーで並べ替える"],"a":0,"e":"チャンク固有の文脈文を前置して埋め込めば、その文脈がベクトルに反映され、同一プラン内の条項の位置づけまで区別されます。処理は取り込み内で完結し検索側は不変です。B は全チャンクが同じ文脈になり区別できず、C は呼び出し側の条件指定 (検索設定の変更) が必要、D は候補の順序を変えるだけで埋め込み自体の曖昧さは解消しません。"},
{"d":0,"q":"RAG チャットボットで「その保証期間は?」のように前のやり取りに依存する省略質問をすると、無関係なチャンクが取得されます。履歴の自前管理や埋め込みの変更をせず、最小の実装で解決する方法はどれですか。","c":["全ターンの会話を連結して retrievalQuery に渡す","直前の 1 ターンだけを質問に連結する","前回取得したチャンクをキャッシュして再利用する","RetrieveAndGenerate で sessionId を指定し、サービス側に会話文脈を保持させて省略質問を自己完結クエリに書き換えさせる"],"a":3,"e":"RetrieveAndGenerate は sessionId による会話文脈の保持に対応しており、省略質問を文脈から自己完結のクエリに書き換えてから検索します。単独で成立する質問はそのまま検索されるため品質も保たれます。A は無関係な背景が積み上がって検索品質が落ち、C は新しい検索が行われず、B はさらに前の文脈に依存する質問を補えません。"},
{"d":0,"q":"ナレッジベースにない話題の質問でも、関連度の低い最上位チャンクを根拠に回答してしまいます。埋め込みモデルとチャンク分割は変更できず、判定は取得の段階で完結させたいです。最も適切な対処はどれですか。","c":["Retrieve が返す関連度スコアにしきい値を設け、全候補が下回る場合は「該当情報なし」と返す","リランカーを追加して最上位の候補を生成に渡す","Comprehend で質問と候補の関連度を別途判定する","キーワード一致がゼロの質問だけを範囲外として検出する"],"a":0,"e":"Retrieve の応答には各結果の関連度スコアが含まれるため、しきい値判定だけで取得の段階で範囲外を検出でき、生成に進む必要もありません。B は並べ替えであり「関連文書が存在しない」ことは判定できず、C は取得に使った埋め込みと異なる基準で整合せず、D は語の一致と意味の一致がずれるケースを取り違えます。"},
{"d":0,"q":"製造業の RAG で「この不具合の考えられる原因は?」と聞くと、類似度最上位の 1 文書のチャンクばかりが取得され、別文書に書かれた他の原因が候補に入りません。取り込み設定と一致精度は維持したまま、複数の原因を取得したいです。最も適切な方法はどれですか。","c":["取得件数を 50 件に広げ、リランカーで上位 5 件に絞る","同一文書から取得するチャンク数に上限を設け、上位から文書をまたいで選ぶ","ハイブリッド検索に変更して語の一致も併用する","類似度のしきい値を下げて取得対象を広げる"],"a":1,"e":"類似度順に取ると同一文書の複数チャンクが上位を占めがちです。1 文書あたりの件数に上限を置けば、順位付け基準 (一致精度) を変えずに複数文書へ分散できます。A は候補が広がっても上位の偏りは残り、C は分散する保証がなく、D は関連の低いチャンクが混ざって精度が落ちます。"},
{"d":0,"q":"社内の製品コードや独自略語 (例: PJ-7) をモデルが一般的な意味で解釈し、回答がずれます。定義は社内用語集にあります。追加学習なしで、用語集を更新しても実装改修が不要で、入力コストも最小にしたい場合、最も適切な方法はどれですか。","c":["用語集全文を AppConfig で配信し、毎回システムプロンプトに添付する","質問に含まれる社内用語だけを用語集から引き、その定義をコンテキストに添える","用語の対応を数千件集めてファインチューニングする","用語集をナレッジベースに取り込み、質問との類似検索で定義を取得する"],"a":1,"e":"ずれの原因は定義がモデルに渡っていないことなので、質問に現れた用語に限定して定義を添えれば最小の入力量で解決し、用語集の更新は参照データの更新として自動反映されます。A は数百語の定義が毎回入力に乗りコスト増、C は学習工程が必要で更新のたびにやり直し、D は定義文が質問と語彙的に重ならないことが多く類似検索で引けません。"},
{"d":0,"q":"1 つの Bedrock Knowledge Base で、鮮度重視のニュース記事と網羅性重視の用語集を扱っており、単一の取得設定ではどちらかの精度が犠牲になります。また部門ごとに最適な埋め込みモデルが異なることも検証で分かっています。これらの要件に対する正しい理解はどれですか。","c":["取得設定も埋め込みモデルも Knowledge Base 単位の設定のため、コンテンツ種別や部門ごとに KB を分割し、問い合わせを適切な KB に振り分ける","データソースごとに埋め込みモデルを指定できるため、KB は 1 つのままデータソースを分ければよい","取得件数を増やせば両方のコンテンツ特性を同時にカバーできる","S3 ライフサイクルで古い記事を削除すれば単一設定で両立できる"],"a":0,"e":"埋め込みモデルは KB 作成時に決まる KB 単位の設定で、データソース単位では変えられません。取得設定 (件数・検索タイプ) も呼び出しごとに KB に対して指定します。性質の異なるコンテンツや部門別のモデル要件には KB を分割し、振り分け層 (分類 Lambda 等) でルーティングするのが定石で、インデックス分離は他部門文書の混入も構造的に防ぎます。"},
{"d":0,"q":"ある企業の RAG 要件は、(1) 独自のクロスエンコーダによるリランキング、(2) 複数回の検索を連鎖させる独自のマルチホップ推論、(3) 社内の多数の独自システムとの連携取り込み、のすべてを含みます。Bedrock Knowledge Bases と自前パイプラインのどちらを選ぶべきですか。","c":["Knowledge Bases — チャンキングやハイブリッド検索を含むすべての要件を標準機能で満たせる","Amazon Kendra に置き換える","Knowledge Bases を 2 つ直列に接続してマルチホップを実現する","自前パイプライン (例: OpenSearch Serverless + Bedrock + オーケストレーションフレームワーク) — 独自リランカー・マルチホップ・多数の独自コネクタは KB の標準機能を超える"],"a":3,"e":"KB はチャンキング方式の選択・ハイブリッド検索・一部のリランカーなどを提供しますが、独自クロスエンコーダの組み込み、自由なマルチホップ制御、任意の社内システム連携は標準機能の範囲外です。3 要件がすべて必須なら自前構成が妥当です。A は KB の機能範囲の過大評価、C は KB にそのような連鎖機構はなく、B はマネージド検索であり独自リランカー等の要件を満たしません。"},
{"d":0,"q":"Bedrock Knowledge Bases で、既存の Aurora PostgreSQL クラスタをベクトルストアとして流用し、セマンティックチャンキングを使いたいという 2 つの要件があります。これらを満たす構成について正しい説明はどれですか。","c":["どちらもベクトルストアを利用者が選んで運用する Customer-managed 構成で満たす (ストアの流用とチャンキング戦略の全種類の選択が可能)","フルマネージド (Quick create) 構成でも既存 Aurora の流用とセマンティックチャンキングが可能","セマンティックチャンキングは Aurora をストアにすると使えない","既存 Aurora を使うには DMS でデータを OpenSearch に移行する必要がある"],"a":0,"e":"既存のベクトルストア (Aurora pgvector、OpenSearch 等) の流用や、デフォルト/固定/階層/セマンティック/なしからのチャンキング選択は、利用者がストアを用意する customer-managed 構成の特徴です。Quick create はサービス側がストアを新規作成するため既存クラスタの流用はできません。なお SharePoint などのコネクタ取り込みや文書 ACL はマネージド側の機能であり、customer-managed を選ぶ理由にはなりません。"},
{"d":0,"q":"3 つのチームがそれぞれ要件を出しています。チーム X: ID 連動のアクセス制御が組み込まれた、すぐ使える社内アシスタントが欲しい。チーム Y: 1 つの検索インデックスを Bedrock アプリと独自アプリの両方の取得元として共有したい。チーム Z: 基盤モデルとベクトルストアを自由に選べるカスタム RAG を作りたい。最も適切な組み合わせはどれですか。","c":["X: Bedrock Knowledge Bases、Y: Q Business、Z: Kendra","X: Amazon Q Business、Y: Amazon Kendra (GenAI インデックスの共有)、Z: Bedrock Knowledge Bases","X: Kendra、Y: Bedrock Knowledge Bases、Z: Q Business","3 チームとも Bedrock Knowledge Bases で統一する"],"a":1,"e":"購入 (buy) から構築 (build) のスペクトルで考えます。ターンキーで ID 連動 ACL 込みのアシスタント = Q Business。1 つのインデックスを複数の下流 (Bedrock・Q Business・独自アプリ) に供給 = Kendra (GenAI 向けエディションのインデックスは共有リトリーバーとして使える)。FM・ベクトルストアの自由度最優先のカスタム構成 = Bedrock Knowledge Bases (ただしコネクタや ID フィルタの作り込みは自前)。"},
{"d":0,"q":"Bedrock Knowledge Bases でデータソースを削除して差し替えたのに、旧データソース由来の古いチャンクが検索され続けています。最も可能性の高い原因はどれですか。","c":["ベクトルストアへの反映に数日かかる仕様のため","新しいデータソースを同期すれば旧データも自動的に消える","検索タイプが HYBRID になっているため古いデータが混ざる","データソースの dataDeletionPolicy が RETAIN に設定されており、削除時に埋め込みがベクトルストアに残った"],"a":3,"e":"dataDeletionPolicy はデータソース/KB 削除時にベクトルストア内の埋め込みも消すかを決める設定で、既定は DELETE ですが RETAIN だと残ります。残ったデータはストアから直接削除する必要があります。反映は通常数秒〜数十秒 (A)、検索タイプは無関係 (C)、別データソース由来の埋め込みは他のデータソースの同期では消えません (B)。"},
{"d":0,"q":"S3 をデータソースとする Knowledge Base で、誤記のあるチャンクを KnowledgeBaseDocuments 系 API で直接修正したところ、検索には即時反映されましたが、翌朝には修正前の内容に戻っていました。原因と正しい対処はどれですか。","c":["夜間の StartIngestionJob が S3 上の古い原本を再取り込みして上書きした。修正時は S3 の原本も同時に更新する","取り込みジョブが失敗して古い状態に戻った。ジョブを再実行する","直接更新と夜間ジョブが同時実行で競合した。排他制御を入れる","同じ内容でも埋め込みが毎回変わるため差分が出た。embedding を固定する"],"a":0,"e":"KnowledgeBaseDocuments 操作はベクトルストアを即時更新しますが、S3 上の原本は変更しません。次回の同期は S3 の内容 (古い版) を正として取り込むため、修正が巻き戻ります。S3 が信頼できる唯一の情報源である以上、修正は原本側にも反映する必要があります。B は失敗なら即時反映自体が起きないはず、C は両者が別時刻に走っており競合ではなく、D は同一内容なら同一の埋め込みになります。"},
{"d":0,"q":"PDF 文書を扱う Bedrock Knowledge Base で、回答の引用に PDF のページ番号を含める必要があります。正しい実現方法はどれですか。","c":["システムプロンプトでモデルにページ番号を書かせる","PDF を 1 ページずつ別ファイルに分割して取り込む","対応するベクトルストア (OpenSearch Serverless や Aurora など) の KB に、チャンキングありの設定で取り込み、ページ番号メタデータ (x-amz-bedrock-kb-document-page-number) を付けさせる","チャンキングなしを選んで文書全体の位置情報を保持する"],"a":2,"e":"対応ストアの KB では PDF のページ番号が専用メタデータに格納され、引用に利用できます。チャンキングなし (D) ではページ番号メタデータが付きません。モデルに書かせる (A) とチャンクにページ情報がない場合は推測になり誤ったページを示す恐れがあり、ページ分割 (B) はページをまたぐ文章を分断して検索品質を下げ管理も煩雑です。"},
{"d":0,"q":"学習データのストリーミング取り込み基盤を選定しています。既存の資産として Kafka クライアント実装、トピック設計、Kafka Streams のジョブがあり、チームの専門性も Kafka に集中しています。最も適切な選択はどれですか。","c":["Amazon Kinesis Data Streams — 常に MSK より優れたマネージドサービスのため","AWS Glue ストリーミング ETL — ストリーム処理には常にこれを使う","Amazon SQS FIFO — 順序保証があるため","Amazon MSK — Kafka エコシステム互換が要件であり、既存のクライアント・トピック・Streams 資産をそのまま活かせる"],"a":3,"e":"MSK を選ぶ基準は「Kafka 互換が要件にあるか」です。クライアント・トピック・コンシューマーグループ・Kafka Streams などの既存資産とチームの専門性が Kafka に根ざしているなら MSK が適切です。Kinesis が汎用的に優れているわけではなく (A)、SQS FIFO はストリーム分析基盤ではなく (C)、Glue ストリーミング ETL は変換レイヤーであって基盤の代替ではありません (B)。"},
{"d":0,"q":"MongoDB 互換 API の既存アプリを持つ企業が、別の検索基盤を増やさずに Amazon DocumentDB に埋め込みを同居させて RAG を作る案を検討しています。この選択のトレードオフとして正しい説明はどれですか。","c":["DocumentDB は Bedrock Knowledge Bases のネイティブなベクトルストアとして登録でき、マネージド取り込みが使える","DocumentDB のベクトル検索は Serverless クラスタ専用である","ベクトルインデックスはコンソールから作成し、接続情報はアプリにハードコードするのが推奨される","既存 Mongo 系アプリとの API 継続性は得られるが、KB のネイティブ統合はないため、チャンク化・埋め込み・検索の各段を自前実装する必要がある。ベクトルインデックスは HNSW と IVFFlat が使え、インデックス可能な次元には上限がある"],"a":3,"e":"DocumentDB には KB のネイティブ統合がなく、RAG に使うなら取り込み (チャンク化・埋め込み・書き込み) と検索 (クエリ埋め込み・ベクトル検索・チャンク返却) を自前で構築します。得られるのは Mongo 互換 API の継続性です。インデックスは HNSW (構築遅いが高性能) と IVFFlat (事前データ必須、probes で再現率調整) があり、インデックス可能な次元に上限があるため高次元の埋め込みモデルは使えないことがあります。インデックス作成は Mongo 互換 API (createIndex) で行い、認証情報は Secrets Manager から取得します。"},
{"d":0,"q":"GraphRAG のために Neptune Analytics のグラフを設計しています。埋め込みモデルの選定とグラフ作成の順序について正しい説明はどれですか。","c":["ベクトルインデックスは後からいくつでも追加でき、次元も随時変更できる","グラフはベクトルインデックスを 1 つしか持てず、次元は作成時に固定されるため、埋め込みモデルはグラフ作成前に確定させる。またプロパティとベクトルの更新はアトミックではないため部分失敗はアプリ側で整合させる","ベクトル更新は ACID 準拠のため部分失敗を考慮する必要はない","Neptune Analytics はベクトル検索に対応していないため OpenSearch を併用する必要がある"],"a":1,"e":"Neptune Analytics のグラフはベクトルインデックスを 1 つだけ持ち、次元 (vector-search-configuration の dimension) はグラフ作成時に固定で後から変更できません。したがって埋め込みモデルの決定が先です。またベクトルインデックスの更新はアトミック/ACID ではないため、プロパティとベクトルの両方を書くアプリは部分失敗の整合を自分で処理します。"},
{"d":0,"q":"S3 上の行指向データを、学習ジョブが読む 160 個の宛先パーティションを持つ Parquet テーブルへ Athena で変換します。正しい手順はどれですか。","c":["1 回の CTAS で 160 パーティションすべてを書き込む","1 回の巨大な INSERT INTO にまとめる","まず範囲を限定した CTAS でテーブルを作り、その後 100 パーティション未満の範囲に区切った複数の INSERT INTO を実行する","CTAS は無制限なので INSERT INTO のみ分割する"],"a":2,"e":"Athena の CTAS と INSERT INTO は、1 ステートメントで書き込める宛先パーティションが最大 100 個です (CTAS 自体も同じ上限)。したがって範囲限定の CTAS でテーブルを作成し、残りを上限未満に区切った複数の INSERT INTO で埋めます。INSERT INTO は追記ではなく毎回新しい S3 ファイルを作成し、マニフェストで書き込みファイルを追跡できます。"},
{"d":0,"q":"Kinesis Data Streams で流れる学習データのスキーマを Glue Schema Registry で統制します。新しいスキーマバージョンが「過去のすべてのバージョン」と互換であることを強制したい場合、どの互換性モードを選びますか。","c":["BACKWARD (直前バージョンとの互換のみを検査する)","NONE (検証なしで登録を許可する)","BACKWARD_ALL (過去の全バージョンとの互換を要求する)","DISABLED (スキーマの進化を禁止する)"],"a":2,"e":"Schema Registry はプロデューサーとコンシューマー間の契約で、互換性モードが新バージョンの受け入れ可否を決めます。BACKWARD は直前バージョンのみとの互換 (フィールド削除やオプショナル追加を許容) で、全履歴との互換が必要なら BACKWARD_ALL を選びます。Registry は Avro / JSON Schema / Protobuf に対応し、Kinesis・MSK・Lambda・Flink と統合されます。"},
{"d":0,"q":"アナリストが SageMaker Data Wrangler でビジュアルに前処理フローを試作しました。本番ではマネージド基盤で実行し、選択した中間ステージを別々の S3 に出力し、品質レポートの所見をリリース判断に使いたいと考えています。正しい設計はどれですか。","c":["Data Wrangler の Quality Report の判定をそのまま自動リリース判断に使う","フローを Data Wrangler ジョブとしてエクスポートして SageMaker Processing で実行し、選択ステージを別々の S3 宛先に書き出す。品質レポートの所見は明示的な合否基準に変換してパイプラインで強制する","フローをそのまま常駐の Studio ノートブックで毎日実行する","最終ステージの出力だけを S3 に書き、途中経過は再計算する"],"a":1,"e":"Data Wrangler フローはジョブとしてエクスポートすると SageMaker Processing で実行され、選択した変換ステージを別々の S3 宛先に書き出せます。Processing はジョブ終了でインスタンスが解放されるマネージド実行基盤です。重要なのは、Data Insights / Quality Report は「検出」止まりで、リリース判断には明示的な合否基準への変換が必要という点です (A は誤り)。C は常駐リソースでマネージド実行の要件に反し、D は中間ステージ出力の要件を満たしません。"},
{"d":0,"q":"英語の問い合わせチャットで、定型的な意図はセルフサービス画面に誘導し、それ以外だけを基盤モデルに送る設計です。意図判定そのものは FM を使わず、決定的かつ低コストにリアルタイムで行う必要があります。最も適切な方法はどれですか。","c":["小型の FM に意図を分類させる","Bedrock Guardrails の拒否トピックで定型意図を検出する","Comprehend の非同期分類ジョブで判定する","ラベル付きデータで学習した Amazon Comprehend カスタム分類器をリアルタイムエンドポイントで使う"],"a":3,"e":"Comprehend のカスタム分類器はラベル付きデータで学習でき、リアルタイムエンドポイントなら対話中の判定に使えます。FM 不使用・決定的・低コストという要件に合致します (対応言語に制約がある点に注意)。A は FM 不使用の要件に反し、C はバッチ処理でその場の誘導に使えず、B の拒否トピックは応答をブロックする安全機能でありルーティングに使うと利用者にブロックメッセージが返ります。"},
{"d":0,"q":"スキャン申請書を Amazon Textract で文字起こしして RAG に取り込むパイプラインで、低品質スキャンのページから誤認識テキストが混入し検索品質を下げています。誤認識ページを埋め込み対象から外し、後から再処理できるようにする最も適切な方法はどれですか。","c":["基盤モデルに誤認識箇所を推測で修正させてから埋め込む","Textract が返す信頼度スコアにしきい値を設け、下回るページを除外して一覧を S3 に記録する","辞書にない語の割合でページを除外する","全ページを高解像度で再スキャンして再取り込みする"],"a":1,"e":"Textract は抽出要素ごとに信頼度スコアを返すため、しきい値で低品質ページを機械的に判別・除外でき、除外一覧を S3 に残せば再スキャン後に対象を特定して再処理できます。追加の推論も別サービスも不要です。A は原本を確かめる手段がなく誤った内容が混入し、C は専門用語や型番の多い正常ページまで除外し、D は蓄積済み原本の全再スキャンという過大な作業になります。"},
{"d":0,"q":"文書・画像・音声・動画が混在する大量の非構造データを、1 つのパイプラインで構造化インサイト (請求書の特定フィールド抽出など) に変換したいです。単一モダリティの低レイテンシ処理は別要件にありません。最も適切なサービスはどれですか。","c":["Amazon Textract を各モダリティに個別適用する","Amazon Bedrock Data Automation (BDA) をカスタムブループリント付きで使う","Amazon Rekognition で全モダリティを処理する","Converse API に全ファイルを直接渡す"],"a":1,"e":"BDA は非構造のドキュメント・画像・音声・動画を構造化インサイトに変換する非同期・大量処理向けサービスで、複数モダリティを 1 パイプラインで扱う場合に最も有利です。標準出力に加え、請求書の特定フィールド群のようなビジネス固有スキーマはカスタムブループリントで抽出します。単一モダリティ + レイテンシ重視なら Textract/Rekognition/Transcribe 等の専用サービス直用が適しますが、本問の要件はマルチモーダル一括です。"},
{"d":0,"q":"サポートチケットの返信草案を FM に生成させています。チケットの種類が非常に多く、固定の few-shot 例では関連しない例が混ざり、例を増やすと毎回の入力トークンが膨らみます。対応の型を示しつつトークン増を抑える最も適切な方法はどれですか。","c":["固定の例を 30 件に増やしてすべての型をカバーする","全対応パターンでファインチューニングする","ロール指示を詳細化して例をなくす","過去チケットの埋め込みをベクトルストアに保存し、新規チケットに類似した解決済み事例を数件検索して、その都度プロンプトに例として挿入する (動的 few-shot)"],"a":3,"e":"動的 few-shot は入力に合った手本だけをその都度検索して挿入するため、関連性が高く、必要な件数しか入れないのでトークン増も小さく済みます。A は毎回のトークンが大きく増え無関係な例も混ざり、C は社内の対応の型そのものを示せず、B は学習・評価・運用の手間に加えて手順変更のたびに再学習が必要です。"},
{"d":0,"q":"平均 4 語の短いクエリと平均 600 語の長いチャンクを同じ埋め込みモデルで処理しており、短いクエリの検索一致率が低いです。チャンク分割と検索経路は変更できず、再埋め込みは 1 回だけ許されます。最も適切な対処はどれですか。","c":["検索のたびにクエリを数百語に展開してから埋め込む","文書用とクエリ用の input_type (search_document / search_query) を使い分けられる埋め込みモデルに切り替え、全文書を一度だけ再埋め込みする","リランカーを追加して上位候補を並べ替える","ハイブリッド検索に切り替えて語の一致を併用する"],"a":1,"e":"非対称検索 (短いクエリ vs 長い文書) に対応するモデルは、input_type の指定で文書とクエリを別々に最適化した埋め込みにします。指定はモデルへの引数なのでチャンク分割も検索経路も不変で、再埋め込みは 1 回で済みます。A は検索ごとの生成呼び出しが増え、C は候補に入らなかった文書を救えず、D は 4 語のクエリでは一致語が少なく根本解決になりません。"},
{"d":0,"q":"既存の OpenSearch Service (2.9 以降) の商品インデックスに意味検索を追加します。アプリケーション側のコード変更を最小にし、取り込み時と検索時の埋め込み生成を自動化したいです。最も適切な方法はどれですか。","c":["アプリから InvokeModel で埋め込みを生成し、取り込みと検索の両方のコードを改修する","Bedrock Knowledge Bases に既存インデックスを接続する","ML コネクタで Bedrock の埋め込みモデルをリモートモデルとして登録し、取り込みパイプラインと neural クエリで埋め込み生成を自動化する","S3 Vectors に別のベクトルインデックスを構築する"],"a":2,"e":"OpenSearch 2.9 以降は ML コネクタで Bedrock の埋め込みモデルをリモートモデルとして登録でき、neural 検索では取り込みパイプラインが投入時に、neural クエリが検索時に埋め込みを自動生成します。アプリは従来どおり文書投入と検索を行うだけです。A は動くが両経路の改修が必要、B の KB は所定フィールド構成のインデックスへデータソースから取り込む仕組みで既存インデックスを流用できず、D は構成が大きく変わります。"},
{"d":0,"q":"Amazon Bedrock でファインチューニングしたカスタムモデルを単一リージョンで運用しています。リージョン障害時にも推論を継続できるようにする最も適切な事前対策はどれですか。","c":["クロスリージョン推論プロファイルにカスタムモデルの ARN を登録する","モデルコピー機能で別リージョンへ事前に複製し、コピー先で推論できる状態 (必要な提供スループット等) を整えておく","障害発生後に学習データから再ファインチューニングする","別アカウントにモデルを共有して冗長化する"],"a":1,"e":"カスタムモデルは既定では作成したリージョン (とアカウント) でしか使えませんが、モデルコピーで別リージョンへ複製できます。事前にコピーし、コピー先で使える推論方式を用意しておけば、障害時は呼び出し先の切り替えだけで済みます。クロスリージョン推論プロファイル (A) は基盤モデルの容量分散の仕組みでカスタムモデルの DR 用ではなく、事後の再学習 (C) は時間がかかり、アカウント共有 (D) はリージョンが変わらないため元リージョン障害に効きません。"},
{"d":0,"q":"自然言語から SQL を生成するモデルを改善したいのですが、入力と正解 SQL のペアはほとんど手元にありません。一方、生成された SQL を実際に実行して結果の正否を機械的に判定することはできます。最も適切なカスタマイズ手法はどれですか。","c":["教師ありファインチューニング (大量の正解ペアを人手で作成する)","モデル蒸留 (大型教師モデルの出力を例にする)","強化学習ファインチューニング — SQL を実行して正否を返す Lambda の報酬関数で学習させる","スキーマ文書での継続事前学習"],"a":2,"e":"強化学習ファインチューニングは正解ペアではなく、出力の質を採点する報酬関数で学習します。Bedrock では Lambda のカスタムコードを報酬関数にでき、SQL を実行して結果の正否を返すような「実行して検証できる」タスクに適合します。教師あり FT (A) は大量の正解ペアが前提、蒸留 (B) は教師モデル自身が不正確なら効果が限られ、継続事前学習 (D) は用語に慣れさせるだけで正しい結果を出す力を直接高めません。"},
{"d":0,"q":"GenAI 基盤の設計で Amazon Bedrock と Amazon SageMaker AI のどちらを使うか検討しています。選択の軸として最も適切な説明はどれですか。","c":["モデル能力の高い方を選ぶ。Bedrock のモデルは常に SageMaker で動かすモデルより高性能である","Bedrock を選べばサーバーレスなので評価・プロンプト設計・ガードレール設計などの運用責任もすべて AWS 側に移る","必要なインフラ制御の度合いで選ぶ。マネージド API で最小のインフラ管理なら Bedrock、学習・ホスティング・スケーリングまで細かく制御するなら SageMaker AI。両者は排他ではなく併用できる","ファインチューニングが必要な場合は SageMaker AI しか選べない"],"a":2,"e":"第一の設計判断は能力比較ではなく「インフラ制御がどれだけ必要か」です。事前学習済み FM をマネージド API で使うなら Bedrock、モデル・学習・ホスティング・スケーリングの制御が要るなら SageMaker AI で、汎用生成は Bedrock + ドメイン特化モデルは SageMaker という併用が典型です。Bedrock を選んでも評価・プロンプトと推論設定・ガードレール設計・データの責任は利用者に残り (B は誤り)、Bedrock 自体もファインチューニングに対応します (D は誤り)。"},
{"d":0,"q":"1 億件のベクトルを持つ OpenSearch インデックスを新しい埋め込みモデルへ移行します。全件の再埋め込みに 3 日かかりますが、その間も検索を止められず、移行後に精度が想定を下回れば即座に元へ戻せる必要があります。最も適切な方法はどれですか。","c":["既存インデックスに新モデルのベクトルを追記し、揃った時点で古い方を削除する","日ごとに置き換え済みの範囲から段階的に検索対象を移す","Route 53 で検索エンドポイントの宛先を移す","新しいインデックスを並行構築し、完了後にエイリアスの参照先を切り替える (問題があれば参照先を戻す)"],"a":3,"e":"エイリアスは検索の宛先を示す別名で、参照先の変更は不可分に行われるため、切り替えの瞬間に対象が欠けることも二重になることもありません。構築中はエイリアスが旧インデックスを指すので検索は無停止、巻き戻しは参照先を戻すだけです。A は新旧モデルのベクトルが混在して結果が一貫せず、C は DNS 層の切り替えで反映に遅延があり、B は変換済みと未変換で埋め込みが異なり検索の一貫性が崩れます。"},
{"d":0,"q":"連続して届くニュース記事を 1 分以内に意味検索できるようにする必要があります。Bedrock Knowledge Bases の取り込みジョブはデータソースごとに同時 1 実行の制約があり追いつきません。最も適切な構成はどれですか。","c":["Kinesis Data Streams で記事を受け、Lambda で埋め込みを生成して記事 ID をキーに OpenSearch のインデックスへ逐次書き込む","記事が届くたびに StartIngestionJob を実行する","毎晩のバッチ取り込みにまとめる","1 時間ごとに手動で同期を実行する"],"a":0,"e":"ストリーム処理 (Kinesis + Lambda) で記事を逐次埋め込み・書き込みすれば、届いた記事が数秒から数十秒で検索可能になり 1 分以内の要件を満たします。記事 ID をキーにすれば再処理時も冪等です。B は取り込みジョブの同時実行制約 (データソースごとに 1 つ) に阻まれて追いつかず、C と D は要件の時間粒度に達しません。"},
{"d":0,"q":"マルチテナント RAG で、テナント・法域・ポリシー版・有効日の境界を厳密に守る必要があります。境界の強制方法として正しい説明はどれですか。","c":["Bedrock Guardrails を設定すれば、ナレッジベースから取得される参照にも適用されて境界を守れる","ランキングの前にメタデータフィルタで適格文書だけに絞る。Guardrails はユーザー入力と生成応答に適用されるもので、取得された参照には適用されない","関連度ブーストで適格文書を上位に寄せれば不適格文書は実質除外される","ポリシー変更のたびにモデルを再学習して境界を反映する"],"a":1,"e":"境界の強制は取得の前段で行う必要があり、メタデータフィルタが検索対象自体を適格文書に限定します。Guardrails の適用範囲はユーザー入力と生成応答で、実行時に KB から取得された参照には適用されません (A は適用範囲の誤解)。ブースト (C) は並び替えにすぎず不適格文書を除外しません。RAG は問い合わせ時にコンテキストを取得する仕組みなので再学習 (D) は筋違いです。"},
{"d":1,"q":"Converse API を使うチャットアプリで 2 つの不具合が報告されています: (1) 長い回答が途中で切れているのに完結した回答として表示される、(2) モデルがツール呼び出しを要求したターンで空のメッセージが表示される。アプリ側の最も適切な修正はどれですか。","c":["temperature を下げて短い回答を生成させ、ツール利用を無効化する","max_tokens を十分大きな固定値にして、content の本文だけを常に表示する","ConverseStream に切り替えてトークンを逐次表示する","応答の stopReason を検査し、max_tokens なら続きを要求して結合、tool_use ならツールを実行して結果を返すよう分岐する"],"a":3,"e":"Converse の応答には停止理由 (stopReason) が含まれ、end_turn / max_tokens / tool_use などで後続処理を分岐するのが正攻法です。max_tokens は出力上限による打ち切りを示すので続きの生成を要求し、tool_use は本文が空でもエラーではなくツール実行の要求です。B は打ち切りと tool_use ターンを区別できず両方のバグが残ります。C は体感速度の改善であり切り捨て検知にはなりません。A は機能を失わせるだけです。"},
{"d":1,"q":"配送状況の問い合わせのうち約 2 割で、モデルが照会ツールを呼ばず自身の知識で推測回答してしまいます。ツールの宣言と実装は他機能と共用のため変更できず、他の種類の問い合わせの挙動も変えたくありません。最も適切な対応はどれですか。","c":["システムプロンプトに「必ずツールを使うこと」と追記する","配送状況の問い合わせと判定したリクエストに限り、Converse の toolChoice で該当ツールの呼び出しを強制する","temperature を 0 にして決定的な挙動にする","ツールの説明文を全問い合わせ向けに書き換える"],"a":1,"e":"toolChoice はリクエスト単位で「任意 (auto)」「いずれかのツール必須 (any)」「特定ツール必須 (tool)」を指定でき、該当リクエストだけに適用すれば他の問い合わせに影響しません。A のプロンプト指示は確率的で 2 割の取りこぼしがまさに残り、C の temperature はツール選択の保証にならず、D は共用のツール定義の変更にあたり他機能に影響します。"},
{"d":1,"q":"エージェントが天気・為替・在庫の 3 つの独立したツールを毎回順番に呼ぶため合計 3.7 秒かかり、応答要件の 2 秒を超えています。為替ツールは月に数 % 失敗しますが、その場合も残り 2 つの結果で応答する必要があります。最も適切な設計はどれですか。","c":["モデルが 1 回の応答で複数の toolUse を返せるようにし、ツール群を並行実行して各 toolResult を個別に返す（失敗分はエラーとして返す）","3 ツールを 1 つの複合ツールに統合する","Step Functions の Choice ステートでツールを 1 つに絞る","失敗する為替ツールをリトライ 5 回に設定する"],"a":0,"e":"ツール利用対応モデルは 1 ターンで複数の toolUse ブロックを返せ、アプリ側で並行実行すればレイテンシは最長の 1 ツール分に短縮されます。toolResult はツールごとに返すため、為替の失敗をエラーとして返せば残り 2 つの結果で応答を継続できます。B は一部失敗で全体が失敗し失敗分離の要件に反します。C は結果が 1 つになり要件を満たさず、D は遅延をさらに悪化させます。"},
{"d":1,"q":"ヘルプデスク回答の先頭に「ご質問ありがとうございます。ご説明いたします。」のような前置きが付き、画面の先頭に出すべき要点が押し出されます。システムプロンプトで前置きを禁止しても一定割合で残ります。追加の後処理を挟まずに最も確実に抑止する方法はどれですか。","c":["few-shot 例を 10 個に増やす","max_tokens を小さくして前置きが入る余地をなくす","temperature を 0 に設定する","messages の末尾に assistant ロールで回答の書き出し（例:「要点: 」）を部分的に与え、モデルにその続きから生成させる（プレフィル）"],"a":3,"e":"assistant メッセージの書き出しを与えるプレフィルは、応答がその文字列の続きとして生成されることを構造的に保証するため、前置きの混入を確実に防げます。プロンプト指示や few-shot (A) は確率的で取りこぼしが残り、B は回答本体まで切り詰め、C はばらつきを減らすだけで前置き自体の抑止にはなりません。"},
{"d":1,"q":"Bedrock Prompt Management で管理するプロンプトのバージョン ARN を Converse API の modelId に指定して呼び出したところ、400 ValidationError が返りました。コードでは inferenceConfig に temperature も渡しています。原因として最も可能性が高いものはどれですか。","c":["管理プロンプト使用時は推論設定がプロンプトリソース側に保持されるため、リクエストで inferenceConfig を併送してはならない","Converse は管理プロンプトに対応しておらず InvokeModel が必須","バージョン ARN ではなくドラフトのプロンプト ARN を渡す必要がある","管理プロンプトはストリーミング専用である"],"a":0,"e":"管理プロンプトを Converse で使う場合、温度などの推論設定はプロンプトリソース（バリアント）側に定義されており、リクエストに inferenceConfig を併せて渡すと ValidationError になります。Converse は管理プロンプトのバージョン ARN を modelId に渡す方式に対応しているため B と C は誤りで、本番利用では不変のバージョン ARN を使うのが正しい運用です。D のような制約はありません。"},
{"d":1,"q":"商品説明を 5 言語で生成するバッチで、価格・保証・仕様の 3 必須項目が言語によって欠けたり順序が入れ替わったりします。後段のシステムは 3 項目が固定の構造で揃っている前提で改修できません。最も確実な対策はどれですか。","c":["プロンプトに「必ず 3 項目を順番に出力」と各言語で明記する","出力を正規表現で検査し、欠落時は再生成する","3 項目を required としたスキーマ（inputSchema）を持つツールを定義し、ツール使用で構造化された値そのものを出力させる","言語ごとにファインチューニングしたモデルを用意する"],"a":2,"e":"ツール使用ではモデルの出力が宣言した JSON スキーマ（型・必須項目）に沿う引数として返るため、言語に関わらず構造が保証されます。プロンプト指示 (A) は確率的で多言語ではさらに揺れやすく、正規表現の再生成 (B) はコストと遅延が増えるその場しのぎ、ファインチューニング (D) は構造保証の仕組みではなく過剰投資です。"},
{"d":1,"q":"推論サービスのコンテナイメージが ECR にあり、ビルド工程なしで直接デプロイしたいのですが、1 リクエストの処理に最大 4 分かかります（応答開始までストリーミングもできません）。最も適切なホスティング先はどれですか。","c":["AWS App Runner","Amazon S3 の静的ホスティング","Lambda 関数 URL（バッファモード）","Amazon ECS (Fargate) + Application Load Balancer"],"a":3,"e":"App Runner は ECR のイメージをビルド工程なしで直接デプロイできる手軽さが利点ですが、リクエストタイムアウトが 120 秒のため 4 分の処理は収まりません (A)。ECS/Fargate + ALB ならコンテナをそのまま動かし、長いタイムアウトを設定できます (D)。Lambda は最大 15 分でも同期呼び出しのペイロード/ゲートウェイ制約と相性が悪く、バッファモードの関数 URL では応答待ちが長くなるだけです (C)。B は動的推論に使えません。"},
{"d":1,"q":"EKS 上で vLLM ベースの LLM 推論 Pod を動かします。GPU が必須で、ノードレベルの監視エージェントを DaemonSet として常駐させる要件もあります。どの実行基盤を選ぶべきですか。","c":["EKS on Fargate","App Runner","GPU 搭載の EC2 ノードグループに Pod をスケジュールする","Lambda コンテナイメージ"],"a":2,"e":"EKS の Fargate は GPU / Inferentia などのアクセラレーターを利用できず、DaemonSet・特権コンテナ・HostPort などもサポートしません (A は両要件とも不可)。GPU 推論と DaemonSet 常駐の両方を満たすのは EC2 ノードグループです (C)。App Runner (B) と Lambda (D) は Kubernetes ワークロードの実行基盤ではありません。"},
{"d":1,"q":"チームが SageMaker JumpStart から専有（プロプライエタリ）モデルをワンクリックでデプロイして検証しました。1 週間後、使っていないのに想定外の課金が続いていることに気づきました。この事象の原因と、デプロイ時に必要だった手続きの組み合わせとして正しいものはどれですか。","c":["デプロイは実インスタンスの SageMaker エンドポイントを作成し削除するまで課金が続く。専有モデルは AWS Marketplace のサブスクリプション／EULA 同意が必要","JumpStart はサーバーレスなので課金は発生しない。手続きも不要","課金は S3 のモデル保存のみ。EULA は不要","JumpStart モデルは 24 時間で自動削除されるため課金は一時的"],"a":0,"e":"JumpStart のデプロイは指定インスタンスタイプ上に実体のある SageMaker エンドポイントを作成するため、検証後に削除しない限り課金とリソースが残り続けます。また専有モデルは AWS Marketplace サブスクリプションや EULA の明示的な同意（SDK では accept_eula=True）が前提です。サーバーレス (B)、保存課金のみ (C)、自動削除 (D) はいずれも誤解です。"},
{"d":1,"q":"自社ホストする推論コンテナが、起動のたびに 48GB のモデル重みを外部サイトからインターネット経由でダウンロードしており、起動に 22 分かかるうえ外部サイト障害時はデプロイ自体が失敗します。社内基準でコンテナイメージは 10GB 以内です。最も適切な改善はどれですか。","c":["重みをコンテナイメージに焼き込む","重みを半分に量子化して外部ダウンロードを続ける","起動のたびに外部サイトの CDN を増強する","重みを S3 に配置し、起動時に S3 から高速ロードする（イメージとデータの分離）"],"a":3,"e":"大容量の重みはイメージではなく S3 に置き、起動時に同一リージョンの高帯域で読み込むのが定石です。外部依存が消えてデプロイの信頼性が上がり、イメージは 10GB 基準内に収まります。イメージ焼き込み (A) は基準違反かつビルド/配布が肥大化し、C は外部依存を残したままコストを増やし、B は依存と障害点が残ります。"},
{"d":1,"q":"SageMaker リアルタイムエンドポイント（LMI コンテナでホストする LLM）のチャット UI で、全文生成が終わるまで何も表示されず体感が悪いという苦情があります。生成中のテキストを順次表示するために呼び出し側が使うべき API はどれですか。","c":["InvokeEndpoint を 1 秒間隔でポーリングする","InvokeEndpointAsync で非同期化する","InvokeEndpointWithResponseStream を呼び、届いたチャンクを順次 UI に流す","ConverseStream を SageMaker エンドポイントに対して呼ぶ"],"a":2,"e":"SageMaker のストリーミングは InvokeEndpointWithResponseStream で行い、LMI などストリーミング対応コンテナから生成途中の断片を逐次受け取れます。InvokeEndpoint (A) は完了まで 1 応答で、ポーリングしても途中経過は取れません。InvokeEndpointAsync (B) は大容量・長時間ジョブ向けで逐次表示はできず、ConverseStream (D) は Bedrock の API であり SageMaker エンドポイントには使えません。"},
{"d":1,"q":"VPC にアタッチした Node.js Lambda 関数が最大 20MB の文書を生成します。要件は (1) 完了を待たず最初のテキストから順次受信する、(2) 通信はプライベートネットワーク経由にする、の 2 つです。正しい構成はどれですか。","c":["Lambda 関数 URL のストリーミングを有効化する","Lambda インターフェース VPC エンドポイント経由で InvokeWithResponseStream を呼ぶ","API Gateway REST API（バッファリング統合）を前段に置く","同期 Invoke で呼び、6MB ずつ分割して返す"],"a":1,"e":"Lambda 関数 URL は VPC アタッチ関数のレスポンスストリーミングをサポートしないため A は不可です。InvokeWithResponseStream API 自体は利用でき、Lambda のインターフェース VPC エンドポイント経由で呼べばプライベート経路とストリーミング（最大 200MB）を両立できます (B)。REST API のバッファリング統合 (C) は逐次配信にならず、同期 Invoke (D) は 6MB のペイロード上限と分割の複雑さを抱えます。"},
{"d":1,"q":"CloudFront 配下の GenAI アプリで、リクエストヘッダーに応じて推論オリジンを振り分ける軽量ロジックを Lambda@Edge で実装します。Lambda@Edge の制約として正しいものはどれですか。","c":["任意のリージョンで作成でき、$LATEST を関連付けられる","VPC 接続とコンテナイメージをサポートする","us-east-1 で番号付き公開バージョンを作成する必要があり、VPC 接続不可・サイズ/実行時間の制約があるため、重い推論ではなくヘッダー検査やルーティングに使う","推論 API の代替としてフル推論を実行するのが推奨"],"a":2,"e":"Lambda@Edge は us-east-1 で作成した番号付き公開バージョンのみ関連付け可能で（$LATEST/エイリアス不可）、VPC 接続・コンテナイメージ・大きなペイロードは使えず実行時間も制限されます。したがって適所は重い推論を行うオリジンの前段でのヘッダー検査・ルーティング・軽量な整形です。A・B・D はいずれも制約に反します。"},
{"d":1,"q":"API Gateway REST API の背後の Lambda が長時間の生成ジョブを開始します。クライアントには即時に 202 を返し、Lambda は非同期で実行させたいです。カスタム（非プロキシ）統合での正しい設定はどれですか。","c":["統合リクエストのヘッダー X-Amz-Invocation-Type に静的値 'Event' を設定する","Lambda のタイムアウトを 15 分に設定する","API Gateway の統合タイムアウトを無効化する","クライアント側で fire-and-forget にして応答を読まない"],"a":0,"e":"カスタム統合では統合リクエストのヘッダーマッピングで X-Amz-Invocation-Type: 'Event'（リテラルは引用符付き）を指定すると Lambda が非同期起動され、API Gateway は即座に応答を返せます。B は同期のままタイムアウト上限も解決せず、C の統合タイムアウト無効化はできず、D は接続・再送の問題を残すだけです。"},
{"d":1,"q":"リージョナル REST API の背後で動く推論処理が 60〜90 秒かかり、API Gateway のタイムアウト（29 秒）で切断されます。アーキテクチャを変えずに対処する方法として正しいものはどれですか。","c":["エッジ最適化 API に変更する","Lambda 予約同時実行数を増やす","29 秒は全 API タイプで固定のため変更不可","Service Quotas で「統合の最大タイムアウト」の引き上げを申請する（リージョナル/プライベート API で可能）"],"a":3,"e":"統合タイムアウトの既定は 29 秒ですが、リージョナルおよびプライベート REST API では Service Quotas から上限引き上げを申請できます（エッジ最適化は不可のため A は逆方向）。C は旧情報で、現在は調整可能なクォータです。B の同時実行数はタイムアウトとは無関係です。なお根本的にはストリーミングや非同期化も検討対象です。"},
{"d":1,"q":"GraphQL (AppSync) ベースのアプリに 2 つの GenAI 機能を追加します: (1) 数秒で終わる短いキャッチコピー生成、(2) 1〜2 分かかる長文レポート生成。それぞれの適切な統合はどれですか。","c":["両方とも AppSync の Bedrock データソースで同期的に解決する","(1) は AppSync の Bedrock データソースで同期解決、(2) は Lambda で非同期実行しサブスクリプション（ミューテーション発火）で完了を配信","両方とも ConverseStream を AppSync リゾルバーから直接ストリーミングする","両方とも Step Functions Express に委譲する"],"a":1,"e":"AppSync の Bedrock データソースは短時間（目安 10 秒以内）の同期呼び出し向きで、キャッチコピー生成に適します。一方 AppSync はストリーミング API を呼べないため、長時間処理は Lambda などで非同期実行し、進捗/完了をミューテーション経由でサブスクリプションに発火させて配信します。A は長時間処理でタイムアウトし、C は AppSync の制約上不可、D は配信経路の答えになっていません。"},
{"d":1,"q":"AppSync で推論の進捗を配信しています。購読側は subscription で status と tokenCount を要求していますが、実際の通知には jobId しか含まれません。原因はどれですか。","c":["サブスクリプションの認可設定が不足している","WebSocket のペイロード上限を超えている","通知に含まれるフィールドは発火側ミューテーションの選択セットで決まるため、ミューテーション呼び出しの選択セットに status と tokenCount を含める必要がある","サブスクリプションは 1 フィールドしか配信できない"],"a":2,"e":"AppSync のサブスクリプション通知に入るデータは、発火元ミューテーションの「選択セット」に含まれるフィールドで決まります。購読側がいくら要求しても、バックエンドが publish ミューテーションを呼ぶ際の選択セットに status と tokenCount を含めなければ届きません。認可 (A) なら接続自体が失敗し、B・D のような制約は該当しません。"},
{"d":1,"q":"契約プラン（Basic は小型モデル、Premium は高性能モデル）に応じて呼び出すモデルを変えます。プラン情報はリクエストボディで自己申告させてはならず、改ざんできない出所から取る必要があります。API Gateway での最も適切な実装はどれですか。","c":["リクエスト JSON の plan フィールドで分岐する","User-Agent ヘッダーでプランを判定する","クライアント SDK にプラン別のモデル ID を埋め込む","Lambda オーソライザーが認証時にプランを解決してコンテキストとして返し、統合側で $context.authorizer 経由の値を使ってモデルを選択する"],"a":3,"e":"Lambda オーソライザーは認可ポリシーと一緒に任意のコンテキスト値を返せ、統合リクエスト側で $context.authorizer.* として参照できます。認証と同時にサーバー側でプランを解決するため改ざん不能です。リクエストボディ (A)、クライアント埋め込み (C)、ヘッダー (B) はいずれも利用者が自由に書き換えられるため、課金/能力の境界を委ねてはいけません。"},
{"d":1,"q":"世界中のモバイルアプリから呼ばれる推論 API を 2 リージョンの ALB で提供します。要件は (1) クライアント設定に固定 IP を登録したい、(2) リージョン障害時はヘルスチェックに基づき自動で健全側へ振り替える、(3) リクエストは動的 POST でキャッシュは効かない、の 3 つです。最も適切なサービスはどれですか。","c":["CloudFront","Route 53 レイテンシールーティングのみ","AWS Global Accelerator（エンドポイントに各リージョンの ALB を登録）","各リージョンに NAT ゲートウェイを追加"],"a":2,"e":"Global Accelerator は静的なエニーキャスト IP を提供し、AWS グローバルネットワーク経由でヘルスベースのリージョン間ルーティングを行うため、3 要件をすべて満たします。CloudFront (A) はキャッシュ/HTTP 配信の層で固定 IP を提供せず、Route 53 のみ (B) は DNS キャッシュによりフェイルオーバーが遅延し固定 IP 要件も満たしません。D は無関係です。なお全エンドポイントが異常になった場合、GA はトラフィックを破棄せず全エンドポイントへ送ります。"},
{"d":1,"q":"EventBridge ルールで GenAI 処理の完了イベントを複数システムへ配信しています。先週、ターゲットの 1 つが長時間ダウンし、復旧後にイベントの一部が失われていたことが判明しました。EventBridge の特性と対策の説明として正しいものはどれですか。","c":["EventBridge は無期限に再試行するため、イベントは失われないはず","配信の再試行（既定で最大約 24 時間）を使い切るとイベントは破棄されるため、ターゲットごとに DLQ（SQS）を設定して失敗イベントを退避・再処理する。また EventBridge は順序を保証しない","ルールを 2 つに複製すれば喪失は防げる","FIFO イベントバスに変更して順序と再配信を保証する"],"a":1,"e":"EventBridge のターゲット配信は指数バックオフで既定最大 24 時間/185 回再試行され、それを使い切るとイベントは破棄されます。ターゲットに SQS の DLQ を設定すれば失敗イベントを保全し、後で再処理できます。また EventBridge は順序保証がないため、順序依存の下流は別途設計が必要です。A は誤り、C は重複配信を増やすだけ、D の FIFO イベントバスは存在しません。"},
{"d":1,"q":"外部 SaaS（EventBridge 対応パートナー）でチケットが作成されるたびに、社内の FM 要約パイプラインを起動します。受信用の公開エンドポイントの運用やポーリングは避けたい要件です。最も適切な統合はどれですか。","c":["SaaS から Webhook を受ける公開 API を立てる","SaaS の REST API を 1 分間隔でポーリングする","S3 へのエクスポートを夜間バッチで取り込む","パートナーイベントソースを受け入れてパートナーイベントバスに関連付け、チケット作成イベントのルールでパイプラインを起動する"],"a":3,"e":"EventBridge 対応 SaaS はパートナーイベントソースとしてイベントを直接 EventBridge へ送信できます。アカウント側でソースを受け入れてイベントバスに関連付け、ルールで処理を起動すれば、公開エンドポイントもポーリングも不要です。A は運用・セキュリティ負担が増え、B はレイテンシとレート制限の問題、C はリアルタイム性を失います。"},
{"d":1,"q":"注文変更イベントを FM で処理して基幹システムへ登録します。同じ注文のイベントが順序を入れ替えて処理されると古い内容で上書きされる一方、異なる注文同士は互いを待たずに並行処理したい要件です。最も適切な構成はどれですか。","c":["SQS 標準キュー + 冪等性キー","EventBridge ルールで直接配信する","1 本の FIFO キューに単一のグループ ID で全件直列化","注文 ID を MessageGroupId にした SQS FIFO キュー"],"a":3,"e":"FIFO キューはメッセージグループ内でのみ厳密な順序を保証し、グループ間は並行処理できます。注文 ID を MessageGroupId にすれば「同一注文は到着順・異なる注文は並行」が正確に実現します。標準キュー (A) は順序保証がなく冪等性キーでは順序逆転の上書きを防げません。単一グループ (C) は全体が直列化されスループットを失い、EventBridge (B) は順序を保証しません。"},
{"d":1,"q":"SQS FIFO のメッセージグループで口座単位の操作列を処理しています。各操作は直前の操作の成功を前提とします。失敗メッセージの扱いとして最も適切なものはどれですか。","c":["maxReceiveCount=3 の DLQ を設定して失敗分を退避する","このグループには DLQ を使わず、先頭の失敗が解消されるまでグループの処理を意図的に停止させたままにする","失敗メッセージを標準キューへ転送して並行処理する","可視性タイムアウトを 0 にして即時再配信する"],"a":1,"e":"DLQ は失敗メッセージをグループから抜き取るため、FIFO の順序保証が静かに崩れ、後続操作が「前提の欠けた状態」で実行されてしまいます。操作列が順序依存のグループでは、あえて DLQ を付けず先頭の失敗で処理を止め、修復後に続行するのが正しい設計です。A・C は順序破壊、D はリトライ暴走を招きます。"},
{"d":1,"q":"SQS から受けた 1 件の処理（大型文書群の FM 解析）が最長 16 時間かかります。ワーカーは可視性タイムアウトを延長し続ける実装ですが、時々同じメッセージが別ワーカーに再配信されます。原因と正しい対処はどれですか。","c":["可視性タイムアウトは最初の受信から合計 12 時間を超えて延長できないため。処理を小さな単位に分割するか、Step Functions で長時間ワークフローとして管理する","ロングポーリングを有効にすれば解決する","DLQ の maxReceiveCount を増やせば再配信は止まる","FIFO キューに変更すれば再配信されない"],"a":0,"e":"SQS の可視性タイムアウトは延長できるものの、最初の受信から累計 12 時間が上限です。それを超える処理は 1 レシートで抱え込まず、作業を分割するか Step Functions（Standard）で状態管理します。ロングポーリング (B) は空受信の削減、maxReceiveCount (C) は DLQ 移動条件、FIFO (D) は順序の話で、いずれも 12 時間上限とは無関係です。"},
{"d":1,"q":"契約レビューのワークフローは最長 3 週間実行され、補償ステップを含み、.waitForTaskToken で弁護士の承認コールバックを待ち、監査用に実行履歴の保全が必要です。選ぶべきワークフロータイプと理由はどれですか。","c":["Express — 低コストで高スループットだから","Express 非同期 — at-least-once でも監査要件は満たせるから","Standard — 最長 1 年の実行、exactly-once のセマンティクス、タスクトークンのコールバック対応、耐久的な実行履歴を備えるから","どちらでもよい — タイプは実行ごとに切り替えられるから"],"a":2,"e":"Standard ワークフローは最長 1 年実行・exactly-once・.waitForTaskToken / .sync・耐久的で監査可能な実行履歴を備え、長期間の承認待ちと補償を含む本件に適合します。Express は最長 5 分・（非同期は）at-least-once でトークンコールバック非対応のため A・B は不可。ワークフロータイプはステートマシン作成時に固定され実行ごとに変えられないため D も誤りです。"},
{"d":1,"q":"エージェントの注文キャンセル処理は、在庫引当の解除 → 返金 → 配送手配の取消を独立した 3 つの外部システムへ順に書き込みます。途中で失敗した場合は完了済みの操作を取り消して整合を保ち、進行状況も追跡する必要があります。最も適切な実装はどれですか。","c":["3 つの書き込みを 1 つの Lambda で実行し、失敗したら例外を投げる","DynamoDB トランザクションで 3 システムをまとめて更新する","Step Functions で各書き込みをステートにし、失敗時は完了済みステートに対応する補償ステート（取り消し処理）へ遷移するサガパターンを実装する","3 システムへ同時に書き込み、失敗したものだけ再試行する"],"a":2,"e":"独立した外部システムに跨る処理は分散トランザクションにできないため、サガパターンで各ステップに補償（取り消し）処理を定義し、Step Functions の Catch で失敗時に補償へ遷移させます。実行履歴で進行状況も追跡できます。単一 Lambda (A) は部分完了の取り消しと再開ができず、DynamoDB トランザクション (B) は自社テーブルにしか効かず、同時書き込み + 再試行 (D) は「全成功か全取り消し」を保証しません。"},
{"d":1,"q":"1 件の入力を Step Functions の Parallel ステートで 4 つの下流分析（要約・分類・感情・エンティティ）に同時に配っています。現在は 1 ブランチの失敗で実行全体が失敗し、成功した 3 つの結果まで捨てられます。成功分を活かしつつ失敗を記録する正しい方法はどれですか。","c":["各ブランチ内に Retry/Catch を設け、失敗ブランチはエラー情報を正常な出力形式で返して集約側で成功/失敗を判別する","Parallel をやめて 4 回直列実行する","ステートマシン全体を 2 回実行して差分を取る","失敗ブランチを Map ステートに変更する"],"a":0,"e":"Parallel ステートは 1 ブランチの未捕捉エラーで全体が失敗します。各ブランチの内側で Catch してエラーを構造化された出力として返せば、実行は継続し、後段で成功 3 件 + 失敗 1 件として扱えます。直列化 (B) はレイテンシを 4 倍にし、再実行 (C) は無駄で非決定的、Map (D) は同種処理の反復用でありエラー分離の答えではありません。"},
{"d":1,"q":".waitForTaskToken で人間のレビューを待つ Step Functions ワークフローで、承認者が本文を修正してから承認するケースがあります。修正後の本文と差分を後続ステートと長期分析の両方で利用できるようにする正しい実装はどれですか。","c":["承認画面が SendTaskSuccess を呼ぶ際の output に修正後本文と差分を含める（output は次のステートの入力になる）。あわせて DynamoDB 等に記録する","SendTaskSuccess は出力を持てないため、修正は別 API で通知する","SendTaskFailure で差し戻してから再実行する","修正はステートマシンの実行名に埋め込む"],"a":0,"e":"タスクトークンのコールバックでは、SendTaskSuccess の output JSON がそのまま待機ステートの出力 = 次ステートの入力になります。承認 UI から修正後本文と差分を output に含めれば後続処理で直接使え、長期分析用にはあわせて永続化します。B は誤り（output は第一級の引数）、C は正常系の承認フローを壊し、D は実行名の用途・サイズに反します。"},
{"d":1,"q":"エージェントに「社内 FAQ 検索」と「Web 検索」の 2 ツールを渡していますが、どちらの説明文も「情報を検索する」とだけ書かれており、モデルが誤ったツールを選ぶ事例が頻発しています。最も効果的な改善はどれですか。","c":["より大型のモデルに変更する","各 toolSpec の説明文に、対象データ・使うべき場面・戻り値・引数の意味と具体例を明確に書き分ける","ツールを 1 つに統合してモデルの選択をなくす","temperature を 0 にする"],"a":1,"e":"モデルはツール名・説明文・入力スキーマだけを根拠にツールを選びます。説明が同文なら区別のしようがなく、対象範囲・適用場面・戻り値・引数例を書き分けるのが最も直接的で効果的な対策です。モデル変更 (A) は根拠不足を解消せず、統合 (C) は社内/Web の使い分け要件自体を失い、temperature (D) は選択の正しさを保証しません。"},
{"d":1,"q":"エージェントのツールが呼ぶ社内集計処理は完了まで 30〜40 分かかります。ツールの同期実行はタイムアウトし、エージェントの対話もブロックされます。最も適切なツール設計はどれですか。","c":["ツール Lambda のタイムアウトを 60 分に設定する","エージェントに 40 分待つよう指示する","「ジョブを開始して ID を返すツール」と「ID で状態・結果を取得するツール」に分割し、処理本体は Step Functions 等で非同期実行する","集計を毎回事前計算しておく"],"a":2,"e":"長時間処理は「開始」と「結果取得」の 2 ツールに分けるのが定石です。開始ツールは即座にジョブ ID を返し、本体は Step Functions などで非同期に実行、エージェントや利用者は後から状態確認ツールで結果を取得します。Lambda の最大実行時間は 15 分のため A は実現不能、B は UX とタイムアウトの問題を放置、D はアドホックな集計要求には適用できません。"},
{"d":1,"q":"Strands Agents で構築したエージェント群に、(1) すべてのツール呼び出しの入力から口座番号をマスクして監査ログに記録、(2) 営業時間外は発注系ツールの実行をブロック、という横断的な制御を個々のツール実装を変えずに追加します。使うべき仕組みはどれですか。","c":["各ツール関数の先頭に共通コードをコピーする","システムプロンプトで「営業時間外は発注しない」と指示する","Strands のフック（例: BeforeToolCall などライフサイクルイベントへのハンドラー）でツール呼び出しを横取りし、マスク・記録・ブロックを一元実装する","ツールごとに別エージェントを作る"],"a":2,"e":"Strands Agents のフックはエージェントのライフサイクルの決まった時点（ツール呼び出し前後など）に処理を差し込む仕組みで、マスキング・監査・時間帯ブロックのような横断的関心事を一箇所で実装できます。コードコピー (A) は保守不能、プロンプト指示 (B) は強制力がなく、エージェント分割 (D) は問題を分散させるだけです。"},
{"d":1,"q":"マルチエージェント協調で、請求・技術・契約の 3 コラボレーターを持つスーパーバイザーを構成します。問い合わせの大半は 1 つのコラボレーターだけで完結し、結果の統合は不要で、レイテンシを最小化したい要件です。適切な協調モードはどれですか。","c":["SUPERVISOR — 全コラボレーターに問い合わせて回答を統合する","SUPERVISOR_ROUTER — 選択したコラボレーターに転送し、その応答をそのまま最終応答として返す","コラボレーターを 1 つに統合する","ラウンドロビンで均等に振り分ける"],"a":1,"e":"SUPERVISOR_ROUTER は適切なコラボレーターを選んで要求を転送し、その応答を変更せず最終応答にするため、統合が不要な場合にレイテンシを最小化できます。SUPERVISOR (A) は複数コラボレーターの結果を統合する分オーバーヘッドが増え、本件では不要です。統合エージェント (C) は専門分化の利点を失い、ラウンドロビン (D) は内容を見ない振り分けで誤配します。なおルーティング精度のため各コラボレーターの説明は具体的かつ重複なく書きます。"},
{"d":1,"q":"エージェントに 2 つの能力を追加します: (1) API が提供されていない社内 Web アプリの画面操作（フォーム入力・クリック）による予約処理、(2) アップロードされた表データの正確な集計。それぞれに使う AgentCore コンポーネントの組み合わせとして正しいものはどれですか。","c":["(1) Code Interpreter、(2) Browser","両方とも Memory で実現する","両方とも Gateway で実現する","(1) Browser（マネージドな隔離ブラウザセッションで画面操作）、(2) Code Interpreter（サンドボックスでコードを実行して計算）"],"a":3,"e":"AgentCore Browser は隔離されたマネージドブラウザ環境でページ遷移・入力・クリックなどの画面操作をエージェントに行わせるコンポーネントで、API のないサイトの操作に適します。Code Interpreter はサンドボックスでコードを生成・実行させ、集計や分析を推測ではなく実行結果で返します。なお Browser の VPC モードはプライベート IP のみ付与されるため、外部サイトへはプライベートサブネット + NAT 経由で出す必要があります。Gateway はツール公開、Memory は記憶の仕組みで用途が異なります。"},
{"d":1,"q":"エージェントが利用者に代わって外部 SaaS（カレンダー等）へアクセスします。要件は (1) 各利用者が明示的に同意した範囲のデータだけにアクセスする、(2) 利用者ごとの外部トークンを安全に保管・再利用する、の 2 つです。最も適切な仕組みはどれですか。","c":["SaaS の管理者 API キーを Secrets Manager に 1 つ保管して全利用者に使う","AgentCore Identity で OAuth 2.0 認可コードグラント（3LO）を使い、利用者が同意したスコープのトークンをトークンボールトに利用者ごとに保管して利用する","利用者のパスワードを預かってエージェントがログインする","クライアントクレデンシャルグラントで共通トークンを取得する"],"a":1,"e":"利用者単位の同意に基づく委任アクセスは OAuth 2.0 認可コードグラント（3-legged OAuth）で実現し、AgentCore Identity は取得したトークンを利用者ごとにトークンボールトで安全に保管・再利用します。管理者キーの共用 (A) や共通トークン (D) は全員のデータに等しくアクセスできてしまい同意範囲の要件に反し、パスワード預かり (C) は重大なアンチパターンです。"},
{"d":1,"q":"(1) 単一チームが使う、信頼済みの社内 MCP サーバー 1 台への接続、(2) 複数チームのエージェントが共有する数十の API / Lambda 群を、集中認証・アクセス制御・ポリシー適用付きのツール面として公開、という 2 つの要件があります。適切な使い分けはどれですか。","c":["両方とも AgentCore Gateway を必ず経由させる","両方とも直接のリモート MCP 接続にする","(1) は直接のリモート MCP 接続で十分、(2) は AgentCore Gateway でターゲット群を MCP ツールとして公開し、認証とポリシーを一元化する","(1) は Gateway、(2) は直接接続"],"a":2,"e":"単純で信頼できる単一エンドポイントへの接続は直接のリモート MCP 接続で足り、Gateway を挟む必然性はありません。一方、多数のツールを複数チームで共有し、認証・集中アクセス制御・ポリシー適用が要る場合は AgentCore Gateway が API / Lambda / MCP サーバーを統治されたツール面として公開する適所です。A は小規模要件に過剰、B・D はガバナンス要件を満たしません。"},
{"d":1,"q":"アカウント A にある Bedrock Knowledge Base（Customer-managed / VECTOR 型）を、アカウント B のアプリから Retrieve で検索させたい要件があります。正しい実現方法はどれですか。","c":["アカウント A に Retrieve を許可した IAM ロールを作成し、アカウント B のアプリがそのロールを AssumeRole して呼び出す","KB にリソースベースポリシーを付与してアカウント B を許可する","KB をパブリック公開に設定する","ベクトルストアのデータを B へ毎日コピーする"],"a":0,"e":"Customer-managed（VECTOR 型）の Knowledge Base はリソースベースポリシーに対応していないため、B の方式は使えません（対応するのは Managed KB のみ）。クロスアカウント利用は、KB のあるアカウント側に Retrieve を許可したロールを用意し、呼び出し側がそのロールを引き受ける標準パターンで実現します。パブリック公開 (C) は不可能かつ論外、データ複製 (D) は同期と重複管理の問題を生みます。"},
{"d":1,"q":"Amazon Connect のエージェント型セルフサービス（音声）で解決できなかった請求問題を人間のオペレーターへ引き継ぎます。顧客に最初から説明し直させないための正しい実装はどれですか。","c":["通話を切断して折り返し電話にする","Escalate の Return-to-Control ツールを呼んでフローに制御を戻し、理由・会話要約・意図・感情をコンタクト属性に設定してからキューへ転送する","オペレーターに録音を最初から聞かせる","顧客に要約をメールで送らせる"],"a":1,"e":"エージェント型セルフサービスには Complete と Escalate の Return-to-Control ツールがあり、呼び出すとコンタクトフローへ制御が戻ります。エスカレーション時は理由・会話要約・顧客の意図・感情を構造化してコンタクト属性に渡してからキュー転送するのが定石で、受けた人間は続きから対応できます。A・C・D は顧客体験と処理時間を悪化させる回避策に過ぎません。"},
{"d":1,"q":"経理部門が請求書処理を自動化します。要件は、中央管理で所有されること、大量・長時間のバッチ実行、フロー制御とエラー処理、例外のみ指名レビュアーが承認するヒューマンインザループ、です。個人の短時間自動化ではありません。最も適切な選択はどれですか。","c":["Quick Automate を使い、ヒューマンインザループのタスクにリゾルバー（担当者）を割り当てる","Quick Flows で各担当者が個人フローを作る","チャットでその都度依頼する","Q Business の新規アプリとして構築する"],"a":0,"e":"短時間・個人/チーム規模の自動化は Quick Flows、中央管理・長時間/大量実行・フロー制御・ケース管理・エラー処理・カスタムコードが要る業務プロセスは Quick Automate という使い分けです。Automate は自動化プラン内に人間のレビュー/承認タスクを作ってリゾルバーを割り当てられ、例外時のみ人を挟む要件に合致します (A)。B は統制要件に反し、C は自動化ではなく、Q Business (D) は新規顧客受付を終了しており新規構築には Quick が推奨です。"},
{"d":1,"q":"S3 に保存された動画から不適切コンテンツを検出するパイプラインを作ります。範囲が明確に定まったこの種のタスクに汎用 FM より安価な特化サービスを使い、完了を効率よく検知する構成はどれですか。","c":["動画フレームを 1 枚ずつ FM に渡して判定する","動画を Bedrock バッチ推論に直接投入する","Get 系 API を 1 秒間隔でポーリングする","Rekognition の StartContentModeration で非同期ジョブを開始し、完了を SNS 通知で受けて Get 系 API で結果を取得（NextToken でページング）する"],"a":3,"e":"範囲の決まったコンテンツモデレーションは、用途特化の Rekognition が汎用 FM より高速かつ大幅に安価です。保存動画の分析は Start 系 API で非同期ジョブを開始 → SNS が完了を通知 → Get 系 API で結果取得（複数ページは NextToken で辿る）という契約で設計します。フレーム分割 FM (A) はコスト過大、ポーリング (C) は非効率、Bedrock バッチ (B) は動画モデレーション向けの仕組みではありません。低信頼度の判定だけ人間のレビューに回すとさらに効率的です。"},
{"d":1,"q":"窓口アプリで、来店客が提出する 1 ページの申請書（表と手書き項目を含む）からその場で低レイテンシに項目を抽出します。一方、夜間には PDF・画像・音声が混在する大量の申請書類一式を構造化するバッチもあります。適切なサービスの使い分けはどれですか。","c":["両方とも Bedrock Data Automation","その場の抽出は Textract の同期 API（AnalyzeDocument: フォーム/テーブル）、夜間のマルチモーダル大量処理は Bedrock Data Automation","両方とも Textract の非同期 API","その場の抽出は Titan Image Generator"],"a":1,"e":"単一ページの帳票から低レイテンシで項目・表・手書きを抽出するなら Textract の同期 AnalyzeDocument（フォーム/テーブル分析）が適所です。一方、PDF・画像・音声が混在する大量・非同期の構造化は Bedrock Data Automation の守備範囲です。BDA をその場の 1 枚に使う (A) のは非同期前提でレイテンシ要件に合わず、非同期 Textract (C) は窓口の即時性を損ない、Titan Image Generator (D) は画像生成サービスで抽出には使えません。"},
{"d":1,"q":"GenAI パイプラインの出力 JSON を 4 つのチームの基幹システムが取り込みます。項目名や型の想定が文書共有のみで、構造変更のたびに取り込み失敗と原因調査が発生しています。古いバージョンのイベントを読む長寿命コンシューマーも残っています。最も適切な対策はどれですか。","c":["スキーマを README に記載してレビューを義務化する","AWS Glue Schema Registry にスキーマを登録し、互換モード（過去全バージョンと互換にするなら BACKWARD_ALL）の検証下でバージョン管理する","全チームに同じパーサーライブラリを配布する","JSON をやめて CSV に変更する"],"a":1,"e":"チーム間の構造契約は Glue Schema Registry で一元管理し、登録時に互換モードで検証するのが定石です。全過去バージョンのイベントを読み続けるコンシューマーがいる場合は BACKWARD_ALL を選び、互換を壊す変更を登録段階で拒否できます。文書やレビュー (A) は強制力がなく、共通パーサー (C) は契約自体のバージョン管理を解決せず、CSV 化 (D) は型情報をむしろ失います。"},
{"d":2,"q":"マルチテナントの RAG アプリで、Bedrock Knowledge Bases のメタデータフィルタ (tenant_id) により他テナント文書の取得を防いでいます。セキュリティレビューで「このフィルタがコンプライアンス境界として成立する条件」を問われました。正しい説明はどれですか。","c":["フィルタ値がクライアントから渡されたリクエストパラメータであれば十分である","フィルタ値が認証済み ID と認可コンテキストからサーバー側で導出されている場合に限り境界として機能する","Guardrails を併用すればフィルタ値の出所に関係なく境界になる","ベクトル類似度が高い文書はフィルタを通過するため境界にはなり得ない"],"a":1,"e":"メタデータフィルタは検索のランキング前に適用され対象外文書を候補から排除できますが、境界になるのはフィルタ値を利用者が操作できない場合だけです。クライアント指定 (A) なら改ざんでき境界になりません。Guardrails (C) はコンテンツ安全層でありアクセス制御の代替ではありません。D は誤り — フィルタはランキング前に適用されるため、意味的に近くても対象外文書は候補に現れません。"},
{"d":2,"q":"複数子会社で共有する Knowledge Base で、「利用者は自社テナントかつ自分の管轄の現行版ポリシーだけを取得できる」ことを厳格に保証する必要があります。関連度の調整も行いたいです。アクセス境界の実装として正しいのはどれですか。","c":["クエリ文字列に「英国の現行ポリシーのみ」とテナント名を含めて検索させる","関連度チューニング (ブースト) で対象外文書のスコアを十分下げれば境界として扱える","テナント・管轄・版・発効日はメタデータフィルタで候補集合から排除し、関連度の調整はその後のブースト/リランクで行う","リランカーモデルに管轄要件をプロンプトで指示する"],"a":2,"e":"厳格な適格性境界 (テナント・管轄・版・発効日) はランキング前に働くメタデータフィルタに置きます。ブースト/リランク (B, D) は既に適格な候補の並べ替えであり、スコアが低くても対象外文書が候補に残るため境界になりません。クエリ文字列への混ぜ込み (A) は曖昧な意味一致で強制力がありません。"},
{"d":2,"q":"12 万件の報告書は 1 ファイル内に「公開可の概要」と「機密の付録」を含みます。概要は全社員、付録は研究部門だけに検索させたいですが、ファイル単位の機密度管理では概要まで隠れてしまいます。保管容量も増やしたくありません。最も適切な方法はどれですか。","c":["全ファイルを複製し、概要のみ版と全文版の 2 つの Knowledge Base を作る","取り込み時にセクション単位で分割し、チャンクごとに機密度メタデータを付与して検索時に利用者権限でフィルタする","付録の内容を Guardrails の拒否トピックに登録する","概要だけを再執筆した要約文書を別途生成して取り込む"],"a":1,"e":"機密度はファイル単位でなくチャンク単位のメタデータ属性として持たせれば、同じ文書の概要チャンクは全社員に、付録チャンクは研究部門だけに返せます。複製 (A, D) は容量要件に反し運用も二重化します。拒否トピック (C) は話題の遮断であり、文書内の部分的なアクセス制御はできません。"},
{"d":2,"q":"病院の RAG で、一般の院内規程と患者情報を含む診療記録が同じベクトルインデックスに同居しています。診療記録だけ保管時の暗号化鍵とアクセス権を強化したい一方、一般規程の検索経路は変えたくありません。どうしますか。","c":["インデックス全体の暗号化鍵をより強い鍵に替える","同一インデックスのまま、診療記録チャンクに「機密」タグを付けて Guardrails でブロックする","診療記録を別インデックス (別 Knowledge Base) に分離し、専用の KMS カスタマーマネージドキーと限定した IAM アクセスを設定する","診療記録の取り込みをやめ、必要時にモデルの一般知識で回答させる"],"a":2,"e":"暗号化鍵とアクセス権という保管レベルの統制を区分ごとに変えるには、ストア自体を分離するのが確実です。別インデックスなら診療記録側だけ専用 CMK と限定 IAM を適用でき、一般規程側は無変更で済みます。B は保管の統制にならず、A は全体に同じ鍵で要件未達、D は業務要件を失い幻覚リスクも生みます。"},
{"d":2,"q":"本番の問い合わせデータを開発環境に複製して GenAI 機能を開発します。要件は (1) 開発者に実名・電話番号を見せない、(2) 文体や傾向は保つ、(3) 同一顧客の複数の問い合わせを横断して追跡できる、の 3 つです。最も適切な処理はどれですか。","c":["PII を一律に「***」へ置換する","PII を検出し、同じ値が常に同じ仮名になる決定的な仮名化で置換してから複製する","開発者全員に本番データへの読み取り権限を付与し NDA を結ぶ","問い合わせ本文を LLM で要約してから渡す"],"a":1,"e":"決定的な仮名化なら同一の値は常に同一の仮名に写像されるため、個人情報を見せずに同一顧客の横断追跡 (要件 3) と文面の自然さ (要件 2) を両立できます。一律の伏せ字 (A) は同一人物の紐づけを壊します。C は要件 1 に真っ向から反し、D は傾向・文体の再現を損ないます。"},
{"d":2,"q":"訴訟対応で「特定顧客の特定期間のチャットログを、調査が終わるまで期限を定めずに削除から保護せよ」と指示されました。他のログは既存のライフサイクルルールで期限どおり削除を続ける必要があります。最も適切な方法はどれですか。","c":["バケット全体の S3 Object Lock リテンション期間を 10 年に延長する","対象オブジェクトに S3 Object Lock のリーガルホールドを設定し、調査終了後に解除する","ライフサイクルルールを全て停止する","対象ログを Glacier Deep Archive へ移動する"],"a":1,"e":"リーガルホールドは期限を持たない削除保護で、オブジェクト単位に設定・解除できます。調査期間が不定でも対応でき、他オブジェクトのライフサイクル削除には影響しません。A はいつ終わるか不明の調査に固定期間で対応するうえ全体に影響し、C は他ログの保持方針を壊し、D はストレージクラスの変更であって削除保護ではありません。"},
{"d":2,"q":"Bedrock のエージェントが推論の途中で削除系ツールを試しに呼び、意図しないレコード削除が発生しました。照会系ツールは今までどおり自由に使わせ、正当な削除は人の確認を経て実行できるようにしたいです。最も適切な構成はどれですか。","c":["システムプロンプトに「削除前に必ず確認すること」と記載する","エージェントの実行ロールから削除権限を剥奪する","削除アクションにのみユーザー確認 (confirmation) を必須に設定し、照会アクションは設定を変えない","全アクションに承認ワークフローを追加する"],"a":2,"e":"アクショングループはアクション単位で確認要求を設定でき、破壊的操作だけに人の確認を挟めます。B は正当な削除もできなくなり要件に反します。A はモデルの遵守頼みで保証がなく (プロンプトはアーキテクチャ上の統制にならない)、D は照会まで遅くなり過剰です。"},
{"d":2,"q":"拒否トピックを設定した Guardrails 付きの RAG チャットボットで、禁止トピックに触れる記述が Knowledge Base から取得された参照文書経由で回答に混入しました。原因と対策の組み合わせとして正しいのはどれですか。","c":["拒否トピックはストリーミングでは機能しない。同期呼び出しに変更する","ガードレールのバージョンが古い。最新バージョンへ更新すれば取得文書も評価される","ガードレールはユーザー入力とモデル出力を評価し、取得された参照自体は評価しない。取得文書は ApplyGuardrail API で個別に評価してから文脈に渡す","取得文書は自動的に評価されるため、フィルタ強度を上げれば解決する"],"a":2,"e":"Guardrails の評価対象はユーザー入力と生成出力で、Knowledge Base から取得された参照 (検索結果) は対象外です。取得内容を統制したい場合は、文脈に渡す前に ApplyGuardrail で取得テキストを評価・フィルタします。B・D は評価対象の誤解で、A はストリーミングの表示タイミングの話であり原因ではありません。"},
{"d":2,"q":"社内エージェントが DynamoDB を更新する操作はすべて共通の実行ロールで行われるため、CloudTrail を見ても「誰の依頼による操作か」が分かりません。監査要件は操作ごとに依頼ユーザーを特定できることです。最も適切な方法はどれですか。","c":["利用者ごとに IAM ユーザーを発行しアクセスキーをエージェントに渡す","認証済みユーザーの識別子をセッション属性としてエージェントに引き渡し、各ツール実行時に操作内容と共に監査レコードとして記録する","CloudTrail のログ保持期間を延長する","エージェントの応答に「操作者: AI」と明記する"],"a":1,"e":"エージェントの AWS 操作は実行ロールの資格情報で行われるため、依頼者の帰属はアプリ層で行います。認証済みユーザー ID をセッション属性等で引き回し、ツール実行ごとに操作内容と組で監査記録に残すのが定石です。A はエージェントに長期資格情報を渡す重大なアンチパターン、C は内容の欠落を解決せず、D は表示であって監査証跡ではありません。"},
{"d":2,"q":"EU のデータ保護要件により、推論処理を EU 域内のリージョンに限定する必要があります。スロットリング対策としてクロスリージョン推論は使いたいです。SCP による域外 API 拒否も運用中です。正しい構成はどれですか。","c":["グローバル推論プロファイルを使い、SCP で域外を拒否しているので問題ない","EU 域内に宛先を限定した地理的 (geographic) 推論プロファイルを使い、プロファイルの全宛先リージョンが SCP で許可されていることを確認する","基盤モデル ID を直接指定すればクロスリージョン分散と域内限定が両立する","クロスリージョン推論はリージョンを選べないため、要件とは絶対に両立しない"],"a":1,"e":"クロスリージョン推論プロファイルには宛先を特定の地理圏に限定する geographic プロファイルと、商用全リージョンに広がる global プロファイルがあります。EU プロファイルを選べば処理を域内に保ったままバースト吸収が可能です。その際、プロファイルの宛先リージョンがすべて SCP で許可されている必要があります。A は域外宛先への呼び出しが SCP で失敗しスロットリング対策になりません。C は単一リージョン処理になり分散しません。D は geographic プロファイルの存在を無視しています。"},
{"d":2,"q":"EU 域内でデータを処理する要件のあるチャットボットで、多言語の有害表現検出の精度を上げるため Guardrails の Standard tier を使いたいです。Standard tier はクロスリージョン処理が前提と聞きました。どう構成しますか。","c":["Standard tier を有効にし、SCP は一時的に解除する","Standard tier は域内限定と両立しないため Classic tier に留める","EU のガードレールプロファイルを指定し、評価処理を EU 域内のリージョン群に保ったまま Standard tier を使う","多言語の検出は Comprehend に置き換える"],"a":2,"e":"Guardrails の Standard tier はクロスリージョン処理 (ガードレールプロファイル) を前提としますが、プロファイルには地理圏を限定したもの (EU など) があり、これを指定すれば評価処理を域内リージョン群に保ったまま高精度の多言語検出を使えます。B は不要な妥協、A は統制の放棄、D は Guardrails の拒否トピック等の機能を失います。"},
{"d":2,"q":"Bedrock のモデル呼び出しログを S3 に出力しています。CloudWatch Logs のデータ保護ポリシーをアカウント全体に適用しましたが、S3 上のログ内の PII がマスクされていません。原因と対策はどれですか。","c":["S3 のバージョニングが有効なためマスクが適用されない。バージョニングを無効化する","ポリシーの反映に最大 7 日かかるため待てばよい","データ保護ポリシーは CloudWatch Logs に取り込まれたログにのみ作用する。S3 出力分は Macie でスキャンし検出結果に基づき対処する","KMS 暗号化がマスクを妨げている。SSE-S3 に変更する"],"a":2,"e":"CloudWatch Logs のデータ保護ポリシーの適用範囲は CloudWatch Logs のロググループ内だけで、S3 へ直接出力されたオブジェクトには作用しません。S3 側は Macie による機微データ検出と、検出結果に基づく隔離・墨消しのワークフローで守ります。B・A・D はいずれも適用範囲の誤解です。"},
{"d":2,"q":"RAG アプリで Guardrails のコンテキストグラウンディングチェックを有効にしましたが、しきい値が緩いと根拠の弱い応答が通過し、厳しいと正当な応答まで遮断されます。現在は担当者の感覚で設定しています。しきい値を決める最も適切な方法はどれですか。","c":["デフォルト値のまま運用する (AWS が最適化済みのため)","最も厳しい値に固定し、苦情が来たら緩める","接地の良否が既知の応答を集めた評価データセットでスコア分布を測定し、誤通過と誤遮断のバランス点にしきい値を較正する","しきい値を毎日ランダムに変えて A/B テストする"],"a":2,"e":"しきい値はワークロードごとに最適点が異なるため、接地の良否がラベル付けされた評価データセットでスコア分布を取り、誤通過 (幻覚の通過) と誤遮断 (正当応答のブロック) のトレードオフが要件に合う点へ較正するのが定石です。B は本番ユーザーを実験台にし、A は自ワークロードの分布を反映せず、D は制御されていない実験で較正になりません。"},
{"d":2,"q":"金融機関が生成 AI の統制要件への適合を監査のたびに示す必要がありますが、現在は監査直前に担当者が各サービスの設定画面を回って証跡を集めており、「過去の各時点で適合していたか」を示せません。最も適切な改善はどれですか。","c":["AWS Config を無効化し CloudTrail に一本化する","監査前のスクリーンショット取得を月次に増やす","統制要件に対応するフレームワークから AWS Audit Manager のアセスメントを作成し、証跡を継続的・自動的に収集する","監査人に AdministratorAccess を払い出して直接確認してもらう"],"a":2,"e":"AWS Audit Manager は統制フレームワークに沿って証跡を継続的・自動的に収集し、過去の各時点の適合状況をアセスメントとして示せます。手作業のスクリーンショット (B) は頻度を上げても網羅性と時点証明に欠けます。A は構成履歴という証跡源を失う逆行で、D は最小権限に反する重大な悪手です。"},
{"d":2,"q":"採用支援アプリが候補者レコード全体 (氏名・住所・家族構成・経歴・資格など) を Converse API のコンテキストとしてモデルに渡し、職務適合性の要約を生成しています。プライバシーレビューで是正を求められました。既存レコードの構造は変えられません。最も適切な対応はどれですか。","c":["レコード全体を暗号化してからモデルに渡す","呼び出し側で職務経歴と資格の項目だけを抽出してコンテキストに渡す (データ最小化)","モデルへのシステムプロンプトで「氏名・住所は無視せよ」と指示する","レコード構造を変更して機微項目を削除する"],"a":1,"e":"データ最小化の原則では、タスクに必要な項目だけをモデルに渡します。抽出は呼び出し側の処理なのでレコード構造は変えずに済みます (B)。暗号化 (A) は渡す内容を減らさず、モデルは復号済みテキストを見る必要があるため意味がありません。プロンプト指示 (C) では機微情報がモデルとログに到達済みです。D は「構造は変えられない」制約に反します。"},
{"d":2,"q":"Guardrails の有害性コンテンツフィルタを全分類とも最高強度にしたところ、正当な業務質問が月約 900 件ブロックされています。内訳を調べると誤遮断の 9 割が「暴力」分類によるもので、製造業の安全手順 (切断・爆発防止など) の質問でした。有害出力の防止は維持する必要があります。最も適切な対応はどれですか。","c":["全分類の強度を一律に最低へ下げる","フィルタ全体を無効化し、システムプロンプトの注意書きに置き換える","誤遮断の多い分類 (暴力) だけ強度を一段下げ、評価データセットで有害検出率と誤遮断率の変化を確認してから反映する","ブロックされた質問を自動で再送信するリトライを実装する"],"a":2,"e":"コンテンツフィルタの強度は分類ごとに独立して設定できます。誤遮断の原因分類だけを調整し、変更の影響を評価データセットで検証してから反映するのが、保護を維持しつつ使い勝手を直す方法です。B・A は保護の放棄、D はブロックの迂回であり、ガードレールの意味を失わせます。"},
{"d":2,"q":"マルチモーダル対応のチャットボットに画像アップロード機能を追加したところ、テキストでは遮断される不適切な内容が画像経由では素通りしています。テキスト側の設定は維持したまま是正したいです。最も適切な対応はどれですか。","c":["画像を一度テキスト説明に変換してからテキストフィルタに通す独自前処理を実装する","画像アップロード機能を削除する","Guardrails のコンテンツフィルタで画像の評価を有効にし、テキストと同じポリシーを画像にも適用する","アップロード可能な画像サイズを制限する"],"a":2,"e":"Guardrails のコンテンツフィルタはテキストに加えて画像コンテンツの評価に対応しており、有効化すれば同一ポリシーを両モダリティに適用できます。機能削除 (B) は過剰、独自変換 (A) はマネージド機能で足りるものを自作する運用負荷で情報落ちもあり、サイズ制限 (D) は安全性と無関係です。"},
{"d":2,"q":"ある開発チームが「Bedrock はマネージドサービスなのでセキュリティとコンプライアンスは AWS 側で担保される」と考え、IAM の絞り込み・Guardrails・ログ設定を一切行っていませんでした。是正の出発点として最も適切なのはどれですか。","c":["ペネトレーションテストを依頼し、結果が出るまで現状維持する","AWS サポートに「全設定を代行してほしい」と依頼する","マネージドサービスの利用をやめ、自社ホスティングに移行する","共有責任モデルに照らして自社が負う設定項目 (IAM、データ保護、Guardrails、ログ等) を洗い出し、AWS Config ルールで実装状況を継続評価する"],"a":3,"e":"マネージドサービスでもセキュリティ「の中の」統制 (IAM、データ分類と保護、Guardrails 構成、ログ有効化など) は顧客の責任です。まず共有責任モデルに基づき自社担当分を列挙し、AWS Config による継続評価で「設定されている状態」を維持します。B は責任の誤転嫁、C は責任範囲がむしろ拡大し本末転倒、A は時間を浪費するだけで既知の欠落を放置します。"},
{"d":2,"q":"14 の部門がそれぞれ独自に生成 AI システムを構築・契約しており、全社でどこにどんな AI がどの目的で稼働しているかを示せません。リスク管理と監査の前提となる一覧の正確性を維持する最も実効的な方法はどれですか。","c":["年 1 回の全部門アンケートで一覧を更新する","AI システムの登録を利用開始の条件 (アカウント払い出しや API キー発行の前提) とし、台帳を契約・支出記録と突合して漏れを検出する","全部門に生成 AI の新規利用を禁止する","情報システム部が全部門のシステムを目視で棚卸しする"],"a":1,"e":"台帳の正確性は「登録しないと使えない」構造で担保するのが実効的です。さらに契約・支出記録との突合により、構造の外で始まった利用 (シャドー AI) も検出できます。アンケート (A) や目視 (D) は即座に陳腐化し、禁止 (C) はシャドー化を促進する逆効果です。"},
{"d":2,"q":"独自の ID・パスワードで認証する社内 GenAI アプリで、人事システムの退職処理が反映されず、退職者が 90 日後もアクセスできていました。要件は退職処理から 1 時間以内の全アクセス停止です。最も適切な構成はどれですか。","c":["退職者リストをアプリの拒否リストに手動登録する運用にする","月次でアカウント棚卸しを行い退職者を手動削除する","パスワードの有効期限を 30 日に短縮する","認証を IAM Identity Center に統合し、人事システムを信頼元とした SCIM 自動プロビジョニングで退職と同時にユーザーを無効化する"],"a":3,"e":"独自認証が人事イベントと切り離されていることが根本原因です。IAM Identity Center + SCIM で IdP (人事連動) をソースオブトゥルースにすれば、退職処理がそのままアカウント無効化に伝播し、1 時間要件を自動で満たせます。B は最大 1 か月の露出、C でも最長 30 日残り、A は手動運用で漏れが再発します。"},
{"d":2,"q":"AWS Organizations 配下の全アカウントで動く多数の Bedrock アプリに対し、アプリのコードを変更せずに、承認済みガードレールの適用を組織全体へ強制したいです。最も適切な方法はどれですか。","c":["各開発チームに依頼して呼び出しコードへ guardrailIdentifier を追加してもらう","Organizations の Bedrock 向けポリシー (ガードレール強制ポリシー) で、指定ガードレール ARN とバージョンの適用をメンバーアカウントに強制する","SCP で bedrock:InvokeModel を全面拒否する","ガードレールの設定手順書を全社に配布する"],"a":1,"e":"Organizations には Bedrock のガードレール適用を組織・OU 単位で強制するポリシータイプがあり、管理アカウントからガードレール ARN とバージョンを指定すれば、各アプリのコード変更なしに全呼び出しへ適用されます。A はコード変更が必要なうえ徹底できず、C は利用自体の停止で目的と違い、D は強制力がありません。なお強制ガードレールを使うには、メンバーアカウントのロールに該当ガードレールへの bedrock:ApplyGuardrail 許可も必要です。"},
{"d":2,"q":"エージェントがモデル生成コードを AgentCore Code Interpreter で実行します。コードが機密データを外部サーバーへ送信するリスクを塞ぎつつ、S3 の特定バケットの読み取りは許可する必要があります。最も適切な構成はどれですか。","c":["実行環境の CPU とメモリを制限する","生成コードを目視レビューしてから実行する","システムプロンプトで「外部送信するコードを書かないこと」と指示する","Code Interpreter を VPC モードで実行してインターネット経路を持たせず、実行ロールは対象バケットの読み取りのみ許可する"],"a":3,"e":"生成コードの実行環境は「悪意あるコードが混ざる」前提で設計します。ネットワーク層で外部経路を断ち (VPC モード、インターネットなし)、IAM で到達可能なリソースを最小化すれば、コードの内容に依存しない構造的な防御になります。目視 (B) は難読化に弱くスケールせず、プロンプト指示 (C) は保証がなく、リソース制限 (A) は DoS 対策であって流出対策ではありません。"},
{"d":2,"q":"公開チャットボットでガードレールの介入率が平常時の 20 倍に急増しました (組織的な攻撃の兆候)。深夜で担当者の対応は数時間後になります。被害を人の対応を待たずに抑える仕組みとして最も適切なのはどれですか。","c":["ガードレールの強度を自動で最低に下げて誤検知を減らす","アラームを oncall にメール通知し、出社後に対応する","介入率のダッシュボードを作成して可視化する","介入率の CloudWatch アラームをトリガーに Lambda で機能フラグを切り替え、定型 FAQ 回答のみの安全モードへ自動移行する"],"a":3,"e":"攻撃兆候の急増には自動緩和が必要です。介入率メトリクスのアラームから Lambda で機能フラグを安全モード (生成を止め定型応答のみ) に切り替えれば、人の対応を待たず露出を最小化できます。通知 (B) と可視化 (C) は対応までの時間を縮めず、強度引き下げ (A) は攻撃中に防御を弱める最悪の自動化です。"},
{"d":2,"q":"拡張思考 (reasoning) を有効にしたモデルで、思考過程をユーザーに表示する機能を追加したところ、最終回答ではブロックされるはずの機密情報が思考過程の表示に現れました。原因と対策はどれですか。","c":["温度を下げれば推論に機密情報が現れなくなる","ガードレールのバージョン固定が原因。DRAFT を参照すれば推論も評価される","推論部分は常に安全であり、表示しても問題ない","ガードレールの評価対象は入力と最終出力であり、推論 (reasoning) 部分は評価されない。表示前に ApplyGuardrail で推論テキストを個別に評価する"],"a":3,"e":"ガードレールのコンテンツ評価は入力と応答が対象で、拡張思考の推論テキストは評価対象に含まれません。思考過程を表示する設計では、表示前に ApplyGuardrail (モデルを呼ばず任意テキストを評価できる API) で推論部分を検査します。B はバージョン運用の誤解、C は事実誤認、A はばらつき制御であり内容の保証はありません。"},
{"d":2,"q":"社外向けサポートボットの Knowledge Base が、全社員が書き込める Wiki を毎日同期しています。誤記や悪意ある編集 (データポイズニング) がそのまま顧客回答に反映されるリスクが指摘されました。回答の鮮度は保つ必要があります。最も適切な対策はどれですか。","c":["同期頻度を週次に下げて悪意ある編集の混入確率を下げる","社外向け回答には、担当部署の承認を経た文書だけを置く専用データソースを使い、変更は承認ワークフローと記録で管理する","Guardrails の拒否トピックに「誤った情報」を登録する","Wiki の全ページに「内容は保証されません」の免責を追記する"],"a":1,"e":"RAG の情報源が誰でも書ける状態だと、検索精度やガードレールでは防げない「上流の汚染」が回答に直結します。影響の大きい社外向けには、承認済み文書のみの分離ソースと変更統制 (承認+記録) が正攻法です。頻度削減 (A) は確率を下げるだけで混入は防げず鮮度も落ちます。拒否トピック (C) は話題の遮断であり正誤判定はできません。免責 (D) はリスクの転嫁であって対策ではありません。"},
{"d":2,"q":"エージェントのアクショングループに callInternalApi(path, method, body) という汎用プロキシ型の Lambda ツールを公開したところ、モデルが想定外のエンドポイントを自分で組み立てて呼び出す挙動が確認されました。最も適切な是正はどれですか。","c":["Lambda のタイムアウトを短縮する","システムプロンプトに「許可されたパス以外を呼ばないこと」と記載する","ツールの説明文 (description) に注意書きを追加する","ツールを getOrderStatus(orderId) のような型付き引数の目的別関数に分割し、呼べる操作を列挙された範囲に限定する"],"a":3,"e":"汎用プロキシ型のツールは、モデルに「任意の API を呼ぶ能力」を与えてしまいます。目的別の型付き関数に分割すれば、呼べる操作がスキーマで列挙され、モデルの選択肢が構造的に制限されます。プロンプト (B) や説明文 (C) はモデルの遵守頼みで強制力がなく、タイムアウト (A) は実行時間の制御にすぎません。"},
{"d":2,"q":"料金判定の詳細な業務ロジック (割引率のマトリクスや閾値) をシステムプロンプトに記載したチャットボットで、利用者の巧妙な聞き出しによりロジックが漏えいしました。「開示するな」という指示も Guardrails の単語フィルタも回避されています。根本対策はどれですか。","c":["システムプロンプトを Secrets Manager に保管する","ロジックを Base64 でエンコードしてプロンプトに入れる","「いかなる場合も開示しない」という指示をプロンプトの先頭と末尾に重複記載する","機密ロジックをプロンプトから排除し、Lambda 等のツール側で計算して結果だけをモデルに渡す"],"a":3,"e":"モデルのコンテキストに入れた情報は、原理的にモデルの出力経由で漏れ得ます。指示 (C) や難読化 (B) は推論で復元・漏えいされ、保管場所の変更 (A) は実行時にコンテキストへ入る事実を変えません。機密の業務ロジックはプロンプトに置かず、ツール側で計算して結果のみ渡すのが唯一の構造的対策です。"},
{"d":2,"q":"外部パートナーが顧客 PII を含むファイルを S3 経由で提供します。コンプライアンス部門は「AWS 管理者や S3 ポリシーの誤設定でも平文が露出しない」ことを要求しています。最も適切な方式はどれですか。","c":["アップロード後に Lambda でサーバー側再暗号化する","SSE-S3 (S3 マネージドキー) による保存時暗号化を有効にする","バケットをプライベート設定にし、アップロード用の署名付き URL を使う","パートナー側で公開鍵を使ってクライアントサイド暗号化してからアップロードし、秘密鍵は自社のコンプライアンスチームのみが保持する"],"a":3,"e":"要件は「S3 に届く前から平文が存在しない」ことです。クライアントサイド暗号化なら、バケットポリシーの誤設定やサービス側の閲覧でも暗号文しか見えず、復号能力は秘密鍵を持つチームに限定されます。SSE-S3 (B) や署名付き URL (C) はサービス側/設定ミスの露出経路を残し、A はアップロード〜再暗号化の間に平文が存在します。"},
{"d":2,"q":"AgentCore 上の自律エージェントが深夜に不審なツール呼び出しを連発しました。調査には「初期プロンプト→推論ループ→各ツール呼び出しと引数→応答」の一連の流れを時系列で再構成する必要がありますが、アプリの通常ログでは断片しか追えません。最も適切な手段はどれですか。","c":["エージェントの温度を 0 にして再現実験する","CloudTrail の管理イベントだけで操作の再構成を試みる","Lambda ツール側の print ログを増やす","AgentCore Observability を X-Ray と統合し、OpenTelemetry の分散トレースとしてエージェントの推論・ツール呼び出しの全ステップを取得する"],"a":3,"e":"非決定的に動くエージェントの事後調査には、推論ループとツール呼び出しを横断する分散トレーシングが必要です。AgentCore Observability は X-Ray / OpenTelemetry と統合し、セッション全体をトレースとして再構成できます。CloudTrail (B) は API の管理イベントで推論過程を含まず、ツール側ログ (C) は呼び出し間の因果が繋がりません。A は非決定性ゆえに同じ挙動の再現を保証できません。"},
{"d":2,"q":"エージェントがユーザーの代理で外部 SaaS (カレンダー) を操作します。要件は (1) ユーザーごとに本人が明示的に同意した範囲のみ操作、(2) トークンの安全な保管・再利用、の 2 つです。最も適切な実装はどれですか。","c":["SaaS の管理者 API キーを 1 つ発行し、Secrets Manager に保管して全ユーザーの操作に使い回す","AgentCore Identity で OAuth 2.0 認可コードグラント (3LO) を構成し、ユーザーごとの同意に基づくトークンを暗号化ストアで管理させる","ユーザーの SaaS パスワードをアプリの DB に保存してエージェントがログインする","エージェントの IAM ロールに SaaS への権限を付与する"],"a":1,"e":"ユーザー単位の委任アクセスには、本人が同意画面でスコープを承認する OAuth 2.0 認可コードグラント (3-legged OAuth) が適合します。AgentCore Identity はエージェントの ID と送信資格情報を管理し、ユーザーごとのトークンを暗号化ストアで保管・更新します。管理者キーの使い回し (A) は全ユーザー分の過剰権限と同意の欠如、パスワード保存 (C) は重大なアンチパターン、IAM (D) は AWS 外の SaaS には作用しません。"},
{"d":2,"q":"モデルへ渡す前のテキストを Amazon Comprehend のリアルタイム PII 検出に通す設計で、1 件あたり最大 400KB のドキュメントを処理する必要があります。考慮すべき制約と対処はどれですか。","c":["PII 検出は S3 上のファイルに対してのみ実行できる","上限はないためそのまま 1 回の呼び出しで処理できる","リアルタイム検出は英語に対応していないため使用できない","リアルタイム検出の入力上限は UTF-8 で 100KB のため、100KB 未満に分割してチャンクごとに検出するか、非同期バッチジョブを使う"],"a":3,"e":"Comprehend のリアルタイム (同期) PII 検出には UTF-8 100KB の入力上限があります。大きな文書は 100KB 未満に分割してチャンク単位で検出する (オフセットの付け替えに注意) か、リアルタイム性が不要なら S3 入出力の非同期バッチジョブを使います。B は上限の誤認、C は言語対応の誤り (英語対応)、A は同期 API がテキスト直接入力であることと矛盾します。"},
{"d":2,"q":"Knowledge Base にリランカーモデルを有効化したところ、アプリの実行ロールは bedrock:Retrieve を持っているのに検索が AccessDenied で失敗するようになりました。原因として最も可能性が高いのはどれですか。","c":["Knowledge Base のサービスロールに、リランカー呼び出しに必要な bedrock:Rerank とリランカーモデルへの bedrock:InvokeModel 許可が無い","リランカーはプロビジョンドスループットでしか動作しない","アプリの実行ロールに s3:GetObject が不足している","リランカー有効化によりベクトルインデックスが再構築中である"],"a":0,"e":"リランキングは Knowledge Base 側が内部でリランカーモデルを呼び出すため、呼び出し元ロールではなく KB のサービスロールに bedrock:Rerank と該当モデルへの bedrock:InvokeModel が必要です。呼び出し側の bedrock:Retrieve だけでは足りません。B は誤り、C は取り込み時の話で検索失敗の直接原因になりにくく、D のような再構築は発生しません。"},
{"d":2,"q":"Amazon Q Business で人事文書を含むデータソースを接続しています。ソースシステムの ACL により閲覧権限が守られていますが、「管理者が誤って ACL 連携を無効化すると全文書が全ユーザーに見える」ことがリスクとして指摘されました。最も適切な予防策はどれですか。","c":["管理者向け IAM ポリシーで qbusiness:DisableAclOnDataSource を明示的に Deny する","管理者に ACL を無効化しないよう教育する","人事文書のインデックス化をやめる","Web エクスペリエンスの利用者を人事部員に限定する"],"a":0,"e":"Q Business は権限認識型で、ソースの ACL を尊重して利用者ごとに取得範囲を絞ります。ACL 連携の無効化は「全文書が全ユーザーに可視化される」最重大の設定ミスであり、該当操作の IAM アクション (qbusiness:DisableAclOnDataSource) を明示 Deny で封じるのが構造的な予防策です。教育 (B) は誤操作を防げず、C・D は業務要件を損なう回避にすぎません。"},
{"d":2,"q":"Bedrock Prompt Management で、プロンプトエンジニアは下書きを自由に編集・改善し、リリース管理者だけが「配備可能なバージョンの確定」を行える職務分離を IAM で実装したいです。正しい設計はどれですか。","c":["エンジニアに bedrock:UpdatePrompt を、リリース管理者に bedrock:CreatePromptVersion を許可する (両者は別の IAM アクション)","プロンプト操作は単一の bedrock:ManagePrompt アクションのため、職務分離はタグでしか実現できない","エンジニアとリリース管理者で別々の AWS アカウントを使うしかない","バージョン確定はコンソール専用操作のため IAM では制御できない"],"a":0,"e":"Prompt Management では下書きの編集 (bedrock:UpdatePrompt) とバージョンのスナップショット確定 (bedrock:CreatePromptVersion) が別の IAM アクションとして定義されているため、ロールごとに許可を分ければ「編集者と承認者の分離」をネイティブに実装できます。B・D は事実誤認で、C はアカウント分離まで持ち出す過剰設計です。"},
{"d":2,"q":"Bedrock Flows からナレッジベースノードと Lambda ノードを削除しました。実行ロールはコンソールが管理しています。最小権限の観点で注意すべき点はどれですか。","c":["コンソールはノード追加時に権限を足すが、ノード削除時に権限を自動では削除しないため、不要になった権限を監査して明示的に取り除く","ノード削除と同時に権限も自動削除されるため、対応は不要","実行ロールは変更できないため、フローを作り直すしかない","フローの実行ロールには権限が不要である"],"a":0,"e":"コンソール管理のフロー実行ロールは「増える一方」です。ノードを追加すると必要権限が付与されますが、ノードを外しても古い権限は残るため、削除後は実行ロールを監査し、外したノードだけが必要としていた権限 (この例ではナレッジベースと該当 Lambda) を明示的に削除します。B は挙動の誤解、C・D は事実誤認です。"},
{"d":2,"q":"エージェントハーネスの allowedTools 設定で危険なツールを除外したので、「そのツールは呼ばれ得ない」とレビューで主張されました。セキュリティ観点で正しい指摘はどれですか。","c":["allowedTools はモデルが選択できるツールを絞るオーケストレーション層の誘導にすぎず、API の直接呼び出しは防がない。強制は IAM / Gateway の認可で行う必要がある","allowedTools はネットワーク層で適用されるため、直接呼び出しも遮断される","allowedTools の除外は暗号学的に強制されるため、追加対策は不要","ツール名を難読化すればアクセス境界として十分になる"],"a":0,"e":"allowedTools はオーケストレーションループ内で評価される「モデルの選択肢の制限」であり、エージェントランタイムの API を直接呼ぶ経路には作用しません。アクセス境界は IAM 認可や Gateway 側のポリシー適用など、呼び出し経路に依存しない層で強制します。B・C は仕組みの誤解、D は隠蔽であり境界ではありません。"},
{"d":2,"q":"Guardrails の機密情報フィルタ (マスク動作) を適用済みのエージェントで、ユーザー向け応答のメールアドレスはマスクされる一方、ツール呼び出し (tool_use) の引数に平文のメールアドレスが渡り、ツール側のログに残っていました。正しい理解と対策はどれですか。","c":["機密情報フィルタの対象はテキスト入出力であり、ツール呼び出しパラメータ内の PII は検査されない。ツール実行前にアプリ側で引数を検査・マスクする層を追加する","フィルタ強度を High にすればツール引数も検査される","ツール引数は Bedrock が自動で暗号化するため問題ない","ログの保持期間を短くすれば要件を満たす"],"a":0,"e":"機密情報フィルタが検査するのはテキストの入出力で、モデルが生成するツール呼び出し (tool_use) のパラメータは対象外です。ツール側へ PII が流れる経路は、実行前にアプリ層で引数を検査・マスクして塞ぎます (実行後では手遅れ)。B は強度の意味の誤解、C は事実誤認、D は露出の事後縮小にすぎません。"},
{"d":2,"q":"us-east-1 と eu-west-1 の S3 バケットに保管するプロンプトアーカイブについて、「リソースポリシーが外部アカウントへのアクセスを許していないこと」を継続的に検出したいです。us-east-1 で IAM Access Analyzer (外部アクセス) を有効化済みです。正しい理解はどれですか。","c":["アナライザーはリージョン単位のため eu-west-1 にも有効化が必要であり、検出結果は「ポリシー上アクセス可能」という事実を示すもので、実際にアクセスされた証明ではない","1 リージョンで有効化すれば全リージョンのリソースが対象になる","Access Analyzer は実際のアクセスログを解析して外部アクセスの発生を証明する","S3 は対象外のため CloudTrail でしか検出できない"],"a":0,"e":"外部アクセスアナライザーはリージョン単位で有効化が必要で、us-east-1 のアナライザーは eu-west-1 のリソースを見ません。また検出結果はリソースポリシーが外部アクセスを「許している」ことの検出であり、実際の利用の証明には CloudTrail 等のアクセス記録が別途必要です。B・C・D はそれぞれ範囲・性質・対象の誤解です。"},
{"d":2,"q":"GenAI プラットフォームの認証設計で、(1) 社内のデータサイエンティストが 6 つの AWS アカウントへ SSO でアクセスする経路と、(2) 一般顧客がチャットアプリへサインインする経路を設計します。適切なサービスの組み合わせはどれですか。","c":["(1) も (2) も Amazon Cognito で統一する","(1) は IAM Identity Center (企業 IdP 連携・許可セット)、(2) は Amazon Cognito (ユーザープールで認証、ID プールで一時認証情報)","(1) も (2) も IAM ユーザーを発行する","(1) は Cognito、(2) は IAM Identity Center"],"a":1,"e":"IAM Identity Center は従業員 (ワークフォース) の複数 AWS アカウントへの集中アクセス管理で、企業 IdP と連携し許可セットで各アカウントのロールを払い出します。Cognito は顧客向けアプリの ID 基盤で、ユーザープールが認証と JWT 発行、ID プールが一時 AWS 認証情報への交換を担います。両者は対象が異なり逆転 (D) や統一 (A) は不適合、IAM ユーザーの直接発行 (C) は長期資格情報の乱立でアンチパターンです。"},
{"d":2,"q":"Cognito ユーザープールで認証した SPA からの JWT をバックエンドが受け取り、GenAI API の認可に使います。現在はトークンを Base64 デコードしてクレームを読むだけです。セキュリティレビューで指摘される内容として正しいのはどれですか。","c":["デコードは検証ではない。JWKS から kid で署名鍵を取得して署名を検証し、有効期限・発行者 (issuer)・token_use・クライアント ID・必要スコープまで確認する必要がある","JWT は改ざん不可能な形式のため、デコードだけで十分である","HTTPS を使っていればトークン検証は不要である","署名検証は Cognito 側で完結しているためバックエンドでの確認は冗長である"],"a":0,"e":"デコードは誰でもできる単なる復号で、真正性を一切保証しません。受信側は JWKS (kid で鍵を特定、ローテーションに追随) による署名検証に加え、exp・iss・token_use (access/id の区別)・client_id・必要な OAuth スコープを確認して初めてトークンを信頼できます。B は JWT の誤解 (署名を検証しなければ改ざんも偽造も検出できない)、C は通信路と真正性の混同、D は検証責任の誤解です。"},
{"d":2,"q":"推論アプリのロールに kms:Decrypt を許可する IAM ポリシーを付けたのに、カスタマーマネージドキーで暗号化されたデータの復号が AccessDenied になります。SCP や明示的 Deny はありません。最も可能性が高い原因はどれですか。","c":["キーポリシーが IAM ベースの認可を有効にしていない (アカウントルートへの委任ステートメントが無い) ため、IAM の Allow が効力を持たない","KMS は IAM ポリシーを一切参照しないため、常にキーポリシーだけで認可される","kms:Decrypt は存在しないアクション名である","復号にはキーの管理者権限 (kms:PutKeyPolicy) が必要である"],"a":0,"e":"KMS の認可はキーポリシーが起点です。キーポリシーに「アカウントの IAM に認可を委ねる」ステートメントが無ければ、IAM ポリシーの Allow は評価上の効力を持ちません。キーポリシーで IAM 認可を有効化するか、キーポリシーに直接プリンシパルを許可します。B は言い過ぎ (委任があれば IAM も効く)、C は誤り、D は管理と利用の混同です (むしろ分離すべき)。"},
{"d":2,"q":"サードパーティのモデルプロバイダー API キーを、カスタマーマネージド KMS キーで暗号化した Secrets Manager シークレットに保管しています。推論ロールに secretsmanager:GetSecretValue を許可しても取得が AccessDenied になります。原因はどれですか。","c":["CMK 暗号化のシークレット取得には Secrets Manager の権限に加えて該当 KMS キーの復号権限 (キーポリシー側の許可) も必要で、どちらが欠けても拒否される","GetSecretValue はコンソール専用の操作である","シークレット名が暗号化されており解決できない","ローテーション設定が無いシークレットは取得できない"],"a":0,"e":"カスタマーマネージドキーで暗号化されたシークレットの取得は、(1) secretsmanager:GetSecretValue と (2) その CMK に対する復号の認可、の二重の権限が必要です。キーポリシー側で推論ロール (または kms:ViaService 条件付きの許可) を認可します。なおシークレット名・説明・タグ等のメタデータは暗号化されません (C は誤り)。B・D は事実誤認です。"},
{"d":2,"q":"API Gateway 前段の AWS WAF で GenAI API への不正ペイロードを検査しています。利用者は最大 40KB のプロンプトを送信しますが、「大きなリクエストの一部が検査されずに通過している」と指摘されました。正しい理解と対策はどれですか。","c":["WAF のボディ検査にはサイズ上限があり、超過分のバイトは既定では検査されない。オーバーサイズ時の処理 (ブロック等) を明示的に設定し、必要なら検査上限の引き上げを構成する","WAF は常にボディ全体を検査するため、指摘は誤りである","ボディ検査はできないため、ヘッダー検査のみで運用する","WAF を外し、Shield Advanced に置き換える"],"a":0,"e":"WAF のボディ検査には統合先に応じたサイズ上限があり (既定では ALB 等で先頭 8KB、CloudFront/API Gateway 等は既定 16KB で引き上げ可能)、超過バイトは検査されずに通過し得ます。対策は (1) オーバーサイズハンドリングで「上限超過リクエストの扱い」(ブロック等) を意図的に選ぶこと、(2) 必要に応じて検査上限を引き上げることです。なお MATCH 設定自体はブロックではなく、ルールのアクションと組み合わせて初めて遮断されます。B・C は事実誤認、D は DDoS 対策との混同です。"},
{"d":3,"q":"ある社内アシスタントは平常時の Bedrock 呼び出しがクォータの 3 割程度ですが、始業直後の約 10 秒間だけ毎秒のリクエストが急増し、ThrottlingException が集中発生します。集中はすぐ解消します。平常時の費用を増やさず、スパイク中のリクエストも失わない最も適切な対策はどれですか。","c":["プロビジョンドスループットを購入して容量を固定する","ジッター付き指数バックオフのリトライで、数十秒の集中を吸収する","全リクエストを Priority ティアに切り替える","max_tokens を小さくしてリクエストを軽くする"],"a":1,"e":"数十秒で解消する瞬間的な輻輳は、リトライ（指数バックオフ+ジッター）で待って再送すれば取りこぼしなく処理でき、追加費用もかかりません。PT 購入 (A) や Priority ティア (C) は恒常的な費用増で、10 秒のスパイクには過剰です。max_tokens (D) は出力長の制御でありスロットリングの根本対策ではありません。※逆に「恒常的に容量が足りない」場合はバックオフでは増えない — 問題文の時間スケールで使い分けます。"},
{"d":3,"q":"AWS Glue ジョブが数百万件の文書を Bedrock の埋め込み API へ直列に送っており、クォータの 2 割しか使えず締切に間に合いません。並列度を無計画に上げると ThrottlingException で失敗が多発しました。クォータの引き上げには頼れません。最も適切な設計はどれですか。","c":["並列度を最大にし、失敗分は無制限リトライで回収する","バッチ推論ジョブに切り替えて非同期で処理する","送信を複数の並行ワーカーに分け、合計送信レートが Service Quotas の上限直下に収まるよう同時実行数を制御する","リクエスト間に固定 1 秒の待ちを入れて直列処理を続ける"],"a":2,"e":"スループットの上限はクォータ（RPM/TPM）で決まるため、並列化しつつ合計レートをクォータ直下に制御するのが正解です。クォータを超えた分は必ず失敗するので最大並列+リトライ (A) は無駄が多く、固定待ちの直列 (D) はクォータを使い切れません。リアルタイム埋め込み取り込みの文脈では、合計レートの制御が「速さ」と「失敗ゼロ」を両立します。"},
{"d":3,"q":"社内ツールの推論エンドポイント（SageMaker）は平日日中に散発的にしか呼ばれず、夜間と週末はほぼゼロです。初回リクエストで数秒の起動待ちは許容できます。コストを最小化するホスティング方式はどれですか。","c":["サーバーレス推論エンドポイントに変更し、アイドル時は容量を保持しない","リアルタイム推論エンドポイントを 24 時間稼働させる","プロビジョンドスループットを購入する","非同期推論エンドポイントに変更し、結果を SNS で通知する"],"a":0,"e":"散発的・アイドル時間が長い・数秒の起動待ち許容 — これはサーバーレス推論の典型シナリオです。リクエスト到着時にだけ容量を確保し、アイドル中は課金されません。常時稼働のリアルタイム EP (B) はアイドル費用が無駄で、PT (C) は定常大量トラフィック向け。非同期推論 (D) は長時間ジョブのキューイング向けで、即時応答が欲しい対話的ツールには不適です。"},
{"d":3,"q":"SageMaker サーバーレス推論エンドポイントは 1 時間に数件しか呼ばれず、アイドルが 30 分を超えると次の初回リクエストに約 6 秒かかり、要件の 2 秒を超過します。利用のない夜間・週末には費用を発生させたくありません。どう対処しますか。","c":["リアルタイムエンドポイントへ移行して常時 1 台を確保する","メモリサイズを最大にしてコールドスタートをなくす","呼び出し側で 6 秒のタイムアウトを許容するよう要件を変更する","サーバーレス推論のプロビジョンド同時実行を営業時間帯だけ設定し、実行環境を温めておく"],"a":3,"e":"サーバーレス推論にはプロビジョンド同時実行（Provisioned Concurrency）があり、指定数の実行環境を温めてコールドスタートを回避できます。営業時間帯だけ設定すれば夜間・週末の費用はゼロのままです。常時稼働のリアルタイム EP (A) は夜間費用が発生し、メモリ増 (B) はコールドスタート自体を消せません。要件の緩和 (C) は解決ではありません。"},
{"d":3,"q":"数百 MB の PDF を GPU モデルで 10〜30 分かけて解析するワークロードがあります。依頼は 1 日数件〜数十件と不定期で、夜間・週末はゼロ。結果は完了通知で受け取れれば十分です。最もコスト効率の良いホスティングはどれですか。","c":["リアルタイム推論エンドポイントを常時稼働させ、タイムアウトを延長する","SageMaker 非同期推論エンドポイントを使い、リクエストをキューイングしてアイドル時はゼロまでスケールインする","AWS Lambda に GPU を割り当てて処理する","毎晩のバッチ変換ジョブにまとめて処理する"],"a":1,"e":"非同期推論は長時間の推論をキューに積み、処理後に S3 へ結果を置いて通知でき、リクエストがない間はインスタンス数ゼロまでスケールインできます。リアルタイム EP (A) は常時課金かつ呼び出しタイムアウトの制約があり、Lambda (C) は GPU 非対応かつ最大 15 分で不適。夜間バッチ (D) は「依頼から結果まで」の遅延が要件以上に伸びます。"},
{"d":3,"q":"工場ごとにファインチューニングした小型モデルが 50 個あり、それぞれ専用の SageMaker リアルタイムエンドポイントで常時稼働していますが、大半はアイドルで固定費が重くなっています。50 個すべてを呼び出せる状態は維持する必要があります。最も費用対効果の高い構成はどれですか。","c":["1 つのマルチモデルエンドポイントに 50 モデルを集約し、共有インスタンスで提供する","各エンドポイントにオートスケーリング（最小 1 台）を設定する","利用の少ないエンドポイントをスケジュールで夜間停止する","50 モデルを 1 つの大型モデルに統合するため再学習する"],"a":0,"e":"アイドルの多い多数の小型モデルは、マルチモデルエンドポイント (MME) に集約して共有インスタンスで提供するのが定石です。モデルは S3 から必要時にロードされ、全モデルが呼び出し可能なまま固定費を大きく削減できます。最小 1 台のオートスケール (B) は 50 台の固定費が残り、夜間停止 (C) は「常に呼べる」要件に反し、再学習 (D) は工数と品質リスクが過大です。なお同一ベースの LoRA 群なら推論コンポーネント（アダプタ）も選択肢です。"},
{"d":3,"q":"推論 API のコンテナ群（ALB 配下）にターゲット追跡スケーリングを設定します。容量を追加したときに値が比例して下がる指標が必要です。最も適切な指標はどれですか。","c":["ALB の総リクエスト数 (RequestCount)","p95 レスポンスレイテンシ","ターゲットあたりのリクエスト数 (RequestCountPerTarget) または平均 CPU 使用率","期間内の合計入力トークン数"],"a":2,"e":"ターゲット追跡は「容量を増やせば値が下がる」使用率系の指標を前提とします。ターゲットあたりリクエスト数や平均 CPU はこの性質を満たします。総リクエスト数 (A) や合計トークン数 (D) は容量を増やしても変わらないため収束せず、p95 レイテンシ (B) は容量との関係が非線形・遅行で発振の原因になります。"},
{"d":3,"q":"1 つの Auto Scaling グループに CPU 使用率とターゲットあたりリクエスト数の 2 つのターゲット追跡ポリシーを設定しています。CPU は十分低いのにスケールインが起きません。最も可能性の高い理由はどれですか。","c":["ターゲット追跡はスケールインを一切行わない仕様だから","スケールインにはスケジュールポリシーの併用が必須だから","CloudWatch アラームが欠損データを breaching として扱っているから","スケールアウトはどれか 1 つのポリシーで発動するが、スケールインは有効な全ポリシーが同意したときだけ実行されるから"],"a":3,"e":"複数のターゲット追跡ポリシーでは、スケールアウトは「どれか 1 つ」の要求で起き、スケールインは「全ポリシーの同意」が必要という非対称な仕様です（可用性をコスト削減より優先）。CPU が低くても、もう一方の指標（ターゲットあたりリクエスト数）がまだ高ければ縮退しません。A・B は仕様の誤解、C は別の設定の話です。"},
{"d":3,"q":"来週の決まった開始時刻に、過去に例のない大規模データ移行が推論 API に流入します。繰り返しの履歴はありません。事前に容量を確保しつつ、想定外の変動にも追従したい場合、最も適切な組み合わせはどれですか。","c":["開始時刻に合わせたスケジュールスケーリングで事前に容量を引き上げ、ターゲット追跡を併用する","予測スケーリングのみを有効化する","ターゲット追跡のみに任せ、負荷到来後の自動拡張を待つ","最大容量を恒久的に 10 倍へ引き上げる"],"a":0,"e":"開始時刻が分かっている一回限りのイベントにはスケジュールスケーリングで事前に底上げし、実際の変動はターゲット追跡が追う構成が正解です。予測スケーリング (B) は日次・週次の繰り返しパターンと最低 24 時間（精度向上には約 2 週間）の履歴が前提で、一回限りには機能しません。事後反応のみ (C) は立ち上がりの遅延・エラーを招き、恒久的な上限 10 倍 (D) は要件と無関係な過剰設定です。"},
{"d":3,"q":"夜間ゼロコスト化のため ECS 推論サービスの最小タスク数を 0 にし、ALB のターゲットあたりリクエスト数でターゲット追跡スケーリングを設定しました。しかし朝にトラフィックが戻ってもタスク数が 0 のまま復帰しません。原因はどれですか。","c":["ECS はタスク数 0 からのスケールアウトを一切サポートしない","ターゲット数が 0 だとターゲットあたり指標にデータポイントが存在せず、アラームが発火しないため。0 でも値が出る指標（SQS キュー深度など）やスケジュールでの復帰が必要","ALB がターゲット 0 のときリクエストを破棄するから","最小 0 の設定は Application Auto Scaling では無効だから"],"a":1,"e":"RequestCountPerTarget は「ターゲットあたり」の指標なので、タスク（分母）が 0 のときはデータポイント自体が発行されず、ターゲット追跡は反応できません。ゼロからの復帰には、タスク 0 でも値が出る指標（SQS キュー深度等）に基づくステップ/ターゲット追跡スケーリングか、営業開始前のスケジュールスケーリングを使います。最小 0 自体は有効な設定です (D は誤り)。"},
{"d":3,"q":"ドキュメントの一括アップロード時だけ埋め込み生成のワーカー群（ECS）に大きなバックログが発生し、平常時はほぼアイドルです。バースト開始に素早く反応してスケールアウトし、バックログ解消後は確実に縮退させたい場合、最も適切なスケーリング指標はどれですか。","c":["ワーカーの平均 GPU 使用率","ワーカーの平均メモリ使用率","SQS キューの滞留メッセージ数（キュー深度）に基づくターゲット追跡","1 時間ごとのスケジュールスケーリング"],"a":2,"e":"キュー深度は処理すべきバックログ量を直接表すため、バースト開始と同時に跳ね上がり（即スケールアウト）、解消すればゼロに戻る（確実なスケールイン）理想的な先行指標です。GPU/メモリ使用率 (A, B) はバックログの大きさを反映しない遅行指標で、不定期なバーストにスケジュール (D) は合いません。実務ではワーカーあたりの滞留数（backlog per task）をターゲットにします。"},
{"d":3,"q":"セマンティックキャッシュ導入の費用対効果を見積もっています。キャッシュヒット時にもゼロにならないコストとして、見積もりに必ず含めるべきものはどれですか。","c":["ヒットした質問に対する基盤モデルの生成コスト","プロンプトキャッシュの書き込み料金","Guardrails の適用料金","クエリを埋め込みに変換するモデル呼び出しと、ベクトル検索（キャッシュストア）の実行コスト"],"a":3,"e":"セマンティックキャッシュは「ヒットでも」質問を埋め込みベクトル化して類似検索する必要があるため、埋め込みモデル呼び出しとキャッシュストア（ElastiCache 等）のベクトル検索コストは常に発生します。これを含めずに FM 呼び出し削減分だけで見積もると効果を過大評価します。回避されるのは FM の生成コスト (A) 側です。"},
{"d":3,"q":"トークン消費のカスタムメトリクスを「全体の合計」だけで送っていたため、消費が倍増しても 4 モデル × 9 機能のどこが原因か特定できませんでした。既存のメトリクス名は他のダッシュボードが参照しており変えられず、大規模改修もできません。最も適切な対応はどれですか。","c":["同じメトリクス名のまま、モデルと機能をディメンションとして付与して発行する","機能ごとに別名のメトリクス 36 本を新設する","ダッシュボードを捨てて Logs Insights のアドホック集計に切り替える","X-Ray トレースのサンプリング率を 100% に上げる"],"a":0,"e":"CloudWatch メトリクスはディメンション（model=...、feature=...）で内訳を持てます。メトリクス名を変えずにディメンションを追加すれば、既存参照を壊さずにモデル別・機能別の切り分けが可能になります。36 本の新設 (B) は命名管理が破綻しやすく、Logs Insights 常用 (C) はクエリコストと手間が増え、トレース (D) はレイテンシの内訳用でトークン集計の代替になりません。"},
{"d":3,"q":"開発チームの負荷試験が本番と同じ AWS アカウントの Bedrock クォータを消費して本番にスロットリングが発生し、開発者が本番の Guardrails 設定を誤変更する事故も起き、費用も環境別に分離できていません。3 つの問題を同時に解決する最も根本的な対策はどれですか。","c":["開発の呼び出しに別の IAM ロールを使う","開発と本番で AWS アカウントを分離する（クォータ・権限・請求がアカウント単位で分かれる）","開発チームに負荷試験の実施時間帯ルールを課す","本番のクォータ引き上げを申請する"],"a":1,"e":"Bedrock のクォータはアカウント×リージョン単位なので、アカウントを分ければ開発の消費が本番に影響しなくなり、権限境界も請求も自然に分離されます（3 問題を一度に解決）。IAM ロール分離 (A) は権限には効いてもクォータと請求は共有のまま、時間帯ルール (C) は運用頼みで事故が残り、クォータ引き上げ (D) は競合の緩和にすぎません。"},
{"d":3,"q":"エージェントのツールが 4 個から 18 個に増え、毎回の呼び出しで 18 個分のツール宣言だけで約 3,200 トークンを消費し、ツール選択の誤りと遅延も増えました。まれにしか使わないツールも必要な時には使える状態を保ち、追加の推論呼び出しなしで改善する方法はどれですか。","c":["まれなツール 10 個を完全に削除する","ツール宣言を 2 回の呼び出しに分割して半分ずつ送る","ツール宣言はリクエスト単位で渡せるため、依頼内容とツールの対応付け（キーワード等の軽量ルール）で関連ツールだけを宣言して送る","大型モデルに切り替えて 18 個の宣言を処理させる"],"a":2,"e":"ツール定義は呼び出しごとに渡す仕組みなので、毎回全部送る必要はありません。依頼内容から軽量ルールで関連ツールを 1〜3 個に絞って宣言すれば、トークン・遅延・選択誤りが同時に減り、まれなツールも該当依頼では宣言されるため使えます。削除 (A) は機能喪失、分割送信 (B) は往復が増えるだけ、大型モデル (D) はコスト増で根本解決になりません。"},
{"d":3,"q":"EC エージェントは 1 件の依頼で在庫照会ツールを商品ごとに平均 5 回呼び、モデル往復が増えて p95 が 9.4 秒（要件 5 秒）です。ツールの裏の社内 API は複数の商品コードを一括で受け付けられます。回答内容を変えずに最も効果的な改善はどれですか。","c":["ツール実行側の Lambda メモリを増やす","より高速な基盤モデルに切り替える","在庫照会の結果をすべて 24 時間キャッシュする","ツールの入力スキーマを商品コードの配列にし、1 回のツール呼び出しで複数商品をまとめて照会する"],"a":3,"e":"エージェントの遅延はツール呼び出しごとの「推論→実行→観察」往復で積み上がります。API が一括照会に対応しているなら、ツールのスキーマを配列入力にして 5 回を 1 回にまとめるのが最も効きます（往復 4 回分を丸ごと削減）。Lambda メモリ (A) やモデル変更 (B) は往復回数を減らさず、在庫の 24 時間キャッシュ (C) は鮮度が要る在庫情報で誤回答のリスクがあります。"},
{"d":3,"q":"AWS Marketplace 経由で利用しているサードパーティ製 Bedrock モデルの支出が想定外に増加しました。Cost Anomaly Detection を設定済みなのに検知されません。確実にアラートを受け取る方法はどれですか。","c":["AWS Budgets でこの支出に対する予算としきい値アラートを設定する（Cost Anomaly Detection は Marketplace/外部法人請求の支出を検知対象にしないため）","Cost Anomaly Detection のしきい値を 0 ドルに下げる","モニターの種類をコスト配分タグ別に変更する","CloudWatch 請求メトリクスの異常検知バンドを使う"],"a":0,"e":"Cost Anomaly Detection には AWS Marketplace 経由（外部法人により請求される）支出が検知対象外という盲点があります。しきい値 (B) は通知の抑制量を変えるだけで検知対象は広がらず、モニター種類の変更 (C) でも対象外は対象外のままです。この支出には AWS Budgets のしきい値アラートを併用するのが正解です。"},
{"d":3,"q":"毎日 12 万件の文書を Bedrock ナレッジベースへ取り込んでいますが、約 7 割は前日と内容が同一です。ファイルの更新日時やサイズは当てにならず（サイズ不変で内容だけ変わる文書もある）、全件を毎日埋め込み直すため費用が高騰しています。最も確実に無駄な再埋め込みを防ぐ方法はどれですか。","c":["ファイルサイズが前日と同じ文書をスキップする","各文書の内容ハッシュ（SHA-256 等）を保存し、ハッシュが変わった文書だけを取り込み対象にする","取り込みを週 1 回に減らす","埋め込みモデルをより安価なものに変更する"],"a":1,"e":"内容そのもののハッシュ比較は、サイズ・日時に依存せず「内容が変わったかどうか」を厳密に判定できます。変更分だけを取り込めば埋め込みコストは約 3 割に落ちます。サイズ比較 (A) は同サイズ別内容を取りこぼし、頻度削減 (C) は鮮度要件を損ない、安価な埋め込みモデルへの変更 (D) は全ベクトルの再取り込みが必要になり逆効果になりえます。"},
{"d":3,"q":"アシスタントの回答に長い前置き・同じ内容の言い換え・不要な補足が多く、出力トークン費用が膨らんでいます。回答に含まれる情報自体は適切で、必要なのは要点と根拠だけです。情報を保ったまま、追加の呼び出しを増やさずに出力トークンを減らす最も適切な方法はどれですか。","c":["max_tokens を半分に下げて強制的に打ち切る","別のモデルで応答を要約し直す後処理を追加する","システムプロンプトで出力形式と分量を指定する（結論から述べる・箇条書き 3 点以内・前置きと言い換えの禁止など）","temperature を 0 に下げる"],"a":2,"e":"冗長さの原因が「書き方」にある場合は、プロンプトで出力形式・分量を指定するのが最も直接的で、情報を保ったまま生成そのものを短くします（生成しないトークンは課金されない）。max_tokens (A) は文の途中で切れて品質を壊し、再要約 (B) は呼び出しが増えて本末転倒、temperature (D) はばらつきの制御で長さにはほぼ効きません。"},
{"d":3,"q":"コスト削減のため Cost Explorer のライトサイジング推奨を有効化しましたが、費用の大半を占める Bedrock 推論や SageMaker エンドポイントについて推奨が一切表示されません。理由として正しいものはどれですか。","c":["推奨の生成には 6 か月分の利用履歴が必要だから","Savings Plans を購入済みのアカウントでは推奨が無効になるから","組織の管理アカウントからしか推奨を見られないから","ライトサイジング推奨の対象は EC2（Auto Scaling グループ含む）のみで、Bedrock や SageMaker は対象外だから。これらは呼び出しログ・使用率メトリクス等で自前分析する"],"a":3,"e":"Cost Explorer のライトサイジング推奨は EC2 が対象で、直近約 14 日の CloudWatch 使用率（最大 CPU が 1% 以下ならアイドル判定）を分析します。Bedrock のトークン消費や SageMaker エンドポイントは対象外なので、呼び出しログ・Invocations/使用率メトリクス・アプリケーション推論プロファイル等で自前の分析が必要です。A〜C はいずれも実在しない制約です。"},
{"d":3,"q":"OpenSearch Service の HNSW ベクトル検索で p95 が 420 ミリ秒と要件の 200 ミリ秒を超えています。ef_search は既定の 10 倍超の 512 に設定されており、リコールは 0.99（要件は 0.95）です。インデックス再構築には 8 時間かかるため避けたい場合、最初に試すべき対策はどれですか。","c":["ef_search を下げる — クエリ時パラメータなので再構築不要で、リコール 0.95 の範囲まで探索量を減らしてレイテンシを縮められる","HNSW の m パラメータを下げてインデックスを作り直す","埋め込みモデルを替えて次元数を半分にする","ノードを倍増する"],"a":0,"e":"ef_search は検索時の探索候補数を決めるクエリ時パラメータで、下げれば再構築なしで直ちにレイテンシが下がります。リコールが要件に対して 0.04 の余裕を持つ今の状況は、まさに「精度を少し売ってレイテンシを買う」局面です。m の変更 (B) と次元変更 (C) は再構築（8 時間）か全件再埋め込みが必要で、ノード倍増 (D) は費用をかける前に無料の調整から試すべきです。"},
{"d":3,"q":"RAG アプリは取得（Lambda）・生成（Bedrock）・後処理（Lambda）の 3 段構成で、ログが 3 つのロググループに分かれています。これまで時刻の近さで突き合わせていましたが、ピーク時は毎秒 80 件で同一ミリ秒に複数リクエストが並び、対応付けができません。最も確実な解決策はどれですか。","c":["3 つのロググループを 1 つに統合する","入口で一意のリクエスト ID を発番し、全段に引き回して各ログに構造化フィールドとして記録する","ログのタイムスタンプをマイクロ秒精度に上げる","ピーク時のリクエストを 1 秒あたり 10 件に制限する"],"a":1,"e":"複数コンポーネントにまたがる 1 件の処理は、相関 ID（リクエスト ID）を入口で発番して全段に伝搬し、各ログに記録するのが基本です。Logs Insights でその ID を指定すれば 3 つのロググループを横断して 1 件の全行程を取り出せます。ロググループ統合 (A) だけでは対応付けの鍵がなく、精度向上 (C) でも同時刻衝突は残り、流量制限 (D) は本末転倒です。X-Ray のトレース ID を使う形でも同じ考え方です。"},
{"d":3,"q":"1 回 18 時間のファインチューニングジョブを月 12 回、SageMaker のオンデマンドインスタンスで実行しており学習費用が高額です。数時間の完了遅れは許容でき、チェックポイントの保存・再開は実装済みです。品質を変えずに学習費用を大きく下げる方法はどれですか。","c":["学習エポック数を半分にする","より小さいインスタンスに変更して時間単価を下げる","マネージドスポットトレーニングを有効化し、中断時はチェックポイントから自動再開させる","学習を自前の EC2 スポットフリートに移して手動管理する"],"a":2,"e":"遅延許容 + チェックポイント実装済みはマネージドスポットトレーニングの理想条件です。中断と再開を SageMaker が管理し、オンデマンド比で大幅（最大約 90%）の節約が見込めます。エポック半減 (A) は品質を変えてしまい、小型インスタンス (B) は時間が伸びて総額が下がるとは限らず、自前スポット管理 (D) は同じ節約をより高い運用負荷で実現する劣後案です。"},
{"d":3,"q":"バックオフィス業務のアシスタントは 15〜30 分間隔でしか呼び出されません。長い共通プレフィックスにプロンプトキャッシュを設定しましたが、毎回キャッシュミスになり書き込みばかり発生します。プレフィックスは完全に固定です。原因と対策はどれですか。","c":["プレフィックスが最小トークン数未満なので、共通部分を増やす","キャッシュはリージョンごとに分かれるため、単一リージョンに固定する","キャッシュポイントの位置が末尾にあるため、先頭へ移動する","キャッシュの有効期限が既定の約 5 分（読み取りで延長）で、呼び出し間隔がそれを超えて毎回失効している。対応モデルで TTL を 1 時間に設定する"],"a":3,"e":"プロンプトキャッシュの有効期限は既定で約 5 分（読み取りのたびに延長）です。リクエスト間隔が 15〜30 分だと毎回失効して書き込みからやり直しになります。対応モデルでは TTL を 1 時間に設定でき、この間隔でもヒットするようになります。プレフィックスが固定である以上、A〜C は症状と一致しません（最小トークン未満なら書き込み自体が発生しません）。"},
{"d":3,"q":"ニュースアーカイブの RAG で、直近 3 か月の記事は頻繁に検索されますが、それ以前の記事はまれにしか検索されません（1 秒弱の応答で許容）。全記事を OpenSearch Serverless に保持しており、ベクトルストア費用が高騰しています。最も適切なコスト最適化はどれですか。","c":["直近の記事は低レイテンシの OpenSearch Serverless に残し、古い記事のベクトルは保存単価が低くまれなクエリ向けの Amazon S3 Vectors へ階層化する","古い記事のベクトルを削除し、必要時に再埋め込みする","全記事を 1 つの大きなインデックスに統合して管理費を下げる","古い記事の埋め込み次元を半分にして混在させる"],"a":0,"e":"アクセス頻度でストレージを階層化する発想です。ホットな直近分は低レイテンシの OpenSearch Serverless、コールドなアーカイブは保存単価が低く 1 秒未満程度で応答する S3 Vectors に置けば、検索可能性を保ったまま費用を大幅に削減できます。削除 + 再埋め込み (B) は検索漏れと再埋め込み費用を生み、統合 (C) は費用構造を変えず、次元の混在 (D) は同一インデックスでは比較不能で成立しません。"},
{"d":3,"q":"「応答が途中で切れている」という報告が散発しています。原因は max_tokens 到達と推測されますが、発生頻度を継続的に計測したいです。アプリのコードは変更せず、モデル呼び出しログ（stopReason を含む）は出力済みです。最も手軽で確実な方法はどれですか。","c":["ユーザーからの報告件数を手作業で集計する","CloudWatch Logs のメトリクスフィルターで stopReason が max_tokens のログ行を数えてメトリクス化し、しきい値アラームを設定する","毎週 Logs Insights で手動クエリを実行する","X-Ray トレースに切り詰めアノテーションを追加する"],"a":1,"e":"既知の文字列パターンを継続的に数えるならメトリクスフィルターが定石です。ログ行から数値メトリクスを作れば、ダッシュボード表示もしきい値アラームも自動化でき、コード変更は不要です。手作業 (A) と週次手動クエリ (C) は継続性・即時性に欠け、X-Ray アノテーション (D) はアプリ改修が必要で「コード変更なし」の条件に反します。"},
{"d":3,"q":"スーパーバイザー + 3 つの専門エージェントで構成されたシステムの応答が遅いのですが、どのエージェントのどのツール呼び出しが支配的かを特定できません。1 件の依頼の全行程を 1 つのトレースとして追跡する正しい方法はどれですか。","c":["各エージェントの合計実行時間を CloudWatch メトリクスで並べる","各エージェントのログを別々に目視で突き合わせる","OpenTelemetry で各エージェントを計装し、エージェント間の呼び出しでトレースコンテキストを引き継いで、推論とツール呼び出しをネストしたスパンとして記録する（AgentCore Observability / X-Ray）","エージェントを 1 つに統合してから計測する"],"a":2,"e":"分散トレーシングの核心は「トレースコンテキストの伝搬」です。各エージェントを OpenTelemetry で計装し、呼び出し時にコンテキストを引き継げば、1 件の依頼がスーパーバイザー→各エージェント→各ツールとネストしたスパンの 1 トレースになり、支配的な区間が一目で分かります。メトリクスの合計時間 (A) は内訳が見えず、目視突き合わせ (B) はスケールせず、統合 (D) は構成の放棄です。AgentCore では Transaction Search の有効化も忘れずに。"},
{"d":3,"q":"月次レポート生成で、本文の約 8 割は毎回同じ定型文（免責事項・手順説明・固定の表組み）で、残り 2 割だけが案件ごとに変わります。現在は全文を基盤モデルに生成させています。品質を保ちつつ生成コストを最も下げる方法はどれですか。","c":["全文生成をバッチ推論に切り替えて約 50% 引きにする","より安価なモデルで全文を生成する","プロンプトキャッシュで定型部分の入力を割引する","定型部分はテンプレートで組み立て、可変の 2 割だけを基盤モデルで生成して結合する"],"a":3,"e":"最も安い生成は「生成しないこと」です。固定文はテンプレートで組み立てれば出力トークンが 8 割消え、品質も決定的になります（免責事項の揺れもなくなる）。バッチ (A) や安価モデル (B) は無駄な生成を安くするだけで、プロンプトキャッシュ (C) は入力側の割引であり、出力 8 割の無駄には効きません。"},
{"d":3,"q":"日中のチャット向けにプロビジョンドスループット（時間課金・契約済み）を購入していますが、夜間はほぼ遊休です。別チームが夜間の大量要約ジョブの実行方法を検討しています。最もコスト効率の良い方法はどれですか。","c":["夜間ジョブを SQS にキューイングし、契約済みプロビジョンド容量の遊休枠内で並列度を制御しながら処理する","夜間ジョブ用にプロビジョンドスループットを追加購入する","夜間ジョブをオンデマンド Priority ティアで実行する","夜間ジョブを別リージョンのオンデマンドで実行する"],"a":0,"e":"プロビジョンドスループットは使っても使わなくても時間課金されるため、夜間の遊休枠は「すでに支払い済みの容量」です。ジョブを SQS で平準化し、チャットに影響しない範囲の並列度で遊休枠を使い切るのが追加費用ゼロで最も効率的です。追加購入 (B)・Priority ティア (C)・別リージョンのオンデマンド (D) はいずれも、支払い済み容量を遊ばせたまま新たな費用を発生させます。"},
{"d":3,"q":"オンデマンド推論で効果を上げていたプロンプトキャッシュ付きのワークロードを、コスト削減のためバッチ推論ジョブへ移行したところ、キャッシュの割引が一切効かなくなりました。理由はどれですか。","c":["バッチ推論ではプレフィックスの最小トークン数が 10 倍になるから","プロンプトキャッシュはオンデマンド推論のみが対象で、バッチ推論ジョブでは機能しないから","バッチ推論では JSONL の形式がキャッシュポイントを壊すから","バッチ推論の割引とキャッシュ割引は併用すると相殺されるから"],"a":1,"e":"プロンプトキャッシュが機能するのはオンデマンド推論のみで、バッチ推論ジョブは対象外です。バッチの約 50% 引きとキャッシュ割引は仕組みが別で、「両方取り」はできません。キャッシュ効率に依存するワークロードはオンデマンドに残し、キャッシュの効かない大量処理をバッチへ回す、という切り分けが正解です。A・C・D は実在しない仕様です。"},
{"d":3,"q":"GenAI の前処理 API を ECS on Fargate で運用しています。「利用がない夜間はコストゼロ」が要件ですが、夜間もタスク 1 つ分の課金が続いています。Lambda 移行以外で要件を満たす設定はどれですか。","c":["Fargate は自動的にゼロスケールするため、設定は不要","ECS サービスのデプロイタイプを変更する","Application Auto Scaling のスケーラブルターゲットで最小タスク数を明示的に 0 に設定する（ゼロ復帰はキュー深度指標やスケジュールで行う）","タスクの CPU 割り当てを最小にする"],"a":2,"e":"ECS on Fargate は自動ではゼロになりません。Application Auto Scaling の最小キャパシティを明示的に 0 に設定して初めてタスクゼロ＝課金ゼロにできます（Lambda は既定でアイドルゼロなのと対照的）。なおタスクが 0 のときはターゲットあたり指標が出ないため、復帰はキュー深度やスケジュールで設計します。CPU 最小化 (D) は課金を減らすだけでゼロにはなりません。"},
{"d":3,"q":"API Gateway (REST API) → Lambda → Bedrock の構成で長文レポートを生成すると、生成に 45〜60 秒かかるリクエストがクライアントに 504 エラーで返ります。Lambda 自体は正常に完了しています。最も適切な恒久対策はどれですか。","c":["Lambda のタイムアウトを 15 分に伸ばす","API Gateway のリトライ回数を増やす","より大きな Lambda メモリを割り当てる","統合タイムアウト（既定 29 秒）を超える処理なので非同期パターンに変える — 受付時に即ジョブ ID を返し、完了はポーリングや WebSocket/SNS で通知する（またはストリーミング応答に変更する）"],"a":3,"e":"API Gateway の統合タイムアウトは既定 29 秒（エッジ最適化 REST API は固定上限）で、Lambda が完走しても API Gateway 側が先に 504 を返します。45〜60 秒の生成は同期 API に載せず、ジョブ ID を即時返却する非同期化（SQS + ポーリング / WebSocket / SNS 通知）か、ストリーミングで応答開始を早める設計に変えるのが恒久対策です。Lambda のタイムアウト (A)・メモリ (C)・リトライ (B) は 29 秒の壁を動かせません。"},
{"d":4,"q":"Bedrock Knowledge Bases の検索（Retrieve）だけを対象に評価ジョブを実行し、「回答に必要な情報が検索結果に漏れなく含まれているか」を測定したいです。評価データセットには質問ごとの参照テキスト（正解となる記述）を用意しています。どのメトリクスを使うべきですか。","c":["Context relevance — 検索結果と質問の関連度を採点する","Context coverage — 検索結果が参照テキストの情報をどれだけ網羅しているかを採点する","Citation coverage — 回答文と引用の対応を採点する","Completeness — 生成された回答が質問に完全に答えているかを採点する"],"a":1,"e":"Context coverage は取得テキストを参照テキストと比較し、必要な情報の網羅度を測る検索専用の指標で、参照テキストの用意が前提です。Context relevance (A) は関連度だけを見るため、関連はあるが必要な記述が欠けた結果でも高スコアになります。Citation coverage (C) と Completeness (D) は生成回答を採点する指標で、Retrieve-and-generate 型のジョブでないと使えません。"},
{"d":4,"q":"RAG アプリで「質問と無関係なチャンクが文脈に混ざって渡されている」ことが品質低下の原因だと疑っています。この「検索結果に混入するノイズの少なさ」を直接定量化する評価メトリクスはどれですか。","c":["Faithfulness — 回答が取得文脈に根拠を持つ割合","Answer Relevancy — 回答が質問に適合している度合い","Context Precision — 取得されたチャンクのうち実際に関連するものの割合","Context Recall — 必要な情報が取得結果に含まれている割合"],"a":2,"e":"Context Precision は取得チャンク中の関連チャンクの割合で、検索ノイズ（無関係チャンクの混入）をそのまま表します。Context Recall (D) は「取り漏れ」を測る逆方向の指標、Faithfulness (A) は生成側のハルシネーション指標、Answer Relevancy (B) はパイプライン全体の出力品質で、ノイズ混入そのものを特定できません。検索器は Precision/Recall、生成器は Faithfulness と役割分担で覚えます。"},
