(function(){var P=[[614,"■ なぜ正解か\nHNSW(Hierarchical Navigable Small World)は、ベクトルを多層のグラフにして、上位層で大まかな位置を特定し、下位層で精密に探索します。全件を比較しないため検索が高速で、リアルタイム用途に向きます。代償はグラフを保持するためメモリ消費が大きく、インデックス構築にも時間がかかることです。\n■ ほかの選択肢が誤りな理由\n・「クラスターに分割して対象クラスターだけ探索」は IVF の説明です。\n・「全ベクトルと毎回距離計算」は厳密(総当たり)検索で、近似最近傍(ANN)ではありません。\n・「メモリ消費が最小」は IVF 側の特徴で、HNSW はメモリを多く使います。\n■ 覚えておくポイント\nHNSW=高速・高メモリ(大規模・高性能向き)、IVF=省メモリだが大規模ではコスト効率が悪い。"],[615,"■ なぜ正解か\nプレフィルターは、先にメタデータ(部署・日付など)で候補を絞ってからベクトル検索をします。ポストフィルターは、ベクトル検索の結果をあとからメタデータで絞ります。プレフィルターは検索対象が減るためレイテンシが下がり、関連の薄い文書も除外できます。\n■ ほかの選択肢が誤りな理由\n・「どちらも検索の後」ならプレフィルターの意味がありません。\n・出力のマスクと入力のマスクの話ではなく、あくまで検索対象を絞る順序の違いです。\n・日付専用/部署専用という区別はなく、どのメタデータにも使えます。\n■ 覚えておくポイント\nメタデータは検索精度の向上、レイテンシ短縮、アクセス制御、最新情報への限定に役立ちます。ただし絞りすぎると「何も見つからない」になります。"],[616,"■ なぜ正解か\nOpenSearch のインデックスは(RDB のテーブルに相当)、1つ以上のシャードで構成されます。プライマリシャードが元のデータを持ち、レプリカシャードがそのコピーを持って、可用性と読み取りの負荷分散を担います。各ドキュメントは一意の ID を持ち、どのシャードに置くかはその ID のハッシュ値で決まります。\n■ ほかの選択肢が誤りな理由\n・元データを持つのはプライマリで、レプリカはコピーです(逆の説明は誤り)。\n・シャーディングはデータを複数に分割して分散する仕組みで、1台に全部置くのではありません。\n・インデックスが「シャードの集まり」であって、ドキュメントの集まりではない、という説明も逆です。\n■ 覚えておくポイント\nドキュメント=レコード、インデックス=テーブル、シャード=インデックスの分割単位。"],[617,"■ なぜ正解か\nソース文書が更新されても、ベクトルストアは自動では更新されません。S3 イベント通知はソースの更新を検知して Lambda を起動できるので、更新に追従できます。EventBridge Scheduler を使えば、たとえば週1回の定期更新もできます。\n■ ほかの選択肢が誤りな理由\n・手動で毎回再作成するのは運用負荷が大きく、鮮度の仕組みにはなりません。\n・埋め込みモデルを毎日変えると、全ベクトルの作り直しが毎日必要になります。\n・Guardrails の再作成は、ベクトルストアの鮮度とは無関係です。\n■ 覚えておくポイント\n更新の仕組み(イベント駆動か定期か)と頻度を設計する。判断軸は「元データの変更頻度 × 古い回答の許容度」です。"],[618,"■ なぜ正解か\n次元数は埋め込みベクトルの要素数です。次元が高いほど意味の違いを細かく表現でき、検索精度は上がります。一方で、ベクトルデータベースのストレージ消費と、類似度計算の負荷(レイテンシ)が増えます。逆に次元が低いと、計算と保存は軽くなりますが、近いベクトルの差を捉えにくくなります。\n■ ほかの選択肢が誤りな理由\n・「次元が低いほど精度が上がる」は逆です(精度は下がる)。\n・次元は精度にもコストにも影響します。\n・次元が高いとストレージ消費は減りません(増えます)。\n■ 覚えておくポイント\n精度とコストのトレードオフ。対象言語・ドメイン・コスト・レイテンシ・マルチモーダル対応も選定基準です。"],[619,"■ なぜ正解か\n類似度の計算は、ベクトルが同じ座標空間にあることが前提です。異なる埋め込みモデルは別の空間を作るので、同じ意味の文章でもベクトルの位置が違います。そのため、ドキュメントとクエリには同じ埋め込みモデル(同じ次元)を使う必要があります。\n■ ほかの選択肢が誤りな理由\n・クエリ用だけ別モデルにすると、座標空間が一致せず検索結果が無意味になります。\n・生成に使う FM とは役割が別ですが、埋め込み側(ドキュメント/クエリ)は必ず揃える必要があります。\n・埋め込みモデルを変えるなら全ベクトルの作り直しが必要で、「一度作れば更新不要」ではありません。\n■ 覚えておくポイント\nモデルの変更=全文書の再埋め込み。"],[620,"■ なぜ正解か\nベクトル同士の近さの測り方は3つあります。コサイン類似度は角度を測り、-1〜1(1 に近いほど同じ向き、0 は無関係、-1 は逆向き)で、一般的な埋め込みモデルでよく使われます。内積は向きに加えて大きさも考慮し、ユークリッド距離は2点の直線距離で、小さいほど似ています。\n■ ほかの選択肢が誤りな理由\n・BLEU・ROUGE・BERTScore は、生成文の品質を評価する指標です。\n・HNSW・IVF・k-NN は、近傍探索のアルゴリズムです。\n・温度・top_p・top_k は、生成時の推論パラメータです。\n■ 覚えておくポイント\n「ベクトルの類似度の指標」「近似検索のアルゴリズム」「生成の品質指標」「推論パラメータ」を区別する。"],[621,"■ なぜ正解か\n単語を単位にすると語彙が無限になり、データベースが巨大化して未知語に対応できません。文字を単位にすると意味の単位が失われ、文脈の学習が非効率になります。トークンは、サイズを現実的に保ちつつ意味も捉えられる、バランスのよい単位です。\n■ ほかの選択肢が誤りな理由\n・トークンは単語の一部、句読点、1文字のこともあり、常に1単語ではありません。\n・画像専用ではなく、テキストを含む入力の基本単位です。\n・暗号化とは無関係です。\n■ 覚えておくポイント\nコンテキストウィンドウはトークン数で決まる。同じ文字数でも日本語は英語よりトークン数が多くなる傾向があります。"],[622,"■ なぜ正解か\nRAG は3フェーズです。インデキシングでは、文書を収集してチャンク化し、埋め込みモデルでベクトル化してベクトルデータベースに格納します。リトリーバルでは、クエリをベクトル化して類似検索を行い、近いチャンクを取得します。ジェネレーションでは、取得したチャンクとクエリを合わせてプロンプトにして LLM が回答を作ります。\n■ ほかの選択肢が誤りな理由\n・ジェネレーションが先頭になる順序は、根拠なしに回答を作ることになり、RAG ではありません。\n・ファインチューニングは RAG のフェーズではありません。\n・「チャンク化→回答生成→埋め込み」では、検索に使う索引ができません。\n■ 覚えておくポイント\nKnowledge Bases for Bedrock は、この3フェーズ全てをマネージドで担います。"],[623,"■ なぜ正解か\n通常の RAG のベクトル検索は、意味的に近いチャンクは見つけられても、エンティティ間の関係を辿れません。たとえば「田中はプロジェクトXのリーダー」「プロジェクトXは AI 事業部の管轄」という2つのチャンクがあるとき、「田中の所属部門は?」は前者にしかヒットしません。GraphRAG は関係をグラフ(田中→プロジェクトX→AI 事業部)で保持するので答えられます。\n■ ほかの選択肢が誤りな理由\n・埋め込みモデルもチャンキングも、グラフ RAG でも引き続き必要です。\n・グラフの構築・検索が加わるため、常に安いわけではありません。\n■ 覚えておくポイント\nNeptune Analytics を KB のベクトルストアに選ぶと、エンティティ抽出からグラフ検索までマネージドに実行されます。"],[624,"■ なぜ正解か\nHyDE は、ユーザーのクエリを直接ベクトル化せず、LLM に仮の回答文を書かせて、その回答文をベクトル化して検索します。質問文より、回答文のほうが文書の文体・語彙に近く、ベクトル空間での類似度が上がるためです。\n■ ほかの選択肢が誤りな理由\n・同義語の追加は「クエリ拡張」です。\n・複合質問の分割は「クエリ分解」です。\n・検索結果の並べ替えは「リランキング」です。\n■ 覚えておくポイント\nクエリ拡張だけが KB のマネージド機能で、クエリ分解・クエリ変換・HyDE は Lambda などで LLM を呼んで自前実装します。"],[625,"■ なぜ正解か\n従来の RAG は、検索結果が不十分でもそのまま回答を生成します。エージェント型 RAG では、エージェントが質問を解釈し、検索が必要かを判断し、結果が不十分なら追加の検索をして、十分な情報が揃ってから回答を生成します。\n■ ほかの選択肢が誤りな理由\n・「不十分でもそのまま回答」は従来型の弱点です。\n・必ず1回だけの検索という固定動作ではありません。\n・人間が毎回クエリを書くのではなく、エージェントが自律的に判断します。\n■ 覚えておくポイント\nAWS では Bedrock Agents で実装でき、KB 検索と外部関数・API 呼び出しを自律的に使い分けます。"],[626,"■ なぜ正解か\n外部アプリから KB を使う方法は3つです。関数呼び出し(Function calling)は、KB を LLM のツールとして登録し、質問内容に応じて LLM が必要なときだけ検索するのでコスト最適です。MCP は多くの LLM が対応する標準プロトコルで、複数の AI ツールを併用するときに便利です。REST API は汎用的で、拡張や移行がしやすい方法です。\n■ ほかの選択肢が誤りな理由\n・SMTP・FTP・SNMP はメール・ファイル転送・ネットワーク管理のプロトコルで、RAG の呼び出しとは無関係です。\n・「gRPC・GraphQL・SOAP のみ」「SSH・Telnet・RDP」も、動画で紹介された方法ではありません。\n■ 覚えておくポイント\n関数呼び出し=必要なときだけ RAG、MCP=複数ツールで共通利用、REST=汎用。"],[627,"■ なぜ正解か\n継続事前学習は、特定分野(法律・医学など)の大量のラベルなしテキストでモデルを追加学習し、その分野の専門用語や文脈を理解させます。結果として、専門家のような振る舞いを獲得します。\n■ ほかの選択肢が誤りな理由\n・スタイルや形式を教え、プロンプトと応答のペアを使うのは「教師ありファインチューニング」です。\n・人間の好みに合わせ、フィードバックデータを使うのは「RLHF」です。\n・大型モデルから小型モデルへ知識を移すのは「蒸留」です。\n■ 覚えておくポイント\nデータの種類(ラベルなし/ペア/人間のフィードバック/教師出力)で手法を見分ける。"],[628,"■ なぜ正解か\nRAG は、モデルを再学習せず、外部のデータで知識を補います。モデルが知らない最新情報や社内情報に答えさせたいときに使います。ファインチューニングは、新しいパラメータで学習し直して、答え方・スタイル・専門用語への適合を変えます。両方を組み合わせることもできます。\n■ ほかの選択肢が誤りな理由\n・最新情報はファインチューニングでは追えません(再学習が必要)。\n・学習データは教師データとして使うだけで、データ自体は不変なので、ハルシネーション対策にはなりません。\n・パラメータを更新するのはファインチューニングで、RAG ではありません。\n■ 覚えておくポイント\n知識の不足=RAG、振る舞いの変更=ファインチューニング。"],[629,"■ なぜ正解か\nLoRA(Low-Rank Adaptation)は、元の重みは固定したまま、小さなアダプター行列だけを追加で学習します。学習するパラメータ数が大幅に減るので、学習時間・コスト・ストレージコストが下がります。ベースモデルを共有して、用途ごとにアダプターだけを切り替える使い方もできます。\n■ ほかの選択肢が誤りな理由\n・全重みの更新は「フルファインチューニング」です。\n・トークンの暗号化とは無関係です。\n・画像を生成する拡散モデルとは別の技術です。\n■ 覚えておくポイント\nBedrock のファインチューニングでは LoRA のランクなど内部パラメータは調整できません(AWS 側がマネージド)。概念だけ理解すれば十分です。"],[630,"■ なぜ正解か\nAWS では、ファインチューニング、継続事前学習(CPT)、蒸留を並列に「カスタムモデル」として扱います。Bedrock でトレーニングして、Bedrock エンドポイントにデプロイします。カスタムモデルを使うときは、プロビジョンドスループットを選択します。\n■ ほかの選択肢が誤りな理由\n・RAG・プロンプトエンジニアリング・キャッシュは、モデルを変更せずに使う手法です。\n・Guardrails・PrivateLink は、安全性とネットワークの機能です。\n・CloudWatch・X-Ray・CloudTrail は、監視と監査のサービスです。\n■ 覚えておくポイント\nカスタマイズは大きく3分類(プロンプトの調整/パラメータの変更/元のモデルから別モデルの作成=蒸留)。"],[631,"■ なぜ正解か\n埋め込みモデルも基盤モデルの一種で、Bedrock では Amazon Titan Embeddings や Nova の埋め込みモデルなどが使えます。選ぶときは基盤モデルと同様に、次元数や用途(多言語・マルチモーダルなど)を考慮します。\n■ ほかの選択肢が誤りな理由\n・Amazon Polly はテキストを音声に変換するサービスです。\n・Amazon Rekognition は画像・動画の認識サービスです。\n・AWS Glue は ETL・データカタログのサービスで、埋め込みモデルではありません。\n■ 覚えておくポイント\n埋め込みモデルと生成モデルは役割が別で、兼用はできません。"],[632,"■ なぜ正解か\nBedrock の API は2系統に分かれます。コントロールプレーンは、モデル一覧の取得、カスタムモデルの作成、ナレッジベースやガードレールの管理など、管理系の操作を担当します。データプレーンは、InvokeModel や Converse など、実際に推論を実行する API です。\n■ ほかの選択肢が誤りな理由\n・役割が逆の説明です。\n・IAM では別の名前空間として扱われ、それぞれに個別に権限を付与する必要があります。\n・データプレーンは S3 専用ではなく、モデル推論の API です。\n■ 覚えておくポイント\n管理と推論は別のエンドポイント・別の権限。PrivateLink も使う API ごとに作ります。"],[633,"■ なぜ正解か\nInvokeModel は最も低レベルな API で、細かい設定を指示できますが、リクエスト/レスポンスの形式がモデルごとに異なり、会話履歴の管理もアプリ側です。Converse は全モデル共通のスキーマ(メッセージ配列・システムプロンプト・推論設定)で、モデル切替は modelId の変更だけで済みます。\n■ ほかの選択肢が誤りな理由\n・「InvokeModel が全モデル共通」は逆です。\n・Converse もガードレールやプロンプトマネージメントとネイティブに統合できます。\n・会話履歴をサーバー側で保持するのではなく、メッセージ配列にアプリが積みます。\n■ 覚えておくポイント\n現在は Converse が推奨です。"],[634,"■ なぜ正解か\nWebSocket は、クライアントとサーバーの間で双方向の TCP 接続を維持します。そのため、クライアントからのキャンセルを送れ、サーバーから能動的にメッセージも送れます。マルチエージェントや長時間の対話セッションに向き、Cognito 認証や Lambda とも統合できます。API Gateway の WebSocket のアイドルタイムアウトは10分です。\n■ ほかの選択肢が誤りな理由\n・SSE は単方向なので、クライアントからの割り込みには別の HTTP リクエストが必要です。\n・同期 REST では、生成中の双方向のやり取りはできません。\n・SMTP はメール転送のプロトコルです。\n■ 覚えておくポイント\n双方向=WebSocket、単方向で軽量=SSE。"],[635,"■ なぜ正解か\nSSE は HTTP で動くストリーミングで、サーバーが接続を開いたままテキストを連続で送ります。プロキシやファイアウォールの設定が簡単で、WebSocket より軽量です。API Gateway の HTTP API には29秒のタイムアウトがあり、長時間のストリーミングには不向きです。Lambda 関数 URL なら最大15分まで接続を維持できます。\n■ ほかの選択肢が誤りな理由\n・双方向で割り込める、は WebSocket の特徴です(SSE は単方向)。\n・Lambda 関数 URL は Cognito 連携ができない点がデメリットです。\n・API Gateway HTTP API で無制限に接続できる、わけではありません。\n■ 覚えておくポイント\nSSE の割り込みは別 HTTP リクエストで行う。"],[636,"■ なぜ正解か\nConverseStream のレスポンスは、連続するイベントのストリームです。messageStart(応答の開始)→ contentBlockStart(ブロックの開始)→ contentBlockDelta(生成データが連続で流れる)→ 最後にトークン使用量やレイテンシなどのメトリクスが返ります。クライアントは contentBlockDelta を受け取って画面に表示していきます。\n■ ほかの選択肢が誤りな理由\n・最終結果が1回で返るのは非ストリーミングです。\n・contentBlockDelta は最初の1回ではなく、連続して発生します。\n・エラーはストリーム内のエラーイベントとして返ります(HTTP ヘッダーだけではない)。\n■ 覚えておくポイント\nツール使用時は、コンテンツブロックが複数に分かれることがあります。"],[637,"■ なぜ正解か\nストリーミングは、トークンが生成されるたびにチャンクで届けるので、最初のトークンが表示されるまでの時間(TTFT)が短くなり、ユーザーの体感が良くなります。また、生成中の内容が見えるため、途中で止めて無駄なトークン生成を避けることもできます。\n■ ほかの選択肢が誤りな理由\n・生成の合計時間は変わりません(半分にはなりません)。\n・料金も変わりません。\n・クォータが増えるわけでもありません。\n■ 覚えておくポイント\n改善するのは体感(TTFT)。総レイテンシを下げるのは小型モデルやレイテンシ最適化推論です。"],[638,"■ なぜ正解か\nアクショングループは、エージェントが実行できる操作の定義で、スキーマ(何ができるか)と Lambda 関数(実際の処理)で構成されます。スキーマは OpenAPI スキーマ(既存の REST API の接続向け)か、ファンクションスキーマ(関数名・説明・パラメータを JSON で定義する簡易版)で定義します。\n■ ほかの選択肢が誤りな理由\n・ベクトルストアと埋め込みモデルは、ナレッジベース(RAG)の要素です。\n・VPC と NAT ゲートウェイは、ネットワークの構成です。\n・KMS キーと CloudTrail は、暗号化と監査です。\n■ 覚えておくポイント\nLLM がアクショングループを呼び、パラメータが Lambda に渡されて、結果がエージェントに返ります。"],[639,"■ なぜ正解か\n短期メモリは、セッション内の会話履歴を保持し、セッションが終わると破棄されます。長期メモリは、セッションをまたいで履歴を永続化します。メモリはユーザー ID で管理されます。\n■ ほかの選択肢が誤りな理由\n・「短期がセッションをまたぐ」は逆です。\n・「長期がセッション終了で破棄」も逆です。\n・メモリはモデルのパラメータではなく、別に保存される履歴です。\n■ 覚えておくポイント\n推論プロセスのトレースを見ると、エージェントの各ステップ(ReAct のループ)を確認でき、間違ったアクショングループや不要なループも調べられます。"],[640,"■ なぜ正解か\nBedrock Agents は、プロンプト管理・推論・ReAct ループなどを AWS が管理するフルマネージドで、インストラクション・アクショングループ・KB を設定するだけで作れます。モデルは Bedrock のものに限られます。AgentCore は Strands・LangGraph・CrewAI などのフレームワークやサードパーティのモデルも使え、認証・メモリ・ツール統合・監視といった大規模運用の機能を提供します。\n■ ほかの選択肢が誤りな理由\n・機能も対象も異なり、名前が違うだけではありません。\n・AgentCore はモデルも Bedrock に限りません。\n・任意のフレームワークが使えるのは AgentCore のほうです。\n■ 覚えておくポイント\n標準的なエージェントを手早く=Bedrock Agents、自由度と大規模運用=AgentCore。"],[641,"■ なぜ正解か\nStrands Agents は AWS がオープンソースで公開している AI エージェントのフレームワークで、Python と TypeScript に対応します。「モデル駆動型」で、プロンプトで役割とツールを定義すると、LLM が自動でタスクの計画・ツール呼び出し・評価を行います。数行のコードで作れ、Bedrock・OpenAI・Gemini などの幅広いモデルに対応し、MCP や A2A にも対応します。\n■ ほかの選択肢が誤りな理由\n・有償のマネージドサービスではなく OSS で、Bedrock 専用でもありません。\n・データベースのスキーマ移行ツールではありません。\n・画像生成ライブラリでもありません。\n■ 覚えておくポイント\nローカル・Lambda・EC2・AgentCore Runtime などにデプロイできます。"],[642,"■ なぜ正解か\nエージェントグラフ(Graph)は、エージェント間の依存関係と実行順序を DAG(有向非巡回グラフ)として定義するパターンで、条件分岐を含む複雑な処理を表現できます。\n■ ほかの選択肢が誤りな理由\n・スワーム(Swarm)は、複数の類似エージェントが同時にアプローチする(ブレインストーミングのような)パターンです。\n・エージェントワークフローは、前のエージェントの出力が次の入力になる直列のパイプラインです。\n・ツールとしてのエージェントは、オーケストレーターがサブエージェントをツールとして呼ぶ一般的なパターンです。\n■ 覚えておくポイント\nパターンは組み合わせて使えます(スワームの中にグラフを含めるなど)。"],[643,"■ なぜ正解か\nMCP はエージェントと、ツール/データソースを接続する標準で、クライアントサーバーモデルです。エージェントが外部ツールを実行するためのインターフェースを標準化します。A2A は、異なるフレームワークで作られたエージェント同士が通信するためのプロトコルで、タスクの定義・進捗と結果・ステートの共有を標準化します。\n■ ほかの選択肢が誤りな理由\n・役割が逆の説明です。\n・どちらも暗号化アルゴリズムではありません。\n・画像専用/音声専用でもありません。\n■ 覚えておくポイント\nエージェント⇔ツール=MCP、エージェント⇔エージェント=A2A。"],[644,"■ なぜ正解か\nAppConfig のフラグにモデル ID を持たせ、Lambda が実行時に読み込めば、設定値の変更だけでモデルを切り替えられます。Converse API なら modelId の変更だけで済むため相性が良く、段階的なデプロイやロールバックも容易です。温度などのパラメータも変数化して管理できます。\n■ ほかの選択肢が誤りな理由\n・毎回コードを書き換えてデプロイするのは、コード変更なしという要件に反します。\n・ステージ名を変えても、モデル選択は変わりません。\n・モデルごとに別アカウントを使う必要はありません。\n■ 覚えておくポイント\nリクエスト内容に応じて Lambda で大型/小型モデルに振り分ける構成もとれます。"],[645,"■ なぜ正解か\nStep Functions の Choice ステートは、生の文章を直接判定できません。そこで、最初の Task ステートで、プロンプトを分類してラベルを付けます(出力は後続で扱いやすい JSON)。次に Choice ステートでそのラベルを評価して、コード生成なら高価なモデル、一般的な質問応答なら軽量なモデルへ振り分けます。\n■ ほかの選択肢が誤りな理由\n・Wait ステートは待機するだけで、振り分けには使えません。\n・Map ステートは配列の各要素の反復処理です。\n・Parallel ステートは全ブランチを同時に実行するので、振り分けになりません。\n■ 覚えておくポイント\n自前実装の代わりに、マネージドなインテリジェントプロンプトルーティングも使えます。"],[646,"■ なぜ正解か\nサーキットブレーカーは3状態です。クローズドは正常で、通常通り転送し失敗をカウントします。失敗数が閾値を超えるとオープン(遮断)になり、リクエストを代替経路へ回して、バックエンドへの負荷を避けます。一定時間後にハーフオープンになり、限定的に元のモデルへ転送して復帰を確認します。\n■ ほかの選択肢が誤りな理由\n・「オープン=正常」は逆です(電気回路のスイッチの用語とは異なり、オープンは遮断)。\n・ハーフオープンは全リクエストを通すのではなく、限定的に試します。\n・状態は2つではなく3つです。\n■ 覚えておくポイント\nAWS では SDK のリトライ・Step Functions のエラー検知とカウント・DynamoDB の状態保存を組み合わせます。"],[647,"■ なぜ正解か\nグレースフルデグラデーションは、障害時にクラッシュさせず、品質を段階的に縮小しながら稼働を維持する考え方です。高品質モデル → バランス型モデル → 軽量モデルと順にフォールバックし、全て失敗した場合は ElastiCache などに保存した過去の応答をキャッシュから返し、それも無理なら最終手段として静的な応答を返します。\n■ ほかの選択肢が誤りな理由\n・最初から静的な応答では、使えるモデルを活かしていません。\n・失敗した全リクエストを破棄するのは、縮退ではなく停止です。\n・全モデルを同時に呼ぶのは、コストが膨らむだけでフォールバックではありません。\n■ 覚えておくポイント\nStep Functions の Catch と Retry で、スロットリングなどを捕捉して次のステートへ遷移させます。"],[648,"■ なぜ正解か\nプロンプトマネージメントは、プロンプトをアプリコードから分離して、コンソールで管理するマネージドな機能です。変数を定義して動的に値を注入でき、バージョニングで変更履歴を追跡でき、本番反映前に承認ワークフローを挟めます。テンプレートを S3 に一元保存して CI/CD や GitHub と連携することもできます。\n■ ほかの選択肢が誤りな理由\n・プロンプトの自動最適化やモデルの再学習をする機能ではありません。\n・変数は使えます。\n・バージョン管理もできます。\n■ 覚えておくポイント\n複数のプロンプトをチェーンで接続するのは、別機能の Prompt Flows(Bedrock Flows)です。"],[649,"■ なぜ正解か\nBedrock Flows は、複数のプロンプトを視覚的にチェーンとして接続する機能で、ノーコード/ローコードで構築できます。プロンプトの出力を別のプロンプトの入力にする(英語から日本語に翻訳してから要約するなど)ことや、出力内容に応じた条件分岐、共通の処理や検証ロジックのコンポーネント化・再利用ができます。\n■ ほかの選択肢が誤りな理由\n・モデルの重みの更新はファインチューニングの領域です。\n・画像の圧縮とは無関係です。\n・ネットワークの分離は VPC 等の領域です。\n■ 覚えておくポイント\n前処理・後処理(Lambda 等)との統合も可能です。"],[650,"■ なぜ正解か\nモデルの出力は確率的で、正しい結果を出す確率は100%ではなく、異常値を返すこともあります。そのため Lambda 関数などで、決定論的な出力検証(JSON スキーマのバリデーション・キーワードチェック・スコアリング)を行います。Step Functions の Choice ステートで複数のテストケース(境界値・空文字・超長文・多言語混在)を並列実行し、CloudWatch にモデルの正解率をメトリクスとして出力してアラームを設定します。\n■ ほかの選択肢が誤りな理由\n・確率的だからこそテストが必要です。\n・毎回人手で全件確認するのは、スケールしません。\n・temperature を上げると出力がさらに不安定になり、検証になりません。\n■ 覚えておくポイント\nリリース後の異常をアラームで自動通知できます。"],[651,"■ なぜ正解か\nBedrock は、フルマネージドなので運用負荷を最小にでき、ガードレールや RAG などの Bedrock の機能もそのまま使えます。SageMaker は、より細かいカスタマイズが必要な場合、独自のモデルを使いたい場合、ブルー/グリーンデプロイを使いたい場合に向きます。\n■ ほかの選択肢が誤りな理由\n・SageMaker のほうが常に運用負荷が低いわけではなく、むしろインフラの管理が増えます。\n・Bedrock でもファインチューニング・継続事前学習・蒸留などのカスタマイズができます。\n・両者は機能も向き不向きも異なります。\n■ 覚えておくポイント\nどちらでも、カスタムモデルの推論には Bedrock ならプロビジョンドスループットを選択します。"],[652,"■ なぜ正解か\nプロンプトインジェクションは、ユーザーが入力するプロンプトに悪意のある指示を紛れ込ませ、AI に本来のタスクを無視させて、攻撃者の指示を実行させる攻撃です。たとえば文章要約をするはずのモデルに、悪意のあるコメントを応答させます。\n■ ほかの選択肢が誤りな理由\n・ジェイルブレイクは、安全ガードレールを巧みなプロンプトで回避して有害な応答を引き出す攻撃です(「あなたは小説家です」の前提など)。\n・プロンプトリークは、システムプロンプトや参照している機密情報を出力させる攻撃です。\n・プロンプトポイズニングは、RAG の知識ソースに悪意のある情報を埋め込む攻撃です。\n■ 覚えておくポイント\nこれらを総称して「プロンプト攻撃」と呼びます。"],[653,"■ なぜ正解か\nプロンプトポイズニングは、特に RAG を標的として、AI が参照する知識ソースに意図的に悪意のある情報を埋め込む攻撃です。たとえば編集権限を持つ攻撃者が、社内データに偽のルールを追加すると、ボットは汚染されたデータに基づいて誤った応答をします。\n■ ほかの選択肢が誤りな理由\n・ジェイルブレイクは、ガードレールの回避です。\n・プロンプトリークは、隠された情報を出力させる攻撃です。\n・ハイジャッキングは、インジェクションの中でも AI の本来のタスクを中断させて、攻撃者の利益になる別タスクを実行させる攻撃です。\n■ 覚えておくポイント\n攻撃の入口が「ユーザー入力」か「知識ソース」かで区別する。"],[654,"■ なぜ正解か\n解釈可能性は、モデルがなぜその結論に至ったかを人間が理解できないという問題です。基盤モデルは複雑な問題を解ける一方で、内部のプロセスを直感的に理解することが難しく、応答はブラックボックスです。そのため、誤った回答をしても原因の特定や修正が難しく、医療などの重要な意思決定ではAIの判断を鵜呑みにできません。\n■ ほかの選択肢が誤りな理由\n・ハルシネーションは、事実に基づかない情報をもっともらしく生成する問題で、RAG が有効です。\n・バイアスは、学習データの偏見(ジェンダー・人種・文化)を学習する問題です。\n・著作権は、学習データや生成物の権利が法的に未整備な問題です。\n■ 覚えておくポイント\nAI だけでは社会的な説明責任を果たせない。"],[655,"■ なぜ正解か\nコンテンツフィルターは有害カテゴリの検出、拒否トピックは業務範囲外のトピックのブロック(例: 金融機関のチャットボットで投資アドバイスを禁止)、単語フィルターは指定した語や不適切な表現のブロックです。PII・機密情報フィルターは個人情報を検出してマスキングまたはブロックし、グラウンディングチェックは出力が提供されたコンテキストに基づくかを検証します。\n■ ほかの選択肢が誤りな理由\n・拒否トピックは画像の暗号化ではなく、トピックの制限です。\n・グラウンディングチェックは PII のマスキングではなく、根拠との整合の検証です。\n・コンテンツフィルターはコスト課金の制御ではありません。\n■ 覚えておくポイント\n全フィルターで強度を設定できます。画像のコンテンツフィルターもあります。"],[656,"■ なぜ正解か\nグラウンディングとは、LLM の出力を信頼できる情報源に基づかせる手法です。グラウンディングチェックは、出力と情報源の関連性を評価し、情報源に書かれていない内容を勝手に生成していないか、出力が質問に直接答えているかをスコアで評価します。しきい値を設定し、下回ればブロックまたは警告を返すよう構成できます。\n■ ほかの選択肢が誤りな理由\n・出力を常に自動で書き換える機能ではありません。\n・入力だけでなく出力(と根拠)を対象にします。\n・スコアのしきい値は設定できます。\n■ 覚えておくポイント\nデータソースや RAG の検索結果を根拠として回答させることでハルシネーションを抑制します。"],[657,"■ なぜ正解か\nガードレール単体では防ぎきれないハルシネーションを、複数の手段で抑えます。構造化出力(JSON スキーマ準拠)は表現の揺れを減らします。Text-to-SQL は、自然言語の代わりに SQL を生成させ、DB の実行結果を返すことで、回答根拠が SQL として明示されます。セマンティック類似度の検証では、出力と根拠文書のベクトル類似度を計算し、乖離が大きければ再生成します。多重生成と一致確認(セルフコンシステンシー)では、同じプロンプトの複数回答が一致したものだけを採用します。\n■ ほかの選択肢が誤りな理由\n・温度を最大にすると出力が不安定になります。\n・出力を長くしても根拠は増えません。\n・学習データを削除しても事実性は上がりません。\n■ 覚えておくポイント\n構造化・決定論的な処理・検証・合意を組み合わせる。"],[658,"■ なぜ正解か\n多層防御は、1つの層が突破されても他の層で守る設計です。ガードレールの前段に、Lambda などで入力の前処理(プロンプトの長さ・構造の検証、想定外の入力の排除)を置き、後段に出力の後処理(回答に必須項目が欠けていれば再生成するなど)を置きます。Well-Architected のセキュリティの柱でも、ネットワーク・IAM・データ保護・検出とモニタリングで多層防御を構成することが推奨されています。\n■ ほかの選択肢が誤りな理由\n・ガードレール1つだけでは、突破されたときに守れません。\n・入力前処理にも意味があります(不要とするのは誤り)。\n・出力後処理でモデルを再学習することはしません(検証と再生成です)。\n■ 覚えておくポイント\n「どの層も漏れる」前提で重ねる。"],[659,"■ なぜ正解か\nVPC エンドポイントには、ゲートウェイ型とインターフェース型があります。Bedrock にはインターフェース型(PrivateLink)を使い、VPC 内から AWS のプライベートネットワーク経由で直接アクセスできます。インターネットの影響を受けず、VPC を経由するのでセキュリティグループや VPC エンドポイントポリシーで通信を細かく制御できます。\n■ ほかの選択肢が誤りな理由\n・ゲートウェイ型は S3 と DynamoDB 専用です(頻出のひっかけ)。\n・インターネットゲートウェイはパブリックな経路です。\n・VPC ピアリングは VPC 同士の接続で、AWS サービスへのプライベート接続ではありません。\n■ 覚えておくポイント\nBedrock は API ごと(bedrock / bedrock-runtime / bedrock-agent / bedrock-agent-runtime)にエンドポイントを作ります。"],[660,"■ なぜ正解か\nBedrock のアクセスは IAM で、サービス・アクション・モデル・リージョンなど多様な単位で制御できます。最小権限の原則で、必要最小限のアクション(InvokeModel のみ許可、ファインチューニングは拒否など)と、必要最小限のモデル(ポリシーの Resource に特定モデルの ARN を指定)だけを許可します。\n■ ほかの選択肢が誤りな理由\n・bedrock:* を全リソースに許可するのは最小権限の逆です。\n・ルートユーザーの日常利用は避けるべきです。\n・モデルアクセスを全員に開放すると、想定外のモデル利用とコスト増を招きます。\n■ 覚えておくポイント\nIAM Identity Center の許可セット(ベーシック/スタンダード/プロの階層)と組み合わせると、グループごとの管理がしやすくなります。"],[661,"■ なぜ正解か\nPII の検出は、いつ働くかで使い分けます。Comprehend はテキスト内の PII をリアルタイムに検出し、Lambda での前処理・後処理に組み込めます。Macie は S3 上の機密データを自動で発見します。Bedrock Guardrails の PII フィルターは、Bedrock の入出力で PII をマスキングまたはブロックします。\n■ ほかの選択肢が誤りな理由\n・役割が逆の説明です(Macie は S3 のスキャン、Comprehend はテキストの検出)。\n・Guardrails は S3 に保存されたデータをスキャンしません。\n・いずれも PII を扱えます。\n■ 覚えておくポイント\nデータ保護は、保存時(S3 の既定暗号化・KMS)と転送時(TLS)の両方を暗号化します。"],[662,"■ なぜ正解か\nCloudTrail は API 呼び出しの記録で、誰がいつどのモデルを呼んだかを証跡として残し、監査に使います。CloudWatch は、利用状況をメトリクス(トークン数・呼び出し回数・エラー率)として可視化し、異常なトラフィックにアラームを設定できます。CloudWatch Logs は、モデル呼び出しログ(プロンプトと応答)の出力先にもなります。\n■ ほかの選択肢が誤りな理由\n・役割が逆の説明です。\n・両者は別の機能です。\n・CloudWatch Logs にはプロンプトと応答を保存できます。\n■ 覚えておくポイント\n監査=CloudTrail、監視・内容の保存=CloudWatch。"],[663,"■ なぜ正解か\n責任ある AI は、Bedrock の機能に対応づけられます。Guardrails は有害コンテンツのフィルタリングと PII のマスキングで安全性とプライバシーを保証します。モデル評価は、精度評価やバイアス検出で正確性と公平性を確認します。ナレッジベースはハルシネーションを抑制して正確性を高めます。モデル呼び出しのログ記録でガバナンスを保証します。\n■ ほかの選択肢が誤りな理由\n・精度評価はモデル評価の役割です(Guardrails ではない)。\n・PII のマスキングは Guardrails の役割です。\n・ナレッジベースはネットワーク分離のための機能ではありません。\n■ 覚えておくポイント\nAI レンズ(Generative AI Lens)は、責任ある AI を実装するための Well-Architected のレンズです。"],[664,"■ なぜ正解か\nオンデマンド推論は、スタンダード(標準)・プライオリティ(低レイテンシで割高)・フレックス(遅延を許容する代わりに割安)の3つの料金から選べます。\n■ ほかの選択肢が誤りな理由\n・バッチ(非同期・割安)とリザーブド(長期契約の割引)は、オンデマンドのティアとは別の購入方式です。\n・プライオリティが割安でフレックスが低レイテンシという対応は逆です。\n・ティアは存在します。\n■ 覚えておくポイント\nプロビジョンドスループットは、スループットを確保するオプションです。"],[665,"■ なぜ正解か\nプロンプトキャッシュは、プロンプトの先頭にある繰り返し使われる部分をキャッシュして再利用します。保持期間は既定で5分で、キャッシュヒット時はその部分を再利用するので、TTFT と入力トークンが削減され、コストパフォーマンスが最適化されます。\n■ ほかの選択肢が誤りな理由\n・キャッシュするのは先頭の繰り返し部分で、末尾ではありません。\n・回答全体を保存する(クエリ結果のキャッシュ)ものではありません。\n・キャッシュミスはエラーではなく、新しいチェックポイントを作るか、キャッシュなしで通常通り回答します。\n■ 覚えておくポイント\nキャッシュの書き込みと読み出しには割引が適用されます。"],[666,"■ なぜ正解か\nファインチューニングと継続事前学習は、トークン単価とモデルのストレージ月額に対して課金されます。蒸留は、教師モデルの推論コストと、生徒モデルの学習コストが発生します。単価はリージョンやモデルごとに異なります。\n■ ほかの選択肢が誤りな理由\n・カスタマイズは無料ではありません。\n・学習時だけでなく、保管(ストレージ)にも課金されます。\n・蒸留にも料金がかかります。\n■ 覚えておくポイント\n最新の料金は AWS の公式ドキュメントで確認する。"],[667,"■ なぜ正解か\nクロスリージョン推論は、元のリージョンの単価で課金され、追加コストは発生しません。スループット制限の回避や回復性の向上が得られます。一方で、トラフィックが他のリージョンを経由するため、コンプライアンスなどで地理的な制約がある場合は慎重な検討が必要です。許可するリージョンは IAM ポリシーや SCP で制限できます。\n■ ほかの選択肢が誤りな理由\n・必ず割高になるわけではありません。\n・データが常に元のリージョン内にあるのではなく、他のリージョンを経由します。\n・リージョンの制限はできます。\n■ 覚えておくポイント\n呼び出し時にインファレンスプロファイル ID を指定するだけで利用できます。"],[668,"■ なぜ正解か\nInvocationLatency は、モデルへのリクエストから最後のトークンを返すまでの時間で、要約など最終的な応答を待つワークフローで重視されます。TimeToFirstToken は、ストリーミングで最初のトークンが返るまでの時間で、チャットでは顧客満足度に影響します。InvocationThrottles は、スロットリングされた呼び出し数です。\n■ ほかの選択肢が誤りな理由\n・TimeToFirstToken は料金の指標ではなくレイテンシの指標です。\n・成功した呼び出し回数は InvocationCount など別のメトリクスです。\n・入力トークン数は InputTokenCount など別のメトリクスです。\n■ 覚えておくポイント\nトークン数のメトリクスはモデル別にフィルタリングでき、モデル ID ごとにエラーメトリクスも取得できます。"],[669,"■ なぜ正解か\n生成 AI アプリは API Gateway・Lambda・Bedrock・ベクトルストアなど複数のサービスをまたぎます。X-Ray のトレース機能を使うと、1つのリクエストがサービス間をどう流れたかを可視化でき、レイテンシ・リトライ・エラーが記録されるので、どのコンポーネントでレイテンシが発生しているかのボトルネックを突き止められます。\n■ ほかの選択肢が誤りな理由\n・CloudTrail は API 呼び出しの記録で、レイテンシの分析には向きません。\n・Macie は機密データの発見サービスです。\n・KMS のキーの確認は、暗号化の話でボトルネック調査とは関係ありません。\n■ 覚えておくポイント\nエージェントの監視には、AgentCore Observability が CloudWatch ダッシュボードで可視化します。"],[670,"■ なぜ正解か\nモデルサイズとコストはほぼ比例し、最小と最大のモデルでは利用料金に数百倍の差が出ることもあります。リアルタイムチャットでは、小型で高速なモデル(Nova Micro や Haiku)を選び、速度より品質を優先できる夜間バッチ処理には大型モデルを割り当てます。\n■ ほかの選択肢が誤りな理由\n・どちらも常に最大のモデルは、コストが過大です。\n・どちらも常に最小のモデルでは、品質が必要な処理に不足します。\n・夜間バッチにストリーミングは必須ではありません(人が見ていないため)。\n■ 覚えておくポイント\nコンテキストウィンドウもコストとのトレードオフです。"],[671,"■ なぜ正解か\nモデルカスケードは、複数のモデルを段階的に組み合わせてコストと精度のバランスを取る手法です。まず軽量なモデルで処理し、出力を評価して十分ならそのまま返し、不十分ならより高性能なモデルで処理し直します。複雑なケースだけ高性能モデルに任せることで、コストと応答速度を最適化できます。\n■ ほかの選択肢が誤りな理由\n・全リクエストを最初から高性能モデルに送るのは、カスケードの逆でコストが高くなります。\n・全モデルの出力を平均する手法ではありません。\n・モデルを毎回再学習することもしません。\n■ 覚えておくポイント\nインテリジェントプロンプトルーティングは、入力の時点で振り分け先を予測するので、さらにコストを節約できます。"],[672,"■ なぜ正解か\nROUGE は要約タスクの指標で、AI が生成した要約文と人間の要約文の間で、単語やフレーズがどれだけ重複しているかを測ります。重複度が高いほどスコアが高くなります。\n■ ほかの選択肢が誤りな理由\n・BLEU は翻訳の品質を測る指標で、短すぎる翻訳にペナルティを与えます(「要約には使えない」と断定するのは不正確ですが、要約の代表指標は ROUGE です)。\n・MMLU は、モデルの知識を測るベンチマークです。\n・SuperGLUE は、自然言語処理の能力を測るベンチマークで、翻訳専用ではありません。\n■ 覚えておくポイント\nBERTScore は埋め込みで単語の意味の類似性を比較し、より汎用的なテキスト生成を評価します。"],[673,"■ なぜ正解か\nMMLU は、高校レベルの数学から専門的な法律・倫理まで57のタスクを含み、モデルの知識や能力を測る、LLM の評価で広く使われるベンチマークです。SuperGLUE は、生成 AI ブーム以前に作られた自然言語処理の能力のベンチマークで、文章の分類や質問応答を測ります。\n■ ほかの選択肢が誤りな理由\n・MMLU は翻訳専用ではありません。\n・SuperGLUE は画像専用ではありません。\n・公開ベンチマークは一般的な評価で、実際のユースケースに当てはまるとは限りません。\n■ 覚えておくポイント\nそのため、ユースケース固有の評価を Bedrock のモデル評価で並行して行います。"],[674,"■ なぜ正解か\nBedrock のモデル評価には3つの方式があります。自動評価は、組み込みのアルゴリズムで、精度・堅牢性・毒性などをあらかじめ用意された指標とデータセットで機械的に算出します。LLM による評価は、事前学習済みのモデルを評価者にして、より人間に近い評価ができます。人手による評価は、自分で用意したデータセットで関連性やスタイルなどを人間が評価します。\n■ ほかの選択肢が誤りな理由\n・自動評価のみでは、評価できる指標が限定されます。\n・人手評価のみでは、スケールしません。\n・評価は RAG にも使えます(検索と生成を LLM で評価)。\n■ 覚えておくポイント\n開発段階は自動評価、最終的な品質確認は人手評価という使い分けが効果的です。"],[675,"■ なぜ正解か\nRAG の評価は、検索と生成の2つに分けて行います。検索は、コンテキストの関連性とカバレッジ(網羅性)を評価します。生成は、正確性とハルシネーションを含む完全性を評価します。さらに、引用の網羅性と精度も評価できます。\n■ ほかの選択肢が誤りな理由\n・トークン数や料金は、品質の評価観点ではありません。\n・RAG は LLM を使って評価できます。\n・人間でなければ評価できない、わけではありません(LLM-as-a-judge が使えます)。\n■ 覚えておくポイント\nモデル評価は CodePipeline から呼び出して CI/CD に組み込み、評価スコアに基づく承認ステップでデプロイの可否を判断できます。"],[676,"■ なぜ正解か\n503(ServiceUnavailable)はサービス側の問題で、ユーザー側の設定でできることはありません。待機するか、別のモデルやリージョンを使う対処になります。アカウントレベルのクォータやレート制限は CloudTrail に履歴が残りますが、503 は切り分けができません。\n■ ほかの選択肢が誤りな理由\n・IAM 設定の誤りは AccessDenied になります。\n・入力トークンが多すぎる場合は ValidationException などです。\n・リクエストの形式の不正も、ValidationException です。\n■ 覚えておくポイント\nストリーミング API では、エラー内容がストリーム内のイベントとして返されます。"],[677,"■ なぜ正解か\n入力トークンがコンテキストウィンドウを超えると、ValidationException が返るか、入力が切り捨てられます。対処は、長文を分割する、RAG の取得件数を減らす、プロンプトから不要な情報を除外するなど、入力側を減らすことです。\n■ ほかの選択肢が誤りな理由\n・max_tokens は出力側の上限で、入力のオーバーフローには効きません。\n・温度は出力のランダム性で、入力の長さとは無関係です。\n・KB の再作成は、入力のオーバーフローの対処になりません。\n■ 覚えておくポイント\n出力が途中で切れる場合は max_tokens を引き上げる。入力側と出力側の問題を区別する。"],[678,"■ なぜ正解か\nRAG で回答が的外れなときは、検索フェーズと生成フェーズのどちらが原因かを切り分けます。検索の問題なら、チャンキング戦略の見直し・ハイブリッド検索の導入・リランキングの導入を検討します。生成の問題なら、モデルや埋め込みの問題なので、埋め込みモデルの変更やドメイン適合性の評価を行います。\n■ ほかの選択肢が誤りな理由\n・原因に関係なくモデルを大型にするのは、切り分けなしの高コストな対処です。\n・KB を常に削除するのは、極端で不要です。\n・キャッシュを常に無効にしても、原因の切り分けにはなりません。\n■ 覚えておくポイント\n時間の経過で検索精度が劣化する(モデルのドリフト)場合は、ナレッジベースの評価を定期的に行います。"],[679,"■ なぜ正解か\nBedrock Agents には専用のエージェント評価がないため、オープンソースのツールを組み合わせて評価します。Ragas は RAG や LLM を評価するライブラリで、内部的に LLM-as-a-judge が使われます。Langfuse は、トレースと評価スコアを記録する LLM の監視プラットフォームです。\n■ ほかの選択肢が誤りな理由\n・専用のエージェント評価機能が完備されている、のではなく、ないので OSS を使います。\n・評価は不要ではなく、品質の確認に必要です。\n・Guardrails は安全性の機能で、エージェントの評価はできません。\n■ 覚えておくポイント\nエージェントの評価は、答えだけでなく、ツール選択・推論のステップ・効率(軌跡)も対象にする。"],[680,"■ なぜ正解か\ntemperature が 0 より大きい場合や、top_p・top_k を使う場合、AI は確率に基づいて次の単語を選ぶため、同じプロンプトでも毎回異なる応答になります(非決定性)。毎回完全に同じ結果が欲しいときは、temperature を 0 に設定します。\n■ ほかの選択肢が誤りな理由\n・temperature を最大にすると、ランダム性が最も高くなります(逆効果)。\n・top_p を最大にすると、候補の単語が広がり、揺らぎが大きくなります。\n・stop sequence は、特定の文字列で生成を止める機能で、揺らぎの制御ではありません。\n■ 覚えておくポイント\ntemperature が低い=決定的で予測可能、高い=創造的で多様。"],[681,"■ なぜ正解か\n試験は「どのモデルが最良か」ではなく、複数の制約が重なった状況で全てを満たす選択肢を選ばせます。制約は5つ(機能・レイテンシ・スループット・データ所在地・コスト)に整理でき、うち4つは具体的な Bedrock の機能に対応します。\n■ ほかの選択肢が誤りな理由\n・「精度、速度、色、名前、価格」「リージョン数、アカウント数…」「モデルの発表日…」は、設計上の制約ではなく、選定の判断軸になりません。\n■ 覚えておくポイント\n各制約が選択肢を消していき、全てを適用した後に残った1つが正解になる。"],[682,"■ なぜ正解か\nモデルは Active(新規利用可)→ Legacy(後継があり EOL 日が事前告知される)→ EOL(推論を提供せず呼び出しは失敗)の3段階をたどります。EOL 後は呼び出しが失敗するため、モデル ID を設定で差し替えられる設計(置き換えを前提にした構築)が必要です。\n■ ほかの選択肢が誤りな理由\n・「料金が倍になるが呼べる」「自動で最新に置き換わる」「Legacy と同じで無期限」は、いずれも EOL の挙動ではありません。\n■ 覚えておくポイント\nEOL を迎えた基盤モデルの派生カスタムモデルも使えなくなる。"],[683,"■ なぜ正解か\nConverse は統一メッセージ API で、1つの形式で全てのメッセージ対応モデルを呼べ、切替は modelId の変更だけです。InvokeModel は提供元ネイティブで、Anthropic・Nova・Llama・Cohere など提供元ごとに JSON が異なります。料金(トークン単価)は同じなので、決め手は移植性です。\n■ ほかの選択肢が誤りな理由\n・InvokeModel のほうが安い/常に高速、という事実はありません。\n・Converse もツール利用・画像・ドキュメントにネイティブ対応し、ガードレールも設定ブロックで付けられます。\n■ 覚えておくポイント\n埋め込み・画像生成・提供元固有の機能は InvokeModel を使う。"],[684,"■ なぜ正解か\n実行 API は、統一(Converse 系)か提供元ネイティブ(InvokeModel 系)か、同期/ストリーミング/非同期かの2軸で整理できます。InvokeModelWithBidirectionalStream は完全な双方向(全二重)で、リアルタイム音声の入力と出力に使います。\n■ ほかの選択肢が誤りな理由\n・ConverseStream は、統一形式の単方向ストリーミングです。\n・StartAsyncInvoke は、長時間ジョブを投げて結果を S3 に書き出す fire-and-forget です。\n・CreateModelInvocationJob は、バッチ推論(S3 入出力、約半額)です。\n■ 覚えておくポイント\n選択肢の API 名は、この表のどこに当たるかで見分ける。"],[685,"■ なぜ正解か\ntop P は確率の合計が P になる最小のトークン集合から、top K は件数で候補を制限します。max tokens は出力の長さの上限なので、長い入力プロンプトの料金は減りません。どのパラメータ設定でもハルシネーションは防げません。\n■ ほかの選択肢が誤りな理由\n・temperature を 0 にすると、同じ誤りを毎回確信を持って返すだけで、なくなりません。\n・top P は件数の固定ではありません(固定は top K)。\n・max tokens は出力のみ制限するので入力料金は下がりません。\n■ 覚えておくポイント\nストップシーケンスは、指定の文字列で生成を止める機能です。"],[686,"■ なぜ正解か\n抽出・分類・SQL 生成・JSON 生成のように、出力を下流のシステムが処理する場合は、決定性(再現性)が要件です。temperature を低くして、毎回同じ構造・同じ内容になるようにします。人間が読む創作(コピー・ブレスト)は、多様性が有益なので高めにします。\n■ ほかの選択肢が誤りな理由\n・「高く」「最大」は、揺らぎを増やすので機械処理には不向きです。\n・出力形式と temperature は無関係ではなく、構造化出力ほど低くします。\n■ 覚えておくポイント\n出力を機械が消費するか、人間が消費するかで決める。"],[687,"■ なぜ正解か\n問題は、回答が出るまで空白が続くことによる体感の悪さで、総レイテンシではありません。ConverseStream でトークンを逐次ブラウザに流せば、4秒の空白画面が、すぐに文字が流れ出す画面に変わり、離脱を防げます。\n■ ほかの選択肢が誤りな理由\n・スロットリングがないので、プロビジョンドスループット(容量)は効きません。\n・グローバルクロスリージョン推論も容量対策で、同じ理由で不適切です。\n・Lambda のメモリ調整は、4秒のモデル呼び出しに対してミリ秒しか効きません。\n■ 覚えておくポイント\n「離脱する」「遅く感じる」と聞いたら、まずストリーミングを確認する。"],[688,"■ なぜ正解か\nStandard が既定のオンデマンド(何も指定しない)、Priority は約75%の割増で高需要時に優先、Flex は約50%の割引で混雑時の高遅延を許容、Batch は非同期で S3 入出力かつ約50%の割引です。Reserved は固定月額で1か月または3か月の契約、プロビジョンドスループットはモデルユニット単位で1か月または6か月です。\n■ ほかの選択肢が誤りな理由\n・Priority が割引、Flex が割増、というのは逆です。\n・Reserved は固定の月額で、従量課金のみではありません。\n・Batch は非同期です(同期ではない)。\n■ 覚えておくポイント\n最初の4つは invoke 時の1パラメータで、バッチとプロビジョンドスループットはアーキテクチャが変わる。"],[689,"■ なぜ正解か\nReserved は1分あたりトークンで予約し、1か月または3か月の固定月額を払い、稼働率の目標は99.5%で、超過分は Standard に溢れて失敗しません。プロビジョンドスループットはモデルユニット単位の課金で、カスタム(ファインチューニング済み)モデルを提供できるのはこれだけです。\n■ ほかの選択肢が誤りな理由\n・Reserved はカスタムモデルを提供できません。\n・プロビジョンドスループットは時間課金(コミットメントの期間で単価が変わる)で、月額のみではありません。\n・超過すると失敗するのではなく、Reserved は Standard に溢れます。\n■ 覚えておくポイント\nバースト的なトラフィックに予約を使うのは、ピーク分を払い続けるので通常は誤り。"],[690,"■ なぜ正解か\n誰も個別の結果を待たず、データが既に S3 にあるなら、Bedrock のバッチ推論が合います。S3 から読み S3 に書き、約50%の割引で、数百万件のループ(並列・リトライ)は Bedrock が担います。\n■ ほかの選択肢が誤りな理由\n・Flex も約50%割引ですが、240万件の同期呼び出しと並列制御・リトライを自分で持つ必要があります。\n・プロビジョンドスループットは固定費で、バッチの代わりにはなりません。\n・モデルを変えない/品質を落とさない、という制約に反します。\n■ 覚えておくポイント\n価格が同じなら、「ループを誰が回すか」が決め手になる。"],[691,"■ なぜ正解か\nクロスリージョン推論は、推論プロファイル ID を指定すると、Bedrock が容量のある送信先リージョンに送ります。推論の計算は送信先で行われ、応答は暗号化して元に返ります。ログ・ナレッジベース・設定・保存データは元のリージョンに残ります。ジオグラフィックは範囲内に限定され、グローバルは世界中へルーティングされます。\n■ ほかの選択肢が誤りな理由\n・グローバルは規制があるときは誤りです(世界中へルーティングされるため)。\n・ナレッジベースのデータは複製されません。\n・追加のリージョン管理の設定は不要です。\n■ 覚えておくポイント\nCRIS は計算を動かすもので、保存データは動かさない。"],[692,"■ なぜ正解か\n「EU 内の処理」と「ピーク時の余裕」を両立するのは、ジオグラフィック(EU)推論プロファイルです。「開発者が誤って EU 外へルーティングするのを防ぐ」には、EU 以外のプロファイル ARN での呼び出しを拒否する SCP(組織のポリシー)が、防止的コントロールとして有効です。\n■ ほかの選択肢が誤りな理由\n・グローバルプロファイルは EU 外へルーティングされます。ログは事後に分かる検知的コントロールです。\n・3つの EU スタックは CRIS を手作りで再構築するだけです。\n・クォータ引き上げは容量を増やしますが、防止のコントロールにはなりません。\n■ 覚えておくポイント\n「防止する」と書かれていたら、検知ではなく防止の制御を選ぶ。"],[693,"■ なぜ正解か\n継続運用のパターンは5つです。SDK の指数バックオフ+ジッターのリトライ(スロットリングは通常のこと)、サーキットブレーカー(失敗する依存先を叩き続けず素早く失敗)、モデルフォールバック(小さいモデルへ)、グレースフルデグラデーション(キャッシュ応答など)、クロスリージョン推論(リージョンの容量対策)です。\n■ ほかの選択肢が誤りな理由\n・暗号化・監査・タグ付け・バックアップ・DR は、継続運用のパターンではありません。\n・クォータ引き上げのみ、リトライ無制限は、失敗時にコストを増やすだけです。\n■ 覚えておくポイント\n容量はスループットの問題、フォールバックは可用性の問題。"],[694,"■ なぜ正解か\nモデル ID を AppConfig に持たせ、Lambda が実行時に取得すれば、コード変更なしでモデルを切り替えられます。デプロイ戦略で一部のトラフィックから段階的に展開し、CloudWatch アラームで自動ロールバックもできます。\n■ ほかの選択肢が誤りな理由\n・Secrets Manager は認証情報用で、段階展開もロールバックもありません。\n・Lambda エイリアスの重み付けルーティングは、バージョンの発行(デプロイ)が必要で、「コード変更なし」に反します。\n・DynamoDB と管理用 Lambda は、設定サービスを自作することになり、運用負荷が大きい。\n■ 覚えておくポイント\n「コード変更なし」「一部のトラフィック」「自動ロールバック」が AppConfig の三点セット。"],[695,"■ なぜ正解か\nカスタム(ファインチューニング済み)モデルは、デプロイしないと何も提供できません。デプロイ(プロビジョンドスループットまたはカスタムモデルのデプロイ)を作って、そのデプロイ ARN で呼び出します。パイロットではベースモデルの ID を渡していて、デプロイが無かったため拒否されました。\n■ ほかの選択肢が誤りな理由\n・指数バックオフは、スロットリングへの対処で、リクエストが不正な ValidationException には効きません(同じエラーが返り続ける)。\n・reserved ティアにしても、デプロイがないという問題は残ります。\n・グローバルプロファイルは容量と所在地の話で、無関係です。\n■ 覚えておくポイント\nValidation=リクエストが誤り、Throttling=待てば通る。"],[696,"■ なぜ正解か\nカスタマイズは、プロンプトの調整(分単位)→ RAG → ファインチューニング → 継続事前学習と、段を上がるほど費用・時間・保守が増えます。試験では、要件を満たす最も低い段が正解です。ゼロからのモデル学習は、試験ガイドで範囲外とされています。\n■ ほかの選択肢が誤りな理由\n・常に最上段(継続事前学習)は、過剰で保守の義務も増えます。\n・ゼロから学習する選択肢は、最初から誤りです。\n・RAG のほうが高コスト、という関係ではありません(通常は RAG のほうが低い)。\n■ 覚えておくポイント\n段を上がるたびに、壊れうるものとベースモデル更新時の再学習が増える。"],[697,"■ なぜ正解か\nファインチューニングは、1000件の方針文書で学習しても、その方針文書らしい文体を学ぶほうが、内容を想起するより容易です。したがって事実を確実に追加できず、ハルシネーションも止めず、最新に保てず、学習データは全ての呼び出し元に見えるので利用者ごとの権限も表現できません。得意なのは、トーン・出力形式などの一貫性です。\n■ ほかの選択肢が誤りな理由\n・事実を確実に追加できる、権限を表現できる、は上記の限界に反します。\n・コストは常に下がるわけではありません(カスタムモデルの運用には固定費がかかる)。\n■ 覚えておくポイント\n知識の問題=検索、振る舞いの問題=ファインチューニング。"],[698,"■ なぜ正解か\n臨床プロトコルは月2回改訂され(学習では追いつけない)、回答に版の出典が必要(ファインチューニング済みモデルは出典を言えない)、職種で閲覧範囲が違う(重みでは表現できないがメタデータフィルターでは可能)、と3つの独立した理由が、学習方式を排除します。\n■ ほかの選択肢が誤りな理由\n・改訂のたびに再学習するファインチューニングは、永遠に再学習することになります。\n・継続事前学習も、更新・出典・権限のいずれにも答えません。\n・職種別モデルは、権限だけを力技で解決する誘惑的な選択肢です。\n■ 覚えておくポイント\n3つのうち1つだけでも、RAG を選ぶ十分な理由になる。"],[699,"■ なぜ正解か\n蒸留は、大きな教師モデルの応答で、小さな生徒モデルを学習します。ユーザーが用意するのはプロンプトのみで、Bedrock が教師モデルで応答を生成します。既存のモデル呼び出しログをプロンプトの元にでき、ログに応答も入っていれば生成と教師の費用を省けます。\n■ ほかの選択肢が誤りな理由\n・プロンプトと応答のペアを用意するのは、ファインチューニングです。\n・ラベルなしの大量コーパスは、継続事前学習です。\n・独自の重みのインポートは、カスタムモデルインポートです。\n■ 覚えておくポイント\n生徒は、蒸留した用途以外では教師より劣る。"],[700,"■ なぜ正解か\nログに、プロンプトと承認済みの分類が入っている点が決め手です。これは学習データセットそのもので、モデル蒸留は呼び出しログを直接読めます。フロンティアモデルを教師にすれば、精度を保ったまま、小さいモデルで費用と遅延を下げられます。\n■ ほかの選択肢が誤りな理由\n・最小モデル+プロンプト改善は、「精度を落とさない」を保証できません。\n・継続事前学習は、分類の費用・遅延の問題と関係がありません。\n・プロビジョンドスループットは、課金の形を変えるだけで、フロンティアモデルを安くも速くもしません。\n■ 覚えておくポイント\n「同等の精度で低コスト・低遅延」は蒸留。"],[701,"■ なぜ正解か\nカスタムモデルインポートは、自分の重みを、サポートされるオープンなアーキテクチャ(Llama・Mistral など)について Bedrock に持ち込む機能です。ほかの場所で行ったカスタマイズを再利用でき、インポート後は他の Bedrock モデルと同様に呼び出せます。\n■ ほかの選択肢が誤りな理由\n・どんなモデルでも、特に Anthropic のようなプロプライエタリモデルはインポートできません。\n・SageMaker AI で学習した結果をインポートする使い方はできます(不可ではない)。\n■ 覚えておくポイント\nSageMaker AI で学習して Bedrock にインポートすると、Bedrock が出していない技法も使える。"],[702,"■ なぜ正解か\nモデルパッケージグループが1つのモデルの全バージョンを持ち、各バージョンに承認ステータス(pending / approved / rejected)が付きます。このステータスがデプロイをゲートします。バージョンにはメタデータ・系統(どのデータで学習したか、スコア、モデルカード)も付き、直前の承認済みバージョンが残っているのでロールバックは再デプロイだけです。\n■ ほかの選択肢が誤りな理由\n・承認ステータスは存在します。\n・評価スコアは登録できます。\n・ロールバックに再学習は不要です。\n■ 覚えておくポイント\n評価をしてから登録する順序でないと、ゲートは名ばかりになる。"],[703,"■ なぜ正解か\nシャドーは、本番リクエストの写しを新バージョンに流して応答を破棄するので、顧客に一切影響しません(代わりにユーザーのフィードバックもない)。カナリアは、一部の実トラフィックを新バージョンに向けるので、実ユーザーが新しい出力を見ます。問題が起きたときの影響を限定する(blast radius を絞る)手法です。\n■ ほかの選択肢が誤りな理由\n・前者・後者の対応を入れ替えたもの、あるいはどちらも同じ手法とするものは、両者の違いと一致しません。\n■ 覚えておくポイント\n「顧客に影響させない」=シャドー、「影響を限定する」=カナリア。"],[704,"■ なぜ正解か\nコンプライアンスの3要件(記録された人手の承認・承認時に評価スコアが見える・数分で戻せる)を1つずつ、選択肢に当てます。Model Registry(メトリクス添付)、手動承認ゲート、直前の承認済みバージョンの再デプロイが3つ全てを満たします。\n■ ほかの選択肢が誤りな理由\n・自動品質ゲートは、工学的には優れていても、「記録された人手の承認」という指定を満たしません。\n・S3 バージョニング+プルリクエストは、評価スコアの提示と数分での復帰を満たしません。\n・1週間のシャドーは検証手法で、承認の記録にはなりません。\n■ 覚えておくポイント\n要件より優れた案でも、要件を満たさなければ誤り。"],[705,"■ なぜ正解か\nまず最新のベースモデルを、元の学習データ(既にゴールデンセットになる)で、良いプロンプトだけで評価するのが先です。数日で終わり、基準を満たせば、ファインチューニング済みモデル・プロビジョンドスループットの契約・再学習の義務をまとめて削除できます。構造化出力は新世代のモデルが最も改善した能力です。\n■ ほかの選択肢が誤りな理由\n・すぐにファインチューニングは、拙速です(「最初に」と聞かれている)。\n・EOL の延長依頼は、現実的な計画になりません。\n・オンデマンドのデプロイへの移行は、削除しようとするものの費用を最適化するだけです。\n■ 覚えておくポイント\n再構築の前に、再評価する。"],[706,"■ なぜ正解か\nAWS は能力ではなくペルソナで分けています。Bedrock はマネージドな API 駆動のジョブで、ハイパーパラメータも少なく、インフラを考えなくてよいアプリ開発者向けです。SageMaker AI は、学習ループの制御や Bedrock が出さない技法が必要なデータサイエンティスト/ML エンジニア向けで、JumpStart はその中間です。\n■ ほかの選択肢が誤りな理由\n・SageMaker のほうが常に簡単、Bedrock では全くカスタマイズできない、両者に違いはない、はいずれも事実に反します。\n■ 覚えておくポイント\nシナリオに書かれたチームの構成が、選択のヒント。"],[707,"■ なぜ正解か\n基盤モデルは、不完全な入力を受けても例外を出さず、切り詰められた表・文字コードの誤り・パースに失敗した PDF からも、流暢で確信に満ちた回答を返します。出力は正常な回答と同じ見た目で、エラー率でアラームを設定することもできません。そのため検証を上流で明示的に行います。\n■ ほかの選択肢が誤りな理由\n・壊れた入力で例外を投げる、文字化けや切り詰めを自動検出する、不要な列を自動で無視する、はいずれもモデルのしない動作です。\n■ 覚えておくポイント\nパイプラインは取り込み→検証→抽出→拡充→整形の5段階。"],[708,"■ なぜ正解か\nAWS Glue Data Quality は DQDL(宣言型のルール言語)でルールを書きます。ルール推奨機能がデータを分析して初期ルールを提案し、異常検知が過去のプロファイルから逸脱を検出します。データカタログまたは Glue ジョブの中で実行でき、失敗時は EventBridge にイベントを出します。\n■ ほかの選択肢が誤りな理由\n・ルールは Python コードのみではなく、DQDL の宣言型です。\n・異常検知は存在します。\n・カタログ化した表形式データ向けで、S3 の非構造化データ専用ではありません。\n■ 覚えておくポイント\n既知の失敗にはルールのゲート、未知の失敗には異常検知。"],[709,"■ なぜ正解か\n抽出サービスは入力に応じて使い分けます。スキャン文書とフォームは Textract(テキスト・表・キーバリュー・レイアウト)、音声・動画は Transcribe(話者・タイムスタンプ付き)、画像は Rekognition(物体・顔・不適切なコンテンツ・画像内の文字)、テキストは Comprehend、複数モダリティは Bedrock Data Automation(BDA)です。\n■ ほかの選択肢が誤りな理由\n・画像の文字を Transcribe、音声を Rekognition、フォームを Comprehend、という対応は、いずれも入力の種類と一致しません。\n■ 覚えておくポイント\nこの5つは決定的・単機能で安価、マルチモーダルモデルは生成的で柔軟。"],[710,"■ なぜ正解か\n3つのモダリティ・同じ6項目を同じ名前で・小さなチームでオーケストレーションを維持しない・ナレッジベースに入れる、の4点が、BDA のカスタムブループリントを指します。ブループリントでフィールド名・データ型・自然言語の指示を定義でき、BDA はナレッジベースのパーサーとしても使えます。\n■ ほかの選択肢が誤りな理由\n・Textract+Rekognition+Transcribe の連携は、妥当な構成ですが、「オーケストレーションを維持しない」というシナリオの文言で排除されます。\n・マルチモーダルモデルのプロンプトでは、同じ項目名を一貫させるのが難しい。\n・Comprehend のカスタムエンティティ認識は、テキスト専用です。\n■ 覚えておくポイント\nシナリオの文を「背景」でなく「制約」として読む。"],[711,"■ なぜ正解か\n既知のフィールドを一貫して抽出し監査したいなら、先に抽出サービスで抽出します。抽出は決定的で、同じ入力から同じ出力が得られ、信頼度スコアでしきい値を設定でき、1ページあたり安価で、抽出した内容を記録できます。\n■ ほかの選択肢が誤りな理由\n・常に画像をモデルに送る方法は、柔軟ですが、決定性・監査性・安価さがありません。\n・どちらでも同じ、は誤りです。\n・抽出が不要というのも、一貫性と監査の要件に合いません。\n■ 覚えておくポイント\n任意の質問に答えたいなら、文書を直接モデルに送る。決め手は要件。"],[712,"■ なぜ正解か\nConverse はステートレスで、サービス側にセッションはありません。各ターンで会話履歴の全体を送り、その入力トークンを毎回支払います。履歴は DynamoDB にセッションキーで、TTL を付けて保存し、コンテキストに収まらなくなったら要約して畳みます。\n■ ほかの選択肢が誤りな理由\n・Bedrock がセッションを保持することはありません。\n・履歴のトークンは課金されます(無料ではない)。\n・自動で圧縮もされません。\n■ 覚えておくポイント\n無制限の会話のコストは2次関数的に増える。"],[713,"■ なぜ正解か\n通話記録の個人情報を、基盤モデルに渡す前に除去し、伏せた文字を証明するには、Comprehend の個人情報検出(種別と文字オフセットを返す)を使い、Lambda で決定的にオフセットの範囲を置換します。どの文字を伏せたかの証拠が残ります。\n■ ほかの選択肢が誤りな理由\n・基盤モデルに書き直させると、新しいテキストが返り、どこを置換したかの証拠が失われます。\n・Guardrails は呼び出し時に働くので、データは既に Bedrock に届いています。\n・Macie は S3 の保存データを発見・分類するだけで、伏せ字にはしません。\n■ 覚えておくポイント\n処理の前に除去するのか、呼び出し時に処理するのかで選ぶ。"],[714,"■ なぜ正解か\n毎日変わるのは約2%だけなので、変更された文書だけを S3 イベント通知や更新日時で検出して処理し、ナレッジベースを増分更新します。98%の再処理は不要です。\n■ ほかの選択肢が誤りな理由\n・インスタンスを増やして並列化、より小さいモデルへの変更は、いずれも全件再処理を前提に、速く/安くするだけです。\n・バッチ推論は単価を半分にしますが、所要時間は延びるので、問題の悪化になります。\n■ 覚えておくポイント\n最適化の前に、その処理自体が必要かを問う。"],[715,"■ なぜ正解か\n異なる埋め込みモデルは別の座標空間を作るので、モデルを変えるとベクトルが比較できなくなります。全てのベクトルを作り直す(再埋め込み)必要があり、部分的な移行はできません。\n■ ほかの選択肢が誤りな理由\n・新規文書だけ新モデルにすると、同じインデックスに異なる空間が混在して、検索が無意味になります。\n・クエリ側だけを新モデルにしても、空間が一致しません。\n・互換性が自動で保たれることはありません。\n■ 覚えておくポイント\n埋め込みモデルの変更は「ビルド時」の決定。"],[716,"■ なぜ正解か\nマネージド型は、AWS がベクトルストアを所有します。プロビジョニングが不要で、6つのネイティブコネクタと自動同期を持ちます。カスタム型は従来のモデルで、ストアを自分で選んで運用し、インデックスや検索パラメータを制御できます。試験ガイドはマネージド型より前に書かれており、カスタム型を想定しています。\n■ ほかの選択肢が誤りな理由\n・カスタム型は廃止されておらず、引き続きサポートされます。\n・マネージド型はストアを選ぶものではなく、料金が高い、という説明もありません。\n・S3 のみ対応ではなく、複数のコネクタがあります。\n■ 覚えておくポイント\nベクトルストアを運用したくない・専門家がいない場合はマネージド型。"],[717,"■ なぜ正解か\n決め手はコーパスの大きさではなく、クエリのレートです。OpenSearch Serverless は低遅延・ハイブリッド検索・豊富なチューニングを持ちますが、OCU の最低料金があり、アイドル時も払います。S3 Vectors は最大約20億ベクトル/インデックスで、ストレージとリクエストのみの課金です。\n■ ほかの選択肢が誤りな理由\n・コーパスサイズのみ、埋め込みモデルの提供元、データの言語は、ストア選びの決め手ではありません。\n■ 覚えておくポイント\n常時インタラクティブ=OpenSearch、巨大で疎=S3 Vectors。"],[718,"■ なぜ正解か\n9億チャンク・1日400クエリ・3秒で許容、という3つの数字が、巨大で疎で遅延許容、という S3 Vectors のプロファイルを示します。\n■ ほかの選択肢が誤りな理由\n・OpenSearch Serverless は OCU の最低料金を払い続けるので、月400クエリには見合いません。\n・Aurora + pgvector は、ストアとして運用負荷があり、この規模には不向きです。\n・Neptune Analytics は、案件同士が参照し合うという雰囲気の情報(scenery)につられた選択肢で、関係性を問う要件はありません。\n■ 覚えておくポイント\n事実と要件を区別する。要件ではない雰囲気の情報に惑わされない。"],[719,"■ なぜ正解か\nフィルターが、顧客・注文・権限など RDB と結合する場合は、リレーショナルエンジンがネイティブに処理できる Aurora PostgreSQL + pgvector です。複数の文書にまたがる関係を辿る質問(誰が制裁対象と2社を介して繋がっているか)は、グラフ検索ができる Neptune Analytics(GraphRAG)です。\n■ ほかの選択肢が誤りな理由\n・前者と後者を入れ替えた選択肢は、役割が逆です。\n・S3 Vectors や OpenSearch Serverless は、結合や関係の走査をそのままできません。\n■ 覚えておくポイント\n「どの文書にも答えが載っておらず、リンクを辿る必要がある」=マルチホップ=GraphRAG。"],[720,"■ なぜ正解か\n全チャンクには、テナント/所有者、出典とバージョン、タイムスタンプ、分類(部門・製品・管轄)、作成者とステータス(下書き/承認/置き換え済み)を付けます。メタデータは取り込み時に付与されるので、後から必要になると全コーパスの再埋め込みと再取り込みが要ります。\n■ ほかの選択肢が誤りな理由\n・色・サイズ・フォント・言語・拡張子、埋め込み次元・シャード数・ノード数・ログ・コスト、パスワード、は検索の絞り込みやアクセス制御の用途のメタデータではありません。\n■ 覚えておくポイント\nメタデータはロードする前に設計する。"],[721,"■ なぜ正解か\nペネトレーションテストでは、ブラウザでテナント ID を書き換えると、他社の文書が返りました。メタデータフィルターは、呼び出し元がフィルター値を選べない場合にだけアクセス制御になります。そのため、認証済みの ID から、サーバー側でテナント ID を導出して、信頼できるバックエンドでフィルターします。\n■ ほかの選択肢が誤りな理由\n・既知のテナント ID の一覧による検証は、値の形式の確認にすぎず、攻撃者が他社の有効な ID を使えば通ります。\n・800個の KB は最小の変更ではありません。\n・Guardrails は、誰のデータかを知りません。\n■ 覚えておくポイント\n検証は「正しい形式」を確かめるだけで、「あなたのもの」を確かめない。"],[722,"■ なぜ正解か\n単一インデックスは、パイプラインとスキーマが1つで運用が単純で、横断分析もできます。代償は、フィルターの正しさがセキュリティ上重要になることと、うるさい(負荷の高い)テナントが全員のレイテンシに影響することです。テナントごとのインデックスは、フィルターを間違える余地がなく分離が強く、インデックスが小さく速くなりますが、パイプラインとスキーマが N 倍になります。\n■ ほかの選択肢が誤りな理由\n・テナントごとのインデックスが常に安い、単一のほうが分離が強い、違いがない、は事実に反します。\n■ 覚えておくポイント\n分離が法的・契約上の要件であるとき、ドメインの挙動が異なるときに分割する。"],[723,"■ なぜ正解か\n検索が遅いことと、他製品の文書を引用することは、必要以上に12倍広い空間を検索している、という同じ原因です。クエリは必ず1製品に限られ、製品ラインはメタデータとして既に付いているので、呼び出しにフィルターを足すだけで解決します。\n■ ほかの選択肢が誤りな理由\n・12個のインデックスへの分割は、2億チャンクの再取り込みが必要で、クエリパラメータで済むのに高価な選択です。\n・OCU の増加は、検索空間が広いことを解消しません。\n・埋め込み次元の削減は、フィルターで済む問題の根本解決になりません。\n■ 覚えておくポイント\n再インデックスより、クエリ時のパラメータを先に試す。"],[724,"■ なぜ正解か\nマネージド型のコネクタは、S3・SharePoint・Confluence・Google Drive・OneDrive・Web クローラーの6つです。エンタープライズコネクタにはドキュメントレベルのアクセス制御がありますが、Web クローラーにはありません。公開 URL には、権限をマップできる ID がないからです。\n■ ほかの選択肢が誤りな理由\n・全てのコネクタに制御がある、Web クローラーだけにある、は事実に反します。\n・コネクタは S3 のみではありません。\n■ 覚えておくポイント\nネイティブコネクタがないシステムには、カスタムコネクタでチャンクを直接送れる。"],[725,"■ なぜ正解か\n同期が毎晩成功し、追加・更新は反映されるのに、3週間前に削除された文書が引用され続けるのは、削除の伝播が動いていないからです。ソースで削除された文書のチャンクが残っていると、確信を持って検索・引用されます。\n■ ほかの選択肢が誤りな理由\n・約21回の同期が成功しているので、頻度の問題ではなく、イベント駆動にしても解決しません。\n・埋め込みのドリフトは、撤回された文書の引用を説明しません。\n・top K を減らしても、チャンクが残っていれば引用されます。\n■ 覚えておくポイント\n検証は、検索テストで行う。"],[726,"■ なぜ正解か\n検索設定は、変更のコストで2つに分かれます。ビルド時(チャンキング戦略・サイズ・埋め込みモデル・次元・メタデータ)は、取り込み時に決まるので、変更は再構築と再埋め込みです。クエリ時(検索タイプ・フィルター・リランク・分解・top K)は、呼び出しごとのパラメータ1つの変更です。\n■ ほかの選択肢が誤りな理由\n・全てをクエリ時、あるいは全てをビルド時とするのは、事実に反します。\n・違いがないという説明は誤りです。\n■ 覚えておくポイント\n検索が悪いときは、先にクエリ時の列を使い切る。"],[727,"■ なぜ正解か\n小さいチャンク(300トークン)は節の見出しの文脈を失い、大きいチャンク(1500トークン)は精度を失う、という両方の失敗を示すシナリオは、階層型の典型です。小さな子チャンクで精密に照合し、節の見出しを含む大きな親チャンクをモデルに返します。\n■ ほかの選択肢が誤りな理由\n・セマンティックチャンキングは、意味の切れ目で分けますが、節の見出しとのスコープの問題を解決しません。\n・800トークンの固定長は、2つの失敗の中間を取るだけで、両方が少しずつ残ります。\n・チャンキングなしは、200ページの文書には不適切です。\n■ 覚えておくポイント\n階層型は、トレードオフを辞退できる唯一の戦略。"],[728,"■ なぜ正解か\nTitan Text Embeddings V2 は、1,024 から 512 次元に下げても、検索精度の約99%を維持し、256 次元でも約97%を維持して、ストレージは約1/4になります。埋め込みは RAG パイプラインで最も安いステップで、費用はストレージと検索にかかります。\n■ ほかの選択肢が誤りな理由\n・精度が半分になる、256 次元に対応しない、次元数を変更できない、はいずれも事実に反します。\n■ 覚えておくポイント\n選択肢は 256/512/1,024 次元。"],[729,"■ なぜ正解か\nテキストのクエリで動画や写真を探すには、テキスト・画像・動画・音声を同じベクトル空間に置く、マルチモーダル埋め込み(Nova Multimodal Embeddings など)が必要です。文章は検索でき、画像・動画は検索できない、という症状は、メディアがそもそも空間にないことを示します。\n■ ほかの選択肢が誤りな理由\n・次元数の増加とリランカーは、既に動いているテキストの検索品質の改善で、メディアには届きません。\n・自動キーワードタグ付けは、キーワード一致なので、雰囲気や動作の説明には合いません。\n■ 覚えておくポイント\nこれはストアではなく、モデルの変更。"],[730,"■ なぜ正解か\nリランカーは、クエリと文書を一緒に読んで、関連度を直接採点します。埋め込みは取り込み時に文書単体で計算されるため、直接の比較より粗い評価です。全文書に対して行うと高価なので、2段階にします。50〜100件を取得(再現率重視)し、リランクして上位5件を渡します(精度重視)。\n■ ほかの選択肢が誤りな理由\n・取得されなかった文書は救えません(順序は直せるが、網羅性は直せない)。\n・埋め込みの代わりには使いません。\n・Rerank API は KB の外でも使えます。\n■ 覚えておくポイント\nレイテンシとコストは増える。順序を直す道具。"],[731,"■ なぜ正解か\n明示的フィルターは、アプリがフィルターを構築するもので、テナント・部署・状態など既に分かっている制約に使います。暗黙的フィルターは、モデルが自然文のクエリからフィルターを推論します(宣言したスキーマに照らして)。たとえば「4月以降」が日付フィルターになります。\n■ ほかの選択肢が誤りな理由\n・明示的が自然言語から推論するのは、逆の説明です。\n・暗黙的は推論なのでベストエフォートで、アクセス制御には使えません。\n・両者は同じではありません。\n■ 覚えておくポイント\nセキュリティは ID から導出する。"],[732,"■ なぜ正解か\nRetrieve はチャンクをアプリに返し、プロンプトは自分で組み立てるので、他のデータとの結合などの制御ができます。ただしオーケストレーション手順がないので、クエリ分解もありません。RetrieveAndGenerate は検索から回答までを一気にこなし、引用付きの回答を返し、オーケストレーション設定でクエリ分解を有効にできます。\n■ ほかの選択肢が誤りな理由\n・Retrieve は回答を生成しません。\n・RetrieveAndGenerate はチャンクだけではなく回答を返します。\n・クエリ分解ができるのは RetrieveAndGenerate だけです。\n■ 覚えておくポイント\n最終プロンプトの制御と引き換えに、便利さを得る。"],[733,"■ なぜ正解か\n診断は、上流から下流へ向かって行います。1)インデックスに入っているか(パース失敗・削除の未伝播)、2)チャンク境界は適切か、3)クエリが近くに埋め込まれたか(識別子・専門用語・書き換えのない続きの質問)、4)フィルターが除外したか(過剰なフィルターは「何も無い」を返す)、5)取得されたが低く順位付けされたか。5つ目だけをリランクが直します。\n■ ほかの選択肢が誤りな理由\n・リランカーから始める順序は、上流の問題を見逃します。\n・モデルを大きくする、温度を下げる、は検索の問題ではありません。\n・常に再インデックスは、高価な正解です。\n■ 覚えておくポイント\nRetrieve API を直接呼んで、返ってきたものを読む。"],[734,"■ なぜ正解か\n変更された部署のユーザーだけが壊れ、変更のない部署は正常、という分かれ方は、一般的な品質の原因(チャンキング・リランク・検索タイプ)を排除します。これらは全員に同じように効くからです。ユーザーごとに変わるのはフィルターだけで、プロファイルの部署名が、チャンクの部署名の値と一致せず、全てを除外しています。\n■ ほかの選択肢が誤りな理由\n・チャンク境界・リランカー・ハイブリッド検索は、全員に同じ影響を与えます。\n■ 覚えておくポイント\n過剰なフィルターは「見つかりません」と確信を持って返す。"],[735,"■ なぜ正解か\nロール・指針・制約・トーンは system ブロックに置くと、会話履歴をトリミングしても残り、プロンプトキャッシュの安定したプレフィックスにもなります。質問・データ・取得チャンクなど呼び出しごとに変わるものは user メッセージに置きます。\n■ ほかの選択肢が誤りな理由\n・全てを user メッセージに書くと、長い会話で指示が最初にトリミングされ、キャッシュも壊れます。\n・system ブロックを使わない、は誤りです。\n・取得チャンクは呼び出しごとに変わるので system の先頭ではなく user に置きます。\n■ 覚えておくポイント\n障害は徐々に現れる。"],[736,"■ なぜ正解か\n出力が下流のシステムに渡るときは、構造を「確率的」でなく「確実」にします。JSON スキーマやツール定義は、丁寧な依頼より強く形を制約します。temperature を低くし、stop reason も確認します(max tokens なら JSON が途中で切れている)。\n■ ほかの選択肢が誤りな理由\n・「JSON で答えて」と丁寧に頼むのは、確率的です。\n・リトライを増やすのは、非決定的な呼び出しの再試行で、トークン費用が3倍になる祈りです。\n・より大きなモデルでも、構造の保証にはなりません。\n■ 覚えておくポイント\n前置き・キー名の揺れ・途中切れは別の原因なので、1つだけ直す選択肢は不完全。"],[737,"■ なぜ正解か\nPrompt Management は、プロンプトを不変のバージョンとして保存します。モデルのバインディングもバージョンの中に入るので、モデルの変更は、コードのデプロイではなくプロンプトのデプロイになります。使い方は4通りで、直接呼び出し、取得して変更、Flows のプロンプトノード、エージェントです。\n■ ほかの選択肢が誤りな理由\n・バージョンは不変なので、後から上書きできません。\n・モデルはアプリコードではなくバージョン側に置きます。\n・保存に追加料金はなく、実行時のトークンだけ課金されます。\n■ 覚えておくポイント\nエージェントとの統合は Agents Classic(新規受付終了)が対象。"],[738,"■ なぜ正解か\n規制当局の3つの質問(そのとき有効だったプロンプト文・誰が承認したか・アシスタントが何と答えたか)に、選択肢を1つずつ当てます。Prompt Management(バージョン+承認ゲート)が1つ目と2つ目を、モデル呼び出しログが3つ目を、CloudTrail が誰が公開したかの操作の記録を担います。\n■ ほかの選択肢が誤りな理由\n・Git の履歴は、顧客のやり取りとのひも付けがなく、3つ全てには答えません。\n・CloudTrail のみでは、プロンプト文と応答の内容が分かりません。\n・S3 バージョニングのみでは、承認と応答がありません。\n■ 覚えておくポイント\nCloudTrail は管理操作、呼び出しログは内容。"],[739,"■ なぜ正解か\n4商品で確認して15件に1件のバグを見逃す確率は、約3/4です。テスト方法が、この種類の失敗を検出できなかったのです。確率的な失敗には統計的なテストが必要で、ゴールデンセットとアサーションを自動で実行し、合格率で公開をゲートし、本番にアラームも置きます。\n■ ほかの選択肢が誤りな理由\n・2人でレビューしても、同じ方法に人の目を足すだけで、検出力は変わりません。\n・強い指示を足しても、バグを防げる保証はありません。\n・ガードレールだけでは、必須の警告の欠落を防ぐ保証になりません。\n■ 覚えておくポイント\n自動化は、バグも捕まえ、日常の変更も速く保てる。"],[740,"■ なぜ正解か\nプロンプト・KB・ガードレール・分岐だけなら、Bedrock Flows(ビジュアルなビルダー)を使います。承認や外部システムが必要なら、Step Functions(任意の AWS サービスと API、リトライ・Catch・Parallel・Map・Wait)を使います。Prompt Flows は2024年11月に Bedrock Flows に改名されましたが、公式の対象サービス一覧には旧名が残っています。\n■ ほかの選択肢が誤りな理由\n・常に Flows、常に Step Functions、機能が同じ、は事実に反します。\n■ 覚えておくポイント\n数日にわたる人手の承認と差し戻しがあるなら、Step Functions。"],[741,"■ なぜ正解か\nプロンプトの組み立て順が、時刻・ユーザー名・契約書・質問だと、時刻が呼び出しのたびに変わるため、先頭の文字から異なり、キャッシュが一度も再利用できません。契約書を先頭の安定したプレフィックスに並べ替えてから、プロンプトキャッシュを有効にします。数分間の8〜12問は、キャッシュに理想的なパターンです。\n■ ほかの選択肢が誤りな理由\n・契約書の要約は、詳細を失い、コスト問題をプロダクトを消して解決します。\n・並べ替えずにキャッシュを有効にしても、何も変わりません。\n・小さいモデルへの変更は、入力コストの構造を変えません。\n■ 覚えておくポイント\nキャッシュの保持期間は約5分。最大90%のコストと85%のレイテンシ削減。"],[742,"■ なぜ正解か\nエージェントはループです。手順が実行時まで分からない、または、途中の発見でツール選択が変わるなら、エージェントが適しています。フローチャートを描けるなら、Step Functions のワークフローが、安く・速く・テストでき、監査と再現も可能です。\n■ ほかの選択肢が誤りな理由\n・常にエージェント、は誤りです。\n・エージェントは非決定的で、監査向きではありません(逆の説明)。\n・ワークフローは非決定的ではなく、決定的です。\n■ 覚えておくポイント\n既知の構造のワークフローが、判断の必要な1ステップだけを制限付きのエージェントに任せる構成も有効。"],[743,"■ なぜ正解か\nAgentCore は、フレームワークとモデルに依存しないインフラです。7つのコンポーネント(Runtime・Memory・Gateway・Identity・Code Interpreter・Browser・Observability)は独立して採用できます。Runtime は最大8時間の実行とセッション分離を提供し、Lambda の15分上限への答えになります。\n■ ほかの選択肢が誤りな理由\n・Strands 専用ではなく、LangChain や自作のループも動きます。\n・モデルは Bedrock に限りません。\n・15分上限は Lambda のもので、Runtime は最大8時間です。\n■ 覚えておくポイント\nStrands Agents は、エージェントのループを自分のコードで書く SDK で、AgentCore は、それを動かす基盤。"],[744,"■ なぜ正解か\nHarness は設定駆動で、モデル・ツール・指示を宣言すれば AgentCore がループを実行します(旧 Bedrock Agents に近い体験)。Runtime は自分のコード(Strands など)をホストし、オーケストレーションを完全に制御します。\n■ ほかの選択肢が誤りな理由\n・「Harness は自分のコードを書く」「Runtime は設定のみ」は役割が逆です。\n・両者は同じではありません。\n■ 覚えておくポイント\nAgents Classic から移行してマネージドな体験を求めるなら Harness、既存の Strands エージェントなら Runtime。"],[745,"■ なぜ正解か\nBedrock Agents Classic は、2026年7月30日に新規顧客の受付を終了しましたが、既存のエージェントは動き続け、EOL 日も発表されていません。名前変更は API 名前空間・SDK・IaC の型には影響しません。ただし利用できるモデルカタログは凍結されます。return of control は、予測したアクションをアプリに返してアプリが実行する機能です。\n■ ほかの選択肢が誤りな理由\n・直ちに全て停止した、というのは誤りです。\n・新規顧客は引き続き利用できません。\n・Bedrock 自体は影響を受けず、新しいモデルを受け取り続けます。\n■ 覚えておくポイント\nアプリの認証と監査証跡を使えるのが return of control の利点。"],[746,"■ なぜ正解か\nモデルはツールの名前・説明・パラメータスキーマだけを見て選びます。実装は見えません。繰り返し間違ったツールを選ぶなら、バグはほぼ説明にあります。ツールの説明は、別の形のプロンプトエンジニアリングです。\n■ ほかの選択肢が誤りな理由\n・ツールのコードは、モデルに見えません。\n・モデルを大きくするのは、原因を確認せずにコストを上げる対処です。\n・スーパーバイザーの追加は、同じ曖昧さを引き継ぎます。\n■ 覚えておくポイント\nアーキテクチャを変える前に、失敗している組み合わせを計測して説明を書き直す。"],[747,"■ なぜ正解か\n軽量でステートレスなツールは Lambda(ゼロスケール・呼び出し単位の課金・15分上限・コールドスタート)、複雑・長時間・状態保持・永続接続・重い依存があるツールは ECS(常時稼働なので常に課金)が向きます。\n■ ほかの選択肢が誤りな理由\n・重いものを Lambda に置くのは、15分上限などの制約に当たります。\n・両者の違いがないというのは誤りです。\n・MCP のホスティングは EC2 のみではありません。\n■ 覚えておくポイント\n決め手は所要時間より、状態を持つかどうか。"],[748,"■ なぜ正解か\n未処理の例外は、モデルに推論の材料を与えないので、同じ呼び出しを繰り返しがちです。「その ID の顧客はいません。メールで検索してください」のようにエラーを期待する形式付きのデータで返すと、失敗がエージェントの次の正しいステップになります。\n■ ほかの選択肢が誤りな理由\n・未処理の例外を投げる、常に空の応答、エラーを握りつぶす、はいずれも、モデルが自己修正する材料を残しません。\n■ 覚えておくポイント\nパラメータは実行前に検証し(モデルが生成した信頼できない入力)、応答は小さく、ツールは冪等にする。"],[749,"■ なぜ正解か\n500ポンド超の上限がプロンプトにしかなかったので、巧妙なメッセージに議論で覆されました。上限をツール自体と IAM 権限で強制すれば、モデルが何を信じても処理されません。さらに、無限ループ(340回)には最大反復回数とセッションタイムアウトを設定します。インシデントが2つあるので、両方に対処する必要があります。\n■ ほかの選択肢が誤りな理由\n・システムプロンプトの強化は、同じ種類の統制の失敗を繰り返します。\n・拒否トピックは、ビジネスルールのためではなく、ループにも効きません。\n・別の経路へのルーティングは、2つの問題の両方には答えません。\n■ 覚えておくポイント\n統制は、議論されない場所に置く。"],[750,"■ なぜ正解か\n人の介在(HITL)には3つの方法があります。Step Functions のタスクトークンは、数時間〜数日のコールバック待ちの停止、Amazon A2I はレビューの UI が提供されるマネージドなワークフロー、API Gateway と自前の UI は既存のプロダクト内のレビューです。取り消せないアクションには、モデルの信頼度に関係なく人のレビューを求めます。\n■ ほかの選択肢が誤りな理由\n・信頼度が高ければレビュー不要、というのは、取り消せないアクションには誤りです。\n・タスクトークンは Standard のワークフロー向けです(Express は非対応)。\n・A2I は2026年にメンテナンスモードに入っています。\n■ 覚えておくポイント\nA2I は試験では引き続き正解になりうる。"],[751,"■ なぜ正解か\nリクエストの形は4つです。同期(人が待つ短い回答)、ストリーミング(人が出力を見る)、非同期(誰も待たないが仕事を失えない。SQS や Step Functions)、バッチ(締め切りのない大量処理で、S3 の入出力・半額)です。バッチ推論は完了時間の保証がありません。\n■ ほかの選択肢が誤りな理由\n・人が待つ短い回答は同期、人が出力を見守るのはストリーミング、仕事を失えないのは非同期、の説明です。\n■ 覚えておくポイント\n誰が待っているか、どこまで許容できるかで形を決める。"],[752,"■ なぜ正解か\n2025年11月19日から、API Gateway の REST API がレスポンスストリーミングに対応し、統合タイムアウトが15分に延び、10 MB のペイロード上限も撤廃されました。HTTP API はストリーミングしません。区別は REST と HTTP で、API Gateway 全体ではありません。\n■ ほかの選択肢が誤りな理由\n・API Gateway が一切ストリーミングできない、は旧い情報です。\n・HTTP API もできる、は誤りです。\n・WebSocket API だけが可能、でもありません(REST も可能)。\n■ 覚えておくポイント\n古い教材は「ストリーミングなら Lambda 関数 URL か WebSocket」と教える。"],[753,"■ なぜ正解か\nThrottlingException(429)は、リクエストまたはトークンの毎分のレートを超えた状態で、ジッター付きのバックオフで再試行すれば通ります。ServiceQuotaExceededException(400)は、クォータの上限に達した状態で、再試行しても通らないのでクォータを引き上げます。\n■ ほかの選択肢が誤りな理由\n・どちらも再試行、どちらもクォータ引き上げ、429 を引き上げ・400 を再試行、はいずれも対応が正しくありません。\n■ 覚えておくポイント\nジッターは任意ではない(ないと全員が同時に再試行する)。リクエスト数だけでなくトークンも追跡する。"],[754,"■ なぜ正解か\n日次平均はクォータに余裕があるように見えても、3つのアプリが同時にピークを迎えると、その20分間はクォータを超えます。アプリごとの真のピークを測り、合算ピーク分にクォータを引き上げ、アプリごとのレート制限を設けます。顧客向けアプリが落ちてはならない、という優先順位の要件を、レート制限で事前に決められます。\n■ ほかの選択肢が誤りな理由\n・リトライを増やすのは、効果が限定的で、既にバックオフは入れてあります。\n・プロビジョンドスループットは、固定費で、予測しにくい負荷には不向きです。\n・SQS は、待っているユーザーのいる応答では、スロットリングが待ちとタイムアウトに変わるだけです。\n■ 覚えておくポイント\n容量を増やしても、次に不足したときに「何が負けるか」は決まらない。"],[755,"■ なぜ正解か\n決定の根拠は、コンテンツではなく、呼び出し元(誰が支払っているか)です。API Gateway の使用量プランは、API キーにレート制限を紐づけ、リクエストが Lambda に届く前のエッジで決まります。ティアのロジックを Lambda に重複させる必要もありません。\n■ ほかの選択肢が誤りな理由\n・インテリジェントプロンプトルーティングは、プロンプトの難易度の予測で振り分けます。\n・各 Lambda で DynamoDB を参照すると、ロジックが重複します。\n・コンテンツの複雑さによる振り分けは、呼び出し元を見ません。\n■ 覚えておくポイント\nコンテンツによるルーティングと、呼び出し元によるルーティングは別の問題。"],[756,"■ なぜ正解か\n504 が約29秒で返り、Lambda は約55秒で成功しているので、処理は失敗しておらず、呼び出し元より長く生きているだけです。ジョブ ID を返して SQS で非同期に処理し、結果をポーリングか通知で届けます。「待ってもよいが結果は必ず受け取りたい」は、非同期の定義です。\n■ ほかの選択肢が誤りな理由\n・Lambda のタイムアウトを29秒に下げると、失敗が整理されるだけで、結果が届きません。\n・ゲートウェイのタイムアウト増加は(リージョナルは可能ですが)、問題の根本解決ではありません。\n・より速いモデルでも、29秒以内に収まる保証はありません。\n■ 覚えておくポイント\n現状は、誰も受け取らない結果にも Bedrock の料金を払っている。"],[757,"■ なぜ正解か\n11チームが直接 Bedrock を呼ぶ状況の3つの問題(課金の帰属・ガードレールの不一致・EOL を迎えるモデルのハードコード)を、全チームの同時の書き直しなしで解決できるのは、社内の生成 AI ゲートウェイです。呼び出し元が分かるのでコストが帰属でき、ガードレールとモデル選択も集中管理できます。\n■ ほかの選択肢が誤りな理由\n・SCP でモデル ID を制限すると、適用日に3つのアプリが壊れます。\n・コスト配分タグとドキュメントは、1つの問題にしか答えません。\n・チームごとに別アカウントは、1つしか解決せず別の問題を悪化させます。\n■ 覚えておくポイント\nゲートウェイへの切替は、エンドポイントの変更で済む。"],[758,"■ なぜ正解か\nSageMaker AI の推論は、リアルタイムが6 MB・60秒、サーバーレスが4 MB・60秒でゼロスケール、非同期が最大1 GB・最大1時間でキューイングしてゼロスケール、バッチ変換がデータセット全体を処理して停止、です。これらの上限は、インスタンスではなく推論オプションの制限です。\n■ ほかの選択肢が誤りな理由\n・リアルタイムは1 GB まで扱えない(6 MB)。\n・サーバーレスは1時間処理できない(60秒)。\n・非同期は6 MB ではなく1 GB まで。\n■ 覚えておくポイント\n400 MB のファイルが12分かかり、夜間は使われないなら、非同期。"],[759,"■ なぜ正解か\nLLM のメモリは、重みと KV キャッシュの合計です。重みは16ビットで1パラメータ約2バイト(70B で約140 GB)です。KV キャッシュは、シーケンス長と同時接続数で増える可変の部分です。負荷時のメモリ不足は、重みよりキャッシュが原因であることが多いです。\n■ ほかの選択肢が誤りな理由\n・メモリが重みのサイズだけで決まる、は伝統的な ML の考え方です。\n・KV キャッシュは固定ではなく可変です。\n・量子化は重みを小さくして、メモリを減らします(増やしません)。\n■ 覚えておくポイント\nFP8 は重みを約半分にして、キャッシュの余地を広げる(ハードウェア依存)。"],[760,"■ なぜ正解か\nオートスケールはすぐ起動していますが、新しいインスタンスが処理を始めるまで約8分かかっています。これはモデルのロード時間です。ロード時間はスケーリングのレイテンシなので、Fast Model Loading と AOT コンパイルで短縮し、毎朝8時の定時のスパイクには、スケジュールスケーリングで事前に容量を用意します。\n■ ほかの選択肢が誤りな理由\n・オートスケールの閾値を下げても、起動後の8分は変わりません(ポリシーは問題でない)。\n・サーバーレス推論は、大きなモデルのコールドスタートが数百ミリ秒では済みません。\n・より大きなインスタンスも、ロード時間を解決しません。\n■ 覚えておくポイント\n予測可能な定時のスパイクに、反応型のオートスケールは不適切。"],[761,"■ なぜ正解か\n6つの少量トラフィックのモデルは、数秒の応答でよいので、推論コンポーネントで1つのエンドポイント(インスタンス・GPU を共有)に統合して、アイドルの GPU コストを減らします。本番のエンドポイントは、性能に影響してはいけないので、そのまま分けておきます。\n■ ほかの選択肢が誤りな理由\n・全7つを統合すると、より安くなりますが、本番への影響という第2の要件に反します。\n・全てサーバーレスは、本番の定常トラフィックに不向きです。\n・6つを非同期推論にすると、研究者の問い合わせが「送って受け取る」体験になります。\n■ 覚えておくポイント\n要件が互いに引っ張り合うときは、その境界線で分ける。"],[762,"■ なぜ正解か\nカスケードは、回答を見てから判断します。確認ロジックを自作し、エスカレーション時は両方のモデル料金を払い、異なる提供元のモデルも組み合わせられます。インテリジェントプロンプトルーティングは、呼び出し前にプロンプトから難易度を予測し、1リクエストは1モデルだけを呼び、同じファミリーの2モデルに限られます。\n■ ほかの選択肢が誤りな理由\n・どちらも呼び出し後に判断する、カスケードは1モデルに限定、ルーティングは確認ロジックが必要、は役割が逆または誤りです。\n■ 覚えておくポイント\n出力が既に信頼度を持つなら、カスケードのチェックは無料で作れる。"],[763,"■ なぜ正解か\n8,000リクエスト/日で偏りのある負荷は、GPU を埋められないので、アイドル時間の費用を払い続けます。MLOps エンジニアもいません。同じモデルファミリーが Bedrock にあるので、Bedrock で使い、測定した費用がフルコストの GPU 運用を超えたときだけセルフホストを再検討するのが妥当です。\n■ ほかの選択肢が誤りな理由\n・SageMaker+推論コンポーネントへの直行、EKS でのセルフホストは、いずれも測定せずにコミットし、運用負荷も増えます。\n・SageMaker サーバーレス推論は、70B の大きなモデルには、ロード時間などで不向きです。\n■ 覚えておくポイント\nセルフホストを拒否するのではなく、測定前にコミットしない。"],[764,"■ なぜ正解か\n変更できない基幹システムは、イベント駆動で統合します。データベースの変更をキャプチャして EventBridge に発行し、コンシューマーが購読します。今後 AI 機能が増えても、新しいコンシューマーが購読するだけで済み、基幹システムは変更不要です。\n■ ほかの選択肢が誤りな理由\n・基幹システムを改修する案は、「変更できない」と2回述べられているので不可です。\n・夜間バッチは、将来の機能も夜間に縛ります。\n・システムの置き換えは、「変更できない」と同様に過剰です。\n■ 覚えておくポイント\n1つのコンシューマーならバスは不要だが、増えていくならバス。"],[765,"■ なぜ正解か\n「このユーザーはこのモデルを呼べるか」は IAM(呼び出しロールのポリシー)が答え、「このユーザーはこのデータを見られるか」は、検証済みの ID から導出した検索のメタデータフィルターが答えます。2人が同じモデルを共有しながら、異なるコーパスを見る場合、後者は検索の問題です。\n■ ほかの選択肢が誤りな理由\n・両方とも IAM、両方とも Guardrails、両方とも KMS、は2つの異なる判断を同じ仕組みで済ませる誤りです。\n■ 覚えておくポイント\n両者の混同は、企業の ID の問題で最も多い誤答。"],[766,"■ なぜ正解か\nセッションタグ付きの STS AssumeRole で、エンドユーザーの ID を一時的な認証情報に含めます。タグは対象アカウントで principal tag として現れ、リソースポリシーで属性ベースの判断ができ、CloudTrail にも記録されて、誰の認証情報が操作を行ったかが分かります。\n■ ほかの選択肢が誤りな理由\n・共有ロールは、アカウント境界を越えられますが、ログには人でなくロールが記録されます。\n・エンドユーザーごとの IAM ロールは、数が膨れて制限に達します。\n・全テーブルの複製は、守りたい境界自体を壊します。\n■ 覚えておくポイント\nタグは transitive にすれば、ロールチェーンでも維持される。"],[767,"■ なぜ正解か\n最小権限では、InvokeModel の Resource に、特定のモデルまたは推論プロファイルの ARN を指定します(ワイルドカードは避ける)。ストリーミングは別のアクション(InvokeModelWithResponseStream)で、InvokeModel では許可されません。\n■ ほかの選択肢が誤りな理由\n・bedrock:* の許可は最小権限の逆です。\n・ストリーミングは InvokeModel に含まれません。\n・モデルの ARN は指定できます。\n■ 覚えておくポイント\nアプリごとにロールを分ければ、CloudTrail で帰属でき、1チームの侵害の影響を限定できる。組織全体の境界は SCP。"],[768,"■ なぜ正解か\nオンプレミスで動く Bedrock はありません。ハイブリッドのパターンは、境界を越えるものを決めるものです。1つは、データ(ベクトルストアと文書)を Outposts に置き、プロンプトだけを PrivateLink/Direct Connect でリージョンへ送る方法で、Bedrock のカタログを使えます。もう1つは、モデルもデータもオンプレミスに置く方法で、オープンウェイトを SageMaker on Outposts で動かし、Bedrock の機能(ガードレール・KB・Flows)は失います。\n■ ほかの選択肢が誤りな理由\n・Bedrock を Outposts に置けるという説明は誤りです。\n・Direct Connect は私的な回線ですが、データはリージョンで処理されます。\n・Wavelength は5G ネットワーク内の低遅延で、居住地規制向けではありません。\n■ 覚えておくポイント\n派生テキストも出せないなら、リージョンの Bedrock は使えない。"],[769,"■ なぜ正解か\n生成 AI のパイプラインは、通常の CI/CD が扱うコードに加えて、4つをバージョン管理します。アプリケーションコード、プロンプトのバージョン(不変)、モデル選択(AppConfig またはプロンプトバージョン内)、評価データセットです。インフラ(KB やガードレールの設定)も CDK や CloudFormation でコード化します。\n■ ほかの選択肢が誤りな理由\n・コードのみ、コードとログ、プロンプトはバージョン管理しない、は不足しています。\n■ 覚えておくポイント\n評価データセットが変わると、リリース間のスコアが比較できなくなる。"],[770,"■ なぜ正解か\nGuardrails のポリシーは6つで、コンテンツフィルター(ヘイト・侮辱・性的・暴力・不正行為・プロンプト攻撃の有害カテゴリ)、拒否トピック、単語フィルター、機密情報フィルター、コンテキストグラウンディングチェック、自動推論(Automated Reasoning)です。プロンプトとレスポンスの両方で並列に評価されます。\n■ ほかの選択肢が誤りな理由\n・IAM・KMS・VPC・ログ・SCP は、別の制御です。\n・「単語、画像、動画…」は、ポリシーの種類ではありません。\n・グラウンディング・キャッシュ・RAG・FT・蒸留は、Guardrails のポリシーではありません。\n■ 覚えておくポイント\nコンテンツフィルターのしきい値は、入力と出力で別々に設定できる。"],[771,"■ なぜ正解か\n拒否トピックは意味的で、自然言語で主題を書き、例を数個与えると、言い換えや間接的な聞き方も捉えます(確率的なのでテストして調整)。単語フィルターは字義通りで、決定的ですが、同義語で回避されます。\n■ ほかの選択肢が誤りな理由\n・どちらも字義通り、単語フィルターが意味を捉える、拒否トピックは完全一致のみ、は役割が逆または誤りです。\n■ 覚えておくポイント\n「どんな言い方でも」は拒否トピック、「この語句を」は単語フィルター。"],[772,"■ なぜ正解か\n機密情報フィルターは、ブロック(リクエストを拒否)と匿名化(値をマスクして続行)を選べます。決して現れてはならないもの(認証情報など)はブロック、スクラブしつつ周囲の文章を使いたいものは匿名化です。\n■ ほかの選択肢が誤りな理由\n・常にブロックでは、患者が自分の名前を言っただけでリクエストが弾かれる(パイロットで41%がブロック)問題が起きます。\n・常に匿名化は、現れてはならないものも通してしまいます。\n・両者は同じではありません。\n■ 覚えておくポイント\n「読める/使えるままで」は匿名化。"],[773,"■ なぜ正解か\nApplyGuardrail API は、どんなモデルが生成した内容でも、独立して評価します(source=INPUT または OUTPUT)。SageMaker・自社ホスト・外部 API のモデルにも同じポリシーを適用できます。必須化の仕組みは、IAM のポリシーベースの強制、組織横断のセーフガード、不変バージョン、強制せず評価するモニターモードです。\n■ ほかの選択肢が誤りな理由\n・Bedrock のモデルにしか使えない、は誤りです。\n・SCP でガードレール ID の存在を要求するのは、正しいガードレールかを保証しません。\n・呼び出し側の任意のパラメータは、省略できるので統制になりません。\n■ 覚えておくポイント\n呼び出し側が省略できる統制は、統制ではない。"],[774,"■ なぜ正解か\nハルシネーションの回答は、丁寧で、話題に沿い、体裁も整い、全く間違っています。有害カテゴリ・個人情報のいずれにも当たらないので、コンテンツフィルターでは検出できません。コンテキストグラウンディングは、情報源に照らして確率的に採点し、自動推論は、形式化されたルールとの整合を決定的・監査可能に検証します。\n■ ほかの選択肢が誤りな理由\n・コンテンツフィルターは有害性のカテゴリを検出するもので、事実性ではありません。\n・温度を0にしても、同じ誤りを毎回返すだけです。\n・拒否トピックは、トピックを無くす(機能の削除)ことで、誤りを直すものではありません。\n■ 覚えておくポイント\n決定論は正確さではない。"],[775,"■ なぜ正解か\n間接プロンプトインジェクションは、取得した文書の中に埋め込まれた命令で、ユーザーは普通の質問をしただけです。そのため入力側のガードレールは、無害なプロンプトを正しく通しました。対策は多層で行います。ツールを IAM で制限し(承認済みの宛先)、取り消せない送信は人の承認を挟み、取得したコンテンツがプロンプトに入る前に評価します。\n■ ほかの選択肢が誤りな理由\n・ユーザープロンプトのフィルターを強めるのは、攻撃が使わなかったチャンネルを守ります。\n・メールの拒否トピックは、命令の出どころを見ません。\n・何もしないは、攻撃が成立します。\n■ 覚えておくポイント\n検出だけでは防ぎきれない。実害を限定する層が本命。"],[776,"■ なぜ正解か\n生成 AI の1回の呼び出しは、5つの制御ポイントを通ります。SCP(組織の境界)、IAM の ID ポリシー、VPC エンドポイントポリシー、ガードレール、そして記録としてのログ(CloudTrail と呼び出しログ)です。ただしログは記録であって、拒否できる制御ではありません。\n■ ほかの選択肢が誤りな理由\n・KMS は暗号化の仕組みで、呼び出しの制御ポイントの1つではありません。\n・ログが防止的コントロールではない、制御ポイントは IAM のみ、は誤りです。\n■ 覚えておくポイント\n検知と防止を混同するのが、このドメインで最も多い誤り。"],[777,"■ なぜ正解か\nインターフェースエンドポイント(bedrock-runtime と bedrock-agent-runtime)と S3 のゲートウェイエンドポイントで、インターネットを通らない経路を作ります。「侵害されたコンテナが2つ以外のモデルを呼べない」には、エンドポイントポリシーで2つのモデル ARN に制限します。侵害されたコンテナはタスクロールの権限をそのまま持つので、ID ポリシーでは防げません。\n■ ほかの選択肢が誤りな理由\n・NAT ゲートウェイは、インターネットを通る経路です。\n・ID ポリシーだけでは、侵害後は効きません。\n・Direct Connect は、オンプレミスとの専用回線で、ここでは無関係です。\n■ 覚えておくポイント\nプライベート接続は経路、エンドポイントポリシーは誰が使えるか。"],[778,"■ なぜ正解か\n所有アカウントでは動き、他のアカウントでは AccessDenied になるのは、KMS キーポリシーが、そのプリンシパルに Decrypt を許可していないというシグネチャです。所有アカウントは、自分のキーに暗黙のアクセスがあります。\n■ ほかの選択肢が誤りな理由\n・リソースポリシーは、組織を許可していると明記されています。\n・VPC エンドポイントがない場合は、AccessDenied ではなくタイムアウトになります。\n・SCP が ApplyGuardrail を拒否するなら、所有アカウントでも失敗するはずです。\n■ 覚えておくポイント\nクロスアカウントのカスタマーマネージドキーは、リソースポリシーとキーポリシーの2つの許可が必要。"],[779,"■ なぜ正解か\nSCP は、組織や OU/アカウントにアタッチされる制限専用のポリシーで、組織が所有しているので、アカウント管理者は上書きできません。「全アカウントに適用し、チームが変更できない」は、SCP の用途です。ID ポリシーは、アカウントの管理者が変更できます。\n■ ほかの選択肢が誤りな理由\n・IAM ID ポリシーは、アカウントが所有します。\n・リソースポリシーは、リソースの所有者が管理します。\n・KMS キーポリシーは、キー単位の許可です。\n■ 覚えておくポイント\n「このアプリに必要なアクセス」は ID ポリシー、「全アカウントで・変えられない」は SCP。"],[780,"■ なぜ正解か\n個人情報の検出サービスは、いつ働くかで選びます。Macie は保存中の S3 データの発見・分類(報告のみで、伏せ字にはしない)、Comprehend はパイプライン処理中(種別とオフセット)、Guardrails は呼び出し時の入出力、自前の Lambda は好きな場所です。\n■ ほかの選択肢が誤りな理由\n・好みで選ぶ、は誤りです。\n・Macie はリアルタイムの伏せ字ではなく、S3 の発見。\n・Guardrails は S3 のデータをスキャンしません。\n■ 覚えておくポイント\n3つの要件が3つのタイミングなら、単一のサービスでは満たせない。"],[781,"■ なぜ正解か\n消去は、完全性の問題です。原本(S3)・ベクトルストアのチャンクと埋め込み・モデル呼び出しログ・DynamoDB の会話履歴・キャッシュとバックアップまで、全てのコピーを削除します。さらに、検索テストで検証して、証拠を残します。\n■ ほかの選択肢が誤りな理由\n・ソース文書の削除だけでは、他のコピーが残ります。\n・メタデータフィルターは、隠すだけで保持し、後で誰かが外せます。\n・KB 全体の作り直しだけでは、ログや会話履歴が残ります。\n■ 覚えておくポイント\nDynamoDB の TTL は、プライバシーの制御にもなる。"],[782,"■ なぜ正解か\nCloudTrail は、誰がいつどの API を呼んだかという管理イベントを記録します(管理イベントは既定で有効で、プロンプト/応答は含まない)。モデル呼び出しログは、プロンプト・応答・埋め込み・画像などの内容を記録します(既定で無効で、S3 や CloudWatch Logs に出力)。\n■ ほかの選択肢が誤りな理由\n・CloudTrail にプロンプトは記録されません。\n・呼び出しログは既定で有効ではありません。\n・内容を記録するのは呼び出しログだけです。\n■ 覚えておくポイント\n9か月前の苦情に答えるには、呼び出しログが必要。今日の再実行は、今日のシステムの証明でしかない。"],[783,"■ なぜ正解か\nSageMaker のモデルカードは、自分が作る/カスタマイズするモデルの文書(用途・学習データ・指標・限界)で、プログラムでパイプライン内に作成します。AWS AI サービスカードは、AWS が自社の AI サービスについて公開する透明性文書で、読んで自組織のリスク評価に使います。\n■ ほかの選択肢が誤りな理由\n・両方とも自分で作成、サービスカードを自分で書く、モデルカードを AWS が公開、は役割が逆または誤りです。\n■ 覚えておくポイント\nファインチューニングしたモデルを文書化するなら、モデルカード。"],[784,"■ なぜ正解か\n引用は、実在するパッセージを指す証拠で、ユーザーが自分で検証でき、何年後の監査にも耐え、機械的に低コストで作れます。説明は物語で、もっともらしいものの、事後に作られた可能性があり、独立に検証できません。\n■ ほかの選択肢が誤りな理由\n・説明のほうが証拠として強い、どちらも検証できる、引用は捏造されやすい、は事実に反します。\n■ 覚えておくポイント\n規制当局が検証できる必要があるなら引用、ユーザーが理由を理解するなら説明。RetrieveAndGenerate は引用を自動で返す。"],[785,"■ なぜ正解か\n生成 AI のバイアスは、基盤モデル・自社の検索コーパス・プロンプト・ファインチューニングデータの4か所から入り、3つは自分で制御できます。Clarify のバイアス指標は、構造化データと、グループごとの定義された結果を前提とするので、生成テキストには向きません。実用的なのは、層別評価データと LLM をジャッジに使う評価です。\n■ ほかの選択肢が誤りな理由\n・バイアスはモデルだけが原因、は誤りです(検索コーパスやプロンプトも)。\n・Clarify は、生成テキストの測定には最適ではありません。\n・プロンプトはバイアスに関係します。\n■ 覚えておくポイント\n非標準の英語に短い回答が返る事例は、公平性ではなく検索の問題の可能性がある。"],[786,"■ なぜ正解か\n継続的な遵守は、AWS Config のルールで、リソースの状態(KB が CMK で暗号化されているか、呼び出しログが有効か)を評価し、EventBridge で自動修復かチケットに繋ぎます。必要に応じて Audit Manager で証拠を集めます。\n■ ほかの選択肢が誤りな理由\n・毎月のスクリプトのレポートは、継続的ではありません。\n・SCP は作成時のパラメータを防げますが、ログの有効化はアカウントの設定なので、2つの要件の片方しか満たしません。\n・CloudTrail のアラートは、イベントを検知するだけで、遵守状態を評価しません。\n■ 覚えておくポイント\n2つの要件のうち片方だけに答える選択肢は、優れていても正解ではない。"],[787,"■ なぜ正解か\nトークンの課金は、出力トークンが入力の数倍高く、会話は毎ターン全履歴を再送するので2次関数的に増え、取得したコンテキストが入力の最大要素で、top K が調整弁です。max tokens は出力だけを制限します。\n■ ほかの選択肢が誤りな理由\n・入力トークンのほうが高い、会話の長さはコストに影響しない、max tokens が入力も制限する、はいずれも事実に反します。\n■ 覚えておくポイント\n最適化は3つの動き(トークンを減らす、生成を減らす、呼び出しを避ける)に整理できる。"],[788,"■ なぜ正解か\n推論プロファイルという言葉には2つの意味があります。システム定義は AWS が作り、地域のプレフィックスがあり、容量とデータ所在地の問題を解きます。アプリケーションは自分で作ってタグを付け、「どのチームが使ったか」に答え、タグがコスト配分タグになります。\n■ ほかの選択肢が誤りな理由\n・両者は同じではなく、アプリケーションプロファイルは容量を増やしません。\n・タグを付けるのはアプリケーション側です(システム定義ではない)。\n■ 覚えておくポイント\n粒度は使用タイプ×日の日次集計で、リクエスト単位ではない。リクエスト単位が必要なら呼び出しログを併用。タグは遡及しない。"],[789,"■ なぜ正解か\n約65〜70%の質問が、同じトピックの言い換えなので、質問の埋め込みで、過去の質問との類似度が閾値を超えるものに一致させるセマンティックキャッシュが有効です。回答は呼び出し元によって変わらないので、安全にキャッシュできます。\n■ ほかの選択肢が誤りな理由\n・質問文のハッシュによる完全一致は、人が同じ文を打たないので、ヒット率がほぼゼロです(2〜3%)。\n・TTL の延長は、ヒット率が低い問題を解決しません。\n・システムプロンプトのプロンプトキャッシュは、質問への回答自体を再利用しません。\n■ 覚えておくポイント\n閾値が緩いと、別の質問に確信を持って回答してしまう。"],[790,"■ なぜ正解か\nレイテンシの指標は3つで、TTFT(体感。ストリーミング・キャッシュ・短いプロンプト)、総レイテンシ(小型モデル・出力トークンの削減・レイテンシ最適化推論)、スループット(同時実行・容量・クロスリージョン推論・キュー)です。訴えをよく読んで、どの指標かを見極めます。\n■ ほかの選択肢が誤りな理由\n・全て同じ手段で改善する、は誤りです。\n・ストリーミングは総レイテンシを短縮しません(体感を改善)。\n・小型モデルは、総レイテンシを下げます(スループットだけではない)。\n■ 覚えておくポイント\n独立したサブタスクは、Step Functions の Map で並列化すると、最も遅い枝が総時間になる。"],[791,"■ なぜ正解か\nCloudWatch の生成 AI オブザーバビリティは、モデルとエージェントの層を扱い、トークン使用量・プロンプトのトレース・ツール呼び出し・エージェントのステップを見せます。Container Insights は、インフラ層(CPU・メモリ・ポッド/タスクの健全性)で、モデルが何を返したかは知りません。\n■ ほかの選択肢が誤りな理由\n・どちらもモデルの出力を見る、Container Insights がプロンプトをトレースする、生成 AI オブザーバビリティがインフラ専用、は役割が逆または誤りです。\n■ 覚えておくポイント\nFM の挙動が期待から逸脱する問題は、インフラの問題ではない。"],[792,"■ なぜ正解か\nガードレールの介入数の急増は、攻撃・コンテンツの変化・ポリシーが厳しすぎることを示します。逆に突然ゼロになるのは、ガードレールがアタッチされなくなったことが多く、デプロイでパラメータが落ちるとダッシュボード上は素晴らしく見えます。誰もアラームを置かない盲点です。\n■ ほかの選択肢が誤りな理由\n・ユーザーが急に行儀よくなった、モデルが賢くなった、は根拠なく楽観的です。\n・ログの遅延では、介入数のメトリクスが完全にゼロになることを説明しにくい。\n■ 覚えておくポイント\n介入数は、安全性の信号であると同時に、運用の信号でもある。"],[793,"■ なぜ正解か\n全環境で CloudWatch Logs にログを出したことが問題で、スコープと送信先の2つが過剰でした。コンプライアンスは本番のみ・7年保存なので、本番だけにログを有効化し、S3 にライフサイクルで7年保存します。運用クエリ用の CloudWatch Logs は短い保持期間にします。\n■ ほかの選択肢が誤りな理由\n・ログを無効化して CloudTrail に頼るのは、CloudTrail にプロンプトや応答が含まれないので、要件を満たしません。\n・全てで30日保持は、7年の要件に反します。\n・ログの圧縮は、スコープと送信先の過剰を解決しません。\n■ 覚えておくポイント\nCloudWatch Logs はクエリ向けの価格で、7年のアーカイブ向けではない。"],[794,"■ なぜ正解か\nオフライン評価は、固定のゴールデンセットを、リリース前に実行します。管理されていて再現可能で、バージョン間で比較できますが、実際のユーザーが何を聞くかは見えません。オンライン監視は、本番トラフィックを継続的にサンプリングします。実際の分布で見られますが、ノイズがあり、昨日を再実行できません。両方が必要です。\n■ ほかの選択肢が誤りな理由\n・どちらか一方で十分、は誤りです。\n・オンラインは再現可能ではありません(オフラインのほう)。\n・オフラインは、リリース後のドリフトを検出できません(オンラインの役割)。\n■ 覚えておくポイント\nオフラインは悪いリリースを、オンラインは問題のなかったリリースのドリフトを捕捉する。"],[795,"■ なぜ正解か\nBedrock Evaluations には5つのジョブタイプがあります。モデル評価の3つ(プログラム的=参照ベースの決定的メトリクス、LLM-as-a-judge、人手)と、RAG 評価の2つ(retrieve-only=検索段階のみ、retrieve and generate=パイプライン全体)です。\n■ ほかの選択肢が誤りな理由\n・「プログラム的・バッチ・ストリーミング・同期・非同期」は、呼び出し方式の分類です。\n・RAG・FT・蒸留・インポート・キャッシュは、カスタマイズの手法です。\n・精度・コスト・速度・安全・可用性は、評価の観点で、ジョブタイプではありません。\n■ 覚えておくポイント\nretrieve-only があるから、検索の問題だけを切り分けられる。"],[796,"■ なぜ正解か\n各記事に人が書いた要約があるのは、参照データセットです。プログラム的評価は、これを必要とし、他のジョブには使えません。ROUGE は要約、BERTScore は言い換えを許容して意味の類似を評価するので、人手のレビューなしで、客観的で再実行可能な比較ができます。\n■ ほかの選択肢が誤りな理由\n・人手の評価は、編集者のレビューに費用がかかるので、避けたい要件に反します。\n・参照なしの LLM-as-a-judge は、参照が存在しないときの手法で、ここには参照があります。\n・本番トラフィックの3分割は、モデル選定の段階では不適切です。\n■ 覚えておくポイント\nROUGE=要約、BLEU=翻訳、BERTScore=意味、F1/精度=分類や抽出。"],[797,"■ なぜ正解か\n評価モデルと被評価モデルが同じファミリーなので、自己選好バイアスが起きています。スコアが4か月 0.91 と不自然に安定し、専門家は根拠のない主張を見つけているので、忠実性が基準に入っていないと考えられます。異なるファミリーの評価モデルに替え、忠実性を基準に加え、専門家評価のサンプルで較正します。\n■ ほかの選択肢が誤りな理由\n・専門家の評価を信じて自動評価を止めると、スケールを失います。\n・しきい値を上げても、偏った測定値は変わりません。\n・頻度を上げると、偏った測定の精度が上がるだけで、正確さは上がりません。\n■ 覚えておくポイント\nジャッジのスコアは、絶対値でなく比較として扱う。"],[798,"■ なぜ正解か\n品質が落ちたとき、最初に retrieve-only の評価ジョブを走らせて、検索段階だけを測ります。ground-truth のデータセット(質問と、答えるべきパッセージ)があれば、コンテキストの関連性とカバレッジが分かります。検索のスコアが健全なら、問題は下流にあり、システムの半分を1つのジョブで除外できます。\n■ ほかの選択肢が誤りな理由\n・retrieve and generate の全体スコアは、故障箇所を特定できません。\n・セマンティックチャンキングでの再取り込みは、原因が検索だと確かめる前の高価な対処です。\n・回答への LLM-as-a-judge は、既に誤っているかもしれない文脈に対して生成品質を採点するだけです。\n■ 覚えておくポイント\n悪い文脈から作られた悪い回答は、生成の失敗と区別がつかない。"],[799,"■ なぜ正解か\n完了率は87%で安定していますが、ツール呼び出しが5回から13回に増え、コストが60%増えています。同じ結果に、はるかに悪い経路で到達しているので、エージェントは劣化しています。軌跡(ツール選択の精度・推論の質)を評価し、どのツールの出力が変わったかを探します。\n■ ほかの選択肢が誤りな理由\n・問題なし、は結果指標の遅れを見逃します。\n・遅いモデルのせい、という根拠はありません(ツール呼び出し数の増加が原因)。\n・反復上限を上げるのは、症状を隠し、問題を見つけた信号も消します。\n■ 覚えておくポイント\n結果の指標は遅れ、軌跡の指標は先行する。"],[800,"■ なぜ正解か\nBedrock Evaluations は、データセットに対するバッチジョブで、リクエスト経路にインラインで置く API ではありません。ライブの応答の検査にはコンテキストグラウンディングを、母集団の品質にはサンプリングした非同期のジャッジを、ドリフトにはスケジュールのゴールデンセットを使います。\n■ ほかの選択肢が誤りな理由\n・1応答ごとにリアルタイム、評価はインライン API、評価ジョブでガードレールを置き換える、は、いずれもバッチジョブの性質に反します。\n■ 覚えておくポイント\n実務の制約: JSONL・同じリージョンの S3・1ジョブ約1,000プロンプト、評価モデルにもモデルアクセスが必要。"],[801,"■ なぜ正解か\n呼び出しは成功して例外はなく、入力トークンはコンテキストウィンドウ内で、レスポンスが JSON の途中で終わっています。長い文書ほど長い評価を作り、出力の上限(max tokens)に達した、出力の打ち切りです。stop reason を確認し、max tokens を上げ、より簡潔なスキーマを求めます。\n■ ほかの選択肢が誤りな理由\n・コンテキストウィンドウのオーバーフローは、入力側の問題で、入力トークンが範囲内という事実と合いません。\n・JSON が無効なのではなく、有効なまま途中で止まっています。\n・ネットワークのタイムアウトなら、エラーになります。\n■ 覚えておくポイント\n入力と出力のオーバーフローは、どちらも文書の長さと相関するので混同しやすい。"],[802,"■ なぜ正解か\nクロスリージョン推論プロファイルは、呼び出しごとに送信先リージョンを選びます。IAM が eu-west-1 のモデル ARN のみ許可していると、他の EU リージョンへ送られた約1/8のリクエストが拒否されます。リクエストの属性に依存しない失敗は、プラットフォームが選ぶ何かが原因です。\n■ ほかの選択肢が誤りな理由\n・クォータ不足なら、スロットリングとして現れ、AccessDenied にはなりません。\n・モデルアクセス未申請なら、全てのリクエストで失敗するはずです。\n・プロファイル ARN の不正も、全てのリクエストで失敗するはずです。\n■ 覚えておくポイント\nポリシーで、プロファイル ARN と、全ルーティング先リージョンのモデル ARN を許可する。"],[803,"■ なぜ正解か\n不満は不正確さではなく、不一致です。ゴールデンセットを1回走らせる評価は精度を測るだけで、分散には盲目です。同じ入力を繰り返し送って出力の差分を測り(output diffing)、temperature をほぼ0にしてスキーマを使います。下流に渡す分類で temperature 0.7 は、機械は再現性を求めるという原則に反します。\n■ ほかの選択肢が誤りな理由\n・ファインチューニングは、不一致の原因(temperature)を放置します。\n・推論の表示は、揺らぎの測定ではありません。\n・ゴールデンセットの拡大は、1回の精度を測るだけで分散が見えません。\n■ 覚えておくポイント\n88%が安定しているのは、分散を見ていないから。"],[804,"■ なぜ正解か\n4つの仮説は、検索側(KB の同期失敗・新しいチャンキング)と、生成側(モデルの置き換え・プロンプト編集)に分かれます。失敗する質問で Retrieve を直接呼び、右の文書が返るかで、どちら側かが1回で分かり、2つの仮説を除外できます。そのうえで、その半分の中で二分探索します。\n■ ほかの選択肢が誤りな理由\n・4つ全てを戻してから再適用するのは、厳密ですが遅い(モデルの切替や再取り込みに日数がかかる)。\n・retrieve and generate の完全な評価は、故障箇所を特定できません。\n・元のチャンキングでの再取り込みは、1つの仮説に賭けた高価な対処です。\n■ 覚えておくポイント\n二分探索が先、戻すのは後。"]];P.forEach(function(p){X[p[0]]={x:p[1],g:[]};});})();

// A(見出し, 列数, 行数, ノード[[id,"1行目/2行目",絵文字,列,行,種類]], 矢印[[from,to,ラベル,"d"=破線 / "x"=NG]], グループ[[タイトル,列1,行1,列2,行2,種類]])
// 種類: u=利用者 a=AWS m=モデル d=データ s=セキュリティ x=NG n=その他
function A(h,cols,rows,nodes,edges,groups){return {t:"a",h:h,cols:cols,rows:rows,n:nodes,e:edges||[],gr:groups||[]};}
function S(h,actors,msgs){return {t:"s",h:h,a:actors,m:msgs};}
function B(h,rows,note){return {t:"b",h:h,r:rows,note:note};}
var KC={u:"#38bdf8",a:"#ff9900",m:"#a78bfa",d:"#22c55e",s:"#f472b6",x:"#ef4444",n:"#8d9bc4"};
function svgA(g){
  var CW=g.cols>3?100:124,RH=88,NW=CW-(g.cols>3?22:32),NH=58,X0=6,Y0=36,P={};

  g.n.forEach(function(n){P[n[0]]={x:X0+n[3]*CW+CW/2,y:Y0+n[4]*RH+NH/2,n:n};});
  var o='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><defs>'+

  g.gr.forEach(function(r){var c=KC[r[5]||"n"],x=X0+r[1]*CW+2,y=Y0+r[2]*RH-28,w=(r[3]-r[1]+1)*CW-4,hh=(r[4]-r[2])*RH+NH+36;
    o+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="12" fill="'+c+'" fill-opacity=".07" stroke="'+c+'" stroke-opacity=".7" stroke-dasharray="5 4"/><text x="'+(x+8)+'" y="'+(y+12)+'" class="gt" fill="'+c+'">'+esc(r[0])+'</text>';});
  g.e.forEach(function(e){
    var a=P[e[0]],b=P[e[1]],bad=e[3]==="x",c=bad?"#ef4444":"#ff9900",d,mx,my;
    if(Math.abs(a.y-b.y)<1){var dir=b.x>a.x?1:-1;var x1=a.x+dir*NW/2,x2=b.x-dir*NW/2;d="M"+x1+" "+a.y+"L"+x2+" "+b.y;mx=(x1+x2)/2;my=a.y-NH/2-4;}
    else if(Math.abs(a.x-b.x)<1){var dv=b.y>a.y?1:-1;var y1=a.y+dv*NH/2,y2=b.y-dv*NH/2;d="M"+a.x+" "+y1+"L"+b.x+" "+y2;mx=a.x+4;my=(y1+y2)/2+4;}
    else{var dv2=b.y>a.y?1:-1;var ys=a.y+dv2*NH/2,ye=b.y-dv2*NH/2,ym=(ys+ye)/2;d="M"+a.x+" "+ys+"L"+a.x+" "+ym+"L"+b.x+" "+ym+"L"+b.x+" "+ye;mx=(a.x+b.x)/2;my=ym-4;}
    o+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.6"'+((e[3]==="d"||bad)?' stroke-dasharray="4 3"':'')+' marker-end="url(#'+(bad?'ax':'ah')+')"/>';
    if(e[2])o+='<text x="'+mx+'" y="'+my+'" text-anchor="middle" class="el">'+esc(e[2])+'</text>';
  });
  g.n.forEach(function(n){var p=P[n[0]],c=KC[n[5]||"n"],ls=n[1].split("/");
    o+='<rect x="'+(p.x-NW/2)+'" y="'+(p.y-NH/2)+'" width="'+NW+'" height="'+NH+'" rx="10" fill="'+c+'" fill-opacity=".16" stroke="'+c+'" stroke-width="1.4"/>'+
     '<text x="'+p.x+'" y="'+(p.y-NH/2+19)+'" text-anchor="middle" font-size="16">'+n[2]+'</text>';
    ls.forEach(function(l,i){var w=0;for(var ci=0;ci<l.length;ci++)w+=l.charCodeAt(ci)>255?1:.56;var fs=Math.min(10.5,(NW-8)/Math.max(w,1));o+='<text x="'+p.x+'" y="'+(p.y-NH/2+33+i*12)+'" text-anchor="middle" class="nl" style="font-size:'+fs.toFixed(1)+'px">'+esc(l)+'</text>';});});
  return o+'</svg>';
}
function svgS(g){
  var n=g.a.length,CW=340/n,X0=10,H=60+g.m.length*34+10,pos={};
  var o='<svg viewBox="0 0 360 '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9900"/></marker></defs>';

    o+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="'+(H-6)+'" stroke="#2a3a63" stroke-dasharray="3 4"/>'+

     '<text x="'+x+'" y="17" text-anchor="middle" font-size="12">'+a[2]+'</text><text x="'+x+'" y="31" text-anchor="middle" class="nl">'+esc(a[1])+'</text>';});
  g.m.forEach(function(m,i){var y=64+i*34,x1=pos[m[0]],x2=pos[m[1]],self=m[0]===m[1];

    else{o+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#ff9900" stroke-width="1.5"'+(m[3]==="d"?' stroke-dasharray="4 3"':'')+' marker-end="url(#ah)"/><text x="'+((x1+x2)/2)+'" y="'+(y-5)+'" text-anchor="middle" class="el">'+esc(m[2])+'</text>';}});
  return o+'</svg>';
}
function svgB(g){
  var mx=Math.max.apply(null,g.r.map(function(r){return r[1];})),H=g.r.length*34+8;
  var o='<svg viewBox="0 0 360 '+H+'" xmlns="http://www.w3.org/2000/svg" role="img">';
  g.r.forEach(function(r,i){var y=4+i*34,w=Math.max(6,r[1]/mx*190);

  return o+'</svg>'+(g.note?'<div class="gn">'+esc(g.note)+'</div>':'');
}

var KEY="genaiquiz-v1";
var S=load();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.wrong)return s;}catch(e){}return {wrong:[],done:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(id){return document.getElementById(id);}
function show(id){["home","quiz","result"].forEach(function(s){$(s).classList.toggle("on",s===id);});window.scrollTo(0,0);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function renderHome(){
  var h="";
  DOMAINS.forEach(function(n,i){
    var ids=[];Q.forEach(function(q,k){if(q.d===i)ids.push(k);});
    var done=0;ids.forEach(function(k){if(S.done[k]==="ok")done++;});
    var p=Math.round(done/ids.length*100);
    h+='<button class="btn" onclick="startDomain('+i+')">'+n+'<small>'+ids.length+'問 ・ 正解済み '+done+'/'+ids.length+'</small><div class="bar"><i style="width:'+p+'%"></i></div></button>';
  });
  $("domains").innerHTML=h;
  var n=S.wrong.length;
  $("reviewCnt").textContent=n?n+"問":"間違えた問題はありません";
  $("reviewBtn").disabled=!n;
}

var cur=[],idx=0,right=0,per={},answered=false;
function startRandom(n){begin(shuffle(Q.map(function(_,i){return i;})).slice(0,n));}
function startDomain(d){var ids=[];Q.forEach(function(q,k){if(q.d===d)ids.push(k);});begin(shuffle(ids));}
function startReview(){begin(shuffle(S.wrong));}
function begin(ids){if(!ids.length)return;cur=ids;idx=0;right=0;per={};show("quiz");render();}

function render(){
  answered=false;
  var q=Q[cur[idx]];
  $("prog").textContent=(idx+1)+" / "+cur.length;
  $("barFill").style.width=(idx/cur.length*100)+"%";
  $("qtag").textContent=DOMAINS[q.d];
  $("qtext").textContent=q.q;
  $("exp").style.display="none";$("next").style.display="none";
  var order=shuffle(q.c.map(function(_,i){return i;}));
  var h="";
  order.forEach(function(o){h+='<button class="opt" data-o="'+o+'" onclick="pick(this,'+o+')">'+esc(q.c[o])+'</button>';});
  $("opts").innerHTML=h;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function pick(el,o){
  if(answered)return;answered=true;
  var k=cur[idx],q=Q[k],ok=(o===q.a);
  [].forEach.call($("opts").children,function(b){
    b.classList.add("lock");
    var v=+b.getAttribute("data-o");
    if(v===q.a)b.classList.add("ok");
    else if(b===el)b.classList.add("ng");
  });
  per[q.d]=per[q.d]||[0,0];per[q.d][1]++;
  if(ok){right++;per[q.d][0]++;S.done[k]="ok";var p=S.wrong.indexOf(k);if(p>=0)S.wrong.splice(p,1);}
  else{S.done[k]="ng";if(S.wrong.indexOf(k)<0)S.wrong.push(k);}
  save();
  $("exp").innerHTML="<b>"+(ok?"⭕ 正解":"❌ 不正解")+"</b><br>"+esc(q.e)+detail(k);
  $("exp").style.display="block";
  $("next").textContent=(idx+1<cur.length)?"次へ":"結果を見る";
  $("next").style.display="block";
  $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function detail(k){
  var x=X[k];if(!x)return "";
  var h='<div class="xt">'+esc(x.x).replace(/\n/g,"<br>")+'</div>';
  (x.g||[]).forEach(function(g){
    h+='<div class="dg"><h4>📊 '+esc(g.h)+'</h4>';
    if(g.t==="a")h+=svgA(g);else if(g.t==="s")h+=svgS(g);else if(g.t==="b")h+=svgB(g);
    else if(g.t==="f"){
      h+=g.s.map(function(t){var p=t.split("|");return '<div class="st">'+esc(p[0])+(p[1]?'<small>'+esc(p[1])+'</small>':'')+'</div>';}).join('<div class="ar">▼</div>');
    }else{
      h+='<table><tr>'+g.c.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr>';
      g.r.forEach(function(r,i){h+='<tr'+(i===g.hl?' class="hl"':'')+'>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';});
      h+='</table>';
    }
    h+='</div>';
  });
  return h;
}
function next(){idx++;if(idx<cur.length)render();else finish();}

function finish(){
  show("result");
  var pc=Math.round(right/cur.length*100);
  $("rscore").textContent=pc+"%";
  $("rsub").textContent=cur.length+"問中 "+right+"問正解"+(pc>=75?" 🎉 合格ライン超え!":"");
  var h="";
  Object.keys(per).forEach(function(d){h+='<div class="btn" style="cursor:default">'+DOMAINS[d]+'<small>'+per[d][0]+' / '+per[d][1]+' 正解</small></div>';});
  $("rdom").innerHTML=h;
}
function goHome(){renderHome();show("home");}
function resetStats(){if(confirm("成績と復習リストをリセットしますか？")){S={wrong:[],done:{}};save();renderHome();}}
renderHome();
</script>
