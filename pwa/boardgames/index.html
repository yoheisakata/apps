<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<title>ボードゲーム</title>
<meta name="theme-color" content="#241a0f">
<style>
:root{
  --bg1:#241a0f; --bg2:#1c140b; --bg3:#140d07;
  --text:#f2e6d3; --sub:#a5906f;
  --accent:#dcb35c; --accent2:#8a5a2b;
}
*,*::before,*::after{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:16px 12px 40px;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 8%, rgba(220,179,92,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 90%, rgba(138,90,43,0.1) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}
.wrap{position:relative; z-index:1; width:100%; max-width:820px; display:flex; flex-direction:column; align-items:center;}
.home-link{align-self:flex-start; color:var(--sub); text-decoration:none; font-size:0.8rem; margin-bottom:6px;}
.app-title{font-size:clamp(1.5rem,6vw,2rem); font-weight:900; text-align:center; margin:6px 0 2px;
  background:linear-gradient(135deg,#f7e0b0 0%,#c8934e 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.app-sub{color:var(--sub); font-size:0.85rem; text-align:center; margin-bottom:4px;}
.app-version{color:var(--sub); opacity:0.55; font-size:0.65rem; letter-spacing:.06em; text-align:center; margin-bottom:16px;}

#home{width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:10px;}
.game-link{
  display:block; width:100%; max-width:380px; padding:18px; border-radius:16px; border:1px solid rgba(220,179,92,0.25);
  background:linear-gradient(135deg, rgba(220,179,92,0.14), rgba(138,90,43,0.08));
  color:var(--text); text-decoration:none; font-size:1.05rem; font-weight:700; text-align:center;
  cursor:pointer; transition:transform .12s;
}
.game-link:active{transform:scale(0.96);}
.game-link .desc{display:block; font-size:0.75rem; color:var(--sub); font-weight:400; margin-top:4px;}
.notice{margin-top:20px; font-size:0.72rem; color:var(--sub); text-align:center; max-width:380px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="../../">← My Apps</a>
  <div class="app-title">🎲 ボードゲーム</div>
  <div class="app-sub">遊びたいゲームを選んでね</div>
  <div class="app-version">v1.0.0</div>

  <div id="home">
    <a class="game-link" href="shogi/">♟️ 将棋<span class="desc">対AI対戦・2人対戦</span></a>
    <a class="game-link" href="chess/">♞ チェス<span class="desc">対AI対戦・2人対戦</span></a>
    <a class="game-link" href="go/">🔘 囲碁<span class="desc">対AI対戦・2人対戦</span></a>
    <a class="game-link" href="othello/">⚫ オセロ<span class="desc">対AI対戦・2人対戦</span></a>
    <a class="game-link" href="gomoku/">⚪ 五目並べ<span class="desc">対AI対戦・2人対戦</span></a>
    <a class="game-link" href="mahjong/">🀄 麻雀<span class="desc">1人プレイ(対AI×3)</span></a>
    <a class="game-link" href="diamond-game/">💎 ダイヤモンドゲーム<span class="desc">対AI対戦・2人対戦</span></a>
  </div>

  <div class="notice">各ゲームはそれぞれ独立したアプリとして動作します。ここから選んで開いてください。</div>
</div>
</body>
</html>
