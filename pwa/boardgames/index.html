<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<title>ボードゲーム</title>
<meta name="theme-color" content="#241a0f">
<style>
:root{
  --bg1:#241a0f; --bg2:#1c140b; --bg3:#140d07;
  --text:#f2e6d3; --sub:#a5906f;
  --accent:#dcb35c; --accent2:#8a5a2b;
}
*,*::before,*::after{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:16px 12px 40px;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 8%, rgba(220,179,92,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 90%, rgba(138,90,43,0.1) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}
.wrap{position:relative; z-index:1; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center;}
.home-link{align-self:flex-start; color:var(--sub); text-decoration:none; font-size:0.8rem; margin-bottom:6px;}
.app-title{font-size:clamp(1.5rem,6vw,2rem); font-weight:900; text-align:center; margin:6px 0 2px;
  background:linear-gradient(135deg,#f7e0b0 0%,#c8934e 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.app-sub{color:var(--sub); font-size:0.85rem; text-align:center; margin-bottom:4px;}
.app-version{color:var(--sub); opacity:0.55; font-size:0.65rem; letter-spacing:.06em; text-align:center; margin-bottom:16px;}

/* ---- アイコングリッド(トップのランチャーと同じ見た目) ---- */
#home{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 12px;
  width:100%; padding-top:10px;
}
.game{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  text-decoration:none; color:var(--text); cursor:pointer;
}
.game:active .icon-wrap{transform:scale(0.88);}
.icon-wrap{
  position:relative; width:72px; height:72px; border-radius:20px;
  display:flex; align-items:center; justify-content:center; font-size:2.2rem;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
  overflow:hidden;
}
.icon-wrap::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
  border-radius:inherit; pointer-events:none;
}
.game.shogi   .icon-wrap{ background:linear-gradient(135deg,#8a5a2b,#dcb35c); box-shadow:0 6px 20px rgba(220,179,92,0.45); }
.game.chess   .icon-wrap{ background:linear-gradient(135deg,#2b2118,#c9a876); box-shadow:0 6px 20px rgba(201,168,118,0.4); }
.game.go      .icon-wrap{ background:linear-gradient(135deg,#3a2a15,#d9b45f); box-shadow:0 6px 20px rgba(217,180,95,0.4); }
.game.othello .icon-wrap{ background:linear-gradient(135deg,#0f3d1f,#1f9e4e); box-shadow:0 6px 20px rgba(31,158,78,0.45); }
.game.gomoku  .icon-wrap{ background:linear-gradient(135deg,#5c3a1e,#c9974f); box-shadow:0 6px 20px rgba(201,151,79,0.45); }
.game.mahjong .icon-wrap{ background:linear-gradient(135deg,#0d3d2e,#2fae7e); box-shadow:0 6px 20px rgba(47,174,126,0.45); }
.game.diamondgame .icon-wrap{ background:linear-gradient(135deg,#7a1f5c,#e0479f); box-shadow:0 6px 20px rgba(224,71,159,0.45); }
.game-name{
  font-size:0.7rem; font-weight:700; text-align:center; line-height:1.3;
  color:rgba(242,230,211,0.8); max-width:76px; word-break:keep-all;
}

.notice{margin-top:26px; font-size:0.72rem; color:var(--sub); text-align:center; max-width:380px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="../../">← My Apps</a>
  <div class="app-title">🎲 ボードゲーム</div>
  <div class="app-sub">遊びたいゲームを選んでね</div>
  <div class="app-version">v1.1.0</div>

  <div id="home">
    <a class="game shogi" href="shogi/">
      <div class="icon-wrap">♟️</div>
      <div class="game-name">将棋</div>
    </a>
    <a class="game chess" href="chess/">
      <div class="icon-wrap">♞</div>
      <div class="game-name">チェス</div>
    </a>
    <a class="game go" href="go/">
      <div class="icon-wrap">🔘</div>
      <div class="game-name">囲碁</div>
    </a>
    <a class="game othello" href="othello/">
      <div class="icon-wrap">⚫</div>
      <div class="game-name">オセロ</div>
    </a>
    <a class="game gomoku" href="gomoku/">
      <div class="icon-wrap">⚪</div>
      <div class="game-name">五目並べ</div>
    </a>
    <a class="game mahjong" href="mahjong/">
      <div class="icon-wrap">🀄</div>
      <div class="game-name">麻雀</div>
    </a>
    <a class="game diamondgame" href="diamond-game/">
      <div class="icon-wrap">💎</div>
      <div class="game-name">ダイヤモンド<br>ゲーム</div>
    </a>
  </div>

  <div class="notice">各ゲームはそれぞれ独立したアプリとして動作します。ここから選んで開いてください。</div>
</div>
</body>
</html>
