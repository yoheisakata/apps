<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <!-- Leaflet (interactive maps) from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css" />
  <!-- Apply the saved theme before first paint to avoid a flash. Light default. -->
  <script>
    try {
      if (localStorage.getItem("wc2026-theme") === "dark")
        document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="ball">⚽</span> World Cup <strong>2026</strong></div>
    <nav id="tabs">
      <button class="tab" data-tab="japan">🇯🇵 日本</button>
      <button class="tab" data-tab="bracket">🔮 優勝予想</button>
      <button class="tab active" data-tab="schedule">📅 日程・結果</button>
      <button class="tab" data-tab="standings">📊 順位表</button>
      <button class="tab" data-tab="teams">👥 チーム</button>
      <button class="tab" data-tab="rankings">🥇 得点王</button>
      <button class="tab" data-tab="world">🌍 参加国</button>
      <button class="tab" data-tab="cities">🏟️ 開催都市</button>
    </nav>
    <div class="countdown-wrap" id="global-countdown">
      <span class="cd-label">次の試合:</span>
      <span class="cd-timer" id="cd-timer">--:--:--</span>
    </div>
    <div class="update-wrap">
      <span id="update-status" class="update-status">読み込み中…</span>
      <button id="refresh-btn" class="refresh-btn" title="Wikipediaから最新の結果を取得">⟳ 更新</button>
      <button id="theme-btn" class="refresh-btn" title="ライト / ダーク切替">🌙</button>
    </div>
    <div class="host">🇺🇸 🇨🇦 🇲🇽</div>
  </header>

  <main id="main">
    <section id="tab-schedule" class="view"></section>
    <section id="tab-standings" class="view hidden"></section>
    <section id="tab-cities" class="view hidden"></section>
    <section id="tab-world" class="view hidden"></section>
    <section id="tab-teams" class="view hidden"></section>
    <section id="tab-rankings" class="view hidden"></section>
    <section id="tab-bracket" class="view hidden"></section>
    <section id="tab-japan" class="view hidden"></section>
  </main>

  <div id="match-modal" class="city-modal hidden">
    <div class="city-modal-backdrop"></div>
    <div class="city-modal-card mm-card">
      <button class="city-modal-close" aria-label="閉じる">✕</button>
      <div class="mm-body"></div>
    </div>
  </div>

  <div id="loading">読み込み中…</div>

  <script type="module" src="main.js?v=2"></script>
</body>
</html>
