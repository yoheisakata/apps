name: MyGalleryPad
options:
  bundleIdPrefix: com.yoheisakata
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MyGalleryPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MyGalleryPad
    info:
      path: Sources/MyGalleryPad/Info.plist
      properties:
        CFBundleDisplayName: MyGallery Pad
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoheisakata.mygalleryipad
        PRODUCT_NAME: MyGalleryPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6KLK5DPUJ7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
