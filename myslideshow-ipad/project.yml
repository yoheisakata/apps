name: MySlideshowPad
options:
  bundleIdPrefix: com.yoheisakata
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MySlideshowPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MySlideshowPad
    info:
      path: Sources/MySlideshowPad/Info.plist
      properties:
        CFBundleDisplayName: MySlideshow Pad
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoheisakata.myslideshowpad
        PRODUCT_NAME: MySlideshowPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
